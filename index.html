  function addMesesISO(dataISO, meses){
    if(!dataISO) return '';
    var partes = dataISO.split('-');
    var d = new Date(parseInt(partes[0], 10), parseInt(partes[1], 10) - 1, parseInt(partes[2], 10));
    d.setMonth(d.getMonth() + meses);
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dia = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + dia;
  }
  function parseNFeXML(xmlText){
    try{
      var parser = new DOMParser();
      var xml = parser.parseFromString(xmlText, 'text/xml');
      if(xml.getElementsByTagName('parsererror').length) return null;
      function tagText(parent, tag){ var els = parent.getElementsByTagName(tag); return els.length ? (els[0].textContent || '').trim() : ''; }
      var infNFe = xml.getElementsByTagName('infNFe')[0];
      if(!infNFe) return null;
      var ideEl = infNFe.getElementsByTagName('ide')[0];
      var emitEl = infNFe.getElementsByTagName('emit')[0];
      var numero = ideEl ? tagText(ideEl, 'nNF') : '';
      var dataEmissaoRaw = ideEl ? (tagText(ideEl, 'dhEmi') || tagText(ideEl, 'dEmi')) : '';
      var dataEmissao = dataEmissaoRaw ? dataEmissaoRaw.slice(0, 10) : '';
      var fornecedorNome = emitEl ? tagText(emitEl, 'xNome') : '';
      var dets = infNFe.getElementsByTagName('det');
      var itens = [];
      for(var i = 0; i < dets.length; i++){
        var prodEl = dets[i].getElementsByTagName('prod')[0];
        if(!prodEl) continue;
        var xProd = tagText(prodEl, 'xProd');
        if(!xProd) continue;
        itens.push({
          cProd: tagText(prodEl, 'cProd'), xProd: xProd, uCom: tagText(prodEl, 'uCom'),
          qCom: parseFloat(tagText(prodEl, 'qCom')) || 0, vUnCom: parseFloat(tagText(prodEl, 'vUnCom')) || 0,
          vProd: parseFloat(tagText(prodEl, 'vProd')) || 0
        });
      }
      if(!itens.length) return null;
      return {numero: numero, dataEmissao: dataEmissao, fornecedorNome: fornecedorNome, itens: itens};
    }catch(err){
      console.error('Erro ao ler XML da NF-e:', err);
      return null;
    }
  }

  function toISOImport(val){
    if(!val) return '';
    if(val instanceof Date){
      if(isNaN(val.getTime())) return '';
      var y = val.getFullYear(), m = String(val.getMonth()+1).padStart(2,'0'), d = String(val.getDate()).padStart(2,'0');
      return y + '-' + m + '-' + d;
    }
    var s = String(val).trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var m2 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m2) return m2[3] + '-' + m2[2].padStart(2,'0') + '-' + m2[1].padStart(2,'0');
    return '';
  }
  function parseValorImport(v){
    if(typeof v === 'number') return v;
    if(v == null) return 0;
    var s = String(v).trim().replace(/[^\d.,-]/g, '');
    if(s.indexOf(',') !== -1 && s.indexOf('.') !== -1){ s = s.replace(/\./g, '').replace(',', '.'); }
    else if(s.indexOf(',') !== -1){ s = s.replace(',', '.'); }
    return parseFloat(s) || 0;
  }
  function importarFinanceiroDeArquivo(){
    var contaSel = document.getElementById('f-import-conta');
    var statusSel = document.getElementById('f-import-status');
    var fileInput = document.getElementById('import-file-input');
    if(!contaSel || !statusSel || !fileInput) return;
    var contaId = contaSel.value;
    var statusPadrao = statusSel.value;
    var file = fileInput.files && fileInput.files[0];
    if(!file){ alert('Selecione um arquivo primeiro.'); return; }
    if(!contaId){ alert('Selecione uma conta para os lançamentos.'); return; }
    if(!window.XLSX){ alert('A biblioteca de leitura de planilhas ainda está carregando (ou não pôde ser carregada). Tente novamente em instantes.'); return; }

    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:'array', cellDates:true});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true});

        var novos = [];
        for(var i = 1; i < rows.length; i++){
          var r = rows[i];
          if(!r || r.length === 0) continue;
          var nome = r[0] != null ? String(r[0]).trim() : '';
          if(!nome || nome.toUpperCase() === 'TOTAL') continue;
          var dataEmissao = toISOImport(r[1]);
          var vencimento = toISOImport(r[2]);
          var doc = r[3] != null ? String(r[3]).trim() : '';
          var valor = parseValorImport(r[4]);
          if(!valor) continue;
          novos.push({
            id: uid(), contaId: contaId, tipo: contaTipo(contaId), categoria: contaNome(contaId),
            valor: valor, quantidade: 0, peso: 0, unidade: '',
            status: statusPadrao, data: statusPadrao === 'Pago' ? (dataEmissao || vencimento) : '', vencimento: vencimento,
            talhoesIds: [], talhaoId: '', parceiroId: '', membroId: '',
            descricao: nome + (doc ? ' - Doc ' + doc : ''), criadoEm: Date.now()
          });
        }

        if(!novos.length){ alert('Nenhuma linha válida encontrada no arquivo.'); return; }
        if(!window.confirm('Serão criados ' + novos.length + ' lançamentos, todos na conta "' + contaLabel(contaId) + '" com status "' + statusPadrao + '". Confirma a importação?')) return;

        novos.forEach(function(n){ state.financeiro.push(n); });
        saveKey('financeiro', state.financeiro);
        fileInput.value = '';
        renderAll();
        alert(novos.length + ' lançamentos importados com sucesso.');
      }catch(err){
        console.error('Erro ao importar arquivo:', err);
        alert('Não foi possível ler esse arquivo. Verifique se é um .xlsx ou .csv válido, com as colunas na ordem esperada.');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function expandGroupFor(tab){

    if(!btn) return;
    var prev = btn.previousElementSibling;
    while(prev && !prev.classList.contains('nav-group-label')) prev = prev.previousElementSibling;
    if(prev && prev.classList.contains('collapsed')){
      setGroupCollapsed(prev, false);
      var collapsed = getCollapsedGroups().filter(function(g){ return g !== prev.dataset.group; });

  function recalcularValorDiaria(){
    var qtdEl = document.getElementById('f-qtdDiarias');
    var valorDEl = document.getElementById('f-valorDiaria');
    var valorInDiaria = document.getElementById('f-valor');
    var hintD = document.getElementById('diaria-hint');
    if(!qtdEl || !valorDEl) return;
    var qtd = parseFloat(qtdEl.value) || 0;
    var valorD = parseFloat(valorDEl.value) || 0;
    var totalDiaria = qtd * valorD;
    if(valorInDiaria) valorInDiaria.value = totalDiaria.toFixed(2);
    if(hintD){
      hintD.textContent = 'O "Valor (R$)" acima é calculado automaticamente (Nº de diárias × Valor por diária)' + (totalDiaria > 0 ? ' = ' + fmtBRL(totalDiaria) + '.' : '.');
    }
  }

            parcelaFields.vencimento = addMesesISO(vencimentoBase, pi);
            parcelaFields.descricao = (finFields.descricao ? finFields.descricao + ' ' : '') + '(Parcela ' + (pi + 1) + '/' + finParcelas + ')';
            parcelaFields.parcelamentoId = finGrupoParcelamento;
            parcelaFields.parcelaNum = pi + 1;
            parcelaFields.parcelaTotal = finParcelas;
            if(pi === 0) finIdParaAnexo = parcelaFields.id;
            state.financeiro.push(parcelaFields);
          }
        } else {
          var finRepeticoes = parseInt(data.get('recorrenciaRepeticoes'), 10) || 0;
          if(finRepeticoes > 1){
            var finGrupoRecorrencia = uid();
            var finFreqMeses = (data.get('recorrenciaFrequencia') === 'Anual') ? 12 : 1;
            var vencimentoBaseRec = finFields.vencimento || finFields.data || '';
            for(var ri = 0; ri < finRepeticoes; ri++){
              var recFields = {};
              Object.keys(finFields).forEach(function(k){ recFields[k] = finFields[k]; });
              recFields.id = uid();
              recFields.criadoEm = Date.now() + ri;
              recFields.status = 'Pendente';
              recFields.data = '';
              recFields.vencimento = addMesesISO(vencimentoBaseRec, ri * finFreqMeses);
              recFields.descricao = (finFields.descricao ? finFields.descricao + ' ' : '') + '(Recorrência ' + (ri + 1) + '/' + finRepeticoes + ')';
              recFields.recorrenciaId = finGrupoRecorrencia;
              recFields.recorrenciaNum = ri + 1;
              recFields.recorrenciaTotal = finRepeticoes;
              recFields.recorrenciaFrequencia = data.get('recorrenciaFrequencia') || 'Mensal';
              if(ri === 0) finIdParaAnexo = recFields.id;
              state.financeiro.push(recFields);
            }
          } else {
            finFields.id = uid(); finFields.criadoEm = Date.now();
            state.financeiro.push(finFields);
            finIdParaAnexo = finFields.id;
          }
        }
      }

      var finFinalizar = function(){
        saveKey('financeiro', state.financeiro);
        editState = null;
        form.reset(); renderAll();
      };

      var finAnexoInput = document.getElementById('f-anexo-input');
      var finAnexoFile = finAnexoInput && finAnexoInput.files && finAnexoInput.files[0];
      if(finAnexoFile && finIdParaAnexo){
        if(finAnexoFile.size > 5 * 1024 * 1024){
          alert('O comprovante precisa ter até 5MB. O lançamento foi salvo, mas o arquivo não foi anexado — tente novamente com um arquivo menor.');
          finFinalizar();
          return;
        }
        var finReader = new FileReader();
        finReader.onload = function(e){
          rawSet('anexo::' + finIdParaAnexo, {nome: finAnexoFile.name, tipo: finAnexoFile.type, dados: e.target.result}).then(function(){
            var idxAnexo = state.financeiro.findIndex(function(f){ return f.id === finIdParaAnexo; });
            if(idxAnexo !== -1) state.financeiro[idxAnexo].temAnexo = true;
            finFinalizar();
          });
        };
        finReader.onerror = function(){ finFinalizar(); };
        finReader.readAsDataURL(finAnexoFile);
        return;
      }
      finFinalizar();
      return;
    }
  });

  document.addEventListener('click', function(e){
    var plotBtn = e.target.closest('.plot[data-talhao-id]');
    if(plotBtn){
      var talhaoId = plotBtn.dataset.talhaoId;
      switchTab('operacoes');
      var sel = document.getElementById('f-talhaoId');
      if(sel) sel.value = talhaoId;
      var formEl = document.getElementById('form-operacao');
      if(formEl) formEl.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }

    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.dataset.action;
    var id = btn.dataset.id;

    if(action === 'reset-password'){
      if(window.confirm('Isso remove a senha atual (definida apenas neste dispositivo/ambiente). Você poderá definir uma nova em seguida. Continuar?')){
        saveGlobal(PASS_KEY, null).then(function(){ showGateScreen(); });
      }
      return;
    }
    if(action === 'select-workspace'){ selectWorkspace(id); return; }
    if(action === 'open-cat-modal'){ renderCatModalList(); document.getElementById('cat-modal-overlay').style.display = 'flex'; var catInput = document.getElementById('cat-modal-input'); if(catInput) catInput.focus(); return; }
    if(action === 'close-cat-modal'){ document.getElementById('cat-modal-overlay').style.display = 'none'; return; }
    if(action === 'del-categoria-modal'){
      if(!window.confirm('Remover esta categoria? Produtos que já usam ela mantêm o nome salvo, só some da lista de opções.')) return;
      state.categoriasProduto = state.categoriasProduto.filter(function(c){ return c.id !== id; });
      saveKey('categoriasProduto', state.categoriasProduto);
      renderCatModalList();
      renderProdutos();
      return;
    }
    if(action === 'open-tipo-modal'){ renderTipoModalList(); document.getElementById('tipo-modal-overlay').style.display = 'flex'; var tipoInput = document.getElementById('tipo-modal-input'); if(tipoInput) tipoInput.focus(); return; }
    if(action === 'close-tipo-modal'){ document.getElementById('tipo-modal-overlay').style.display = 'none'; return; }
    if(action === 'salvar-cotacao'){
      var inputCot = document.querySelector('.cotacao-input[data-cultura-id="' + id + '"]');
      var precoCot = inputCot ? (parseFloat(inputCot.value) || 0) : 0;
      if(precoCot <= 0){ alert('Digite um preço maior que zero antes de salvar.'); return; }
      var idxCot = state.cotacoes.findIndex(function(c){ return c.culturaId === id; });
      var hojeISO = new Date().toISOString().slice(0, 10);
      if(idxCot !== -1){
        state.cotacoes[idxCot].preco = precoCot;
        state.cotacoes[idxCot].dataAtualizacao = hojeISO;
      } else {
        state.cotacoes.push({id: uid(), culturaId: id, preco: precoCot, dataAtualizacao: hojeISO});
      }
      saveKey('cotacoes', state.cotacoes);
      renderPainel();
      return;
    }
    if(action === 'del-tipo-modal'){
      if(!window.confirm('Remover este tipo de atividade? Atividades já registradas com ele mantêm o nome salvo, só some da lista de opções.')) return;
      state.tiposAtividade = state.tiposAtividade.filter(function(t){ return t.id !== id; });
      saveKey('tiposAtividade', state.tiposAtividade);
      renderTipoModalList();
      renderOperacoes();
      return;
    }
    if(action === 'open-conta-modal'){ renderContaModalList(); document.getElementById('conta-modal-overlay').style.display = 'flex'; var contaInput = document.getElementById('conta-modal-input'); if(contaInput) contaInput.focus(); return; }
    if(action === 'close-conta-modal'){ document.getElementById('conta-modal-overlay').style.display = 'none'; return; }
    if(action === 'del-conta-modal'){
      if(!window.confirm('Remover esta conta? Lançamentos que já usam ela mantêm o vínculo salvo, mas ela some da lista de opções.')) return;
      state.contasFinanceiro = state.contasFinanceiro.filter(function(c){ return c.id !== id; });
      saveKey('contasFinanceiro', state.contasFinanceiro);
      renderContaModalList();
      renderFinanceiro();
      return;
    }
    if(action === 'open-subgrupo-modal'){ renderSubgrupoModalList(); document.getElementById('subgrupo-modal-overlay').style.display = 'flex'; var subInput = document.getElementById('subgrupo-modal-input'); if(subInput) subInput.focus(); return; }
    if(action === 'close-subgrupo-modal'){ document.getElementById('subgrupo-modal-overlay').style.display = 'none'; return; }
    if(action === 'del-subgrupo-modal'){
      if(!window.confirm('Remover este subgrupo? Contas que já usam ele continuam existindo, mas ficam sem subgrupo definido.')) return;
      state.subgruposFinanceiro = state.subgruposFinanceiro.filter(function(s){ return s.id !== id; });
      saveKey('subgruposFinanceiro', state.subgruposFinanceiro);
      renderSubgrupoModalList();
      renderContaModalList();
      return;
    }
    if(action === 'edit-produto'){ editState = {scope:'produtos', id: id}; renderProdutos(); var fP = document.getElementById('form-produto'); if(fP) fP.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    if(action === 'del-produto'){
      if(!window.confirm('Tem certeza que deseja remover este item? Essa ação não pode ser desfeita.')) return;
      state.produtos = state.produtos.filter(function(p){ return p.id !== id; });
      saveKey('produtos', state.produtos);
      renderProdutos();
      return;
    }
    if(action === 'edit-compra'){ editState = {scope:'compras', id: id}; renderCompras(); var fC = document.getElementById('form-compra'); if(fC) fC.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    if(action === 'del-compra'){
      if(!window.confirm('Remover esta compra? Isso não desfaz automaticamente o estoque somado nem o lançamento financeiro criado — ajuste-os manualmente se precisar.')) return;
      state.compras = state.compras.filter(function(c){ return c.id !== id; });
      saveKey('compras', state.compras);
      renderCompras();
      return;
    }
    if(action === 'enviar-certificado'){ enviarCertificado(); return; }
    if(action === 'remover-certificado'){ removerCertificado(); return; }
    if(action === 'testar-sefaz'){ testarConsultaSefaz(); return; }
    if(action === 'ler-nfe'){
      var nfeInput = document.getElementById('nfe-file-input');
      var nfeFile = nfeInput && nfeInput.files && nfeInput.files[0];
      if(!nfeFile){ alert('Selecione o arquivo XML da nota primeiro.'); return; }
      var nfeReader = new FileReader();
      nfeReader.onload = function(e){
        var parsed = parseNFeXML(e.target.result);
        if(!parsed){ alert('Não foi possível ler esse arquivo. Confira se é mesmo o XML de uma NF-e (não o DANFE em PDF).'); return; }
        parsed.itens = parsed.itens.map(function(item){
          var match = state.produtos.find(function(p){ return p.nome.trim().toLowerCase() === item.xProd.trim().toLowerCase(); });
          item.incluir = true;
          item.produtoId = match ? match.id : '';
          return item;
        });
        nfeImportada = parsed;
        renderCompras();
      };
      nfeReader.onerror = function(){ alert('Não foi possível ler esse arquivo.'); };
      nfeReader.readAsText(nfeFile);
      return;
    }
    if(action === 'cancelar-nfe'){ nfeImportada = null; renderCompras(); return; }
    if(action === 'importar-itens-nfe'){
      if(!nfeImportada) return;
      var selecionados = nfeImportada.itens.filter(function(item){ return item.incluir; });
      if(!selecionados.length){ alert('Marque ao menos um item para importar.'); return; }
      if(!window.confirm('Importar ' + selecionados.length + ' item(ns) da nota? Isso cria compras, soma no estoque e lança as despesas no Financeiro.')) return;

      var contaSelInput = document.getElementById('nfe-import-conta');
      var contaEscolhida = contaSelInput ? contaSelInput.value : '';

      var fornecedorId = '';
      if(nfeImportada.fornecedorNome){
        var fornecedorExistente = state.parceiros.find(function(p){ return p.nome.trim().toLowerCase() === nfeImportada.fornecedorNome.trim().toLowerCase(); });
        if(fornecedorExistente){
          fornecedorId = fornecedorExistente.id;
        } else {
          var novoFornecedor = {id: uid(), nome: nfeImportada.fornecedorNome, tipo: 'Fornecedor', contato: '', criadoEm: Date.now()};
          state.parceiros.push(novoFornecedor);
          fornecedorId = novoFornecedor.id;
        }
      }

      selecionados.forEach(function(item, idx){
        var produtoId = item.produtoId;
        if(!produtoId){
          var novoProduto = {id: uid(), nome: item.xProd, categoria: '', unidade: item.uCom || '', estoqueAtual: 0, estoqueMinimo: 0, criadoEm: Date.now() + idx};
          state.produtos.push(novoProduto);
          produtoId = novoProduto.id;
        }
        var compraFields = {
          id: uid(), produtoId: produtoId, fornecedorId: fornecedorId, quantidade: item.qCom, valorUnitario: item.vUnCom,
          valorTotal: item.vProd, contaId: contaEscolhida, notaFiscal: nfeImportada.numero,
          data: nfeImportada.dataEmissao, status: 'Recebido', observacao: 'Importado de NF-e', criadoEm: Date.now() + idx
        };
        state.compras.push(compraFields);
        var prodIdx = state.produtos.findIndex(function(p){ return p.id === produtoId; });
        if(prodIdx !== -1) state.produtos[prodIdx].estoqueAtual = (Number(state.produtos[prodIdx].estoqueAtual) || 0) + item.qCom;
        if(contaEscolhida){
          var contaNfe = state.contasFinanceiro.find(function(c){ return c.id === contaEscolhida; });
          state.financeiro.push({
            id: uid(), contaId: contaEscolhida, tipo: contaTipo(contaEscolhida), categoria: contaNfe ? contaNfe.nome : '',
            valor: item.vProd, quantidade: 0, peso: 0, unidade: '', status: 'Pago',
            data: nfeImportada.dataEmissao || new Date().toISOString().slice(0,10), vencimento: '',
            talhoesIds: [], talhaoId: '', parceiroId: fornecedorId, membroId: '',
            descricao: 'Compra de ' + item.xProd + (nfeImportada.numero ? ' - NF ' + nfeImportada.numero : ''),
            criadoEm: Date.now() + idx
          });
        }
      });

      saveKey('produtos', state.produtos);
      saveKey('compras', state.compras);
      saveKey('parceiros', state.parceiros);
      if(contaEscolhida) saveKey('financeiro', state.financeiro);
      nfeImportada = null;
      renderAll();
      return;
    }
    if(action === 'switch-workspace'){
      currentWorkspaceId = null;
      document.getElementById('app').style.display = 'none';
      loadWorkspaces().then(function(list){ showWorkspaceScreen(list); });
      return;
    }
    if(action === 'lock-app'){
      currentWorkspaceId = null;
      try{ window.sessionStorage.removeItem(UNLOCK_FLAG); }catch(e){}
      document.getElementById('app').style.display = 'none';
      showGateScreen();
      return;
    }

    if(action.indexOf('del-') === 0){
      if(!window.confirm('Tem certeza que deseja remover este item? Essa ação não pode ser desfeita.')) return;
    }

    if(action === 'export-excel'){ exportarExcel(); return; }
    if(action === 'export-pdf'){ window.print(); return; }
    if(action === 'export-backup'){ exportarBackupJSON(); return; }
    if(action === 'import-financeiro'){ importarFinanceiroDeArquivo(); return; }
    if(action === 'import-backup'){ var fileInput = document.getElementById('backup-file-input'); if(fileInput) fileInput.click(); return; }
    if(action === 'cancel-edit'){ editState = null; renderAll(); return; }
    if(action === 'edit-generic'){
      editState = {scope:'generic', entityKey: btn.dataset.entity, id: id};
      renderAll();
      var formCard = document.querySelector('#tab-' + btn.dataset.entity + ' .form-card');
      if(formCard) formCard.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    if(action === 'pagar-parcela-financiamento'){
      var fin = state.financiamentos.find(function(f){ return f.id === id; });
      if(!fin) return;
      if(!fin.contaId){ alert('Antes de pagar uma parcela por aqui, edite este financiamento e escolha uma "Conta" — é nela que a despesa vai ser lançada.'); return; }
      var pagasAtual = Number(fin.parcelasPagas) || 0;
      var novaPagas = pagasAtual + 1;
      var valorParcelaFin = Number(fin.valorParcela) || 0;
      if(!window.confirm('Confirma o pagamento da parcela ' + novaPagas + '/' + (fin.numeroParcelas || '?') + ', no valor de ' + fmtBRL(valorParcelaFin) + '? Isso cria uma despesa "Pago" no Financeiro.')) return;
      fin.parcelasPagas = novaPagas;
      if(fin.numeroParcelas && novaPagas >= Number(fin.numeroParcelas)) fin.status = 'Quitado';
      saveKey('financiamentos', state.financiamentos);
      var contaFin = state.contasFinanceiro.find(function(c){ return c.id === fin.contaId; });
      state.financeiro.push({
        id: uid(), contaId: fin.contaId, tipo: contaTipo(fin.contaId), categoria: contaFin ? contaFin.nome : '',
        valor: valorParcelaFin, quantidade: 0, peso: 0, unidade: '', status: 'Pago',
        data: new Date().toISOString().slice(0,10), vencimento: '',
        talhoesIds: fin.talhaoId ? [fin.talhaoId] : [], talhaoId: fin.talhaoId || '', parceiroId: '', membroId: '',
        descricao: 'Parcela ' + novaPagas + '/' + (fin.numeroParcelas || '?') + ' - ' + fin.banco + (fin.numeroContrato ? ' - Contrato ' + fin.numeroContrato : ''),
        criadoEm: Date.now()
      });
      saveKey('financeiro', state.financeiro);
      renderAll();
      return;
    }
    if(action === 'del-generic'){
      var entityKey = btn.dataset.entity;
      state[entityKey] = state[entityKey].filter(function(x){ return x.id !== id; });
      saveKey(entityKey, state[entityKey]);
      renderAll(); return;
    }
    if(action === 'del-talhao'){ state.talhoes = state.talhoes.filter(function(t){ return t.id !== id; }); saveKey('talhoes', state.talhoes); renderAll(); return; }
    if(action === 'edit-talhao'){ editState = {scope:'talhoes', id: id}; renderAll(); var f2 = document.getElementById('form-talhao'); if(f2) f2.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    if(action === 'del-safra'){ state.safras = state.safras.filter(function(s){ return s.id !== id; }); saveKey('safras', state.safras); renderAll(); return; }
    if(action === 'edit-safra'){ editState = {scope:'safras', id: id}; renderAll(); var f3 = document.getElementById('form-safra'); if(f3) f3.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    if(action === 'del-producao'){ state.producao = state.producao.filter(function(p){ return p.id !== id; }); saveKey('producao', state.producao); renderAll(); return; }
    if(action === 'edit-producao'){
      editState = {scope: btn.dataset.tipo === 'entrada' ? 'producao-entrada' : 'producao-saida', id: id};
      renderAll();
      var f4 = document.getElementById(btn.dataset.tipo === 'entrada' ? 'form-colheita-entrada' : 'form-colheita-venda');
      if(f4) f4.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    if(action === 'del-operacao'){ state.operacoes = state.operacoes.filter(function(o){ return o.id !== id; }); saveKey('operacoes', state.operacoes); renderAll(); return; }
    if(action === 'edit-operacao'){ editState = {scope:'operacoes', id: id}; renderAll(); var f1 = document.getElementById('form-operacao'); if(f1) f1.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    if(action === 'del-financeiro'){
      var finParaExcluir = state.financeiro.find(function(f){ return f.id === id; });
      if(finParaExcluir && lancamentoEstaFechado(finParaExcluir)){ alert('Este lançamento está num período fechado. Reabra o período antes de excluir.'); return; }
      state.financeiro = state.financeiro.filter(function(f){ return f.id !== id; }); saveKey('financeiro', state.financeiro); renderAll(); return;
    }
    if(action === 'edit-financeiro'){
      var finParaEditar = state.financeiro.find(function(f){ return f.id === id; });
      if(finParaEditar && lancamentoEstaFechado(finParaEditar)){ alert('Este lançamento está num período fechado. Reabra o período antes de editar.'); return; }
      editState = {scope:'financeiro', id: id}; renderAll(); var f5 = document.getElementById('form-financeiro'); if(f5) f5.scrollIntoView({behavior:'smooth', block:'start'}); return;
    }
    if(action === 'ver-anexo'){
      rawGet('anexo::' + id).then(function(anexo){
        if(!anexo || !anexo.dados){ alert('Nenhum comprovante encontrado.'); return; }
        var w = window.open();
        if(w && w.document){
          w.document.write('<title>' + escapeHtml(anexo.nome || 'Comprovante') + '</title>' + (anexo.tipo && anexo.tipo.indexOf('image') === 0 ? '<img src="' + anexo.dados + '" style="max-width:100%;">' : '<embed src="' + anexo.dados + '" style="width:100%; height:100vh;">'));
        }
      });
      return;
    }
    if(action === 'fechar-periodo'){
      var mesInput = document.getElementById('fechamento-mes-input');
      var ym = mesInput ? mesInput.value : '';
      if(!ym){ alert('Escolha um mês antes de fechar.'); return; }
      if(!state.periodosFechados) state.periodosFechados = [];
      if(state.periodosFechados.indexOf(ym) !== -1){ alert('Esse período já está fechado.'); return; }
      if(!window.confirm('Fechar ' + ym + '? Nenhum lançamento com data ou vencimento nesse mês poderá ser criado, editado ou excluído até você reabrir.')) return;
      state.periodosFechados.push(ym);
      saveKey('periodosFechados', state.periodosFechados);
      renderAll();
      return;
    }
    if(action === 'reabrir-periodo'){
      if(!window.confirm('Reabrir ' + id + '? Os lançamentos desse mês voltam a poder ser editados/excluídos.')) return;
      state.periodosFechados = state.periodosFechados.filter(function(p){ return p !== id; });
      saveKey('periodosFechados', state.periodosFechados);
      renderAll();
      return;
    }
    if(action === 'salvar-orcamento'){
      var orcContaSel = document.getElementById('f-orc-conta');
      var orcValorInput = document.getElementById('f-orc-valor');
      var orcContaId = orcContaSel ? orcContaSel.value : '';
      var orcValor = orcValorInput ? (parseFloat(orcValorInput.value) || 0) : 0;
      if(!orcContaId || orcValor <= 0){ alert('Escolha uma conta e digite um valor maior que zero.'); return; }
      var idxOrc = state.orcamentos.findIndex(function(o){ return o.contaId === orcContaId && o.ano === orcamentoAnoSelecionado; });
      if(idxOrc !== -1){
        state.orcamentos[idxOrc].valorOrcado = orcValor;
      } else {
        state.orcamentos.push({id: uid(), contaId: orcContaId, ano: orcamentoAnoSelecionado, valorOrcado: orcValor, criadoEm: Date.now()});
      }
      saveKey('orcamentos', state.orcamentos);
      renderOrcamento();
      return;
    }
  });

  boot();
})();
</script>
