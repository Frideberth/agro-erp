<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Fazenda — Caderno de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C2818;
    --panel:#223020;
    --panel-line:#33452D;
    --paper:#F1E9D2;
    --paper-2:#E8DCB9;
    --paper-line:#CBB98C;
    --ink:#2A2016;
    --ink-soft:#6B5D46;
    --accent:#C98A2B;
    --accent-dark:#9C6A1E;
    --growth:#4F7942;
    --growth-dark:#3B5B32;
    --cost:#A23E2E;
    --cost-dark:#7E2F22;
    --khaki:#8B8368;
    --radius:6px;
    --shadow: 0 2px 0 rgba(0,0,0,0.15), 0 8px 20px -12px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:linear-gradient(rgba(0,0,0,0.12) 1px, transparent 1px);
    background-size: 100% 3px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  #app{display:grid; grid-template-columns:232px 1fr; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--panel);
    border-right:1px solid var(--panel-line);
    padding:22px 16px;
    display:flex; flex-direction:column; gap:18px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 4px;}
  .brand-mark{
    width:34px; height:34px; border-radius:50%;
    background:var(--accent); color:var(--panel);
    display:flex; align-items:center; justify-content:center;
    font-family:'Zilla Slab', serif; font-weight:700; font-size:17px; flex:none;
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.25;}
  .brand-text strong{font-family:'Zilla Slab', serif; font-size:16px; color:var(--paper); letter-spacing:0.2px;}
  .brand-text span{font-size:11px; color:#9FAE93; text-transform:uppercase; letter-spacing:0.08em;}

  nav{display:flex; flex-direction:column; gap:2px;}
  .nav-group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;
    color:#9FAE93; font-weight:700; padding:14px 10px 6px;
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; user-select:none; border-radius:4px;
    transition:color .15s ease;
  }
  .nav-group-label:hover{color:var(--paper);}
  .nav-group-label::after{
    content:'▾'; font-size:9px; color:#7C8A70; transition:transform .15s ease;
  }
  .nav-group-label.collapsed::after{transform:rotate(-90deg);}
  .nav-btn{
    display:flex; align-items:center; gap:10px;
    background:transparent; border:1px solid transparent;
    color:#C7D0BC; text-align:left; padding:8px 12px 8px 16px;
    border-radius:var(--radius); font-size:13px; font-weight:500;
    transition:background .15s ease, color .15s ease;
  }
  .nav-btn:hover{background:rgba(255,255,255,0.05); color:var(--paper);}
  .nav-btn.active{background:var(--accent); color:#241704; font-weight:600;}
  .sidebar-footer{margin-top:auto; font-size:11px; color:#7C8A70; line-height:1.5; padding:0 4px;}

  /* ---------- Main ---------- */
  main{padding:28px 34px 60px; max-width:1180px;}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:8px;}
  .topbar h1{font-family:'Zilla Slab', serif; font-size:28px; color:var(--paper); margin:0; font-weight:600;}
  .topbar .subtitle{color:#8E9B82; font-size:13px; margin-top:2px;}
  #loading-indicator{color:#9FAE93; font-size:12.5px; font-style:italic; max-width:260px; text-align:right;}
  #loading-indicator.hidden{display:none;}
  .tab-content.hidden{display:none;}

  /* ---------- Cards / paper ---------- */
  .paper{background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:14px; margin-bottom:24px;}
  .stat-card{padding:16px 18px;}
  .stat-card .label{font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-soft); font-weight:600;}
  .stat-card .value{font-family:'JetBrains Mono', monospace; font-size:22px; font-weight:600; margin-top:6px; color:var(--ink);}
  .stat-card .value.growth{color:var(--growth-dark);}
  .stat-card .value.cost{color:var(--cost-dark);}

  .section-title{font-family:'Zilla Slab', serif; font-size:18px; font-weight:600; color:var(--paper); margin:26px 0 12px;}
  .section-title:first-child{margin-top:0;}

  .alert-box{padding:14px 18px; margin-bottom:8px;}
  .alert-box div{font-size:13.5px; margin-bottom:6px;}
  .alert-box div:last-child{margin-bottom:0;}

  .note-box{padding:12px 18px; margin-top:16px; font-size:12px; color:var(--ink-soft);}

  /* ---------- Plot map ---------- */
  .plot-map{display:flex; flex-wrap:wrap; gap:10px; padding:16px; background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .plot{
    position:relative; min-width:130px; flex:1 1 130px; max-width:220px; aspect-ratio:4/3;
    border-radius:4px; border:1px solid rgba(0,0,0,0.18); padding:10px;
    display:flex; flex-direction:column; justify-content:space-between; color:#1B1508;
    background-image: repeating-linear-gradient(100deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 2px, transparent 2px, transparent 9px);
    font-family:inherit; margin:0; text-align:left; cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .plot:hover, .plot:focus-visible{transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,0.25);}
  .plot .plot-cta{
    align-self:flex-end; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    opacity:0; transition:opacity .12s ease;
  }
  .plot:hover .plot-cta, .plot:focus-visible .plot-cta{opacity:0.85;}
  .plot.status-andamento{background-color:#DFA84E;}
  .plot.status-planejada{background-color:#C9C3A4;}
  .plot.status-colhida{background-color:#7FA36D;}
  .plot.status-none{background-color:#DCD2AE; opacity:.75;}
  .plot .plot-name{font-family:'Zilla Slab', serif; font-weight:600; font-size:14px;}
  .plot .plot-area{font-family:'JetBrains Mono', monospace; font-size:11px; opacity:.85;}
  .plot .plot-crop{font-size:12px; font-weight:600;}
  .plot .plot-status{align-self:flex-start; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; background:rgba(255,255,255,0.55); padding:2px 6px; border-radius:3px; font-weight:600;}

  /* ---------- Recent lists ---------- */
  .list-card{padding:6px 0;}
  .list-row{padding:8px 16px; border-bottom:1px solid var(--paper-2); font-size:13px; display:flex; justify-content:space-between; gap:8px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .flag-late{color:var(--cost-dark); font-weight:700; font-size:10.5px; text-transform:uppercase; margin-left:6px;}

  /* ---------- Property cards (nested talhões) ---------- */
  .property-card{padding:16px 18px; margin-bottom:14px;}
  .property-head{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;}
  .property-title{font-family:'Zilla Slab', serif; font-size:16px; font-weight:600;}
  .property-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .property-sublabel{margin-top:14px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700;}

  /* ---------- Forms ---------- */
  .form-card{padding:16px 18px; margin-bottom:20px;}
  .form-card h3{font-family:'Zilla Slab', serif; margin:0 0 12px; font-size:15px; color:var(--ink); border-bottom:1px dashed var(--paper-line); padding-bottom:8px;}
  form.entry-form{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; align-items:end;}
  .field{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .field label{font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;}
  .field input, .field select{padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; color:var(--ink); font-size:13px; width:100%; min-width:0; box-sizing:border-box;}
  .field input:focus, .field select:focus{border-color:var(--accent);}
  .btn{padding:9px 16px; border-radius:4px; border:none; font-size:13px; font-weight:600; background:var(--accent); color:#241704; transition:background .15s ease;}
  .btn:hover{background:var(--accent-dark); color:var(--paper);}
  .btn-del{background:transparent; border:1px solid var(--cost); color:var(--cost-dark); padding:4px 9px; font-size:11px; border-radius:4px; font-weight:600;}
  .btn-del:hover{background:var(--cost); color:#fff;}
  .btn-edit{background:transparent; border:1px solid var(--accent-dark); color:var(--accent-dark); padding:4px 9px; font-size:11px; border-radius:4px; font-weight:600; margin-right:6px;}
  .btn-edit:hover{background:var(--accent-dark); color:var(--paper);}
  .btn-cancel{background:transparent; border:1px solid var(--paper-line); color:var(--ink-soft); padding:9px 16px; font-size:13px; border-radius:4px; font-weight:600; margin-left:8px;}
  .btn-cancel:hover{background:var(--paper-2);}

  /* ---------- Tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); border-bottom:1px solid var(--paper-line); padding:8px 10px; font-weight:600;}
  tbody td{padding:9px 10px; border-bottom:1px solid var(--paper-2);}
  tbody tr:last-child td{border-bottom:none;}
  .num{font-family:'JetBrains Mono', monospace;}
  .num.growth{color:var(--growth-dark); font-weight:600;}
  .num.cost{color:var(--cost-dark); font-weight:600;}
  .badge{font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; padding:2px 7px; border-radius:3px; font-weight:700;}
  .badge.status-andamento{background:#DFA84E; color:#241704;}
  .badge.status-planejada{background:#C9C3A4; color:#241704;}
  .badge.status-colhida{background:#7FA36D; color:#0E1D0A;}
  .badge.tipo-custo{background:var(--cost); color:#fff;}
  .badge.tipo-receita{background:var(--growth); color:#fff;}

  .empty-state{padding:30px 20px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
  .table-wrap{overflow-x:auto;}

  @media (max-width: 820px){
    #app{grid-template-columns:1fr;}
    .sidebar{position:sticky; top:0; z-index:10; height:auto; flex-direction:row; align-items:center; padding:12px 14px; gap:14px; overflow-x:auto; overflow-y:visible;}
    .brand-text span{display:none;}
    nav{flex-direction:row;}
    .nav-group-label{display:none;}
    .nav-btn{display:flex !important;}
    .sidebar-footer{display:none;}
    main{padding:20px 16px 50px;}
  }

  .no-print{}

  .auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card{
    width:100%; max-width:380px; padding:30px 28px;
  }
  .auth-card h2{font-family:'Zilla Slab', serif; margin:0 0 4px; font-size:22px; color:var(--ink);}
  .auth-card p{font-size:13px; color:var(--ink-soft); margin:0 0 20px; line-height:1.5;}
  .auth-card .field{margin-bottom:14px;}
  .auth-card .btn{width:100%;}
  .auth-error{color:var(--cost-dark); font-size:12.5px; margin:-6px 0 14px; font-weight:600;}
  .auth-link{background:none; border:none; color:var(--ink-soft); font-size:12px; text-decoration:underline; cursor:pointer; margin-top:14px; padding:0;}
  .workspace-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border:1px solid var(--paper-line); border-radius:4px; margin-bottom:8px;
    background:#FBF7EC; cursor:pointer; font-size:14px; font-weight:600;
  }
  .workspace-item:hover{border-color:var(--accent);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,26,16,0.6); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{width:100%; max-width:360px; padding:22px;}
  .modal-cat-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:6px 0; border-bottom:1px solid var(--paper-2); font-size:13.5px;
  }
  .modal-cat-row:last-child{border-bottom:none;}
  .field-with-add{display:flex; align-items:flex-end; gap:6px; min-width:0;}
  .field-with-add .field{flex:1; min-width:0;}
  .btn-add-inline{
    background:var(--accent); color:#241704; border:none; border-radius:4px;
    width:34px; height:34px; font-size:18px; font-weight:700; line-height:1; cursor:pointer; flex:none;
  }
  .btn-add-inline:hover{background:var(--accent-dark); color:var(--paper);}

  @media print{
    .sidebar, #loading-indicator, .form-card, .btn-del, .no-print{display:none !important;}
    #app{display:block !important;}
    main{padding:0; max-width:100%;}
    body{background:#fff;}
    .paper{box-shadow:none; border:1px solid #ccc;}
  }
</style>
</head>
<body>
<div id="gate-screen" class="auth-screen" style="display:none;">
  <div class="auth-card paper"></div>
</div>
<div id="workspace-screen" class="auth-screen" style="display:none;">
  <div class="auth-card paper"></div>
</div>
<div id="cat-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Categorias de Produto</h3>
    <div id="cat-modal-list" style="margin-bottom:14px;"></div>
    <form id="form-cat-modal" style="display:flex; gap:8px;">
      <input type="text" id="cat-modal-input" name="nome" placeholder="Nova categoria" required style="flex:1; padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
      <button type="submit" class="btn">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-cat-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="tipo-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Tipos de Atividade</h3>
    <div id="tipo-modal-list" style="margin-bottom:14px;"></div>
    <form id="form-tipo-modal" style="display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="tipo-modal-input" name="nome" placeholder="Nova atividade (ex: Irrigação)" required style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
      <select id="tipo-modal-cor" name="cor" style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;"></select>
      <button type="submit" class="btn">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-tipo-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="conta-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Contas Financeiras</h3>
    <div id="conta-modal-list" style="margin-bottom:14px; max-height:220px; overflow-y:auto;"></div>
    <form id="form-conta-modal" style="display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="conta-modal-input" name="nome" placeholder="Nome da conta (ex: Fertilizante)" required style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
      <div class="field-with-add">
        <select id="conta-modal-subgrupo" name="subgrupoId" style="flex:1; padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;"></select>
        <button type="button" class="btn-add-inline" data-action="open-subgrupo-modal" title="Novo subgrupo">+</button>
      </div>
      <button type="submit" class="btn">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-conta-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="subgrupo-modal-overlay" class="modal-overlay" style="display:none; z-index:110;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Subgrupos Financeiros</h3>
    <div id="subgrupo-modal-list" style="margin-bottom:14px; max-height:220px; overflow-y:auto;"></div>
    <form id="form-subgrupo-modal" style="display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="subgrupo-modal-input" name="nome" placeholder="Nome do subgrupo (ex: Custo Insumos Agrícolas)" required style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
      <select id="subgrupo-modal-tipo" name="tipo" style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
        <option value="custo">Despesa</option>
        <option value="receita">Receita</option>
      </select>
      <button type="submit" class="btn">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-subgrupo-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">⌂</div>
      <div class="brand-text"><strong>Minha Fazenda</strong><span>Caderno de gestão</span></div>
    </div>
    <nav id="nav">
      <button class="nav-btn active" data-tab="painel">Dashboard</button>
      <div class="nav-group-label" data-group="cadastros">Cadastros</div>
      <button class="nav-btn" data-tab="propriedades">Propriedades</button>
      <button class="nav-btn" data-tab="talhoes">Talhões</button>
      <button class="nav-btn" data-tab="safras">Safras</button>
      <button class="nav-btn" data-tab="culturas">Culturas</button>
      <button class="nav-btn" data-tab="produtos">Produtos</button>
      <button class="nav-btn" data-tab="compras">Compras</button>
      <button class="nav-btn" data-tab="parceiros">Parceiros</button>
      <button class="nav-btn" data-tab="equipe">Funcionários</button>
      <button class="nav-btn" data-tab="patrimonio">Patrimônio</button>
      <div class="nav-group-label" data-group="campo">Campo</div>
      <button class="nav-btn" data-tab="producao">Colheita</button>
      <button class="nav-btn" data-tab="vendasAntecipadas">Venda Antecipada</button>
      <button class="nav-btn" data-tab="operacoes">Diário de Campo</button>
      <div class="nav-group-label" data-group="financeiro">Financeiro</div>
      <button class="nav-btn" data-tab="financeiro">Lançamentos</button>
      <button class="nav-btn" data-tab="contasPagar">Contas a Pagar</button>
      <button class="nav-btn" data-tab="contasReceber">Contas a Receber</button>
      <div class="nav-group-label" data-group="contratos">Contratos e Serviços</div>
      <button class="nav-btn" data-tab="arrendamentos">Arrendamentos</button>
      <button class="nav-btn" data-tab="financiamentos">Financiamentos</button>
      <button class="nav-btn" data-tab="servicosPrestados">Serviços Prestados</button>
      <div class="nav-group-label" data-group="analise">Análise</div>
      <button class="nav-btn" data-tab="rentabilidade">Rentabilidade</button>
      <button class="nav-btn" data-tab="fluxoCaixa">Fluxo de Caixa</button>
      <button class="nav-btn" data-tab="contaCorrente">Conta-Corrente</button>
      <button class="nav-btn" data-tab="orcamento">Orçado x Realizado</button>
      <button class="nav-btn" data-tab="relatorios">Relatórios</button>
      <button class="nav-btn" data-tab="indicadores">Indicadores</button>
    </nav>
    <div class="sidebar-footer">
      Dados compartilhados com quem acessa este app.<br>
      <button type="button" class="auth-link" data-action="switch-workspace" style="color:#9FAE93;">Trocar propriedade</button>
      <button type="button" class="auth-link" data-action="lock-app" style="color:#9FAE93;">Sair</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1 id="page-title">Dashboard</h1>
        <div class="subtitle" id="page-subtitle">Visão geral da propriedade</div>
      </div>
      <div id="loading-indicator">Carregando dados…</div>
    </div>

    <section id="tab-painel" class="tab-content"></section>
    <section id="tab-propriedades" class="tab-content hidden"></section>

  function nomePatrimonio(id){ var p = state.patrimonio.find(function(x){ return x.id === id; }); return p ? p.nome : '—'; }
  function horasUsoTotais(patrimonioId){
    return state.producao.filter(function(p){ return p.maquinaId === patrimonioId; }).reduce(function(s,p){ return s + (Number(p.horasUso)||0); }, 0);
  }

  function calcDepreciacao(item){
    var valor = Number(item.valor) || 0;
    var vidaUtil = Number(item.vidaUtilAnos) || 0;
    var percResidual = Number(item.percentualResidual) || 0;
    if(!item.dataAquisicao || !vidaUtil) return valor;
    var aquisicao = new Date(item.dataAquisicao);
    if(isNaN(aquisicao.getTime())) return valor;
    var hoje = new Date();
    var anos = (hoje - aquisicao) / (365.25 * 24 * 3600 * 1000);
    if(anos < 0) anos = 0;
    var fracao = Math.min(anos / vidaUtil, 1);
    var valorResidual = valor * (percResidual / 100);
    var depreciavel = valor - valorResidual;
    var atual = valor - (depreciavel * fracao);
    return Math.max(atual, valorResidual);
  }
  function calcValorFinanciamentoComJuros(item){
    var principal = Number(item.valorTotal) || 0;
    var taxa = Number(item.taxaJuros) || 0;
    if(!item.dataContratacao || !item.dataFinal || !taxa) return null;
    var inicio = new Date(item.dataContratacao);
    var fim = new Date(item.dataFinal);
    if(isNaN(inicio.getTime()) || isNaN(fim.getTime()) || fim <= inicio) return null;
    var anos = (fim - inicio) / (365.25 * 24 * 3600 * 1000);
    return principal * Math.pow(1 + (taxa / 100), anos);
  }
  function financiamentoValorBase(item){
    var comJuros = calcValorFinanciamentoComJuros(item);
    return comJuros !== null ? comJuros : (Number(item.valorTotal) || 0);
  }
  function financiamentoSaldoDevedor(item){
    var base = financiamentoValorBase(item);
    var pago = (Number(item.parcelasPagas) || 0) * (Number(item.valorParcela) || 0);
    return Math.max(base - pago, 0);
  }

    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);

  function fmtDate(d){
    if(!d) return '—';
    var parts = d.split('-');
    if(parts.length !== 3) return d;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

    var parts = ym.split('-');
    var idx = parseInt(parts[1], 10) - 1;

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });

  /* ---------------- Storage ---------------- */
  var hasCloudStorage = !!(window.storage && typeof window.storage.get === 'function');
  var hasLocalStorage = (function(){
    try{ var k='__fazenda_test__'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  })();
  var hasNetlifyBlobs = false;
  var NETLIFY_STORAGE_ENDPOINT = '/.netlify/functions/storage';
  var LS_PREFIX = 'fazenda:';
  var currentWorkspaceId = null;

  function blobsGet(storageKey){
    return fetch(NETLIFY_STORAGE_ENDPOINT + '?key=' + encodeURIComponent(storageKey))
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(v){ return (v === undefined) ? null : v; })
      .catch(function(err){ console.error('Erro ao ler (Netlify Blobs)', storageKey, err); return null; });
  }
  function blobsSet(storageKey, value){
    return fetch(NETLIFY_STORAGE_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key: storageKey, value: value})
    }).catch(function(err){ console.error('Erro ao salvar (Netlify Blobs)', storageKey, err); });
  }

  function rawGet(storageKey){
    if(hasNetlifyBlobs){ return blobsGet(storageKey); }
    if(hasCloudStorage){
      return Promise.resolve()
        .then(function(){ return window.storage.get(storageKey, true); })
        .then(function(res){ return res && res.value ? JSON.parse(res.value) : null; })
        .catch(function(){ return null; });
    }
    if(hasLocalStorage){
      try{
        var raw = window.localStorage.getItem(LS_PREFIX + storageKey);
        return Promise.resolve(raw ? JSON.parse(raw) : null);
      }catch(e){ return Promise.resolve(null); }
    }
    return Promise.resolve(null);
  }
  function rawSet(storageKey, value){
    if(hasNetlifyBlobs){ return blobsSet(storageKey, value); }
    if(hasCloudStorage){
      return Promise.resolve()
        .then(function(){ return window.storage.set(storageKey, JSON.stringify(value), true); })
        .catch(function(err){ console.error('Erro ao salvar', storageKey, err); });
    }
    if(hasLocalStorage){
      try{ window.localStorage.setItem(LS_PREFIX + storageKey, JSON.stringify(value)); }catch(e){ console.error('Erro ao salvar', storageKey, e); }
    }
    return Promise.resolve();
  }

  function migrateLocalStorageToBlobs(){
    if(!hasLocalStorage) return Promise.resolve();
    var chaves = [];
    try{
      for(var i = 0; i < window.localStorage.length; i++){
        var k = window.localStorage.key(i);
        if(k && k.indexOf(LS_PREFIX) === 0) chaves.push(k.slice(LS_PREFIX.length));
      }
    }catch(e){ return Promise.resolve(); }
    var tarefas = chaves.map(function(chave){
      var raw = null;
      try{ raw = window.localStorage.getItem(LS_PREFIX + chave); }catch(e){}
      if(!raw) return Promise.resolve();
      var valor;
      try{ valor = JSON.parse(raw); }catch(e){ return Promise.resolve(); }
      return blobsSet(chave, valor);
    });
    return Promise.all(tarefas);
  }

  function detectStorageBackend(){
    if(hasCloudStorage) return Promise.resolve();
    return fetch(NETLIFY_STORAGE_ENDPOINT + '?key=__ping__')
      .then(function(res){
        if(!res.ok){
          console.warn('Netlify Blobs: function respondeu com status ' + res.status + ' — usando localStorage como alternativa.');
          return;
        }
        hasNetlifyBlobs = true;
        console.info('Netlify Blobs: conectado com sucesso.');
        return blobsGet('global::workspaces').then(function(blobsWs){
          if(blobsWs && blobsWs.length) return;
          var lsWs = null;
          try{ var raw = window.localStorage.getItem(LS_PREFIX + 'global::workspaces'); lsWs = raw ? JSON.parse(raw) : null; }catch(e){}
          if(lsWs && lsWs.length){
            console.info('Netlify Blobs: migrando dados locais existentes...');
            return migrateLocalStorageToBlobs();
          }
        });
      })
      .catch(function(err){
        console.warn('Netlify Blobs: não foi possível conectar (' + err + ') — usando localStorage como alternativa.');
      });
  }

  // Chaves globais (não dependem de qual propriedade/cliente está selecionado)
  function loadGlobal(key){ return rawGet('global::' + key); }
  function saveGlobal(key, value){ return rawSet('global::' + key, value); }

  // Chaves de dados da propriedade/cliente atualmente selecionado
  function loadKey(key){
    return rawGet(currentWorkspaceId + '::' + key).then(function(v){ return v || []; });
  }
  function saveKey(key, arr){
    return rawSet(currentWorkspaceId + '::' + key, arr);
  }

  function loadWorkspaces(){ return loadGlobal('workspaces').then(function(v){ return Array.isArray(v) ? v : []; }); }
  function saveWorkspaces(list){ return saveGlobal('workspaces', list); }

  function migrateLegacyIfNeeded(){
    return rawGet('talhoes').then(function(legacyTalhoes){
      if(!legacyTalhoes || !legacyTalhoes.length){ return null; }
      var newId = 'ws-' + Date.now();
      return Promise.all(ALL_KEYS.map(function(k){
        return rawGet(k).then(function(val){
          if(val && val.length){ return rawSet(newId + '::' + k, val); }
        });
      })).then(function(){
        return loadWorkspaces().then(function(list){
          list.push({id:newId, nome:'Minha Fazenda', criadoEm:Date.now()});
          return saveWorkspaces(list).then(function(){ return newId; });
        });
      });
    });

  function estoquePorSafra(){
    var map = {};
    state.producao.forEach(function(p){
      if(!map[p.safraId]) map[p.safraId] = {entrada:0, saida:0, precoSoma:0, precoCount:0, unidade:''};
      if(p.tipo === 'entrada'){
        map[p.safraId].entrada += Number(p.quantidade) || 0;
        if(Number(p.precoUnitario) > 0){ map[p.safraId].precoSoma += Number(p.precoUnitario); map[p.safraId].precoCount++; }
        if(p.unidade) map[p.safraId].unidade = p.unidade;
      } else {
        map[p.safraId].saida += Number(p.quantidade) || 0;
      }
    });
    return map;
  }
  function estoqueResumo(){
    var estoque = estoquePorSafra();
    var total = 0;
    var itens = Object.keys(estoque).map(function(sid){
      var e = estoque[sid];
      var qtd = e.entrada - e.saida;
      var preco = e.precoCount ? (e.precoSoma / e.precoCount) : 0;
      var valor = Math.max(qtd, 0) * preco;
      total += valor;
      return {safraId: sid, qtd: qtd, preco: preco, valor: valor, unidade: e.unidade};
    });
    return {total: total, itens: itens};
  }
  var KG_POR_SACA = 60;
  function converterKgSc(qtd, unidade){
    var u = String(unidade || '').trim().toLowerCase();
    if(u === 'kg'){ return {kg: qtd, sc: qtd / KG_POR_SACA}; }
    if(u === 'sc' || u === 'saca' || u === 'sacas'){ return {kg: qtd * KG_POR_SACA, sc: qtd}; }
    return {kg: null, sc: null};
  }
  function estoquePorCultura(){
    var porSafra = estoquePorSafra();
    var porCultura = {};
    Object.keys(porSafra).forEach(function(sid){
      var safra = state.safras.find(function(s){ return s.id === sid; });
      if(!safra) return;
      var culturaId = safra.culturaId;
      var e = porSafra[sid];
      var qtd = e.entrada - e.saida;
      if(qtd <= 0) return;
      var preco = e.precoCount ? (e.precoSoma / e.precoCount) : 0;
      var valor = qtd * preco;
      if(!porCultura[culturaId]) porCultura[culturaId] = {qtd: 0, valor: 0, unidade: e.unidade};
      porCultura[culturaId].qtd += qtd;
      porCultura[culturaId].valor += valor;
      if(!porCultura[culturaId].unidade && e.unidade) porCultura[culturaId].unidade = e.unidade;
    });
    return Object.keys(porCultura).map(function(cid){
      var c = porCultura[cid];
      var conv = converterKgSc(c.qtd, c.unidade);
      return {culturaId: cid, qtd: c.qtd, unidade: c.unidade, valor: c.valor, kg: conv.kg, sc: conv.sc};
    }).sort(function(a,b){ return b.valor - a.valor; });
  }
  function estoqueValorPorSafraIds(safraIds){
    var estoque = estoquePorSafra();
    var total = 0;
    safraIds.forEach(function(sid){
      var e = estoque[sid];
      if(!e) return;
      var qtd = e.entrada - e.saida;
      var preco = e.precoCount ? (e.precoSoma / e.precoCount) : 0;
      total += Math.max(qtd, 0) * preco;
    });
    return total;
  }

  function contasAVencer(dias){
    var hoje = new Date(); hoje.setHours(0,0,0,0);
    var limite = new Date(hoje.getTime() + dias * 24 * 3600 * 1000);
    var lista = [];
    state.financeiro.forEach(function(f){
      if(f.status === 'Pendente' && f.vencimento){
        var d = new Date(f.vencimento);
        if(d <= limite) lista.push({desc:(f.tipo==='custo'?'A pagar':'A receber') + ' · ' + (f.descricao || f.categoria), valor:Number(f.valor)||0, vencimento:f.vencimento, tipo: f.tipo==='receita'?'entrada':'saida', atrasado: d < hoje});
      }
    });
    state.contasPagar.forEach(function(c){
      if(c.status === 'Pendente' && c.vencimento){
        var d = new Date(c.vencimento);
        if(d <= limite) lista.push({desc:'A pagar · ' + c.descricao, valor:Number(c.valor)||0, vencimento:c.vencimento, tipo:'saida', atrasado: d < hoje});
      }
    });
    state.contasReceber.forEach(function(c){
      if(c.status === 'Pendente' && c.vencimento){
        var d = new Date(c.vencimento);
        if(d <= limite) lista.push({desc:'A receber · ' + c.descricao, valor:Number(c.valor)||0, vencimento:c.vencimento, tipo:'entrada', atrasado: d < hoje});
      }
    });
    lista.sort(function(a,b){ return new Date(a.vencimento) - new Date(b.vencimento); });
    return lista;
  }

  function buildCashEvents(){
    var events = [];
    state.financeiro.forEach(function(f){
      var st = f.status || 'Pago';
      if(st === 'Pendente'){ events.push({date: f.vencimento || f.data, valor: Number(f.valor)||0, tipo: f.tipo === 'receita' ? 'entrada' : 'saida', realizado:false}); }
      else { events.push({date: f.data, valor: Number(f.valor)||0, tipo: f.tipo === 'receita' ? 'entrada' : 'saida', realizado:true}); }
    });
    state.contasPagar.forEach(function(c){
      if(c.status === 'Pago'){ events.push({date: c.dataPagamento || c.vencimento, valor:Number(c.valor)||0, tipo:'saida', realizado:true}); }
      else { events.push({date: c.vencimento, valor:Number(c.valor)||0, tipo:'saida', realizado:false}); }
    });
    state.contasReceber.forEach(function(c){
      if(c.status === 'Recebido'){ events.push({date: c.dataRecebimento || c.vencimento, valor:Number(c.valor)||0, tipo:'entrada', realizado:true}); }
      else { events.push({date: c.vencimento, valor:Number(c.valor)||0, tipo:'entrada', realizado:false}); }
    });
    return events.filter(function(e){ return e.date; });
  }

    var areaTotal = state.talhoes.reduce(function(sum,t){ return sum + (Number(t.area)||0); }, 0);

    var totalReceitas = state.financeiro.filter(function(f){ return f.tipo === 'receita' && (f.status||'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
    var saldo = totalReceitas - totalCustos;
    var estoque = estoqueResumo();

    var html = '';
    html += '<div class="stat-row">';
    html += statCard('Área total', fmtHa(areaTotal));
    html += statCard('Propriedades', state.propriedades.length);
    html += statCard('Talhões', state.talhoes.length);
    html += statCard('Safras em andamento', safrasAndamento);
    html += statCard('Saldo financeiro', fmtBRL(saldo), saldo >= 0 ? 'growth' : 'cost');
    html += statCard('Produção em estoque', fmtBRL(estoque.total), 'growth');
    html += '</div>';

    var estoqueBaixo = state.produtos.filter(function(p){ return Number(p.estoqueMinimo) > 0 && Number(p.estoqueAtual) < Number(p.estoqueMinimo); });
    var manutencao = state.patrimonio.filter(function(p){ return p.status === 'Em manutenção'; });
    var hojeMs = Date.now();
    var colheitasProximas = state.safras.filter(function(s){
      if(s.status !== 'andamento' || !s.previsaoColheita) return false;
      var dias = Math.ceil((new Date(s.previsaoColheita + 'T00:00:00').getTime() - hojeMs) / 86400000);
      return dias <= 15;
    });
    if(estoqueBaixo.length || manutencao.length || colheitasProximas.length){
      html += '<div class="paper alert-box">';
      if(estoqueBaixo.length){
        html += '<div><strong style="color:var(--cost-dark);">Estoque abaixo do mínimo:</strong> ' + estoqueBaixo.map(function(p){ return escapeHtml(p.nome); }).join(', ') + '</div>';
      }
      if(manutencao.length){
        html += '<div><strong style="color:var(--accent-dark);">Patrimônio em manutenção:</strong> ' + manutencao.map(function(p){ return escapeHtml(p.nome); }).join(', ') + '</div>';
      }
      if(colheitasProximas.length){
        html += '<div><strong style="color:var(--accent-dark);">Colheita se aproximando:</strong> ' + colheitasProximas.map(function(s){
          var dias = Math.ceil((new Date(s.previsaoColheita + 'T00:00:00').getTime() - hojeMs) / 86400000);
          var txt = dias < 0 ? (Math.abs(dias) + ' dia(s) atrasada') : (dias === 0 ? 'hoje' : 'em ' + dias + ' dia(s)');
          return escapeHtml(safraLabel(s.id)) + ' (' + txt + ')';
        }).join(', ') + '</div>';
      }
      html += '</div>';
    }

    var vencendo = contasAVencer(7);
    if(vencendo.length){
      html += '<div class="section-title">Contas a vencer (próximos 7 dias)</div>';
      html += '<div class="paper list-card">';
      vencendo.forEach(function(v){
        html += '<div class="list-row"><span>' + escapeHtml(v.desc) + (v.atrasado ? '<span class="flag-late">Atrasado</span>' : '') + '</span>';
        html += '<span class="num ' + (v.tipo==='entrada'?'growth':'cost') + '">' + (v.tipo==='entrada'?'+':'−') + ' ' + fmtBRL(v.valor) + ' · ' + fmtDate(v.vencimento) + '</span></div>';
      });
      html += '</div>';
    }

    html += '<div class="section-title">Mapa de talhões</div>';
    if(!state.talhoes.length){
      html += '<div class="paper empty-state">Nenhum talhão cadastrado ainda. Vá até a aba <strong>Talhões</strong> para mapear a primeira área da propriedade.</div>';
    } else {
      html += '<div class="plot-map">';
      state.talhoes.forEach(function(t){
        var safra = safraAtualDoTalhao(t.id);
        var statusClass = safra ? 'status-' + safra.status : 'status-none';
        var statusLabel = safra ? STATUS_LABEL[safra.status] : 'Sem safra';
        html += '<button type="button" class="plot ' + statusClass + '" data-talhao-id="' + t.id + '" title="Registrar atividade no talhão ' + escapeHtml(t.nome) + '">';
        html += '<div><div class="plot-name">' + escapeHtml(t.nome) + '</div><div class="plot-area">' + fmtHa(t.area) + '</div></div>';
        html += '<div><div class="plot-crop">' + (safra ? escapeHtml(culturaNome(safra.culturaId)) : '—') + '</div><span class="plot-status">' + statusLabel + '</span></div>';
        html += '<span class="plot-cta">+ Atividade</span>';
        html += '</button>';
      });
      html += '</div>';
    }

    html += '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-top:24px;">';

    html += '<div><div class="section-title" style="margin-top:0;">Últimas atividades</div>';
    var recentOps = state.operacoes.slice().sort(function(a,b){ return (b.criadoEm||0)-(a.criadoEm||0); }).slice(0,5);
    if(!recentOps.length){
      html += '<div class="paper empty-state">Nenhuma atividade registrada.</div>';
    } else {
      html += '<div class="paper list-card">';
      recentOps.forEach(function(o){
        html += '<div class="list-row"><span>' + escapeHtml(o.tipo) + (o.talhaoId ? ' · ' + escapeHtml(talhaoNome(o.talhaoId)) : '') + '</span><span class="num" style="color:var(--ink-soft);">' + fmtDate(o.data) + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += '<div><div class="section-title" style="margin-top:0;">Grãos em estoque</div>';
    var topEstoqueCultura = estoquePorCultura().slice(0, 5);
    if(!topEstoqueCultura.length){
      html += '<div class="paper empty-state">Nenhuma produção em estoque no momento.</div>';
    } else {
      html += '<div class="paper list-card">';
      topEstoqueCultura.forEach(function(i){
        var nome = culturaNome(i.culturaId).toUpperCase();
        var linhaQtd;
        if(i.kg !== null){
          linhaQtd = nome + ' - ' + i.kg.toLocaleString('pt-BR', {maximumFractionDigits:0}) + 'KG - ' + i.sc.toLocaleString('pt-BR', {maximumFractionDigits:0}) + 'SC';
        } else {
          linhaQtd = nome + ' - ' + fmtNum(i.qtd) + (i.unidade ? ' ' + escapeHtml(i.unidade).toUpperCase() : '');
        }
        html += '<div class="list-row" style="flex-direction:column; align-items:flex-start; gap:3px;">';
        html += '<span style="font-weight:600;">' + linhaQtd + '</span>';
        html += '<span class="num growth">' + fmtBRL(i.valor) + '</span>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += '<div><div class="section-title" style="margin-top:0;">Cotações de referência</div>';
    if(!state.culturas.length){
      html += '<div class="paper empty-state">Cadastre culturas para anotar cotações.</div>';
    } else {
      html += '<div class="paper" style="padding:10px 16px;">';
      state.culturas.forEach(function(c){
        var cot = state.cotacoes.find(function(x){ return x.culturaId === c.id; });
        html += '<div class="list-row" style="align-items:center;">';
        html += '<span>' + escapeHtml(c.nome) + (cot ? ' <span style="font-size:11px; color:var(--ink-soft);">(atualizado ' + fmtDate(cot.dataAtualizacao) + ')</span>' : '') + '</span>';
        html += '<span style="display:flex; align-items:center; gap:6px;">';
        html += '<input type="number" step="0.01" min="0" class="cotacao-input" data-cultura-id="' + c.id + '" placeholder="0,00" value="' + (cot ? cot.preco : '') + '" style="width:90px; padding:5px 7px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:12.5px;">';
        html += '<button type="button" class="btn-edit" data-action="salvar-cotacao" data-id="' + c.id + '">Salvar</button>';
        html += '<a href="https://www.google.com/search?q=' + encodeURIComponent('cotação ' + c.nome + ' cepea hoje') + '" target="_blank" rel="noopener" class="btn-edit" style="text-decoration:none;">Ver preço</a>';
        html += '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';


    var recentFin = state.financeiro.slice().sort(function(a,b){ return (b.criadoEm||0)-(a.criadoEm||0); }).slice(0,5);
    html += '<div><div class="section-title" style="margin-top:0;">Últimos lançamentos</div>';
    if(!recentFin.length){
      html += '<div class="paper empty-state">Nenhum lançamento ainda.</div>';
    } else {
      html += '<div class="paper list-card">';
      recentFin.forEach(function(f){
        html += '<div class="list-row"><span>' + escapeHtml(f.categoria) + '</span><span class="num ' + (f.tipo==='custo'?'cost':'growth') + '">' + (f.tipo==='custo'?'−':'+') + ' ' + fmtBRL(f.valor) + '</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += '</div>';
    el.innerHTML = html;
  }

  /* ---------------- Generic cadastro helpers ---------------- */
  function formatColumn(col, value){
    if(value === undefined || value === null || value === ''){ return '—'; }
    switch(col.format){
      case 'ha': return fmtHa(value);
      case 'brl': return fmtBRL(value);
      case 'num': return escapeHtml(value);
      case 'date': return fmtDate(value);
      case 'badge':
        var bg = (col.colors && col.colors[value]) ? col.colors[value] : '#C9C3A4';
        return '<span class="badge" style="background:' + bg + '; color:#1B1508">' + escapeHtml(value) + '</span>';
      default: return escapeHtml(value);
    }
  }

  function buildGenericFormHtml(entityKey){
    var cfg = ENTITY_CONFIGS[entityKey];
    var editingRecord = null;
    if(editState && editState.scope === 'generic' && editState.entityKey === entityKey){
      editingRecord = state[entityKey].find(function(x){ return x.id === editState.id; }) || null;
    }
    var html = '<div class="paper form-card"><h3>' + (editingRecord ? 'Editar ' + cfg.label.toLowerCase() : 'Novo(a) ' + cfg.label.toLowerCase()) + '</h3>';
    html += '<form class="entry-form" data-form="generic" data-entity="' + entityKey + '"' + (editingRecord ? ' data-editing-id="' + editingRecord.id + '"' : '') + '>';
    cfg.fields.forEach(function(f){
      var current = editingRecord ? editingRecord[f.name] : undefined;
      if(f.type === 'select'){
        var opts = typeof f.optionsFn === 'function' ? f.optionsFn() : f.options;
        html += selectField(f.name, f.label, opts, current);
      } else {
        html += field(f.type, f.name, f.label, !!f.required, f.placeholder || '', f.extra || {}, current);
      }
    });
    html += '<button type="submit" class="btn">' + (editingRecord ? 'Salvar alterações' : 'Adicionar') + '</button>';
    if(editingRecord) html += '<button type="button" class="btn-cancel" data-action="cancel-edit">Cancelar</button>';
    html += '</form></div>';
    return html;
  }

  function buildGenericTableHtml(entityKey){
    var cfg = ENTITY_CONFIGS[entityKey];
    var list = state[entityKey];
    var html = '<div class="paper">';
    if(!list.length){
      html += '<div class="empty-state">Nenhum(a) ' + cfg.label.toLowerCase() + ' cadastrado(a) ainda.</div>';
    } else {
      if(list.length > 4){
        html += '<div style="padding:14px 18px 0;"><input type="text" id="search-' + entityKey + '" placeholder="Buscar..." style="width:100%; max-width:280px; padding:7px 10px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;"></div>';
      }
      html += '<div class="table-wrap"><table><thead><tr>';
      cfg.columns.forEach(function(c){ html += '<th>' + c.label + '</th>'; });
      html += '<th></th></tr></thead><tbody>';
      list.slice().sort(function(a,b){ return (b.criadoEm||0)-(a.criadoEm||0); }).forEach(function(item){
        html += '<tr>';
        cfg.columns.forEach(function(c){
          var val = c.compute ? c.compute(item) : item[c.key];
          var numClass = (c.format === 'ha' || c.format === 'brl' || c.format === 'num') ? ' class="num"' : '';
          html += '<td' + numClass + '>' + formatColumn(c, val) + '</td>';
        });
        html += '<td><button class="btn-edit" data-action="edit-generic" data-entity="' + entityKey + '" data-id="' + item.id + '">Editar</button>';
        html += '<button class="btn-del" data-action="del-generic" data-entity="' + entityKey + '" data-id="' + item.id + '">Remover</button>';
        if(cfg.extraRowAction) html += cfg.extraRowAction(item);
        html += '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
    return html;
  }

  function renderGenericTab(entityKey){
    document.getElementById('tab-' + entityKey).innerHTML = buildGenericFormHtml(entityKey) + buildGenericTableHtml(entityKey);
  }

  function verificarStatusCertificado(){
    var elStatus = document.getElementById('certificado-status');
    var elForm = document.getElementById('certificado-form-area');
    if(!elStatus || !elForm) return;
    fetch('/.netlify/functions/certificado')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.configurado){
          elStatus.innerHTML = '✅ Certificado configurado: <strong>' + escapeHtml(data.nomeArquivo || 'certificado') + '</strong>' + (data.atualizadoEm ? ' (enviado em ' + fmtDate(data.atualizadoEm.slice(0,10)) + ')' : '');
          elForm.innerHTML = '<button type="button" class="btn-del" data-action="remover-certificado">Remover certificado</button>';
        } else {
          elStatus.innerHTML = data.erro ? ('⚠️ ' + escapeHtml(data.erro)) : 'Nenhum certificado configurado ainda.';
          elForm.innerHTML = '<div class="entry-form">'
            + '<div class="field"><label>Arquivo do certificado (.pfx ou .p12)</label><input type="file" id="cert-file-input" accept=".pfx,.p12"></div>'
            + '<div class="field"><label>Senha do certificado</label><input type="password" id="cert-senha-input" placeholder="Senha"></div>'
            + '<button type="button" class="btn" data-action="enviar-certificado" style="align-self:end;">Enviar com segurança</button>'
            + '</div>';
        }
      })
      .catch(function(){
        elStatus.textContent = 'Não foi possível verificar agora — normal se você ainda não publicou a function ou não configurou CERT_ENCRYPTION_KEY no Netlify.';
        elForm.innerHTML = '';
      });
  }

  function enviarCertificado(){
    var fileInput = document.getElementById('cert-file-input');
    var senhaInput = document.getElementById('cert-senha-input');
    var file = fileInput && fileInput.files && fileInput.files[0];
    var senha = senhaInput ? senhaInput.value : '';
    if(!file){ alert('Selecione o arquivo do certificado (.pfx ou .p12).'); return; }
    if(!senha){ alert('Digite a senha do certificado.'); return; }
    if(!window.confirm('Confirma o envio? O certificado é guardado de forma criptografada — a senha não fica visível pra ninguém depois de enviada.')) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var base64 = String(e.target.result).split(',')[1] || '';
      fetch('/.netlify/functions/certificado', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({certBase64: base64, senha: senha, nomeArquivo: file.name})
      })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(data.ok){
            alert('Certificado enviado e guardado com segurança.');
            if(senhaInput) senhaInput.value = '';
            verificarStatusCertificado();
          } else {
            alert('Não foi possível enviar: ' + (data.error || 'erro desconhecido. Confira se a variável CERT_ENCRYPTION_KEY está configurada no Netlify.'));
          }
        })
        .catch(function(){ alert('Não foi possível enviar o certificado. Confira sua conexão e tente de novo.'); });
    };
    reader.readAsDataURL(file);
  }

  function removerCertificado(){
    if(!window.confirm('Remover o certificado guardado?')) return;
    fetch('/.netlify/functions/certificado', {method: 'DELETE'})
      .then(function(){ verificarStatusCertificado(); })
      .catch(function(){ alert('Não foi possível remover agora.'); });
  }

  function testarConsultaSefaz(){
    var ufInput = document.getElementById('f-sefaz-uf');
    var docInput = document.getElementById('f-sefaz-documento');
    var nsuInput = document.getElementById('f-sefaz-ultnsu');
    var resultadoEl = document.getElementById('sefaz-resultado');
    var uf = ufInput ? ufInput.value : '';
    var documento = docInput ? docInput.value.replace(/\D/g, '') : '';
    var ultNSU = nsuInput ? nsuInput.value.replace(/\D/g, '') : '0';
    if(!documento){ alert('Digite o CPF ou CNPJ (só números).'); return; }
    if(!window.confirm('Isso vai consultar a SEFAZ em ambiente de HOMOLOGAÇÃO usando o certificado guardado. Confirma?')) return;
    if(resultadoEl){ resultadoEl.style.display = 'block'; resultadoEl.textContent = 'Consultando a SEFAZ, aguarde…'; }
    fetch('/.netlify/functions/sefaz-consulta', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ambiente: 'homologacao', uf: uf, documento: documento, ultNSU: ultNSU})
    })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(resultadoEl) resultadoEl.textContent = JSON.stringify(data, null, 2);
      })
      .catch(function(err){
        if(resultadoEl) resultadoEl.textContent = 'Erro ao chamar a function: ' + err;
      });
  }

  /* ---------------- Funcionários (equipe) ---------------- */

  /* ---------------- Rentabilidade ---------------- */
  function talhoesDoLancamento(f){
    if(f.talhoesIds && f.talhoesIds.length) return f.talhoesIds;
    if(f.talhaoId) return [f.talhaoId];
    return [];
  }
  function custosFinanceiroPorTalhao(talhaoId){
    return state.financeiro.filter(function(f){ return f.tipo === 'custo' && (f.status || 'Pago') !== 'Pendente'; }).reduce(function(s,f){
      var talhoes = talhoesDoLancamento(f);
      if(talhoes.indexOf(talhaoId) === -1) return s;
      return s + (Number(f.valor||0) / talhoes.length);
    }, 0);
  }
  function receitasFinanceiroPorTalhao(talhaoId){
    return state.financeiro.filter(function(f){ return f.tipo === 'receita' && (f.status || 'Pago') !== 'Pendente'; }).reduce(function(s,f){
      var talhoes = talhoesDoLancamento(f);
      if(talhoes.indexOf(talhaoId) === -1) return s;
      return s + (Number(f.valor||0) / talhoes.length);
    }, 0);
  }
  function contasPagarPagasPorTalhao(talhaoId){
    return state.contasPagar.filter(function(c){ return c.status === 'Pago' && c.talhaoId === talhaoId; }).reduce(function(s,c){ return s + Number(c.valor||0); }, 0);
  }
  function contasReceberRecebidasPorTalhao(talhaoId){
    return state.contasReceber.filter(function(c){ return c.status === 'Recebido' && c.talhaoId === talhaoId; }).reduce(function(s,c){ return s + Number(c.valor||0); }, 0);
  }
  function custosTotaisPorTalhao(talhaoId){ return custosFinanceiroPorTalhao(talhaoId) + contasPagarPagasPorTalhao(talhaoId); }
  function receitasTotaisPorTalhao(talhaoId){ return receitasFinanceiroPorTalhao(talhaoId) + contasReceberRecebidasPorTalhao(talhaoId); }
  function producaoTotalEmSacas(safraIds){
    var totalSc = 0;
    state.producao.forEach(function(p){
      if(p.tipo !== 'entrada' || safraIds.indexOf(p.safraId) === -1) return;
      var conv = converterKgSc(Number(p.quantidade) || 0, p.unidade);
      totalSc += (conv.sc !== null) ? conv.sc : (Number(p.quantidade) || 0);
    });
    return totalSc;
  }

  function renderRentabilidade(){

      state.talhoes.forEach(function(t){
        var safraIdsDoTalhao = state.safras.filter(function(s){ return s.talhaoId === t.id; }).map(function(s){ return s.id; });
        var custos = custosTotaisPorTalhao(t.id);

        var estoqueValor = estoqueValorPorSafraIds(safraIdsDoTalhao);

        var safra = safraAtualDoTalhao(t.id);
        var area = Number(t.area) || 0;
        var custoPorHa = area > 0 ? (custos / area) : null;
        var totalSacas = producaoTotalEmSacas(safraIdsDoTalhao);
        var custoPorSaca = totalSacas > 0 ? (custos / totalSacas) : null;

        html += '<td class="num growth">' + fmtBRL(receitas) + '</td>';
        html += '<td class="num growth">' + fmtBRL(estoqueValor) + '</td>';

        html += '<td class="num">' + (retorno === null ? '—' : retorno.toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '<div class="section-title">Por cultura</div>';

      html += '<div class="paper empty-state">Cadastre culturas para ver a rentabilidade agrupada.</div>';
    } else {
      html += '<div class="paper table-wrap"><table><thead><tr><th>Cultura</th><th>Custos</th><th>Custo/ha</th><th>Custo/saca</th><th>Receitas</th><th>Estoque projetado</th><th>Resultado</th><th>Retorno s/ custo</th></tr></thead><tbody>';
      state.culturas.forEach(function(c){
        var safrasDaCultura = state.safras.filter(function(s){ return s.culturaId === c.id; });
        var talhaoIds = safrasDaCultura.map(function(s){ return s.talhaoId; }).filter(function(v,i,a){ return a.indexOf(v)===i; });
        var safraIds = safrasDaCultura.map(function(s){ return s.id; });
        var custos = talhaoIds.reduce(function(sum,tid){ return sum + custosTotaisPorTalhao(tid); }, 0);
        var receitas = talhaoIds.reduce(function(sum,tid){ return sum + receitasTotaisPorTalhao(tid); }, 0);
        var estoqueValor = estoqueValorPorSafraIds(safraIds);
        var resultado = receitas + estoqueValor - custos;
        var retorno = custos > 0 ? (resultado / custos * 100) : null;
        var areaTotal = talhaoIds.reduce(function(sum,tid){ var t = state.talhoes.find(function(x){ return x.id === tid; }); return sum + (t ? Number(t.area)||0 : 0); }, 0);
        var custoPorHa = areaTotal > 0 ? (custos / areaTotal) : null;
        var totalSacas = producaoTotalEmSacas(safraIds);
        var custoPorSaca = totalSacas > 0 ? (custos / totalSacas) : null;
        html += '<tr>';

        html += '<td class="num">' + (custoPorHa === null ? '—' : fmtBRL(custoPorHa)) + '</td>';
        html += '<td class="num">' + (custoPorSaca === null ? '—' : fmtBRL(custoPorSaca)) + '</td>';
        html += '<td class="num growth">' + fmtBRL(receitas) + '</td>';
        html += '<td class="num growth">' + fmtBRL(estoqueValor) + '</td>';
        html += '<td class="num ' + (resultado >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(resultado) + '</td>';
        html += '<td class="num">' + (retorno === null ? '—' : retorno.toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '<div class="paper note-box">Custos somam os lançamentos "Pago" do Financeiro e as Contas a Pagar "Pago", ambos vinculados ao talhão. Receitas somam o Financeiro "Pago" e as Contas a Receber "Recebido". "Custo/ha" divide o custo total pela área do talhão (ou soma das áreas, na visão por cultura). "Custo/saca" divide o custo total pela quantidade total colhida (aba Colheita), convertendo kg para sacas (60kg = 1sc) quando aplicável. Como um talhão pode ter mais de uma cultura ao longo do tempo, o agrupamento por cultura soma os talhões onde ela já foi ou está sendo cultivada — evite lançar o mesmo valor em mais de um lugar para não contar em duplicidade.</div>';

    el.innerHTML = html;
  }

  /* ---------------- Fluxo de Caixa ---------------- */
  function renderFluxoCaixa(){
    var el = document.getElementById('tab-fluxoCaixa');
    var events = buildCashEvents();
    var buckets = {};
    events.forEach(function(e){
      var ym = e.date.slice(0,7);
      if(!buckets[ym]) buckets[ym] = {entradaReal:0, saidaReal:0, entradaPrev:0, saidaPrev:0};
      if(e.tipo === 'entrada'){
        if(e.realizado) buckets[ym].entradaReal += e.valor; else buckets[ym].entradaPrev += e.valor;
      } else {
        if(e.realizado) buckets[ym].saidaReal += e.valor; else buckets[ym].saidaPrev += e.valor;
      }
    });
    var months = Object.keys(buckets).sort();

    var saldoRealizado = events.filter(function(e){ return e.realizado; }).reduce(function(s,e){ return s + (e.tipo==='entrada' ? e.valor : -e.valor); }, 0);
    var totalPendenteReceber = state.contasReceber.filter(function(c){ return c.status === 'Pendente'; }).reduce(function(s,c){ return s + Number(c.valor||0); }, 0)
      + state.financeiro.filter(function(f){ return f.status === 'Pendente' && f.tipo === 'receita'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
    var totalPendentePagar = state.contasPagar.filter(function(c){ return c.status === 'Pendente'; }).reduce(function(s,c){ return s + Number(c.valor||0); }, 0)
      + state.financeiro.filter(function(f){ return f.status === 'Pendente' && f.tipo === 'custo'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
    var saldoProjetadoFinal = saldoRealizado + totalPendenteReceber - totalPendentePagar;
    var estoque = estoqueResumo();

    var html = '<div class="stat-row">';
    html += statCard('Saldo realizado', fmtBRL(saldoRealizado), saldoRealizado >= 0 ? 'growth' : 'cost');
    html += statCard('A receber (pendente)', fmtBRL(totalPendenteReceber), 'growth');
    html += statCard('A pagar (pendente)', fmtBRL(totalPendentePagar), 'cost');
    html += statCard('Saldo projetado', fmtBRL(saldoProjetadoFinal), saldoProjetadoFinal >= 0 ? 'growth' : 'cost');
    html += '</div>';

    html += '<div class="paper note-box" style="margin-top:-8px; margin-bottom:16px;">Esta projeção não inclui o valor da produção em estoque (' + fmtBRL(estoque.total) + '), que ainda não tem data prevista de venda — acompanhe em Estoque de Colheita, ou lance a venda em Contas a Receber quando houver data.</div>';

    if(!months.length){
      html += '<div class="paper empty-state">Nenhum lançamento com data para projetar o fluxo de caixa ainda.</div>';
    } else {
      html += '<div class="paper table-wrap"><table><thead><tr><th>Mês</th><th>Entradas realizadas</th><th>Saídas realizadas</th><th>Entradas previstas</th><th>Saídas previstas</th><th>Saldo do mês</th><th>Saldo acumulado</th></tr></thead><tbody>';
      var acumulado = 0;
      months.forEach(function(ym){
        var b = buckets[ym];
        var saldoMes = (b.entradaReal + b.entradaPrev) - (b.saidaReal + b.saidaPrev);
        acumulado += saldoMes;
        html += '<tr>';
        html += '<td>' + monthLabel(ym) + '</td>';
        html += '<td class="num growth">' + fmtBRL(b.entradaReal) + '</td>';
        html += '<td class="num cost">' + fmtBRL(b.saidaReal) + '</td>';
        html += '<td class="num growth">' + fmtBRL(b.entradaPrev) + '</td>';
        html += '<td class="num cost">' + fmtBRL(b.saidaPrev) + '</td>';
        html += '<td class="num ' + (saldoMes >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(saldoMes) + '</td>';
        html += '<td class="num ' + (acumulado >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(acumulado) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }
    el.innerHTML = html;
  }

  /* ---------------- Conta-Corrente por Parceiro ---------------- */
  var contaCorrenteParceiroId = '';

  function renderContaCorrente(){
    var el = document.getElementById('tab-contaCorrente');
    var html = '';

    html += '<div class="paper form-card"><h3>Selecionar parceiro</h3>';
    html += '<div class="entry-form">';
    html += selectField('cc-parceiro', 'Parceiro', [{value:'', label:'Todos os parceiros (resumo)'}].concat(state.parceiros.map(function(p){ return {value:p.id, label:p.nome}; })), contaCorrenteParceiroId);
    html += '</div></div>';

    if(!state.parceiros.length){
      html += '<div class="paper empty-state">Nenhum parceiro cadastrado ainda.</div>';
      el.innerHTML = html;
      return;
    }

    if(!contaCorrenteParceiroId){
      var resumo = {};
      state.financeiro.forEach(function(f){
        if(!f.parceiroId) return;
        if(!resumo[f.parceiroId]) resumo[f.parceiroId] = {pago:0, recebido:0, pendenteAPagar:0, pendenteAReceber:0};
        var st = f.status || 'Pago';
        var valor = Number(f.valor) || 0;
        if(f.tipo === 'custo'){
          if(st === 'Pago') resumo[f.parceiroId].pago += valor; else resumo[f.parceiroId].pendenteAPagar += valor;
        } else {
          if(st === 'Pago') resumo[f.parceiroId].recebido += valor; else resumo[f.parceiroId].pendenteAReceber += valor;
        }
      });
      var idsComMovimento = Object.keys(resumo);
      if(!idsComMovimento.length){
        html += '<div class="paper empty-state">Nenhum lançamento vinculado a um parceiro ainda. Vincule parceiros nos Lançamentos para ver o extrato aqui.</div>';
      } else {
        html += '<div class="paper table-wrap"><table><thead><tr><th>Parceiro</th><th>Total pago</th><th>Total recebido</th><th>Saldo</th><th>A pagar (pendente)</th><th>A receber (pendente)</th></tr></thead><tbody>';
        idsComMovimento
          .sort(function(a,b){ return parceiroNome(a).localeCompare(parceiroNome(b)); })
          .forEach(function(pid){
            var r = resumo[pid];
            var saldo = r.recebido - r.pago;
            html += '<tr>';
            html += '<td>' + escapeHtml(parceiroNome(pid)) + '</td>';
            html += '<td class="num cost">' + fmtBRL(r.pago) + '</td>';
            html += '<td class="num growth">' + fmtBRL(r.recebido) + '</td>';
            html += '<td class="num ' + (saldo >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(saldo) + '</td>';
            html += '<td class="num">' + fmtBRL(r.pendenteAPagar) + '</td>';
            html += '<td class="num">' + fmtBRL(r.pendenteAReceber) + '</td>';
            html += '</tr>';
          });
        html += '</tbody></table></div>';
      }
    } else {
      var lancamentos = state.financeiro.filter(function(f){ return f.parceiroId === contaCorrenteParceiroId; });
      var totalPago = lancamentos.filter(function(f){ return f.tipo === 'custo' && (f.status||'Pago') === 'Pago'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
      var totalRecebido = lancamentos.filter(function(f){ return f.tipo === 'receita' && (f.status||'Pago') === 'Pago'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
      var pendAPagar = lancamentos.filter(function(f){ return f.tipo === 'custo' && f.status === 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
      var pendAReceber = lancamentos.filter(function(f){ return f.tipo === 'receita' && f.status === 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
      var saldoParc = totalRecebido - totalPago;

      html += '<div class="stat-row">';
      html += statCard('Total pago a este parceiro', fmtBRL(totalPago), 'cost');
      html += statCard('Total recebido dele', fmtBRL(totalRecebido), 'growth');
      html += statCard('Saldo', fmtBRL(saldoParc), saldoParc >= 0 ? 'growth' : 'cost');
      html += statCard('Pendente a pagar', fmtBRL(pendAPagar));
      html += statCard('Pendente a receber', fmtBRL(pendAReceber));
      html += '</div>';

      if(!lancamentos.length){
        html += '<div class="paper empty-state">Nenhum lançamento vinculado a este parceiro ainda.</div>';
      } else {
        html += '<div class="paper table-wrap"><table><thead><tr><th>Data/Venc.</th><th>Tipo</th><th>Conta</th><th>Descrição</th><th>Status</th><th>Valor</th></tr></thead><tbody>';
        lancamentos.slice().sort(function(a,b){ return (b.criadoEm||0)-(a.criadoEm||0); }).forEach(function(f){
          var st = f.status || 'Pago';
          html += '<tr>';
          html += '<td>' + fmtDate(st === 'Pendente' ? f.vencimento : f.data) + '</td>';
          html += '<td><span class="badge tipo-' + f.tipo + '">' + (f.tipo === 'custo' ? 'Custo' : 'Receita') + '</span></td>';
          html += '<td>' + (f.contaId ? escapeHtml(contaLabel(f.contaId)) : escapeHtml(f.categoria || '—')) + '</td>';
          html += '<td>' + escapeHtml(f.descricao || '—') + '</td>';
          html += '<td><span class="badge" style="background:' + (st === 'Pendente' ? '#DFA84E' : '#7FA36D') + '; color:#1B1508">' + st + '</span></td>';
          html += '<td class="num ' + (f.tipo === 'custo' ? 'cost' : 'growth') + '">' + (f.tipo === 'custo' ? '−' : '+') + ' ' + fmtBRL(f.valor) + '</td>';
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      }
    }

    html += '<div class="paper note-box">Este extrato considera os lançamentos da aba Financeiro vinculados a um Parceiro. Contas a Pagar/Receber, Arrendamentos, Financiamentos e Serviços Prestados têm seus próprios controles e ainda não entram nesta soma.</div>';
    el.innerHTML = html;
  }

  /* ---------------- Orçado x Realizado ---------------- */
  var orcamentoAnoSelecionado = new Date().getFullYear();

  function renderOrcamento(){
    var el = document.getElementById('tab-orcamento');
    var html = '';

    var anosDisponiveis = [];
    for(var ay = new Date().getFullYear() - 2; ay <= new Date().getFullYear() + 2; ay++) anosDisponiveis.push(ay);

    html += '<div class="paper form-card"><h3>Definir orçamento</h3>';
    html += '<div class="entry-form">';
    html += selectField('orc-ano-view', 'Ano em análise', anosDisponiveis.map(function(a){ return {value:String(a), label:String(a)}; }), String(orcamentoAnoSelecionado));
    if(state.contasFinanceiro.length){
      html += selectField('orc-conta', 'Conta', state.contasFinanceiro.map(function(c){ return {value:c.id, label: contaLabel(c.id)}; }));
      html += field('number', 'orc-valor', 'Valor orçado para o ano (R$)', false, '0,00', {step:'0.01', min:'0'});
      html += '<button type="button" class="btn" data-action="salvar-orcamento" style="align-self:end;">Salvar orçamento</button>';
    }
    html += '</div></div>';

    if(!state.contasFinanceiro.length){
      html += '<div class="paper empty-state">Cadastre contas financeiras (aba Lançamentos → botão "+" ao lado de Conta) antes de definir orçamentos.</div>';
      el.innerHTML = html;
      return;
    }

    var orcamentosDoAno = state.orcamentos.filter(function(o){ return o.ano === orcamentoAnoSelecionado; });
    var contasComMovimento = {};
    state.financeiro.forEach(function(f){
      if((f.status || 'Pago') !== 'Pago') return;
      var ano = parseInt((f.data || '').slice(0, 4), 10);
      if(ano !== orcamentoAnoSelecionado) return;
      if(!contasComMovimento[f.contaId]) contasComMovimento[f.contaId] = 0;
      contasComMovimento[f.contaId] += Number(f.valor) || 0;
    });

    var idsRelevantes = {};
    orcamentosDoAno.forEach(function(o){ idsRelevantes[o.contaId] = true; });
    Object.keys(contasComMovimento).forEach(function(cid){ idsRelevantes[cid] = true; });

    var linhas = Object.keys(idsRelevantes).map(function(cid){
      var orc = orcamentosDoAno.find(function(o){ return o.contaId === cid; });
      var orcado = orc ? orc.valorOrcado : 0;
      var realizado = contasComMovimento[cid] || 0;
      var diferenca = orcado - realizado;
      var pctUsado = orcado ? (realizado / orcado * 100) : null;
      return {contaId: cid, orcado: orcado, realizado: realizado, diferenca: diferenca, pctUsado: pctUsado, tipo: contaTipo(cid)};
    }).sort(function(a,b){ return contaLabel(a.contaId).localeCompare(contaLabel(b.contaId)); });

    if(!linhas.length){
      html += '<div class="paper empty-state">Nenhum orçamento definido nem movimento em ' + orcamentoAnoSelecionado + ' ainda.</div>';
    } else {
      html += '<div class="paper table-wrap"><table><thead><tr><th>Conta</th><th>Orçado (ano)</th><th>Realizado</th><th>Diferença</th><th>% usado</th></tr></thead><tbody>';
      linhas.forEach(function(l){
        var estourou = l.tipo === 'custo' && l.orcado > 0 && l.realizado > l.orcado;
        html += '<tr>';
        html += '<td>' + escapeHtml(contaLabel(l.contaId)) + '</td>';
        html += '<td class="num">' + (l.orcado ? fmtBRL(l.orcado) : '—') + '</td>';
        html += '<td class="num">' + fmtBRL(l.realizado) + '</td>';
        html += '<td class="num ' + (l.diferenca >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(l.diferenca) + '</td>';
        html += '<td class="num">' + (l.pctUsado !== null ? '<span class="badge" style="background:' + (estourou ? '#A23E2E' : '#7FA36D') + '; color:#fff;">' + l.pctUsado.toFixed(0) + '%</span>' : '—') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '<div class="paper note-box">"Realizado" considera só lançamentos com status "Pago" e data dentro do ano selecionado. Para despesas (custo), passar de 100% significa que já foi gasto mais do que o orçado.</div>';
    el.innerHTML = html;
  }

  /* ---------------- Relatórios (DRE por Subgrupo/Conta) ---------------- */
  function relatoriosContaStats(contaId){
    var entries = state.financeiro.filter(function(f){ return f.contaId === contaId && (f.status || 'Pago') !== 'Pendente'; });
    var valor = 0, qtd = 0, peso = 0;
    entries.forEach(function(f){ valor += Number(f.valor||0); qtd += Number(f.quantidade||0); peso += Number(f.peso||0); });
    return {valor:valor, qtd:qtd, peso:peso, entries:entries, precoMedio: qtd ? valor/qtd : 0, pesoMedio: qtd ? peso/qtd : 0};
  }
  function fmtPct(n){ return (Number(n)||0).toLocaleString('pt-BR', {maximumFractionDigits:2}) + '%'; }

  function renderRelatorios(){
    var el = document.getElementById('tab-relatorios');
    var totalReceitas = state.financeiro.filter(function(f){ return contaTipo(f.contaId) === 'receita' && (f.status||'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
    var totalCustos = state.financeiro.filter(function(f){ return contaTipo(f.contaId) === 'custo' && (f.status||'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);

    function renderSecao(tipoSecao, totalSecao, label){
      var subgrupos = state.subgruposFinanceiro.filter(function(s){ return s.tipo === tipoSecao; }).sort(function(a,b){ return (a.criadoEm||0)-(b.criadoEm||0); });
      var corTitulo = tipoSecao === 'receita' ? 'var(--growth-dark)' : 'var(--cost-dark)';
      var html = '<div class="paper" style="padding:16px 18px; margin-bottom:16px;">';
      html += '<div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px; margin-bottom:12px;">';
      html += '<div style="font-family:\'Zilla Slab\',serif; font-size:18px; font-weight:700; color:' + corTitulo + ';">' + label + '</div>';
      html += '<div style="display:flex; gap:18px; font-size:12.5px; color:var(--ink-soft);">';
      html += '<span>Total: <strong class="num" style="color:var(--ink);">' + fmtBRL(totalSecao) + '</strong></span>';
      html += '<span>% Custo: <strong class="num">' + (tipoSecao === 'receita' ? (totalCustos ? fmtPct(totalReceitas/totalCustos*100) : '0,00%') : '100,00%') + '</strong></span>';
      html += '<span>% Receita: <strong class="num">' + (tipoSecao === 'receita' ? '100,00%' : (totalReceitas ? fmtPct(totalCustos/totalReceitas*100) : '0,00%')) + '</strong></span>';
      html += '</div></div>';

      var corpo = '';
      subgrupos.forEach(function(sg){
        var contas = state.contasFinanceiro.filter(function(c){ return c.subgrupoId === sg.id; }).sort(function(a,b){ return (a.criadoEm||0)-(b.criadoEm||0); });
        var sgValor = 0, sgQtd = 0;
        var linhasContas = '';
        contas.forEach(function(c){
          var st = relatoriosContaStats(c.id);
          if(!st.entries.length) return;
          sgValor += st.valor; sgQtd += st.qtd;
          var percC = totalCustos ? st.valor/totalCustos*100 : 0;
          var percR = totalReceitas ? st.valor/totalReceitas*100 : 0;
          linhasContas += '<tr style="font-weight:600;">';
          linhasContas += '<td style="padding-left:24px;">' + escapeHtml(c.nome) + '</td>';
          linhasContas += '<td class="num">' + (st.qtd ? fmtNum(st.qtd) : '—') + '</td>';
          linhasContas += '<td class="num">' + (st.pesoMedio ? fmtNum(st.pesoMedio) : '—') + '</td>';
          linhasContas += '<td class="num">' + (st.precoMedio ? fmtBRL(st.precoMedio) : '—') + '</td>';
          linhasContas += '<td class="num ' + (tipoSecao === 'custo' ? 'cost' : 'growth') + '">' + fmtBRL(st.valor) + '</td>';
          linhasContas += '<td class="num">' + fmtPct(percC) + '</td>';
          linhasContas += '<td class="num">' + fmtPct(percR) + '</td>';
          linhasContas += '</tr>';
          st.entries.slice().sort(function(a,b){ return (b.criadoEm||0)-(a.criadoEm||0); }).forEach(function(f){
            var docLabel = f.descricao || (f.parceiroId ? parceiroNome(f.parceiroId) : 'Lançamento');
            linhasContas += '<tr style="font-size:12px; color:var(--ink-soft);">';
            linhasContas += '<td style="padding-left:40px;">' + escapeHtml(docLabel) + (f.parceiroId ? ' — ' + escapeHtml(parceiroNome(f.parceiroId)) : '') + '</td>';
            linhasContas += '<td class="num">' + (f.quantidade ? fmtNum(f.quantidade) : '—') + '</td>';
            linhasContas += '<td class="num">—</td><td class="num">—</td>';
            linhasContas += '<td class="num">' + fmtBRL(f.valor) + '</td>';
            linhasContas += '<td class="num">—</td><td class="num">—</td>';
            linhasContas += '</tr>';
          });
        });
        if(!linhasContas) return;
        var percSgC = totalCustos ? sgValor/totalCustos*100 : 0;
        var percSgR = totalReceitas ? sgValor/totalReceitas*100 : 0;
        corpo += '<tr style="font-weight:700; background:var(--paper-2);">';
        corpo += '<td>' + escapeHtml(sg.nome) + '</td>';
        corpo += '<td class="num">' + (sgQtd ? fmtNum(sgQtd) : '—') + '</td>';
        corpo += '<td class="num">—</td><td class="num">—</td>';
        corpo += '<td class="num ' + (tipoSecao === 'custo' ? 'cost' : 'growth') + '">' + fmtBRL(sgValor) + '</td>';
        corpo += '<td class="num">' + fmtPct(percSgC) + '</td>';
        corpo += '<td class="num">' + fmtPct(percSgR) + '</td>';
        corpo += '</tr>';
        corpo += linhasContas;
      });

      if(!corpo){
        html += '<div class="empty-state">Nenhum lançamento "Pago" nesta seção ainda.</div>';
      } else {
        html += '<div class="table-wrap"><table><thead><tr><th>Subgrupo · Conta · Documento</th><th>Qtd.</th><th>Peso méd.</th><th>Preço méd.</th><th>Valor</th><th>%custo</th><th>%receita</th></tr></thead><tbody>';
        html += corpo;
        html += '<tr style="font-weight:700; border-top:2px solid var(--paper-line);"><td>TOTAL</td><td></td><td></td><td></td>';
        html += '<td class="num">' + fmtBRL(totalSecao) + '</td>';
        html += '<td class="num">' + (totalCustos ? fmtPct(totalSecao/totalCustos*100) : '0,00%') + '</td>';
        html += '<td class="num">' + (totalReceitas ? fmtPct(totalSecao/totalReceitas*100) : '0,00%') + '</td></tr>';
        html += '</tbody></table></div>';
      }
      html += '</div>';
      return html;
    }

    var html = '<div class="stat-row">';
    html += statCard('Total de receitas', fmtBRL(totalReceitas), 'growth');
    html += statCard('Total de despesas', fmtBRL(totalCustos), 'cost');
    html += statCard('Resultado', fmtBRL(totalReceitas - totalCustos), (totalReceitas - totalCustos) >= 0 ? 'growth' : 'cost');
    html += '</div>';
    html += renderSecao('receita', totalReceitas, 'RECEITAS');
    html += renderSecao('custo', totalCustos, 'DESPESAS');
    html += '<div class="paper note-box">Este relatório considera apenas lançamentos do Financeiro marcados como "Pago" e vinculados a uma Conta (cadastrada pelo botão "+" no formulário de Lançamentos). Contas a Pagar/Receber ainda pendentes não entram aqui — acompanhe-as nas abas próprias.</div>';
    el.innerHTML = html;
  }

  /* ---------------- Indicadores (gráficos e exportação) ---------------- */
  function financeiroPorMes(){
    var map = {};
    state.financeiro.forEach(function(f){
      if(!f.data) return;
      var ym = f.data.slice(0,7);
      if(!map[ym]) map[ym] = {custo:0, receita:0};
      map[ym][f.tipo === 'custo' ? 'custo' : 'receita'] += Number(f.valor) || 0;
    });
    var months = Object.keys(map).sort();
    return {
      labels: months.map(monthLabel),
      custos: months.map(function(m){ return map[m].custo; }),
      receitas: months.map(function(m){ return map[m].receita; })
    };
  }
  function custosPorCategoria(){

      map[f.categoria] = (map[f.categoria] || 0) + Number(f.valor || 0);
    });

  function resultadoPorTalhaoChart(){

    });

  function saldoAcumuladoMensal(){
    var events = buildCashEvents();
    var buckets = {};
    events.forEach(function(e){
      var ym = e.date.slice(0,7);
      if(!buckets[ym]) buckets[ym] = 0;
      buckets[ym] += (e.tipo === 'entrada' ? e.valor : -e.valor);
    });
    var months = Object.keys(buckets).sort();
    var acumulado = 0, serie = [];
    months.forEach(function(m){ acumulado += buckets[m]; serie.push(Math.round(acumulado * 100) / 100); });
    return {labels: months.map(monthLabel), valores: serie};
  }
