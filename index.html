<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Fazenda — Caderno de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C2818;
    --panel:#223020;
    --panel-line:#33452D;
    --paper:#F1E9D2;
    --paper-2:#E8DCB9;
    --paper-line:#CBB98C;
    --ink:#2A2016;
    --ink-soft:#6B5D46;
    --accent:#C98A2B;
    --accent-dark:#9C6A1E;
    --growth:#4F7942;
    --growth-dark:#3B5B32;
    --cost:#A23E2E;
    --cost-dark:#7E2F22;
    --khaki:#8B8368;
    --radius:6px;
    --shadow: 0 2px 0 rgba(0,0,0,0.15), 0 8px 20px -12px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:linear-gradient(rgba(0,0,0,0.12) 1px, transparent 1px);
    background-size: 100% 3px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  #app{display:grid; grid-template-columns:232px 1fr; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--panel);
    border-right:1px solid var(--panel-line);
    padding:22px 16px;
    display:flex; flex-direction:column; gap:18px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 4px;}
  .brand-mark{
    width:34px; height:34px; border-radius:50%;
    background:var(--accent); color:var(--panel);
    display:flex; align-items:center; justify-content:center;
    font-family:'Zilla Slab', serif; font-weight:700; font-size:17px; flex:none;
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.25;}
  .brand-text strong{font-family:'Zilla Slab', serif; font-size:16px; color:var(--paper); letter-spacing:0.2px;}
  .brand-text span{font-size:11px; color:#9FAE93; text-transform:uppercase; letter-spacing:0.08em;}

  nav{display:flex; flex-direction:column; gap:2px;}
  .nav-group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;
    color:#9FAE93; font-weight:700; padding:14px 10px 6px;
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; user-select:none; border-radius:4px;
    transition:color .15s ease;
  }
  .nav-group-label:hover{color:var(--paper);}
  .nav-group-label::after{
    content:'▾'; font-size:9px; color:#7C8A70; transition:transform .15s ease;
  }
  .nav-group-label.collapsed::after{transform:rotate(-90deg);}
  .nav-btn{
    display:flex; align-items:center; gap:10px;
    background:transparent; border:1px solid transparent;
    color:#C7D0BC; text-align:left; padding:8px 12px 8px 16px;
    border-radius:var(--radius); font-size:13px; font-weight:500;
    transition:background .15s ease, color .15s ease;
  }
  .nav-btn:hover{background:rgba(255,255,255,0.05); color:var(--paper);}
  .nav-btn.active{background:var(--accent); color:#241704; font-weight:600;}
  .sidebar-footer{margin-top:auto; font-size:11px; color:#7C8A70; line-height:1.5; padding:0 4px;}

  /* ---------- Main ---------- */
  main{padding:28px 34px 60px; max-width:1640px;}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:8px;}
  .topbar h1{font-family:'Zilla Slab', serif; font-size:28px; color:var(--paper); margin:0; font-weight:600;}
  .topbar .subtitle{color:#8E9B82; font-size:13px; margin-top:2px;}
  #loading-indicator{color:#9FAE93; font-size:12.5px; font-style:italic; max-width:260px; text-align:right;}
  #loading-indicator.hidden{display:none;}
  .tab-content.hidden{display:none;}

  /* ---------- Cards / paper ---------- */
  .paper{background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:14px; margin-bottom:24px;}
  .stat-card{padding:16px 18px; min-width:0; overflow:hidden;}
  .stat-card .label{font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-soft); font-weight:600;}
  .stat-card .value{font-family:'JetBrains Mono', monospace; font-size:clamp(14px, 1.6vw, 22px); font-weight:600; margin-top:6px; color:var(--ink); overflow-wrap:break-word; white-space:normal; line-height:1.2;}
  .stat-card .value.growth{color:var(--growth-dark);}
  .stat-card .value.cost{color:var(--cost-dark);}

  .section-title{font-family:'Zilla Slab', serif; font-size:18px; font-weight:600; color:var(--paper); margin:26px 0 12px;}
  .section-title:first-child{margin-top:0;}

  .alert-box{padding:14px 18px; margin-bottom:8px;}
  .alert-box div{font-size:13.5px; margin-bottom:6px;}
  .alert-box div:last-child{margin-bottom:0;}

  .note-box{padding:12px 18px; margin-top:16px; font-size:12px; color:var(--ink-soft);}

  /* ---------- Plot map ---------- */
  .plot-map{display:flex; flex-wrap:wrap; gap:10px; padding:16px; background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .plot{
    position:relative; min-width:130px; flex:1 1 130px; max-width:220px; aspect-ratio:4/3;
    border-radius:4px; border:1px solid rgba(0,0,0,0.18); padding:10px;
    display:flex; flex-direction:column; justify-content:space-between; color:#1B1508;
    background-image: repeating-linear-gradient(100deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 2px, transparent 2px, transparent 9px);
    font-family:inherit; margin:0; text-align:left; cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .plot:hover, .plot:focus-visible{transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,0.25);}
  .plot .plot-cta{
    align-self:flex-end; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    opacity:0; transition:opacity .12s ease;
  }
  .plot:hover .plot-cta, .plot:focus-visible .plot-cta{opacity:0.85;}
  .plot.status-andamento{background-color:#DFA84E;}
  .plot.status-planejada{background-color:#C9C3A4;}
  .plot.status-colhida{background-color:#7FA36D;}
  .plot.status-none{background-color:#DCD2AE; opacity:.75;}
  .plot .plot-name{font-family:'Zilla Slab', serif; font-weight:600; font-size:14px;}
  .plot .plot-area{font-family:'JetBrains Mono', monospace; font-size:11px; opacity:.85;}
  .plot .plot-crop{font-size:12px; font-weight:600;}
  .plot .plot-status{align-self:flex-start; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; background:rgba(255,255,255,0.55); padding:2px 6px; border-radius:3px; font-weight:600;}

  /* ---------- Recent lists ---------- */
  .list-card{padding:6px 0;}
  .list-row{padding:8px 16px; border-bottom:1px solid var(--paper-2); font-size:13px; display:flex; justify-content:space-between; gap:8px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .flag-late{color:var(--cost-dark); font-weight:700; font-size:10.5px; text-transform:uppercase; margin-left:6px;}

  /* ---------- Property cards (nested talhões) ---------- */
  .property-card{padding:16px 18px; margin-bottom:14px;}
  .property-head{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;}
  .property-title{font-family:'Zilla Slab', serif; font-size:16px; font-weight:600;}
  .property-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .property-sublabel{margin-top:14px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700;}

  /* ---------- Forms ---------- */
  .form-card{padding:16px 18px; margin-bottom:20px;}
  .form-card h3{font-family:'Zilla Slab', serif; margin:0 0 12px; font-size:15px; color:var(--ink); border-bottom:1px dashed var(--paper-line); padding-bottom:8px;}
  form.entry-form{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; align-items:end;}
  .field{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .field label{font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;}
  .field input, .field select, .field textarea{padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; color:var(--ink); font-size:13px; width:100%; min-width:0; box-sizing:border-box; font-family:inherit;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .btn{padding:9px 16px; border-radius:4px; border:none; font-size:13px; font-weight:600; background:var(--accent); color:#241704; transition:background .15s ease;}
  .btn:hover{background:var(--accent-dark); color:var(--paper);}
  .btn-del{background:transparent; border:1px solid var(--cost); color:var(--cost-dark); padding:4px 9px; font-size:11px; border-radius:4px; font-weight:600;}
  .btn-del:hover{background:var(--cost); color:#fff;}
  .btn-edit{background:transparent; border:1px solid var(--accent-dark); color:var(--accent-dark); padding:4px 9px; font-size:11px; border-radius:4px; font-weight:600; margin-right:6px;}
  .btn-edit:hover{background:var(--accent-dark); color:var(--paper);}
  .btn-cancel{background:transparent; border:1px solid var(--paper-line); color:var(--ink-soft); padding:9px 16px; font-size:13px; border-radius:4px; font-weight:600; margin-left:8px;}
  .btn-cancel:hover{background:var(--paper-2);}

  /* ---------- Tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); border-bottom:1px solid var(--paper-line); padding:8px 10px; font-weight:600;}
  thead th.th-ordenavel{cursor:pointer; user-select:none;}
  thead th.th-ordenavel:hover{color:var(--ink);}
  tbody td{padding:9px 10px; border-bottom:1px solid var(--paper-2);}
  tbody tr:last-child td{border-bottom:none;}
  .num{font-family:'JetBrains Mono', monospace;}
  .num.growth{color:var(--growth-dark); font-weight:600;}
  .num.cost{color:var(--cost-dark); font-weight:600;}
  .badge{font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; padding:2px 7px; border-radius:3px; font-weight:700;}
  .badge.status-andamento{background:#DFA84E; color:#241704;}
  .badge.status-planejada{background:#C9C3A4; color:#241704;}
  .badge.status-colhida{background:#7FA36D; color:#0E1D0A;}
  .badge.tipo-custo{background:var(--cost); color:#fff;}
  .badge.tipo-receita{background:var(--growth); color:#fff;}

  .empty-state{padding:30px 20px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
  .table-wrap{overflow-x:auto;}

  @media (max-width: 820px){
    #app{grid-template-columns:1fr;}
    .sidebar{position:sticky; top:0; z-index:10; height:auto; flex-direction:row; align-items:center; padding:12px 14px; gap:14px; overflow-x:auto; overflow-y:visible;}
    .brand-text span{display:none;}
    nav{flex-direction:row;}
    .nav-group-label{display:none;}
    .nav-btn{display:flex !important;}
    .sidebar-footer{display:none;}
    main{padding:20px 16px 50px;}
  }

  .no-print{}

  .auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card{
    width:100%; max-width:380px; padding:30px 28px;
  }
  .auth-card h2{font-family:'Zilla Slab', serif; margin:0 0 4px; font-size:22px; color:var(--ink);}
  .auth-card p{font-size:13px; color:var(--ink-soft); margin:0 0 20px; line-height:1.5;}
  .auth-card .field{margin-bottom:14px;}
  .auth-card .btn{width:100%;}
  .auth-error{color:var(--cost-dark); font-size:12.5px; margin:-6px 0 14px; font-weight:600;}
  .auth-link{background:none; border:none; color:var(--ink-soft); font-size:12px; text-decoration:underline; cursor:pointer; margin-top:14px; padding:0;}
  .workspace-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border:1px solid var(--paper-line); border-radius:4px; margin-bottom:8px;
    background:#FBF7EC; cursor:pointer; font-size:14px; font-weight:600;
  }
  .workspace-item:hover{border-color:var(--accent);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,26,16,0.6); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{width:100%; max-width:360px; padding:22px;}
  .modal-cat-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:6px 0; border-bottom:1px solid var(--paper-2); font-size:13.5px;
  }
  .modal-cat-row:last-child{border-bottom:none;}
  .field-with-add{display:flex; align-items:flex-end; gap:6px; min-width:0;}
  .field-with-add .field{flex:1; min-width:0;}
  .btn-add-inline{
    background:var(--accent); color:#241704; border:none; border-radius:4px;
    width:34px; height:34px; font-size:18px; font-weight:700; line-height:1; cursor:pointer; flex:none;
  }
  .btn-add-inline:hover{background:var(--accent-dark); color:var(--paper);}

  @media print{
    .sidebar, #loading-indicator, .form-card, .btn-del, .no-print{display:none !important;}
    #app{display:block !important;}
    main{padding:0; max-width:100%;}
    body{background:#fff;}
    .paper{box-shadow:none; border:1px solid #ccc;}
  }
  .print-only{display:none;}
  @media print{
    .print-only{display:block !important;}
  }
  @media print{
    body.imprimindo-calagem > *:not(#calagem-modal-overlay){display:none !important;}
    body.imprimindo-calagem #calagem-modal-overlay{position:static !important; background:none !important; padding:0 !important; display:block !important;}
    body.imprimindo-calagem .modal-box{max-width:100% !important; box-shadow:none !important; border:none !important; padding:0 !important;}
    body.imprimindo-calagem .no-print{display:none !important;}
  }
</style>
</head>
<body>
<div id="gate-screen" class="auth-screen" style="display:none;">
  <div class="auth-card paper"></div>
</div>
<div id="workspace-screen" class="auth-screen" style="display:none;">
  <div class="auth-card paper"></div>
</div>
<div id="cat-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Categorias de Produto</h3>
    <div id="cat-modal-list" style="margin-bottom:14px;"></div>
    <form id="form-cat-modal" style="display:flex; gap:8px;">
      <input type="text" id="cat-modal-input" name="nome" placeholder="Nova categoria" required style="flex:1; padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
      <button type="submit" class="btn">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-cat-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="calagem-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper" style="max-width:540px; max-height:90vh; overflow-y:auto;">
    <div id="calagem-modal-content"></div>
    <div class="no-print" style="display:flex; gap:8px; margin-top:14px;">
      <button type="button" class="btn" data-action="imprimir-calagem" style="flex:1;">🖨️ Imprimir</button>
      <button type="button" class="btn-cancel" data-action="close-calagem-modal" style="flex:1;">Fechar</button>
    </div>
  </div>
</div>
<div id="efetivar-venda-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper" style="max-width:520px; max-height:90vh; overflow-y:auto;">
    <div id="efetivar-venda-modal-content"></div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button type="button" class="btn" data-action="confirmar-efetivar-venda" style="flex:1;">Confirmar entrega</button>
      <button type="button" class="btn-cancel" data-action="close-efetivar-venda-modal" style="flex:1;">Cancelar</button>
    </div>
  </div>
</div>
<div id="parceiro-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Novo Parceiro</h3>
    <form id="form-parceiro-modal">
      <div class="field"><label>Nome</label><input type="text" id="parceiro-modal-nome" name="nome" placeholder="Nome do parceiro" required style="width:100%; padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;"></div>
      <div class="field"><label>Tipo</label>
        <select id="parceiro-modal-tipo" name="tipo" style="width:100%; padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
          <option value="Fornecedor">Fornecedor</option>
          <option value="Cliente">Cliente</option>
          <option value="Fornecedor e Cliente">Fornecedor e Cliente</option>
        </select>
      </div>
      <button type="submit" class="btn" style="width:100%; margin-top:6px;">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-parceiro-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="tipo-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Tipos de Atividade</h3>
    <div id="tipo-modal-list" style="margin-bottom:14px;"></div>
    <form id="form-tipo-modal" style="display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="tipo-modal-input" name="nome" placeholder="Nova atividade (ex: Irrigação)" required style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
      <select id="tipo-modal-cor" name="cor" style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;"></select>
      <button type="submit" class="btn">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-tipo-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="conta-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Contas Financeiras</h3>
    <div id="conta-modal-list" style="margin-bottom:14px; max-height:220px; overflow-y:auto;"></div>
    <form id="form-conta-modal" style="display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="conta-modal-input" name="nome" placeholder="Nome da conta (ex: Fertilizante)" required style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
      <div class="field-with-add">
        <select id="conta-modal-subgrupo" name="subgrupoId" style="flex:1; padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;"></select>
        <button type="button" class="btn-add-inline" data-action="open-subgrupo-modal" title="Novo subgrupo">+</button>
      </div>
      <button type="submit" class="btn">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-conta-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="subgrupo-modal-overlay" class="modal-overlay" style="display:none; z-index:110;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Subgrupos Financeiros</h3>
    <div id="subgrupo-modal-list" style="margin-bottom:14px; max-height:220px; overflow-y:auto;"></div>
    <form id="form-subgrupo-modal" style="display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="subgrupo-modal-input" name="nome" placeholder="Nome do subgrupo (ex: Custo Insumos Agrícolas)" required style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
      <select id="subgrupo-modal-tipo" name="tipo" style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
        <option value="custo">Despesa</option>
        <option value="receita">Receita</option>
      </select>
      <button type="submit" class="btn">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-subgrupo-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="app" style="display:none;">

  function nomePatrimonio(id){ var p = state.patrimonio.find(function(x){ return x.id === id; }); return p ? p.nome : '—'; }
  function horasUsoTotais(patrimonioId){
    return state.producao.filter(function(p){ return p.maquinaId === patrimonioId; }).reduce(function(s,p){ return s + (Number(p.horasUso)||0); }, 0);
  }

  function calcDepreciacao(item){
    var valor = Number(item.valor) || 0;
    var vidaUtil = Number(item.vidaUtilAnos) || 0;
    var percResidual = Number(item.percentualResidual) || 0;
    if(!item.dataAquisicao || !vidaUtil) return valor;
    var aquisicao = new Date(item.dataAquisicao);
    if(isNaN(aquisicao.getTime())) return valor;
    var hoje = new Date();
    var anos = (hoje - aquisicao) / (365.25 * 24 * 3600 * 1000);
    if(anos < 0) anos = 0;
    var fracao = Math.min(anos / vidaUtil, 1);
    var valorResidual = valor * (percResidual / 100);
    var depreciavel = valor - valorResidual;
    var atual = valor - (depreciavel * fracao);
    return Math.max(atual, valorResidual);
  }
  function depreciacaoAnualItem(item){
    var valor = Number(item.valor) || 0;
    var vidaUtil = Number(item.vidaUtilAnos) || 0;
    var percResidual = Number(item.percentualResidual) || 0;
    if(!vidaUtil) return 0;
    var valorResidual = valor * (percResidual / 100);
    return (valor - valorResidual) / vidaUtil;
  }
  function depreciacaoAnualTotalFazenda(){
    return state.patrimonio.reduce(function(s, item){ return s + depreciacaoAnualItem(item); }, 0);
  }
  function areaTotalFazenda(){
    return state.talhoes.reduce(function(s, t){ return s + (Number(t.area) || 0); }, 0);
  }
  function depreciacaoPorTalhao(talhaoId){
    var areaTotal = areaTotalFazenda();
    if(areaTotal <= 0) return 0;
    var t = state.talhoes.find(function(x){ return x.id === talhaoId; });
    var area = t ? (Number(t.area) || 0) : 0;
    return (area / areaTotal) * depreciacaoAnualTotalFazenda();
  }
  function custoOportunidadeAnualTotalFazenda(taxaPct){
    var valorTotalPatrimonio = state.patrimonio.reduce(function(s, item){ return s + (Number(item.valor) || 0); }, 0);
    return valorTotalPatrimonio * (taxaPct / 100);
  }
  function custoOportunidadePorTalhao(talhaoId, taxaPct){
    var areaTotal = areaTotalFazenda();
    if(areaTotal <= 0) return 0;
    var t = state.talhoes.find(function(x){ return x.id === talhaoId; });
    var area = t ? (Number(t.area) || 0) : 0;
    return (area / areaTotal) * custoOportunidadeAnualTotalFazenda(taxaPct);
  }
  function calcValorFinanciamentoComJuros(item){
    var principal = Number(item.valorTotal) || 0;
    var taxa = Number(item.taxaJuros) || 0;
    if(!item.dataContratacao || !item.dataFinal || !taxa) return null;
    var inicio = new Date(item.dataContratacao);
    var fim = new Date(item.dataFinal);
    if(isNaN(inicio.getTime()) || isNaN(fim.getTime()) || fim <= inicio) return null;
    var anos = (fim - inicio) / (365.25 * 24 * 3600 * 1000);
    return principal * Math.pow(1 + (taxa / 100), anos);
  }
  function financiamentoValorBase(item){
    var comJuros = calcValorFinanciamentoComJuros(item);
    return comJuros !== null ? comJuros : (Number(item.valorTotal) || 0);
  }
  function financiamentoSaldoDevedor(item){
    var base = financiamentoValorBase(item);
    var pago = (Number(item.parcelasPagas) || 0) * (Number(item.valorParcela) || 0);
    return Math.max(base - pago, 0);
  }

  function talhaoOptionsFn(){ return [{value:'', label:'—'}].concat(state.talhoes.map(function(t){ return {value:t.id, label:t.nome}; })); }

  function parceiroOptionsFn(){ return [{value:'', label:'—'}].concat(state.parceiros.map(function(p){ return {value:p.id, label:p.nome}; })); }

    var valorBruto = Number(item.valor) || 0;
    var descontoValor = Number(item.descontoValor) || 0;
    if(item.descontoTipo === 'Percentual') return valorBruto * (descontoValor / 100);
    if(item.descontoTipo === 'ValorFixo') return descontoValor;
    return 0;
  }
  function valorLiquidoContaReceber(item){
    return (Number(item.valor) || 0) - valorDescontoContaReceber(item);
  }
  function valorTotalServicoPrestado(item){
    var qtd = Number(item.quantidade) || 1;
    return qtd * (Number(item.valor) || 0);
  }
  function safraOptionsFn(incluirId){ return safraOptionsAtivas(incluirId); }
  // Venda antecipada: pode sair do estoque geral de uma cultura/lavoura (dividido na entrega) ou de uma safra específica
  function opcoesOrigemVendaAntecipada(incluirId){
    var ops = [];
    state.culturas.forEach(function(c){
      var n = state.safras.filter(function(sf){ return sf.culturaId === c.id; }).length;
      if(n) ops.push({value:'cul:' + c.id, label:'Estoque geral — ' + c.nome + ' (todas as safras)'});
    });
    (state.lavouras || []).forEach(function(l){
      if(safrasDaLavoura(l.id).length > 1 && (!l.encerrada || incluirId === 'lav:' + l.id)) ops.push({value:'lav:' + l.id, label:'Estoque geral — lavoura ' + lavouraLabel(l.id)});
    });
    return ops.concat(safraOptionsAtivas(incluirId));
  }
  // Safras (com saldo) de onde sai uma entrega do estoque geral, proporcional ao saldo de cada uma
  function safrasDoEstoqueGeral(origem, unidade){
    var est = estoquePorSafra();
    var candidatas = state.safras.filter(function(sf){
      if(origem.indexOf('cul:') === 0) return sf.culturaId === origem.slice(4);
      if(origem.indexOf('lav:') === 0) return sf.lavouraId === origem.slice(4);
      return false;
    }).map(function(sf){ var e = est[sf.id]; return {safraId: sf.id, saldo: e ? e.entrada - e.saida : 0, unidade: e ? (e.unidade || '').trim() : ''}; })
      .filter(function(x){ return x.saldo > 0.0005; });
    var un = (unidade || '').trim().toLowerCase();
    var mesmaUn = candidatas.filter(function(x){ return !un || !x.unidade || x.unidade.toLowerCase() === un; });
    return mesmaUn.length ? mesmaUn : candidatas;
  }
  function safraOptionsAtivas(incluirId){
    return state.safras.filter(function(s){ return s.ativa !== false || s.id === incluirId; }).map(function(s){ return {value:s.id, label: safraLabel(s.id) + (s.ativa === false ? ' (inativa)' : '')}; });

  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }
  function fmtBRL(n){ return (Number(n) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
  function fmtHa(n){ return (Number(n) || 0).toLocaleString('pt-BR', {maximumFractionDigits:2}) + ' ha'; }
  function fmtNum(n){ return (Number(n) || 0).toLocaleString('pt-BR', {maximumFractionDigits:2}); }
  function fmtDate(d){
    if(!d) return '—';
    var parts = d.split('-');
    if(parts.length !== 3) return d;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }
  function monthLabel(ym){
    var parts = ym.split('-');
    var idx = parseInt(parts[1], 10) - 1;
    return (MESES[idx] || parts[1]) + '/' + parts[0];
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------------- Storage ---------------- */
  var hasCloudStorage = !!(window.storage && typeof window.storage.get === 'function');
  var hasLocalStorage = (function(){
    try{ var k='__fazenda_test__'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  })();
  var hasNetlifyBlobs = false;
  var NETLIFY_STORAGE_ENDPOINT = '/.netlify/functions/storage';
  var LS_PREFIX = 'fazenda:';
  var currentWorkspaceId = null;

  function blobsGet(storageKey){
    return fetch(NETLIFY_STORAGE_ENDPOINT + '?key=' + encodeURIComponent(storageKey))
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(v){ return (v === undefined) ? null : v; })
      .catch(function(err){ console.error('Erro ao ler (Netlify Blobs)', storageKey, err); return null; });
  }
  function blobsSet(storageKey, value){
    return fetch(NETLIFY_STORAGE_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key: storageKey, value: value})
    }).catch(function(err){ console.error('Erro ao salvar (Netlify Blobs)', storageKey, err); });
  }

  function rawGet(storageKey){
    if(hasNetlifyBlobs){ return blobsGet(storageKey); }
    if(hasCloudStorage){
      return Promise.resolve()
        .then(function(){ return window.storage.get(storageKey, true); })
        .then(function(res){ return res && res.value ? JSON.parse(res.value) : null; })
        .catch(function(){ return null; });
    }
    if(hasLocalStorage){
      try{
        var raw = window.localStorage.getItem(LS_PREFIX + storageKey);
        return Promise.resolve(raw ? JSON.parse(raw) : null);
      }catch(e){ return Promise.resolve(null); }
    }
    return Promise.resolve(null);
  }
  function rawSet(storageKey, value){
    if(hasNetlifyBlobs){ return blobsSet(storageKey, value); }
    if(hasCloudStorage){
      return Promise.resolve()
        .then(function(){ return window.storage.set(storageKey, JSON.stringify(value), true); })
        .catch(function(err){ console.error('Erro ao salvar', storageKey, err); });
    }
    if(hasLocalStorage){
      try{ window.localStorage.setItem(LS_PREFIX + storageKey, JSON.stringify(value)); }catch(e){ console.error('Erro ao salvar', storageKey, e); }
    }
    return Promise.resolve();
  }

  function migrateLocalStorageToBlobs(){
    if(!hasLocalStorage) return Promise.resolve();
    var chaves = [];
    try{
      for(var i = 0; i < window.localStorage.length; i++){
        var k = window.localStorage.key(i);
        if(k && k.indexOf(LS_PREFIX) === 0) chaves.push(k.slice(LS_PREFIX.length));
      }
    }catch(e){ return Promise.resolve(); }
    var tarefas = chaves.map(function(chave){
      var raw = null;
      try{ raw = window.localStorage.getItem(LS_PREFIX + chave); }catch(e){}
      if(!raw) return Promise.resolve();
      var valor;
      try{ valor = JSON.parse(raw); }catch(e){ return Promise.resolve(); }
      return blobsSet(chave, valor);
    });
    return Promise.all(tarefas);
  }

  function detectStorageBackend(){
    if(hasCloudStorage) return Promise.resolve();
    return fetch(NETLIFY_STORAGE_ENDPOINT + '?key=__ping__')
      .then(function(res){
        if(!res.ok){
          console.warn('Netlify Blobs: function respondeu com status ' + res.status + ' — usando localStorage como alternativa.');
          return;
        }
        hasNetlifyBlobs = true;
        console.info('Netlify Blobs: conectado com sucesso.');
        return blobsGet('global::workspaces').then(function(blobsWs){
          if(blobsWs && blobsWs.length) return;
          var lsWs = null;
          try{ var raw = window.localStorage.getItem(LS_PREFIX + 'global::workspaces'); lsWs = raw ? JSON.parse(raw) : null; }catch(e){}
          if(lsWs && lsWs.length){
            console.info('Netlify Blobs: migrando dados locais existentes...');
            return migrateLocalStorageToBlobs();
          }
        });
      })
      .catch(function(err){
        console.warn('Netlify Blobs: não foi possível conectar (' + err + ') — usando localStorage como alternativa.');
      });
  }

  // Chaves globais (não dependem de qual propriedade/cliente está selecionado)
  function loadGlobal(key){ return rawGet('global::' + key); }
  function saveGlobal(key, value){ return rawSet('global::' + key, value); }

  // Chaves de dados da propriedade/cliente atualmente selecionado
  function loadKey(key){
    return rawGet(currentWorkspaceId + '::' + key).then(function(v){ return v || []; });
  }
  function saveKey(key, arr){
    return rawSet(currentWorkspaceId + '::' + key, arr);
  }

  // Trava de importações únicas (seeds): registra que uma importação já foi aplicada,
  // independente de os dados ainda existirem. Assim, excluir registros importados não faz eles voltarem.
  function importJaAplicado(id){ return (state.importsAplicados || []).indexOf(id) !== -1; }
  function marcarImportAplicado(id){
    if(!Array.isArray(state.importsAplicados)) state.importsAplicados = [];
    if(importJaAplicado(id)) return;
    state.importsAplicados.push(id);
    saveKey('importsAplicados', state.importsAplicados);
  }
  // Checa a trava; se ela ainda não existe mas os dados de antes da correção estão lá, marca como aplicada (sem duplicar).
  function jaAplicadoOuLegado(id, checagemLegada){
    if(importJaAplicado(id)) return true;
    if(checagemLegada()){ marcarImportAplicado(id); return true; }
    return false;
  }

  function loadWorkspaces(){ return loadGlobal('workspaces').then(function(v){ return Array.isArray(v) ? v : []; }); }
  function saveWorkspaces(list){ return saveGlobal('workspaces', list); }

  function migrateLegacyIfNeeded(){
    return rawGet('talhoes').then(function(legacyTalhoes){
      if(!legacyTalhoes || !legacyTalhoes.length){ return null; }
      var newId = 'ws-' + Date.now();
      return Promise.all(ALL_KEYS.map(function(k){
        return rawGet(k).then(function(val){
          if(val && val.length){ return rawSet(newId + '::' + k, val); }
        });
      })).then(function(){
        return loadWorkspaces().then(function(list){
          list.push({id:newId, nome:'Minha Fazenda', criadoEm:Date.now()});
          return saveWorkspaces(list).then(function(){ return newId; });
        });
      });
    });
  }

  var PASS_KEY = 'app-password';

  function boot(){
    detectStorageBackend().then(function(){
      var unlocked = false;
      try{ unlocked = window.sessionStorage.getItem(UNLOCK_FLAG) === '1'; }catch(e){}
      if(unlocked){ afterUnlock(); } else { showGateScreen(); }
    });
  }

  function unlockSession(){
    try{ window.sessionStorage.setItem(UNLOCK_FLAG, '1'); }catch(e){}
    afterUnlock();
  }

  function afterUnlock(){
    document.getElementById('gate-screen').style.display = 'none';
    loadWorkspaces().then(function(list){
      if(list.length === 1){ selectWorkspace(list[0].id); return; }
      if(list.length > 1){ showWorkspaceScreen(list); return; }
      migrateLegacyIfNeeded().then(function(migratedId){
        if(migratedId){ selectWorkspace(migratedId); } else { showWorkspaceScreen([]); }
      });
    });
  }

  function showWorkspaceScreen(list){
    var el = document.querySelector('#workspace-screen .auth-card');
    var html = '<h2>' + (list.length ? 'Selecione a propriedade' : 'Vamos começar') + '</h2>';
    html += '<p>' + (list.length ? 'Cada propriedade/cliente tem seus próprios dados, separados dos demais.' : 'Dê um nome para a primeira propriedade ou cliente que você vai gerenciar aqui.') + '</p>';
    list.forEach(function(ws){
      html += '<div class="workspace-item" data-action="select-workspace" data-id="' + ws.id + '">' + escapeHtml(ws.nome) + '</div>';
    });
    html += '<form id="form-workspace" style="margin-top:' + (list.length ? '16px' : '0') + ';">';
    html += '<div class="field"><label for="ws-nome">' + (list.length ? 'Nova propriedade/cliente' : 'Nome da propriedade/cliente') + '</label><input type="text" id="ws-nome" name="nome" placeholder="Ex: Fazenda Santa Luzia" required></div>';
    html += '<button type="submit" class="btn">' + (list.length ? 'Criar e entrar' : 'Criar e começar') + '</button>';
    html += '</form>';
    el.innerHTML = html;
    document.getElementById('workspace-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }

  function estoquePorSafra(){
    var map = {};
    state.producao.forEach(function(p){
      if(!map[p.safraId]) map[p.safraId] = {entrada:0, saida:0, precoSoma:0, precoCount:0, unidade:''};
      if(p.tipo === 'entrada'){
        map[p.safraId].entrada += Number(p.quantidade) || 0;
        if(Number(p.precoUnitario) > 0){ map[p.safraId].precoSoma += Number(p.precoUnitario); map[p.safraId].precoCount++; }
        if(p.unidade) map[p.safraId].unidade = p.unidade;
      } else {
        map[p.safraId].saida += Number(p.quantidade) || 0;
      }
    });
    return map;
  }
  // Descontos na venda de produção (mesmos da Venda Antecipada); os últimos valores usados ficam lembrados

  // Estoque de colheita agrupado (por cultura ou por lavoura) para vender "do estoque geral"
  function gruposEstoqueVenda(){
    var est = estoquePorSafra();
    var grupos = {};
    state.safras.forEach(function(sf){
      var e = est[sf.id]; if(!e) return;
      var saldo = e.entrada - e.saida; if(saldo <= 0.0005) return;
      var un = (e.unidade || '').trim();
      [['cul', sf.culturaId, culturaNome(sf.culturaId)], ['lav', sf.lavouraId, lavouraLabel(sf.lavouraId)]].forEach(function(g){
        if(!g[1]) return;
        var chave = g[0] + ':' + g[1] + ':' + un;
        if(!grupos[chave]) grupos[chave] = {chave: chave, tipo: g[0], nome: g[2], unidade: un, safras: [], saldo: 0};
        grupos[chave].safras.push({safraId: sf.id, saldo: saldo});
        grupos[chave].saldo += saldo;
      });
    });
    var lista = Object.keys(grupos).map(function(k){ return grupos[k]; });
    var assinatura = function(g){ return g.safras.map(function(x){ return x.safraId; }).sort().join(',') + '|' + g.unidade; };
    var assinaturasCultura = lista.filter(function(g){ return g.tipo === 'cul'; }).map(assinatura);
    // lavoura só aparece se for diferente do "todo o estoque da cultura" (ex.: dois anos de milho em estoque)
    return lista.filter(function(g){ return g.tipo === 'cul' || (g.safras.length > 1 && assinaturasCultura.indexOf(assinatura(g)) === -1); })
      .sort(function(a,b){ return (a.tipo === b.tipo ? a.nome.localeCompare(b.nome, 'pt-BR') : (a.tipo === 'cul' ? -1 : 1)); });
  }
  function estoqueResumo(){
    var estoque = estoquePorSafra();
    var total = 0;
    var itens = Object.keys(estoque).map(function(sid){
      var e = estoque[sid];
      var qtd = e.entrada - e.saida;
      var preco = e.precoCount ? (e.precoSoma / e.precoCount) : 0;
      var valor = Math.max(qtd, 0) * preco;
      total += valor;
      return {safraId: sid, qtd: qtd, preco: preco, valor: valor, unidade: e.unidade};
    });
    return {total: total, itens: itens};
  }
  var KG_POR_SACA = 60;
  var HA_POR_ALQUEIRE = 2.42;
  function converterKgSc(qtd, unidade){
    var u = String(unidade || '').trim().toLowerCase();
    if(u === 'kg'){ return {kg: qtd, sc: qtd / KG_POR_SACA}; }
    if(u === 'sc' || u === 'saca' || u === 'sacas'){ return {kg: qtd * KG_POR_SACA, sc: qtd}; }
    return {kg: null, sc: null};
  }
  function estoquePorCultura(){
    var porSafra = estoquePorSafra();
    var porCultura = {};
    Object.keys(porSafra).forEach(function(sid){
      var safra = state.safras.find(function(s){ return s.id === sid; });
      if(!safra) return;
      var culturaId = safra.culturaId;
      var e = porSafra[sid];
      var qtd = e.entrada - e.saida;
      if(qtd <= 0) return;
      var preco = e.precoCount ? (e.precoSoma / e.precoCount) : 0;
      var valor = qtd * preco;
      if(!porCultura[culturaId]) porCultura[culturaId] = {qtd: 0, valor: 0, unidade: e.unidade};
      porCultura[culturaId].qtd += qtd;
      porCultura[culturaId].valor += valor;
      if(!porCultura[culturaId].unidade && e.unidade) porCultura[culturaId].unidade = e.unidade;
    });
    return Object.keys(porCultura).map(function(cid){
      var c = porCultura[cid];
      var conv = converterKgSc(c.qtd, c.unidade);
      return {culturaId: cid, qtd: c.qtd, unidade: c.unidade, valor: c.valor, kg: conv.kg, sc: conv.sc};
    }).sort(function(a,b){ return b.valor - a.valor; });
  }
  function estoqueValorPorSafraIds(safraIds){
    var estoque = estoquePorSafra();
    var total = 0;
    safraIds.forEach(function(sid){
      var e = estoque[sid];
      if(!e) return;
      var qtd = e.entrada - e.saida;
      var preco = e.precoCount ? (e.precoSoma / e.precoCount) : 0;
      total += Math.max(qtd, 0) * preco;
    });
    return total;
  }

  function contasAVencer(dias){
    var hoje = new Date(); hoje.setHours(0,0,0,0);
    var limite = new Date(hoje.getTime() + dias * 24 * 3600 * 1000);
    var lista = [];
    state.financeiro.forEach(function(f){
      if(f.status === 'Pendente' && f.vencimento){
        var d = new Date(f.vencimento);
        if(d <= limite) lista.push({desc:(f.tipo==='custo'?'A pagar':'A receber') + ' · ' + (f.descricao || f.categoria), valor:Number(f.valor)||0, vencimento:f.vencimento, tipo: f.tipo==='receita'?'entrada':'saida', atrasado: d < hoje});
      }
    });
    state.contasPagar.forEach(function(c){
      if(c.status === 'Pendente' && c.vencimento){
        var d = new Date(c.vencimento);
        if(d <= limite) lista.push({desc:'A pagar · ' + c.descricao, valor:Number(c.valor)||0, vencimento:c.vencimento, tipo:'saida', atrasado: d < hoje});
      }
    });
    state.contasReceber.forEach(function(c){
      if(c.status === 'Pendente' && c.vencimento){
        var d = new Date(c.vencimento);
        if(d <= limite) lista.push({desc:'A receber · ' + c.descricao, valor:valorLiquidoContaReceber(c), vencimento:c.vencimento, tipo:'entrada', atrasado: d < hoje});
      }
    });
    lista.sort(function(a,b){ return new Date(a.vencimento) - new Date(b.vencimento); });
    return lista;
  }

  function renderBuscaGlobalResultados(resultados, termo){
    var el = document.getElementById('busca-global-resultados');
    if(!el) return;
    if(!termo.trim() || !resultados.length){
      el.style.display = 'none';
      el.innerHTML = '';
      return;
    }
    var html = '';
    resultados.forEach(function(r){
      html += '<div class="busca-resultado-item" data-action="ir-busca-resultado" data-tab="' + r.tab + '" data-id="' + (r.id||'') + '" data-entity="' + (r.entityKey||'') + '" data-scope-custom="' + (r.scopeCustom||'') + '" style="padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--paper-line); font-size:13px;">';
      html += '<span style="font-size:10px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.03em;">' + escapeHtml(r.tipo) + '</span><br>';
      html += escapeHtml(r.label);
      html += '</div>';
    });
    if(resultados.length === 10) html += '<div style="padding:7px 12px; font-size:11px; color:var(--ink-soft);">Mostrando os 10 primeiros resultados — digite mais pra refinar.</div>';
    el.innerHTML = html;
    el.style.display = 'block';
  }

  function switchTab(tab){
    document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === tab); });
    document.querySelectorAll('.tab-content').forEach(function(sec){ sec.classList.toggle('hidden', sec.id !== 'tab-' + tab); });
    document.getElementById('page-title').textContent = pageMeta[tab].title;
    document.getElementById('page-subtitle').textContent = pageMeta[tab].subtitle;
    expandGroupFor(tab);
  }

  function safeRender(nomeAba, fn){
    try{ fn(); }
    catch(err){
      console.error('Erro ao renderizar "' + nomeAba + '":', err);
      var el = document.getElementById('tab-' + nomeAba);
      if(el){
        el.innerHTML = '<div class="paper note-box">Não foi possível carregar esta aba (erro técnico: ' + escapeHtml(String(err && err.message || err)) + '). As demais abas continuam funcionando normalmente.</div>';
      }
    }
  }

  /* ---------------- Dashboard ---------------- */
  function renderPainel(){
    var el = document.getElementById('tab-painel');
    var areaTotal = state.talhoes.reduce(function(sum,t){ return sum + (Number(t.area)||0); }, 0);
    var safrasAndamento = state.safras.filter(function(s){ return s.status === 'andamento'; }).length;
    var totalCustos = state.financeiro.filter(function(f){ return f.tipo === 'custo' && (f.status||'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
    var totalReceitas = state.financeiro.filter(function(f){ return f.tipo === 'receita' && (f.status||'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
    var saldo = totalReceitas - totalCustos;
    var estoque = estoqueResumo();

    var html = '';
    html += '<div class="stat-row">';
    html += statCard('Área total', fmtHa(areaTotal));
    html += statCard('Propriedades', state.propriedades.length);
    html += statCard('Talhões', state.talhoes.length);
    html += statCard('Safras em andamento', safrasAndamento);
    html += statCard('Saldo financeiro', fmtBRL(saldo), saldo >= 0 ? 'growth' : 'cost');
    html += statCard('Produção em estoque', fmtBRL(estoque.total), 'growth');
    html += '</div>';

    var estoqueBaixo = state.produtos.filter(function(p){ return Number(p.estoqueMinimo) > 0 && Number(p.estoqueAtual) < Number(p.estoqueMinimo); });
    var manutencao = state.patrimonio.filter(function(p){ return p.status === 'Em manutenção'; });
    var hojeMs = Date.now();
    var colheitasProximas = state.safras.filter(function(s){
      if(s.status !== 'andamento' || !s.previsaoColheita) return false;
      var dias = Math.ceil((new Date(s.previsaoColheita + 'T00:00:00').getTime() - hojeMs) / 86400000);
      return dias <= 15;
    });
    if(estoqueBaixo.length || manutencao.length || colheitasProximas.length){
      html += '<div class="paper alert-box">';
      if(estoqueBaixo.length){
        html += '<div><strong style="color:var(--cost-dark);">Estoque abaixo do mínimo:</strong> ' + estoqueBaixo.map(function(p){ return escapeHtml(p.nome); }).join(', ') + '</div>';
      }
      if(manutencao.length){
        html += '<div><strong style="color:var(--accent-dark);">Patrimônio em manutenção:</strong> ' + manutencao.map(function(p){ return escapeHtml(p.nome); }).join(', ') + '</div>';
      }
      if(colheitasProximas.length){
        html += '<div><strong style="color:var(--accent-dark);">Colheita se aproximando:</strong> ' + colheitasProximas.map(function(s){
          var dias = Math.ceil((new Date(s.previsaoColheita + 'T00:00:00').getTime() - hojeMs) / 86400000);
          var txt = dias < 0 ? (Math.abs(dias) + ' dia(s) atrasada') : (dias === 0 ? 'hoje' : 'em ' + dias + ' dia(s)');
          return escapeHtml(safraLabel(s.id)) + ' (' + txt + ')';

    var vencendo = contasAVencer(7);

      html += '<div class="paper list-card">';

        html += '<div class="list-row"><span>' + escapeHtml(v.desc) + (v.atrasado ? '<span class="flag-late">Atrasado</span>' : '') + '</span>';

    html += '<div class="section-title">Mapa de talhões</div>';

  /* ---------------- Generic cadastro helpers ---------------- */
  function formatColumn(col, value){
    if(value === undefined || value === null || value === ''){ return '—'; }
    switch(col.format){
      case 'ha': return fmtHa(value);
      case 'brl': return fmtBRL(value);
      case 'num': return escapeHtml(value);
      case 'date': return fmtDate(value);
      case 'badge':
        var bg = (col.colors && col.colors[value]) ? col.colors[value] : '#C9C3A4';
        return '<span class="badge" style="background:' + bg + '; color:#1B1508">' + escapeHtml(value) + '</span>';
      default: return escapeHtml(value);
    }
  }

  function buildGenericFormHtml(entityKey){
    var cfg = ENTITY_CONFIGS[entityKey];
    var editingRecord = null;
    if(editState && editState.scope === 'generic' && editState.entityKey === entityKey){
      editingRecord = state[entityKey].find(function(x){ return x.id === editState.id; }) || null;
    }
    var temCamposAvancados = cfg.fields.some(function(f){ return f.advanced; });
    if(editingRecord && temCamposAvancados){
      var editandoTemAvancado = cfg.fields.some(function(f){ return f.advanced && editingRecord[f.name] !== undefined && editingRecord[f.name] !== '' && editingRecord[f.name] !== 0; });
      if(editandoTemAvancado) genericAvancadoAberto[entityKey] = true;
    }
    var html = '<div class="paper form-card"><h3>' + (editingRecord ? 'Editar ' + cfg.label.toLowerCase() : 'Novo(a) ' + cfg.label.toLowerCase()) + '</h3>';
    html += '<form class="entry-form" data-form="generic" data-entity="' + entityKey + '"' + (editingRecord ? ' data-editing-id="' + editingRecord.id + '"' : '') + '>';
    cfg.fields.forEach(function(f){
      if(f.advanced) return;
      var current = editingRecord ? editingRecord[f.name] : undefined;
      if(f.type === 'select'){
        var opts = typeof f.optionsFn === 'function' ? f.optionsFn(current) : f.options;
        if(f.addButton){
          html += '<div class="field-with-add">' + selectField(f.name, f.label, opts, current) + '<button type="button" class="btn-add-inline" data-action="' + f.addButton.action + '" title="' + f.addButton.title + '">+</button></div>';
        } else {
          html += selectField(f.name, f.label, opts, current);
        }
      } else {
        html += field(f.type, f.name, f.label, !!f.required, f.placeholder || '', f.extra || {}, current);
      }
    });
    if(temCamposAvancados){
      var avancadoAberto = !!genericAvancadoAberto[entityKey];
      html += '<button type="button" class="btn-add-inline" data-action="toggle-generic-avancado" data-entity="' + entityKey + '" style="grid-column: 1 / -1; width:fit-content; margin-top:6px;">' + (avancadoAberto ? '▲ Ocultar mais parâmetros' : '▼ Mostrar mais parâmetros') + '</button>';
      html += '<div id="generic-avancado-' + entityKey + '" style="display:' + (avancadoAberto ? 'contents' : 'none') + ';">';
      cfg.fields.forEach(function(f){
        if(!f.advanced) return;
        var current = editingRecord ? editingRecord[f.name] : undefined;
        if(f.type === 'select'){
          var opts = typeof f.optionsFn === 'function' ? f.optionsFn(current) : f.options;
          html += selectField(f.name, f.label, opts, current);
        } else {
          html += field(f.type, f.name, f.label, !!f.required, f.placeholder || '', f.extra || {}, current);
        }
      });
      html += '</div>';
    }
    html += '<button type="submit" class="btn">' + (editingRecord ? 'Salvar alterações' : 'Adicionar') + '</button>';
    if(editingRecord) html += '<button type="button" class="btn-cancel" data-action="cancel-edit">Cancelar</button>';
    html += '</form></div>';
    return html;
  }

  var genericTableSort = {};
  function valorParaOrdenarGenerico(c, item){
    return c.compute ? c.compute(item) : item[c.key];
  }
  function compararParaOrdenarGenerico(c, a, b, direcao){
    var va = valorParaOrdenarGenerico(c, a);
    var vb = valorParaOrdenarGenerico(c, b);
    var vazioA = (va === undefined || va === null || va === '');
    var vazioB = (vb === undefined || vb === null || vb === '');
    if(vazioA && vazioB) return 0;
    if(vazioA) return 1;
    if(vazioB) return -1;
    var resultado;
    if(typeof va === 'number' && typeof vb === 'number'){
      resultado = va - vb;
    } else {
      resultado = String(va).localeCompare(String(vb), 'pt-BR', {numeric:true, sensitivity:'base'});
    }
    return direcao === 'desc' ? -resultado : resultado;
  }
  function buildGenericTableHtml(entityKey){
    var cfg = ENTITY_CONFIGS[entityKey];
    var list = state[entityKey];
    var html = '<div class="paper">';
    if(!list.length){
      html += '<div class="empty-state">Nenhum(a) ' + cfg.label.toLowerCase() + ' cadastrado(a) ainda.</div>';
    } else {
      if(list.length > 4){
        html += '<div style="padding:14px 18px 0;"><input type="text" id="search-' + entityKey + '" placeholder="Buscar..." style="width:100%; max-width:280px; padding:7px 10px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;"></div>';
      }
      var ordenAtualGenerico = genericTableSort[entityKey];
      html += '<div class="table-wrap"><table><thead><tr>';
      cfg.columns.forEach(function(c){
        var ativo = ordenAtualGenerico && ordenAtualGenerico.coluna === c.key;
        var seta = ativo ? (ordenAtualGenerico.direcao === 'asc' ? ' ▲' : ' ▼') : '';
        html += '<th data-action="sort-generic-table" data-entity="' + entityKey + '" data-key="' + c.key + '" style="cursor:pointer; user-select:none;" title="Clique para ordenar">' + escapeHtml(c.label) + seta + '</th>';
      });
      html += '<th></th></tr></thead><tbody>';
      var listaOrdenadaGenerico = list.slice();
      if(ordenAtualGenerico){
        var colunaOrdenarGenerico = cfg.columns.find(function(c){ return c.key === ordenAtualGenerico.coluna; });
        if(colunaOrdenarGenerico){
          listaOrdenadaGenerico.sort(function(a,b){ return compararParaOrdenarGenerico(colunaOrdenarGenerico, a, b, ordenAtualGenerico.direcao); });
        }
      } else {
        listaOrdenadaGenerico.sort(function(a,b){ return (b.criadoEm||0)-(a.criadoEm||0); });
      }
      listaOrdenadaGenerico.forEach(function(item){
        html += '<tr>';
        cfg.columns.forEach(function(c){
          var val = c.compute ? c.compute(item) : item[c.key];
          var numClass = (c.format === 'ha' || c.format === 'brl' || c.format === 'num') ? ' class="num"' : '';
          html += '<td' + numClass + '>' + formatColumn(c, val) + '</td>';
        });
        html += '<td><button class="btn-edit" data-action="edit-generic" data-entity="' + entityKey + '" data-id="' + item.id + '">Editar</button>';
        html += '<button class="btn-del" data-action="del-generic" data-entity="' + entityKey + '" data-id="' + item.id + '">Remover</button>';
        if(cfg.extraRowAction) html += cfg.extraRowAction(item);
        html += '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
    return html;
  }

  function renderGenericTab(entityKey){
    document.getElementById('tab-' + entityKey).innerHTML = buildGenericFormHtml(entityKey) + buildGenericTableHtml(entityKey);
  }

  function renderPatrimonio(){
    var totalCompra = state.patrimonio.reduce(function(s,p){ return s + (Number(p.valor)||0); }, 0);
    var totalAtual = state.patrimonio.reduce(function(s,p){ return s + calcDepreciacao(p); }, 0);
    var html = '<div class="stat-row">';
    html += statCard('Itens cadastrados', state.patrimonio.length);
    html += statCard('Valor total de compra', fmtBRL(totalCompra));
    html += statCard('Valor total atual (depreciado)', fmtBRL(totalAtual), 'growth');
    html += '</div>';
    html += buildGenericFormHtml('patrimonio');

  function calcularAjusteEstoque(p, modo, qtdTxt, embNome){
    if(qtdTxt === '' || isNaN(parseFloat(qtdTxt))) return null;
    var emb = embalagensDoProduto(p).find(function(e){ return e.nome === embNome; });
    var q = parseFloat(qtdTxt) * (emb ? Number(emb.conteudo) : 1);
    var atual = Number(p.estoqueAtual) || 0;
    var novo = modo === 'contagem' ? q : (modo === 'saida' ? atual - q : atual + q);
    novo = Math.round(novo * 1000) / 1000;
    return {novo: novo, diferenca: Math.round((novo - atual) * 1000) / 1000};
  }

  function enviarCertificado(){
    var fileInput = document.getElementById('cert-file-input');
    var senhaInput = document.getElementById('cert-senha-input');
    var file = fileInput && fileInput.files && fileInput.files[0];
    var senha = senhaInput ? senhaInput.value : '';
    if(!file){ alert('Selecione o arquivo do certificado (.pfx ou .p12).'); return; }
    if(!senha){ alert('Digite a senha do certificado.'); return; }
    if(!window.confirm('Confirma o envio? O certificado é guardado de forma criptografada — a senha não fica visível pra ninguém depois de enviada.')) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var base64 = String(e.target.result).split(',')[1] || '';
      fetch('/.netlify/functions/certificado', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({certBase64: base64, senha: senha, nomeArquivo: file.name})
      })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(data.ok){
            alert('Certificado enviado e guardado com segurança.');
            if(senhaInput) senhaInput.value = '';
            verificarStatusCertificado();
          } else {
            alert('Não foi possível enviar: ' + (data.error || 'erro desconhecido. Confira se a variável CERT_ENCRYPTION_KEY está configurada no Netlify.'));
          }
        })
        .catch(function(){ alert('Não foi possível enviar o certificado. Confira sua conexão e tente de novo.'); });
    };
    reader.readAsDataURL(file);
  }

  var sefazProximoTesteLiberadoEm = 0;

  function testarConsultaSefaz(){
    var agora = Date.now();
    if(agora < sefazProximoTesteLiberadoEm){
      var minutosFaltando = Math.ceil((sefazProximoTesteLiberadoEm - agora) / 60000);
      alert('A SEFAZ pediu pra esperar antes de consultar de novo. Faltam aproximadamente ' + minutosFaltando + ' minuto(s).');
      return;
    }
    var ambienteInput = document.getElementById('f-sefaz-ambiente');
    var ufInput = document.getElementById('f-sefaz-uf');
    var docInput = document.getElementById('f-sefaz-documento');
    var nsuInput = document.getElementById('f-sefaz-ultnsu');
    var resultadoEl = document.getElementById('sefaz-resultado');
    var ambiente = ambienteInput ? ambienteInput.value : 'homologacao';
    var uf = ufInput ? ufInput.value : '';
    var documento = docInput ? docInput.value.replace(/\D/g, '') : '';
    var ultNSU = nsuInput ? nsuInput.value.replace(/\D/g, '') : '0';
    if(!documento){ alert('Digite o CPF ou CNPJ (só números).'); return; }
    var avisoAmbiente = ambiente === 'producao' ? 'PRODUÇÃO (dados reais)' : 'HOMOLOGAÇÃO (testes)';
    if(!window.confirm('Isso vai consultar a SEFAZ em ambiente de ' + avisoAmbiente + ' usando o certificado guardado. Confirma?')) return;
    sefazOperacaoEmAndamento = 'Consultando a SEFAZ, aguarde…';
    renderCompras();
    fetch('/.netlify/functions/sefaz-consulta', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ambiente: ambiente, uf: uf, documento: documento, ultNSU: ultNSU})
    })
      .then(function(r){ return r.json(); })
      .then(function(data){
        sefazUltimaResposta = data;
        sefazIgnoradasNaUltimaConsulta = 0;
        sefazContagemUltima = {completas:0, resumos:0, eventos:0, jaImportadas:0};
        if(data.documentos && data.documentos.length){
          var nsusJaTemos = sefazDocumentosAcumulados.map(function(d){ return d.nsu; });
          var chavesJaImportadas = state.notasFiscaisImportadas.map(function(n){ return n.chave; });
          data.documentos.forEach(function(doc){
            var schemaDoc = doc.schema || '';
            if(schemaDoc.indexOf('resNFe') !== -1){
              // Só o resumo: a nota completa só vem depois da "Ciência da Operação"
              var resumo = parseResumoNFe(doc.xml);
              if(!resumo || !resumo.chave) return;
              if(chavesJaImportadas.indexOf(resumo.chave) !== -1){ sefazContagemUltima.jaImportadas++; return; }
              if(chaveJaAcumulada(resumo.chave)) return;
              sefazContagemUltima.resumos++;
              guardarResumoSefaz(resumo);
              return;
            }
            if(schemaDoc.indexOf('procNFe') === -1){ sefazContagemUltima.eventos++; return; }
            if(nsusJaTemos.indexOf(doc.nsu) !== -1) return;
            var parsedRapido = parseNFeXML(doc.xml);
            if(parsedRapido && parsedRapido.chave && chavesJaImportadas.indexOf(parsedRapido.chave) !== -1){
              sefazIgnoradasNaUltimaConsulta++;
              sefazContagemUltima.jaImportadas++;
              return;
            }
            if(parsedRapido && parsedRapido.chave && chaveJaAcumulada(parsedRapido.chave)) return;
            sefazContagemUltima.completas++;
            sefazDocumentosAcumulados.push(doc);
            if(parsedRapido && parsedRapido.chave) removerResumoSefaz(parsedRapido.chave);
          });
          saveKey('sefazResumos', state.sefazResumos);
        }
        if(data.cStat === '656'){
          sefazProximoTesteLiberadoEm = Date.now() + 60 * 60 * 1000;
        } else {
          sefazProximoTesteLiberadoEm = Date.now() + 2 * 60 * 1000;
        }
        state.sefazNotasPendentes = sefazDocumentosAcumulados;
        saveKey('sefazNotasPendentes', state.sefazNotasPendentes);
        if(data.ultNSU){
          state.sefazProgresso = [{ultNSU: data.ultNSU, maxNSU: data.maxNSU || '', atualizadoEm: new Date().toISOString()}];
          saveKey('sefazProgresso', state.sefazProgresso);
        }
        sefazOperacaoEmAndamento = '';
        renderCompras();
      })
      .catch(function(err){
        sefazUltimaResposta = { erro: String(err) };
        sefazOperacaoEmAndamento = '';
        renderCompras();
      });
  }

  /* ---------- Resumos de NF-e (resNFe) e Ciência da Operação ---------- */
  function parseResumoNFe(xmlText){
    try{
      var docR = new DOMParser().parseFromString(xmlText, 'text/xml');
      var tg = function(nome){ var el = docR.getElementsByTagName(nome)[0]; return el ? el.textContent.trim() : ''; };
      var chave = tg('chNFe');
      if(!chave) return null;
      return {chave: chave, emitente: tg('xNome'), docEmitente: tg('CNPJ') || tg('CPF'), dataEmissao: (tg('dhEmi') || '').slice(0,10),
        valor: parseFloat(tg('vNF')) || 0, situacao: tg('cSitNFe') || '1', tipo: tg('tpNF')};
    }catch(e){ return null; }
  }
  function chaveJaAcumulada(chave){
    return sefazDocumentosAcumulados.some(function(d){ return d.chave === chave || (d.xml && d.xml.indexOf(chave) !== -1); });
  }
  function guardarResumoSefaz(resumo){
    if(!Array.isArray(state.sefazResumos)) state.sefazResumos = [];
    var existente = state.sefazResumos.find(function(r){ return r.chave === resumo.chave; });
    if(existente){ Object.keys(resumo).forEach(function(k){ existente[k] = resumo[k]; }); return; }
    resumo.status = resumo.situacao === '3' ? 'cancelada' : (resumo.situacao === '2' ? 'denegada' : 'aguardando');
    resumo.recebidoEm = new Date().toISOString();
    state.sefazResumos.push(resumo);
  }
  function removerResumoSefaz(chave){
    state.sefazResumos = (state.sefazResumos || []).filter(function(r){ return r.chave !== chave; });
  }
  function dadosConsultaSefaz(){
    var ambienteInput = document.getElementById('f-sefaz-ambiente');
    var ufInput = document.getElementById('f-sefaz-uf');
    var docInput = document.getElementById('f-sefaz-documento');
    return {ambiente: ambienteInput ? ambienteInput.value : 'producao', uf: ufInput ? ufInput.value : 'PR', documento: docInput ? docInput.value.replace(/\D/g, '') : ''};
  }
  function postSefaz(funcao, corpo){
    return fetch('/.netlify/functions/' + funcao, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(corpo)})
      .then(function(r){ return r.json(); });
  }
  function emLotes(lista, tamanho){ var out = []; for(var i = 0; i < lista.length; i += tamanho) out.push(lista.slice(i, i + tamanho)); return out; }
  function chavesResumosMarcados(){
    var ch = [];
    document.querySelectorAll('.sefaz-resumo-cb:checked').forEach(function(cb){ ch.push(cb.value); });
    return ch;
  }
  // Baixa o XML completo por chave (depois da ciência). Devolve uma Promise.
  function baixarResumosPorChave(chaves, dados){
    dados = dados || dadosConsultaSefaz();
    var baixadas = 0;
    var lotes = emLotes(chaves, 5);
    var seq = Promise.resolve();
    lotes.forEach(function(lote, iL){
      seq = seq.then(function(){
        sefazOperacaoEmAndamento = 'Baixando XML completo… (' + Math.min((iL + 1) * 5, chaves.length) + ' de ' + chaves.length + ')';
        renderCompras();
        return postSefaz('sefaz-consulta', {ambiente: dados.ambiente, uf: dados.uf, documento: dados.documento, chaves: lote}).then(function(resp){
          if(resp.error) throw new Error(resp.error);
          (resp.documentos || []).forEach(function(doc){
            var parsedB = parseNFeXML(doc.xml);
            var chaveB = parsedB && parsedB.chave;
            if(chaveB && chaveJaAcumulada(chaveB)) return;
            doc.chave = chaveB || '';
            doc.nsu = doc.nsu || ('chave-' + chaveB);
            sefazDocumentosAcumulados.push(doc);
            if(chaveB) removerResumoSefaz(chaveB);
            baixadas++;
          });
          (resp.resultados || []).forEach(function(res){
            if(res.baixou) return;
            var rs = (state.sefazResumos || []).find(function(r){ return r.chave === res.chave; });
            if(rs){ rs.mensagem = 'Download: ' + (res.cStat ? res.cStat + ' — ' : '') + (res.xMotivo || 'XML ainda não disponível'); }
          });
        });
      });
    });
    return seq.then(function(){
      state.sefazNotasPendentes = sefazDocumentosAcumulados;
      saveKey('sefazNotasPendentes', state.sefazNotasPendentes);
      saveKey('sefazResumos', state.sefazResumos);
      return baixadas;
    });
  }
  function darCienciaEBaixar(chaves){
    var dados = dadosConsultaSefaz();
    if(!dados.documento){ alert('Preencha o CPF ou CNPJ lá em cima.'); return; }
    var aptas = chaves.filter(function(ch){ var r = (state.sefazResumos || []).find(function(x){ return x.chave === ch; }); return r && r.status !== 'cancelada' && r.status !== 'denegada'; });
    if(!aptas.length){ alert('Nenhuma das notas marcadas pode receber ciência (canceladas ou denegadas ficam de fora).'); return; }
    if(!window.confirm('Registrar "Ciência da Operação" na SEFAZ (' + (dados.ambiente === 'producao' ? 'PRODUÇÃO' : 'homologação') + ') para ' + aptas.length + ' nota(s) e baixar o XML completo?\n\nA ciência só informa que você tomou conhecimento da nota — não confirma nem recusa a operação. Depois você ainda pode confirmar ou desconhecer, se precisar.')) return;
    var sucesso = [];
    var seq = Promise.resolve();
    emLotes(aptas, 20).forEach(function(lote, iL){
      seq = seq.then(function(){
        sefazOperacaoEmAndamento = 'Registrando ciência na SEFAZ… (' + Math.min((iL + 1) * 20, aptas.length) + ' de ' + aptas.length + ')';
        renderCompras();
        return postSefaz('sefaz-manifestar', {ambiente: dados.ambiente, documento: dados.documento, chaves: lote}).then(function(resp){
          if(resp.error) throw new Error(resp.error);
          if(!resp.resultados || !resp.resultados.length) throw new Error('A SEFAZ não confirmou o evento' + (resp.cStat ? ' (' + resp.cStat + ' — ' + (resp.xMotivo || '') + ')' : '') + '.');
          resp.resultados.forEach(function(res){
            var rs = (state.sefazResumos || []).find(function(r){ return r.chave === res.chave; });
            if(!rs) return;
            if(res.sucesso){ rs.status = 'ciencia'; rs.cienciaEm = new Date().toISOString(); rs.mensagem = ''; sucesso.push(res.chave); }
            else { rs.status = 'erro'; rs.mensagem = 'Ciência: ' + res.cStat + ' — ' + (res.xMotivo || ''); }
          });
          saveKey('sefazResumos', state.sefazResumos);
        });
      });
    });
    seq.then(function(){ return sucesso.length ? baixarResumosPorChave(sucesso, dados) : 0; })
      .then(function(baixadas){
        sefazOperacaoEmAndamento = '';
        renderCompras();
        alert('Ciência registrada em ' + sucesso.length + ' nota(s). XML completo baixado de ' + baixadas + '.' + (baixadas < sucesso.length ? '\n\nAs que ainda não vieram costumam ficar disponíveis em alguns minutos — use "Baixar XML de novo" depois.' : '') + (baixadas ? '\n\nAgora é só clicar em "Trazer as notas completas" para revisar e importar.' : ''));
      })
      .catch(function(err){
        sefazOperacaoEmAndamento = '';
        saveKey('sefazResumos', state.sefazResumos);
        renderCompras();
        alert('Não foi possível concluir: ' + (err && err.message ? err.message : err));
      });
  }
  function baixarNovamenteResumos(chaves){
    if(!chaves.length){ alert('Marque as notas.'); return; }
    var dadosB = dadosConsultaSefaz();
    if(!dadosB.documento){ alert('Preencha o CPF ou CNPJ lá em cima.'); return; }
    baixarResumosPorChave(chaves, dadosB).then(function(baixadas){
      sefazOperacaoEmAndamento = ''; renderCompras();
      alert(baixadas ? baixadas + ' nota(s) baixada(s). Clique em "Trazer as notas completas" para revisar.' : 'Nenhum XML disponível ainda para essas notas. Veja a mensagem de cada uma na lista.');
    }).catch(function(err){ sefazOperacaoEmAndamento = ''; renderCompras(); alert('Não foi possível baixar: ' + (err && err.message ? err.message : err)); });
  }

  function persistirRevisaoNFe(){

  function trazerNotasSefaz(){
    if(!sefazDocumentosAcumulados.length){ alert('Nenhuma nota completa acumulada ainda.'); return; }

    var qtdInput = document.getElementById('sefaz-qtd-notas');
    var qtdDesejada = qtdInput ? parseInt(qtdInput.value, 10) : NaN;
    var docsParaProcessar, docsRestantes;
    if(qtdDesejada && qtdDesejada > 0 && qtdDesejada < sefazDocumentosAcumulados.length){
      docsParaProcessar = sefazDocumentosAcumulados.slice(-qtdDesejada); // pega as últimas (mais recentes)
      docsRestantes = sefazDocumentosAcumulados.slice(0, sefazDocumentosAcumulados.length - qtdDesejada);
    } else {
      docsParaProcessar = sefazDocumentosAcumulados;
      docsRestantes = [];
    }

    var novosItens = [];
    var falhas = 0;
    docsParaProcessar.forEach(function(doc){
      var parsed = parseNFeXML(doc.xml);
      if(!parsed){ falhas++; return; }
      var jaImportada = parsed.chave && state.notasFiscaisImportadas.some(function(n){ return n.chave === parsed.chave; });
      parsed.itens.forEach(function(item){
        var match = state.produtos.find(function(p){ return p.nome.trim().toLowerCase() === item.xProd.trim().toLowerCase(); });
        item.incluir = !jaImportada;
        item.produtoId = match ? match.id : '';
        item.destino = 'compra';
        item.safraId = '';
        item.numeroNota = parsed.numero;
        item.dataEmissaoNota = parsed.dataEmissao;
        item.fornecedorNomeNota = parsed.fornecedorNome;
        item.chaveNota = parsed.chave;
        item.naturezaNota = parsed.natureza;
        item.duplicatasNota = parsed.duplicatas || [];
        novosItens.push(item);
      });
    });

    if(!novosItens.length){ alert('Não consegui extrair itens dessas notas.' + (falhas ? ' (' + falhas + ' com erro de leitura)' : '')); return; }

    if(!nfeImportada) nfeImportada = { itens: [] };
    nfeImportada.itens = nfeImportada.itens.concat(novosItens);
    sefazDocumentosAcumulados = docsRestantes;
    state.sefazItensRevisao = nfeImportada.itens;
    state.sefazNotasPendentes = sefazDocumentosAcumulados;
    saveKey('sefazItensRevisao', state.sefazItensRevisao);
    saveKey('sefazNotasPendentes', state.sefazNotasPendentes);
    renderCompras();
    var formCardEl = document.querySelector('#tab-compras .paper.form-card');
    if(formCardEl) formCardEl.scrollIntoView({behavior: 'smooth', block: 'start'});
  }

      html += '<label style="font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;">Talhões da lavoura e área plantada</label>';

        html += '</div>';

  /* ---------------- Diário de Campo (Operações) ---------------- */
  /* ---------------- Diário de Campo: aplicações por lavoura, receituário e máquinas ---------------- */
  var diarioRascunho = null;
  var diarioPreTalhaoId = '';
  function custoMedioProduto(produtoId){
    var prodCm = state.produtos.find(function(x){ return x.id === produtoId; });
    if(prodCm && Number(prodCm.custoManual) > 0) return Number(prodCm.custoManual);
    return custoMedioComprasProduto(produtoId);
  }
  function custoMedioComprasProduto(produtoId){
    var qtd = 0, valor = 0;
    state.compras.forEach(function(c){
      if(c.produtoId !== produtoId) return;
      var q = Number(c.quantidade) || 0;
      if(q <= 0) return;
      qtd += q; valor += Number(c.valorTotal) || (q * (Number(c.valorUnitario) || 0));
    });
    return qtd > 0 ? valor / qtd : 0;
  }
  function unidadeProduto(produtoId){ var p = state.produtos.find(function(x){ return x.id === produtoId; }); return p ? unidadeControle(p) : ''; }
  // Aplicações (onde) de uma atividade: [{safraId, talhaoId, area}]. Atividades antigas usam talhaoId/safraId soltos.
  function aplicacoesDaOperacao(o){
    if(o.aplicacoes && o.aplicacoes.length) return o.aplicacoes;
    if(o.safraId){ var sf = state.safras.find(function(x){ return x.id === o.safraId; }); return [{safraId: o.safraId, talhaoId: sf ? sf.talhaoId : (o.talhaoId || ''), area: sf ? areaPlantadaSafra(sf) : 0}]; }
    if(o.talhaoId){ var t = state.talhoes.find(function(x){ return x.id === o.talhaoId; }); return [{safraId: '', talhaoId: o.talhaoId, area: t ? (Number(t.area) || 0) : 0}]; }
    return [];
  }
  function areaTotalOperacao(o){ return aplicacoesDaOperacao(o).reduce(function(s,a){ return s + (Number(a.area) || 0); }, 0); }
  // Fração da atividade que cabe a uma safra (pela área aplicada)
  function fracaoOperacaoNaSafra(o, safraId){
    var aps = aplicacoesDaOperacao(o);
    var tot = aps.reduce(function(s,a){ return s + (Number(a.area) || 0); }, 0);
    var daSafra = aps.filter(function(a){ return a.safraId === safraId; });
    if(!daSafra.length) return 0;
    if(tot <= 0) return daSafra.length / aps.length;
    return daSafra.reduce(function(s,a){ return s + (Number(a.area) || 0); }, 0) / tot;
  }
  function produtosDaOperacao(o){
    if(o.produtos && o.produtos.length) return o.produtos;
    if(o.produtoId) return [{produtoId: o.produtoId, dose: 0, quantidade: Number(o.quantidade) || 0, custoUnit: 0, custoTotal: 0, unidade: o.unidade || ''}];
    return [];
  }
  function custoInsumosSafra(safraId){
    return state.operacoes.reduce(function(s, o){
      if(o.custear === false) return s;
      var fr = fracaoOperacaoNaSafra(o, safraId);
      if(!fr) return s;
      return s + fr * produtosDaOperacao(o).reduce(function(sp, p){ return sp + (Number(p.custoTotal) || 0); }, 0);
    }, 0);
  }
  // Horas de máquina: Diário de Campo (dividido pela área aplicada) + horas registradas na Colheita
  function horasMaquinaSafra(patrimonioId, safraId){
    var h = 0;
    state.operacoes.forEach(function(o){
      (o.maquinas || []).forEach(function(m){ if(m.patrimonioId === patrimonioId) h += (Number(m.horas) || 0) * fracaoOperacaoNaSafra(o, safraId); });
    });
    state.producao.forEach(function(p){ if(p.maquinaId === patrimonioId && p.safraId === safraId) h += Number(p.horasUso) || 0; });
    return h;
  }
  function horasTotaisMaquina(patrimonioId){
    var h = horasUsoTotais(patrimonioId);
    state.operacoes.forEach(function(o){ (o.maquinas || []).forEach(function(m){ if(m.patrimonioId === patrimonioId) h += Number(m.horas) || 0; }); });
    return h;
  }
  // Custo/hora real = custos pagos lançados na máquina ÷ horas de uso registradas
  function custoHoraMaquina(patrimonioId){
    var horas = horasTotaisMaquina(patrimonioId);
    return horas > 0 ? custosDaMaquina(patrimonioId).valor / horas : 0;
  }
  function custoMaquinasSafra(safraId){
    var usadas = {};
    state.operacoes.forEach(function(o){ (o.maquinas || []).forEach(function(m){ usadas[m.patrimonioId] = true; }); });
    state.producao.forEach(function(p){ if(p.maquinaId && Number(p.horasUso) > 0) usadas[p.maquinaId] = true; });
    return Object.keys(usadas).reduce(function(s, mid){ return s + horasMaquinaSafra(mid, safraId) * custoHoraMaquina(mid); }, 0);
  }

  function rascunhoDiarioDoRegistro(o){
    if(!o) return {origem:'novo', lavouraId:'', areas:{}, marcadas:null, talhaoAvulsoId: diarioPreTalhaoId || '', produtos:[{produtoId:'', dose:'', quantidade:'', qtdManual:false}], maquinas:[]};
    var aps = aplicacoesDaOperacao(o);
    var sf0 = aps[0] && aps[0].safraId ? state.safras.find(function(x){ return x.id === aps[0].safraId; }) : null;
    var areas = {}, marcadas = [];
    aps.forEach(function(a){ if(a.safraId){ areas[a.safraId] = a.area; marcadas.push(a.safraId); } });
    return {
      origem: o.id, lavouraId: sf0 ? sf0.lavouraId : '', areas: areas, marcadas: marcadas.length ? marcadas : null,
      talhaoAvulsoId: !sf0 && aps[0] ? aps[0].talhaoId : '',
      produtos: produtosDaOperacao(o).map(function(p){ var di = p.doseInformada; return {produtoId: p.produtoId, dose: di ? di.valor : (p.dose || ''), doseUn: di ? di.unidade : unidadeProduto(p.produtoId), dosePor: di ? di.por : 'ha', quantidade: p.quantidade || '', qtdManual: !p.dose}; }).concat(produtosDaOperacao(o).length ? [] : [{produtoId:'', dose:'', quantidade:'', qtdManual:false}]),

  var cpPagandoId = null;
  // Paga uma conta (inteira ou em parte). Pagamento parcial: a conta vira "Pago" com o valor pago e a diferença vira uma conta nova pendente.
  function pagarContaPagar(id, dataPag, valorPago){
    var c = state.contasPagar.find(function(x){ return x.id === id; });
    if(!c) return;
    var total = Number(c.valor) || 0;
    var resto = Math.round((total - valorPago) * 100) / 100;
    var escalarPartes = function(reg, novoValor){
      if(!reg.partes || !reg.partes.length || !total) return;
      var fracoes = reg.partes.map(function(pt){ return (Number(pt.valor) || 0) / total; });
      var vals = dividirValor(novoValor, fracoes);
      reg.partes = reg.partes.map(function(pt, i){ return {talhaoId: pt.talhaoId, safraId: pt.safraId, valor: vals[i]}; });
    };
    if(resto > 0.004){
      var restante = JSON.parse(JSON.stringify(c));
      restante.id = uid(); restante.criadoEm = Date.now(); restante.valor = resto; restante.status = 'Pendente'; restante.dataPagamento = '';
      restante.descricao = (c.descricao || '') + ' (saldo restante)';
      escalarPartes(restante, resto);
      state.contasPagar.push(restante);
    }
    escalarPartes(c, valorPago);
