  /* ---------------- AGRO5.0 — espaço para novos indicadores/tecnologias ---------------- */
  function gerarMapaAnualChuvaHtml(registros, ano, tituloPropriedade){
    var matriz = {};
    registros.forEach(function(r){
      if(!r.data) return;
      var partes = r.data.split('-');
      var anoReg = parseInt(partes[0], 10);
      if(anoReg !== ano) return;
      var mes = parseInt(partes[1], 10);
      var dia = parseInt(partes[2], 10);
      if(!matriz[dia]) matriz[dia] = {};
      matriz[dia][mes] = (matriz[dia][mes] || 0) + (Number(r.mm) || 0);
    });

    var totalPorMes = {};
    for(var m = 1; m <= 12; m++) totalPorMes[m] = 0;
    for(var d = 1; d <= 31; d++){
      for(var mm = 1; mm <= 12; mm++){
        if(matriz[d] && matriz[d][mm]) totalPorMes[mm] += matriz[d][mm];
      }
    }
    function diasNoMes(mesNum){ return new Date(ano, mesNum, 0).getDate(); }

    var html = '<div class="paper table-wrap" style="overflow-x:auto;"><p style="font-size:12.5px; font-weight:600; padding:12px 12px 0;">' + escapeHtml(tituloPropriedade) + ' — ' + ano + '</p>';
    html += '<table style="min-width:820px;"><thead><tr><th>Dia</th>';
    for(var mh = 1; mh <= 12; mh++) html += '<th>' + MESES[mh-1] + '</th>';
    html += '</tr></thead><tbody>';
    for(var dia = 1; dia <= 31; dia++){
      html += '<tr><td>' + String(dia).padStart(2,'0') + '</td>';
      for(var mes = 1; mes <= 12; mes++){
        var valorCel = (matriz[dia] && matriz[dia][mes]) ? matriz[dia][mes] : null;
        html += '<td class="num">' + (valorCel !== null ? valorCel.toLocaleString('pt-BR', {maximumFractionDigits:1}) : '') + '</td>';
      }
      html += '</tr>';
    }
    html += '<tr style="font-weight:700; background:var(--paper-2);"><td>TOTAL</td>';
    for(var mt = 1; mt <= 12; mt++){
      html += '<td class="num">' + (totalPorMes[mt] ? totalPorMes[mt].toLocaleString('pt-BR', {maximumFractionDigits:1}) : '') + '</td>';
    }
    html += '</tr>';
    html += '<tr style="font-weight:700;"><td>MÉDIA</td>';
    for(var md = 1; md <= 12; md++){
      var media = totalPorMes[md] ? (totalPorMes[md] / diasNoMes(md)) : null;
      html += '<td class="num">' + (media !== null ? media.toLocaleString('pt-BR', {maximumFractionDigits:1}) : '') + '</td>';
    }
    html += '</tr>';
    html += '</tbody></table></div>';
    return html;
  }

            linhasInsumos.push({data: o.data, tipo: o.tipo, produtoId: pp.produtoId, dose: pp.dose, qtd: (Number(pp.quantidade) || 0) * fr, un: unidadeProduto(pp.produtoId) || pp.unidade || '', area: areaSafraOp, alvo: o.alvo || '', receituario: o.receituario || '', maquinas: (o.maquinas || []).map(function(m){ return nomePatrimonio(m.patrimonioId); }).join(', '), custo: o.custear === false ? 0 : (Number(pp.custoTotal) || 0) * fr});
          });
        });
        html += '<p style="font-size:12.5px; font-weight:600; margin:14px 0 6px;">Insumos aplicados (' + linhasInsumos.length + ')</p>';
        if(!linhasInsumos.length){
          html += '<p style="font-size:12px; color:var(--ink-soft);">Nenhum insumo vinculado a essa safra no Diário de Campo.</p>';
        } else {
          html += '<div class="table-wrap"><table><thead><tr><th>Data</th><th>Atividade</th><th>Produto</th><th>Dose/ha</th><th>Quantidade</th><th>Área</th><th>Alvo</th><th>Receituário</th><th>Máquinas</th><th>Custo</th></tr></thead><tbody>';
          linhasInsumos.sort(function(a,b){ return (a.data||'').localeCompare(b.data||''); }).forEach(function(li){

            html += '<td class="num">' + (li.dose ? fmtNum(li.dose) + ' ' + escapeHtml(li.un) : '—') + '</td><td class="num">' + fmtNum(Math.round(li.qtd * 1000) / 1000) + ' ' + escapeHtml(li.un) + '</td>';
            html += '<td class="num">' + (li.area ? fmtHa(li.area) : '—') + '</td><td>' + escapeHtml(li.alvo || '—') + '</td><td>' + escapeHtml(li.receituario || '—') + '</td><td style="font-size:12px;">' + escapeHtml(li.maquinas || '—') + '</td><td class="num cost">' + (li.custo ? fmtBRL(li.custo) : '—') + '</td></tr>';
          });
          html += '</tbody></table></div>';
        }
        var custoInsR = custoInsumosSafra(safraRastreio.id), custoMaqR = custoMaquinasSafra(safraRastreio.id);
        if(custoInsR || custoMaqR) html += '<p style="font-size:11.5px; margin:6px 0 0;">Custo de insumos aplicados: <strong>' + fmtBRL(custoInsR) + '</strong> · Máquinas (horas × custo/hora): <strong>' + fmtBRL(custoMaqR) + '</strong> — já incluídos no resumo financeiro abaixo.</p>';

        var entradasRastreio = state.producao.filter(function(p){ return p.safraId === safraRastreio.id && p.tipo === 'entrada'; });
        html += '<p style="font-size:12.5px; font-weight:600; margin:14px 0 6px;">Colheita (' + entradasRastreio.length + ' registro(s))</p>';
        if(!entradasRastreio.length){
          html += '<p style="font-size:12px; color:var(--ink-soft);">Nenhuma colheita registrada ainda pra essa safra.</p>';
        } else {
          html += '<div class="table-wrap"><table><thead><tr><th>Data</th><th>Quantidade</th><th>Umidade</th><th>Local</th></tr></thead><tbody>';
          entradasRastreio.slice().sort(function(a,b){ return (a.data||'').localeCompare(b.data||''); }).forEach(function(p){
            html += '<tr><td>' + fmtDate(p.data) + '</td><td class="num">' + fmtNum(p.quantidade) + (p.unidade ? ' ' + escapeHtml(p.unidade) : '') + '</td><td class="num">' + (p.umidade ? fmtNum(p.umidade) + '%' : '—') + '</td><td>' + (p.localArmazenagem ? escapeHtml(p.localArmazenagem) : '—') + '</td></tr>';
          });

        var saidasRastreio = state.producao.filter(function(p){ return p.safraId === safraRastreio.id && p.tipo === 'saida'; });
        html += '<p style="font-size:12.5px; font-weight:600; margin:14px 0 6px;">Vendas (' + saidasRastreio.length + ' registro(s))</p>';
        if(!saidasRastreio.length){
          html += '<p style="font-size:12px; color:var(--ink-soft);">Nenhuma venda registrada ainda pra essa safra.</p>';
        } else {
          html += '<div class="table-wrap"><table><thead><tr><th>Data</th><th>Comprador</th><th>Quantidade</th><th>Preço unit.</th><th>Valor</th></tr></thead><tbody>';
          saidasRastreio.slice().sort(function(a,b){ return (a.data||'').localeCompare(b.data||''); }).forEach(function(p){
            html += '<tr><td>' + fmtDate(p.data) + '</td><td>' + (p.parceiroId ? escapeHtml(parceiroNome(p.parceiroId)) : '—') + '</td><td class="num">' + fmtNum(p.quantidade) + (p.unidade ? ' ' + escapeHtml(p.unidade) : '') + '</td><td class="num">' + fmtBRL(p.precoUnitario) + '</td><td class="num growth">' + fmtBRL((Number(p.quantidade)||0) * (Number(p.precoUnitario)||0)) + '</td></tr>';

        var custoSafraRastreio = custoDiretoSafra(safraRastreio.id);
        var receitaSafraRastreio = receitaDiretaSafra(safraRastreio.id);
        var qtdLancSafraRastreio = qtdLancamentosSafra(safraRastreio.id);
        html += '<p style="font-size:12.5px; font-weight:600; margin:14px 0 6px;">Resumo financeiro da safra (só esse talhão)</p>';

        var lavRastreio = lavouraPorId(safraRastreio.lavouraId);
        var safrasLavRastreio = lavRastreio ? safrasDaLavoura(lavRastreio.id) : [];
        if(safrasLavRastreio.length > 1){
          var custoLavR = safrasLavRastreio.reduce(function(sm, sf){ return sm + custoDiretoSafra(sf.id); }, 0);
          var receitaLavR = safrasLavRastreio.reduce(function(sm, sf){ return sm + receitaDiretaSafra(sf.id); }, 0);

        }

        if(soltosTalhaoRastreio > 0){

        }
        html += '</div>';
      }
      html += '<div class="paper note-box">A rastreabilidade junta, numa visão só, tudo que já está espalhado pelo sistema: o que foi aplicado (Diário de Campo), o que foi colhido (Colheita) e pra quem foi vendido (Colheita → Venda) — útil pra comprovar a cadeia produtiva pra compradores ou certificações.</div>';
    }
    } // fim da secao rastreabilidade

    el.innerHTML = html;
  }

  /* ---------------- Funcionários (equipe) ---------------- */

  /* ---------------- Rentabilidade ---------------- */
  function talhoesDoLancamento(f){
    if(f.talhoesIds && f.talhoesIds.length) return f.talhoesIds;
    if(f.talhaoId) return [f.talhaoId];
    return [];
  }
  // Partes de um lançamento: [{talhaoId, safraId, valor}]. Lançamentos rateados guardam "partes" (um registro só, várias fatias);
  // os antigos sem "partes" dividem o valor igualmente entre os talhões marcados.
  function partesDoLancamento(r){
    if(r.partes && r.partes.length) return r.partes;
    var total = Number(r.valor) || 0;
    var ts = talhoesDoLancamento(r);
    if(!ts.length) return [{talhaoId:'', safraId: r.safraId || '', valor: total}];
    return ts.map(function(t){ return {talhaoId: t, safraId: ts.length === 1 ? (r.safraId || '') : '', valor: total / ts.length}; });
  }
  function valorDoTalhaoNoLancamento(r, talhaoId){
    return partesDoLancamento(r).reduce(function(s, pt){ return pt.talhaoId === talhaoId ? s + (Number(pt.valor) || 0) : s; }, 0);
  }
  function custosFinanceiroPorTalhao(talhaoId){
    return state.financeiro.filter(function(f){ return f.tipo === 'custo' && (f.status || 'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + valorDoTalhaoNoLancamento(f, talhaoId); }, 0);
  }
  function receitasFinanceiroPorTalhao(talhaoId){
    return state.financeiro.filter(function(f){ return f.tipo === 'receita' && (f.status || 'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + valorDoTalhaoNoLancamento(f, talhaoId); }, 0);
  }
  function contasPagarPagasPorTalhao(talhaoId){
    return state.contasPagar.filter(function(c){ return c.status === 'Pago'; }).reduce(function(s,c){ return s + valorDoTalhaoNoLancamento(c, talhaoId); }, 0);
  }

  /* ---------------- Lavouras (cultura + ano agrícola, em um ou vários talhões) ---------------- */
  // Cada registro de "safras" continua sendo o talhão dentro de uma lavoura (talhão × cultura × ano).
  // A lavoura agrupa todas as safras com a mesma cultura e o mesmo ano agrícola.
  function normalizarAnoAgricola(ano){ return (ano || '').replace(/\s+/g, ''); }
  function chaveLavoura(culturaId, ano){ return (culturaId || '') + '::' + normalizarAnoAgricola(ano); }
  function sincronizarLavouras(){
    if(!Array.isArray(state.lavouras)) state.lavouras = [];
    var mudouLav = false, mudouSafras = false;
    var porChave = {};
    state.lavouras.forEach(function(l){ porChave[chaveLavoura(l.culturaId, l.anoAgricola)] = porChave[chaveLavoura(l.culturaId, l.anoAgricola)] || l; });
    state.safras.forEach(function(s){
      var chave = chaveLavoura(s.culturaId, s.anoAgricola);
      var lav = porChave[chave];
      if(!lav){
        lav = {id: 'lav-' + uid(), culturaId: s.culturaId, anoAgricola: normalizarAnoAgricola(s.anoAgricola), nome: '', encerrada: false, criadoEm: Date.now()};
        state.lavouras.push(lav); porChave[chave] = lav; mudouLav = true;
      }
      if(s.lavouraId !== lav.id){ s.lavouraId = lav.id; mudouSafras = true; }
    });
    var usadas = {};
    state.safras.forEach(function(s){ usadas[s.lavouraId] = true; });
    var antes = state.lavouras.length;
    state.lavouras = state.lavouras.filter(function(l){ return usadas[l.id]; });
    if(state.lavouras.length !== antes) mudouLav = true;
    if(mudouLav) saveKey('lavouras', state.lavouras);
    if(mudouSafras) saveKey('safras', state.safras);
  }
  function lavouraPorId(id){ return (state.lavouras || []).find(function(l){ return l.id === id; }) || null; }
  function safrasDaLavoura(lavouraId){ return state.safras.filter(function(s){ return s.lavouraId === lavouraId; }); }
  function lavouraLabel(lavouraId){
    var l = lavouraPorId(lavouraId);
    if(!l) return '—';
    var base = culturaNome(l.culturaId) + (l.anoAgricola ? ' ' + l.anoAgricola : '');
    return l.nome ? l.nome + ' (' + base + ')' : base;
  }
  function areaPlantadaSafra(s){
    if(!s) return 0;
    var a = Number(s.areaPlantada);
    if(a > 0) return a;
    var t = state.talhoes.find(function(x){ return x.id === s.talhaoId; });
    return t ? (Number(t.area) || 0) : 0;
  }
  function areaPlantadaLavoura(lavouraId){ return safrasDaLavoura(lavouraId).reduce(function(s, sf){ return s + areaPlantadaSafra(sf); }, 0); }
  function statusLavoura(l){
    if(!l) return 'planejada';
    if(l.encerrada) return 'encerrada';
    var sfs = safrasDaLavoura(l.id);
    if(sfs.length && sfs.every(function(s){ return s.status === 'colhida'; })) return 'colhida';
    if(sfs.some(function(s){ return s.status === 'andamento' || s.status === 'colhida'; })) return 'andamento';
    return 'planejada';
  }
  var STATUS_LAVOURA_LABEL = {planejada:'Planejada', andamento:'Plantada / em andamento', colhida:'Colhida', encerrada:'Encerrada'};
  function lavourasSelecionaveis(incluirId){
    var ordem = {andamento:0, planejada:1, colhida:2, encerrada:3};
    return (state.lavouras || []).filter(function(l){ return l.id === incluirId || (!l.encerrada && safrasDaLavoura(l.id).some(function(s){ return s.ativa !== false; })); })
      .slice().sort(function(a,b){
        var d = ordem[statusLavoura(a)] - ordem[statusLavoura(b)];
        if(d) return d;
        return (b.anoAgricola || '').localeCompare(a.anoAgricola || '') || lavouraLabel(a.id).localeCompare(lavouraLabel(b.id), 'pt-BR');
      });
  }

  /* ---------------- Destino de lançamentos ---------------- */
  // lavoura = ligado a uma safra (talhão dentro de uma lavoura); talhao = custo do talhão sem cultura; geral = custo geral da fazenda
  // estoque/financiamento = automáticos que não são custo de lavoura; classificar = antigos ainda sem destino
  function destinoEfetivo(r){
    if(r.destino) return r.destino;
    if(r.partes && r.partes.length) return 'lavoura';
    var qtdTalhoesR = talhoesDoLancamento(r).length;
    // Antigos marcados em vários talhões mas com UMA safra só são ambíguos: ficam "a classificar" até o usuário decidir
    if(r.safraId) return qtdTalhoesR > 1 ? 'classificar' : 'lavoura';
    var temTalhao = qtdTalhoesR > 0;
    if(!temTalhao && (r.origem === 'compra' || r.origem === 'nfe')) return 'estoque';
    if(!temTalhao && r.origem === 'financiamento') return 'financiamento';
    return 'classificar';
  }
  var DESTINO_LABEL = {lavoura:'Lavoura', talhao:'Só talhão', geral:'Geral da fazenda', maquina:'Máquina / equipamento', estoque:'Estoque', financiamento:'Financiamento', classificar:'A classificar'};
  function destinoCelulaHtml(r){
    var d = destinoEfetivo(r);
    if(d === 'lavoura'){
      var lavs = [], semLav = [];
      partesDoLancamento(r).forEach(function(pt){
        var sf = pt.safraId ? state.safras.find(function(sx){ return sx.id === pt.safraId; }) : null;
        if(sf){ var lb = lavouraLabel(sf.lavouraId); if(lavs.indexOf(lb) === -1) lavs.push(lb); }
        else if(pt.talhaoId) semLav.push(talhaoNome(pt.talhaoId));
      });
      return (lavs.length ? escapeHtml(lavs.join(', ')) : '—') + (semLav.length ? '<br><span style="font-size:11px; color:var(--ink-soft);">+ só talhão: ' + escapeHtml(semLav.join(', ')) + '</span>' : '');
    }
    if(d === 'maquina') return '🚜 ' + escapeHtml((r.maquinasIds || []).map(nomePatrimonio).join(', ') || '—');
    if(d === 'classificar') return '<span class="badge" style="background:#DFA84E; color:#1B1508; white-space:nowrap;">⚠️ A classificar</span>';
    return '<span style="font-size:12px; color:var(--ink-soft);">' + DESTINO_LABEL[d] + '</span>';
  }

  function patrimonioParaDestino(){
    var ordemCat = {'Máquina':0, 'Veículo':1, 'Outro':2, 'Benfeitoria':3};
    return state.patrimonio.slice().sort(function(a,b){
      var d = (ordemCat[a.categoria] !== undefined ? ordemCat[a.categoria] : 2) - (ordemCat[b.categoria] !== undefined ? ordemCat[b.categoria] : 2);
      return d || (a.nome || '').localeCompare(b.nome || '', 'pt-BR');
    });
  }
  // Custos pagos lançados com destino "Máquina / equipamento" para um item do Patrimônio (dividido igualmente se marcou vários)
  function custosDaMaquina(patrimonioId){
    var soma = 0, qtd = 0;
    var somar = function(r, pago){
      if(!pago || destinoEfetivo(r) !== 'maquina') return;
      var ms = r.maquinasIds || [];
      if(ms.indexOf(patrimonioId) === -1) return;
      soma += (Number(r.valor) || 0) / ms.length; qtd++;
    };
    state.financeiro.forEach(function(f){ somar(f, f.tipo === 'custo' && (f.status || 'Pago') !== 'Pendente'); });
    state.contasPagar.forEach(function(c){ somar(c, c.status === 'Pago'); });
    return {valor: soma, qtd: qtd};
  }

  /* ---------------- Custos/receitas diretos de safra e lavoura ---------------- */
  function somaValorPago(lista, tipo){
    return lista.filter(function(f){ return f.tipo === tipo && (f.status || 'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + (Number(f.valor)||0); }, 0);
  }
  function valorDaSafraNoLancamento(r, safraId){
    if(destinoEfetivo(r) !== 'lavoura') return 0;
    return partesDoLancamento(r).reduce(function(s, pt){ return pt.safraId === safraId ? s + (Number(pt.valor) || 0) : s; }, 0);
  }
  function lancamentoTemSafra(r, safraId){
    return destinoEfetivo(r) === 'lavoura' && partesDoLancamento(r).some(function(pt){ return pt.safraId === safraId; });
  }
  function custoDiretoSafra(safraId){
    var fin = state.financeiro.filter(function(f){ return f.tipo === 'custo' && (f.status || 'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + valorDaSafraNoLancamento(f, safraId); }, 0);
    var cp = state.contasPagar.filter(function(c){ return c.status === 'Pago'; }).reduce(function(s,c){ return s + valorDaSafraNoLancamento(c, safraId); }, 0);
    return fin + cp + custoInsumosSafra(safraId) + custoMaquinasSafra(safraId);
  }
  function receitaDiretaSafra(safraId){
    var fin = state.financeiro.filter(function(f){ return f.tipo === 'receita' && (f.status || 'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + valorDaSafraNoLancamento(f, safraId); }, 0);
    var cr = state.contasReceber.filter(function(c){ return c.safraId === safraId && c.status === 'Recebido'; }).reduce(function(s,c){ return s + valorLiquidoContaReceber(c); }, 0);
    return fin + cr;
  }
  function qtdLancamentosSafra(safraId){
    return state.operacoes.filter(function(o){ return fracaoOperacaoNaSafra(o, safraId) > 0 && (produtosDaOperacao(o).length || (o.maquinas || []).length); }).length + state.financeiro.filter(function(f){ return lancamentoTemSafra(f, safraId); }).length + state.contasPagar.filter(function(c){ return lancamentoTemSafra(c, safraId); }).length;
  }
  // Custos pagos do talhão que ainda não têm destino definido (nem safra, nem "só talhão", nem "geral")
  function custosSemDestinoDoTalhao(talhaoId){
    var fin = state.financeiro.filter(function(f){ return f.tipo === 'custo' && (f.status || 'Pago') !== 'Pendente' && destinoEfetivo(f) === 'classificar'; }).reduce(function(s,f){ return s + valorDoTalhaoNoLancamento(f, talhaoId); }, 0);
    var cp = state.contasPagar.filter(function(c){ return c.status === 'Pago' && destinoEfetivo(c) === 'classificar'; }).reduce(function(s,c){ return s + valorDoTalhaoNoLancamento(c, talhaoId); }, 0);
    return fin + cp;
  }

  /* ---------------- Rateio de custos gerais por área × tempo ---------------- */
  // Período de uma safra: plantio → previsão de colheita (ou última colheita); se faltar, usa o ano agrícola
  function periodoAnoAgricola(ano){
    var m = normalizarAnoAgricola(ano).match(/^(\d{4})(?:\/(\d{2,4}))?$/);
    if(!m) return null;
    var a1 = parseInt(m[1], 10);
    var a2 = m[2] ? parseInt(m[2].length === 2 ? String(a1).slice(0,2) + m[2] : m[2], 10) : a1;
    if(a2 > a1) return {inicio: a1 + '-07-01', fim: a2 + '-06-30'};
    return {inicio: a1 + '-01-01', fim: a1 + '-12-31'};
  }
  // Fica sempre dentro do ano agrícola (café plantado em 2015 não "ocupa" a terra desde 2015 na safra 2026/2027)
  function periodoSafra(s){
    var anoP = periodoAnoAgricola(s.anoAgricola);
    var inicio = s.dataPlantio || (anoP ? anoP.inicio : '');
    var fim = s.previsaoColheita || '';
    if(!fim){
      state.producao.forEach(function(p){ if(p.safraId === s.id && p.tipo === 'entrada' && p.data && p.data > fim) fim = p.data; });
    }
    if(!fim) fim = anoP ? anoP.fim : '';
    if(anoP){
      if(!inicio || inicio < anoP.inicio || inicio > anoP.fim) inicio = anoP.inicio;
      if(!fim || fim > anoP.fim) fim = anoP.fim;
    }
    if(!inicio || !fim) return null;
    if(fim < inicio) fim = anoP ? anoP.fim : inicio;
    return {inicio: inicio, fim: fim};
  }
  function mesesEntre(inicio, fim){
    var lista = [];
    var y = parseInt(inicio.slice(0,4),10), m = parseInt(inicio.slice(5,7),10);
    var yf = parseInt(fim.slice(0,4),10), mf = parseInt(fim.slice(5,7),10);
    while(y < yf || (y === yf && m <= mf)){
      lista.push(y + '-' + (m < 10 ? '0' : '') + m);
      m++; if(m > 12){ m = 1; y++; }
    }
    return lista;
  }
  // mapa mês (AAAA-MM) → [{safraId, area}] das safras ativas naquele mês
  function mapaSafrasAtivasPorMes(){
    var mapa = {};
    state.safras.forEach(function(s){
      var p = periodoSafra(s);
      if(!p) return;
      var area = areaPlantadaSafra(s);
      if(area <= 0) return;
      mesesEntre(p.inicio, p.fim).forEach(function(ym){ (mapa[ym] = mapa[ym] || []).push({safraId: s.id, area: area}); });
    });
    return mapa;
  }
  // Custos gerais (destino "geral", pagos) rateados entre as safras ativas no mês, pela área plantada
  function rateioCustosGeraisPorSafra(){
    var mapa = mapaSafrasAtivasPorMes();
    var porSafra = {}, naoAlocado = 0;
    var itens = [];
    // custos gerais entram inteiros; de máquina, só a parte de máquinas SEM horas registradas
    // (máquinas com horas já entram na safra pelo custo/hora real, via Diário de Campo e Colheita)
    var valorRateavel = function(r){
      var d = destinoEfetivo(r);
      if(d === 'geral') return Number(r.valor) || 0;
      if(d !== 'maquina') return 0;
      var ms = r.maquinasIds || [];
      if(!ms.length) return 0;
      return ms.filter(function(mid){ return horasTotaisMaquina(mid) <= 0; }).length * (Number(r.valor) || 0) / ms.length;
    };
    state.financeiro.forEach(function(f){ if(f.tipo === 'custo' && (f.status||'Pago') !== 'Pendente'){ var v = valorRateavel(f); if(v) itens.push({valor: v, data: f.data || f.vencimento || ''}); } });
    state.contasPagar.forEach(function(c){ if(c.status === 'Pago'){ var v = valorRateavel(c); if(v) itens.push({valor: v, data: c.dataPagamento || c.vencimento || ''}); } });
    itens.forEach(function(it){
      var ativas = it.data ? (mapa[it.data.slice(0,7)] || []) : [];
      var areaAtiva = ativas.reduce(function(s,a){ return s + a.area; }, 0);
      if(areaAtiva <= 0){ naoAlocado += it.valor; return; }
      ativas.forEach(function(a){ porSafra[a.safraId] = (porSafra[a.safraId]||0) + it.valor * a.area / areaAtiva; });
    });
    return {porSafra: porSafra, naoAlocado: naoAlocado};
  }
  // Depreciação / custo de oportunidade: valor anual ÷ 12 por mês ativo, proporcional à área plantada ÷ área total da fazenda
  // Se duas safras ocupam o mesmo talhão no mesmo mês (ex.: milho safrinha terminando e soja começando), dividem aquele mês entre si
  function custosFixosPorSafra(valorAnual){
    var areaTotal = areaTotalFazenda();
    var res = {};
    if(areaTotal <= 0 || !valorAnual) return res;
    var ocupacao = {};
    var periodos = {};
    state.safras.forEach(function(s){
      var p = periodoSafra(s); if(!p) return;
      periodos[s.id] = mesesEntre(p.inicio, p.fim);
      periodos[s.id].forEach(function(ym){ var k = s.talhaoId + '|' + ym; ocupacao[k] = (ocupacao[k] || 0) + 1; });
    });
    state.safras.forEach(function(s){
      if(!periodos[s.id]) return;
      var area = areaPlantadaSafra(s);
      res[s.id] = periodos[s.id].reduce(function(sm, ym){ return sm + valorAnual / 12 * area / areaTotal / ocupacao[s.talhaoId + '|' + ym]; }, 0);
    });
    return res;
  }
  function contasReceberRecebidasPorTalhao(talhaoId){
    return state.contasReceber.filter(function(c){ return c.status === 'Recebido' && c.talhaoId === talhaoId; }).reduce(function(s,c){ return s + valorLiquidoContaReceber(c); }, 0);
  }
  function custosTotaisPorTalhao(talhaoId){ return custosFinanceiroPorTalhao(talhaoId) + contasPagarPagasPorTalhao(talhaoId); }
  function receitasTotaisPorTalhao(talhaoId){ return receitasFinanceiroPorTalhao(talhaoId) + contasReceberRecebidasPorTalhao(talhaoId); }
  function producaoTotalEmSacas(safraIds){
    var totalSc = 0;
    state.producao.forEach(function(p){
      if(p.tipo !== 'entrada' || safraIds.indexOf(p.safraId) === -1) return;
      var conv = converterKgSc(Number(p.quantidade) || 0, p.unidade);
      totalSc += (conv.sc !== null) ? conv.sc : (Number(p.quantidade) || 0);
    });
    return totalSc;
  }

  function produtividadeRealSafra(safraId){
    var safra = state.safras.find(function(s){ return s.id === safraId; });
    if(!safra) return null;
    var talhao = state.talhoes.find(function(t){ return t.id === safra.talhaoId; });
    var area = talhao ? Number(talhao.area) || 0 : 0;
    if(area <= 0) return null;
    var totalSc = producaoTotalEmSacas([safraId]);
    return totalSc > 0 ? totalSc / area : null;
  }

  function historicoTalhao(talhaoId, safraIdExcluir){
    var safrasDoTalhao = state.safras.filter(function(s){ return s.talhaoId === talhaoId && s.id !== safraIdExcluir; });
    var produtividades = [];
    var custosHa = [];
    safrasDoTalhao.forEach(function(s){
      var prod = produtividadeRealSafra(s.id);
      if(prod !== null) produtividades.push(prod);
      var area = areaPlantadaSafra(s);
      if(area > 0 && qtdLancamentosSafra(s.id) > 0){
        custosHa.push(custoDiretoSafra(s.id) / area);
      }
    });
    var mediaProdutividade = produtividades.length ? produtividades.reduce(function(a,b){ return a+b; },0) / produtividades.length : null;
    var mediaCustoHa = custosHa.length ? custosHa.reduce(function(a,b){ return a+b; },0) / custosHa.length : null;
    return {mediaProdutividade: mediaProdutividade, mediaCustoHa: mediaCustoHa, qtdSafras: safrasDoTalhao.length};
  }

  function chuvaAcumuladaPeriodo(propriedadeId, dataFinalStr, dias){
    var dataFinal = new Date(dataFinalStr + 'T00:00:00');
    var dataInicial = new Date(dataFinal.getTime() - (dias - 1) * 86400000);
    var soma = 0;
    state.chuvas.forEach(function(c){
      if(c.propriedadeId !== propriedadeId || !c.data) return;
      var d = new Date(c.data + 'T00:00:00');
      if(d >= dataInicial && d <= dataFinal) soma += Number(c.mm) || 0;
    });
    return soma;
  }

  function maiorVeranico(propriedadeId, dataInicioStr, dataFimStr, limiteMm){
    limiteMm = limiteMm === undefined ? 1 : limiteMm;
    var mapaChuva = {};
    state.chuvas.forEach(function(c){ if(c.propriedadeId === propriedadeId) mapaChuva[c.data] = Number(c.mm) || 0; });
    var dataAtual = new Date(dataInicioStr + 'T00:00:00');
    var dataFim = new Date(dataFimStr + 'T00:00:00');
    var maiorSequencia = 0, sequenciaAtual = 0, sequenciaAteFim = 0;
    while(dataAtual <= dataFim){
      var chaveDia = dataAtual.toISOString().slice(0,10);
      var mmDia = mapaChuva.hasOwnProperty(chaveDia) ? mapaChuva[chaveDia] : null;
      if(mmDia !== null && mmDia < limiteMm){
        sequenciaAtual++;
        if(sequenciaAtual > maiorSequencia) maiorSequencia = sequenciaAtual;
      } else if(mmDia !== null){
        sequenciaAtual = 0;
      }
      dataAtual = new Date(dataAtual.getTime() + 86400000);
    }
    sequenciaAteFim = sequenciaAtual;
    return {maiorSequencia: maiorSequencia, sequenciaAteFim: sequenciaAteFim};
  }

  function climatologiaMesPropriedade(propriedadeId, mes){
    var propNome = state.propriedades.find(function(p){ return p.id === propriedadeId; });
    if(propNome && typeof CLIMATOLOGIA_INMET_ABATIA !== 'undefined' && propNome.nome.trim().toLowerCase() === CLIMATOLOGIA_ABATIA_PROPRIEDADE_NOME){
      return CLIMATOLOGIA_INMET_ABATIA[mes] || null;
    }
    var totaisPorAno = {};
    state.chuvas.forEach(function(c){
      if(c.propriedadeId !== propriedadeId || !c.data) return;
      var partes = c.data.split('-');
      if(parseInt(partes[1],10) !== mes) return;
      var ano = partes[0];
      totaisPorAno[ano] = (totaisPorAno[ano]||0) + (Number(c.mm)||0);
    });
    var valores = Object.keys(totaisPorAno).map(function(a){ return totaisPorAno[a]; });
    return valores.length ? valores.reduce(function(a,b){return a+b;},0) / valores.length : null;
  }

  function renderFluxoCaixa(){

        if(e.realizado) buckets[ym].entradaReal += e.valor; else buckets[ym].entradaPrev += e.valor;

    var saldoProjetadoFinal = saldoRealizado + totalPendenteReceber - totalPendentePagar;
    var estoque = estoqueResumo();

    var html = '<div class="stat-row">';
    html += statCard('Saldo realizado', fmtBRL(saldoRealizado), saldoRealizado >= 0 ? 'growth' : 'cost');
    html += statCard('A receber (pendente)', fmtBRL(totalPendenteReceber), 'growth');
    html += statCard('A pagar (pendente)', fmtBRL(totalPendentePagar), 'cost');
    html += statCard('Saldo projetado', fmtBRL(saldoProjetadoFinal), saldoProjetadoFinal >= 0 ? 'growth' : 'cost');
    html += '</div>';

    html += '<div class="paper note-box" style="margin-top:-8px; margin-bottom:16px;">Esta projeção não inclui o valor da produção em estoque (' + fmtBRL(estoque.total) + '), que ainda não tem data prevista de venda — acompanhe em Estoque de Colheita, ou lance a venda em Contas a Receber quando houver data.</div>';

    if(!months.length){
      html += '<div class="paper empty-state">Nenhum lançamento com data para projetar o fluxo de caixa ainda.</div>';
    } else {
      html += '<div class="paper table-wrap"><table><thead><tr><th>Mês</th><th>Entradas realizadas</th><th>Saídas realizadas</th><th>Entradas previstas</th><th>Saídas previstas</th><th>Saldo do mês</th><th>Saldo acumulado</th></tr></thead><tbody>';
      var acumulado = 0;
      months.forEach(function(ym){
        var b = buckets[ym];
        var saldoMes = (b.entradaReal + b.entradaPrev) - (b.saidaReal + b.saidaPrev);
        acumulado += saldoMes;
        html += '<tr>';
        html += '<td>' + monthLabel(ym) + '</td>';
        html += '<td class="num growth">' + fmtBRL(b.entradaReal) + '</td>';
        html += '<td class="num cost">' + fmtBRL(b.saidaReal) + '</td>';
        html += '<td class="num growth">' + fmtBRL(b.entradaPrev) + '</td>';
        html += '<td class="num cost">' + fmtBRL(b.saidaPrev) + '</td>';
        html += '<td class="num ' + (saldoMes >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(saldoMes) + '</td>';
        html += '<td class="num ' + (acumulado >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(acumulado) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }
    el.innerHTML = html;
  }

  /* ---------------- Conta-Corrente por Parceiro ---------------- */
  var contaCorrenteParceiroId = '';

  function renderContaCorrente(){

    html += '<div class="paper form-card"><h3>Selecionar parceiro</h3>';
    html += '<div class="entry-form">';
    html += selectField('cc-parceiro', 'Parceiro', [{value:'', label:'Todos os parceiros (resumo)'}].concat(state.parceiros.map(function(p){ return {value:p.id, label:p.nome}; })), contaCorrenteParceiroId);

      html += '<div class="paper empty-state">Nenhum parceiro cadastrado ainda.</div>';
      el.innerHTML = html;
      return;
    }

    if(!contaCorrenteParceiroId){
      var resumo = {};
      state.financeiro.forEach(function(f){
        if(!f.parceiroId) return;
        if(!resumo[f.parceiroId]) resumo[f.parceiroId] = {pago:0, recebido:0, pendenteAPagar:0, pendenteAReceber:0};
        var st = f.status || 'Pago';
        var valor = Number(f.valor) || 0;
        if(f.tipo === 'custo'){
          if(st === 'Pago') resumo[f.parceiroId].pago += valor; else resumo[f.parceiroId].pendenteAPagar += valor;
        } else {
          if(st === 'Pago') resumo[f.parceiroId].recebido += valor; else resumo[f.parceiroId].pendenteAReceber += valor;
        }
      });
      var idsComMovimento = Object.keys(resumo);
      if(!idsComMovimento.length){
        html += '<div class="paper empty-state">Nenhum lançamento vinculado a um parceiro ainda. Vincule parceiros nos Lançamentos para ver o extrato aqui.</div>';
      } else {
        html += '<div class="paper table-wrap"><table><thead><tr><th>Parceiro</th><th>Total pago</th><th>Total recebido</th><th>Saldo</th><th>A pagar (pendente)</th><th>A receber (pendente)</th></tr></thead><tbody>';
        idsComMovimento
          .sort(function(a,b){ return parceiroNome(a).localeCompare(parceiroNome(b)); })
          .forEach(function(pid){
            var r = resumo[pid];
            var saldo = r.recebido - r.pago;
            html += '<tr>';
            html += '<td>' + escapeHtml(parceiroNome(pid)) + '</td>';
            html += '<td class="num cost">' + fmtBRL(r.pago) + '</td>';
            html += '<td class="num growth">' + fmtBRL(r.recebido) + '</td>';
            html += '<td class="num ' + (saldo >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(saldo) + '</td>';
            html += '<td class="num">' + fmtBRL(r.pendenteAPagar) + '</td>';
            html += '<td class="num">' + fmtBRL(r.pendenteAReceber) + '</td>';
            html += '</tr>';
          });
        html += '</tbody></table></div>';
      }
    } else {
      var lancamentos = state.financeiro.filter(function(f){ return f.parceiroId === contaCorrenteParceiroId; });
      var totalPago = lancamentos.filter(function(f){ return f.tipo === 'custo' && (f.status||'Pago') === 'Pago'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
      var totalRecebido = lancamentos.filter(function(f){ return f.tipo === 'receita' && (f.status||'Pago') === 'Pago'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
      var pendAPagar = lancamentos.filter(function(f){ return f.tipo === 'custo' && f.status === 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
      var pendAReceber = lancamentos.filter(function(f){ return f.tipo === 'receita' && f.status === 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
      var saldoParc = totalRecebido - totalPago;

      html += '<div class="stat-row">';
      html += statCard('Total pago a este parceiro', fmtBRL(totalPago), 'cost');
      html += statCard('Total recebido dele', fmtBRL(totalRecebido), 'growth');
      html += statCard('Saldo', fmtBRL(saldoParc), saldoParc >= 0 ? 'growth' : 'cost');
      html += statCard('Pendente a pagar', fmtBRL(pendAPagar));
      html += statCard('Pendente a receber', fmtBRL(pendAReceber));
      html += '</div>';

      if(!lancamentos.length){
        html += '<div class="paper empty-state">Nenhum lançamento vinculado a este parceiro ainda.</div>';
      } else {
        html += '<div class="paper table-wrap"><table><thead><tr><th>Data/Venc.</th><th>Tipo</th><th>Conta</th><th>Descrição</th><th>Status</th><th>Valor</th></tr></thead><tbody>';
        lancamentos.slice().sort(function(a,b){ return (b.criadoEm||0)-(a.criadoEm||0); }).forEach(function(f){
          var st = f.status || 'Pago';
          html += '<tr>';
          html += '<td>' + fmtDate(st === 'Pendente' ? f.vencimento : f.data) + '</td>';
          html += '<td><span class="badge tipo-' + f.tipo + '">' + (f.tipo === 'custo' ? 'Custo' : 'Receita') + '</span></td>';
          html += '<td>' + (f.contaId ? escapeHtml(contaLabel(f.contaId)) : escapeHtml(f.categoria || '—')) + '</td>';
          html += '<td>' + escapeHtml(f.descricao || '—') + '</td>';
          html += '<td><span class="badge" style="background:' + (st === 'Pendente' ? '#DFA84E' : '#7FA36D') + '; color:#1B1508">' + st + '</span></td>';
          html += '<td class="num ' + (f.tipo === 'custo' ? 'cost' : 'growth') + '">' + (f.tipo === 'custo' ? '−' : '+') + ' ' + fmtBRL(f.valor) + '</td>';
          html += '</tr>';

    html += '<div class="paper note-box">Este extrato considera os lançamentos da aba Financeiro vinculados a um Parceiro. Contas a Pagar/Receber, Arrendamentos, Financiamentos e Serviços Prestados têm seus próprios controles e ainda não entram nesta soma.</div>';

  /* ---------------- Orçado x Realizado ---------------- */
  var orcamentoAnoSelecionado = new Date().getFullYear();

  function renderOrcamento(){
    var el = document.getElementById('tab-orcamento');
    var html = '';

    var anosDisponiveis = [];
    for(var ay = new Date().getFullYear() - 2; ay <= new Date().getFullYear() + 2; ay++) anosDisponiveis.push(ay);

    html += '<div class="paper form-card"><h3>Definir orçamento</h3>';

    html += selectField('orc-ano-view', 'Ano em análise', anosDisponiveis.map(function(a){ return {value:String(a), label:String(a)}; }), String(orcamentoAnoSelecionado));

      html += selectField('orc-conta', 'Conta', state.contasFinanceiro.map(function(c){ return {value:c.id, label: contaLabel(c.id)}; }));
      html += field('number', 'orc-valor', 'Valor orçado para o ano (R$)', false, '0,00', {step:'0.01', min:'0'});
      html += '<button type="button" class="btn" data-action="salvar-orcamento" style="align-self:end;">Salvar orçamento</button>';
    }
    html += '</div></div>';

    if(!state.contasFinanceiro.length){
      html += '<div class="paper empty-state">Cadastre contas financeiras (aba Lançamentos → botão "+" ao lado de Conta) antes de definir orçamentos.</div>';
      el.innerHTML = html;
      return;
    }

    var orcamentosDoAno = state.orcamentos.filter(function(o){ return o.ano === orcamentoAnoSelecionado; });
    var contasComMovimento = {};
    state.financeiro.forEach(function(f){
      if((f.status || 'Pago') !== 'Pago') return;
      var ano = parseInt((f.data || '').slice(0, 4), 10);
      if(ano !== orcamentoAnoSelecionado) return;
      if(!contasComMovimento[f.contaId]) contasComMovimento[f.contaId] = 0;
      contasComMovimento[f.contaId] += Number(f.valor) || 0;
    });

    var idsRelevantes = {};
    orcamentosDoAno.forEach(function(o){ idsRelevantes[o.contaId] = true; });
    Object.keys(contasComMovimento).forEach(function(cid){ idsRelevantes[cid] = true; });

    var linhas = Object.keys(idsRelevantes).map(function(cid){
      var orc = orcamentosDoAno.find(function(o){ return o.contaId === cid; });
      var orcado = orc ? orc.valorOrcado : 0;
      var realizado = contasComMovimento[cid] || 0;
      var diferenca = orcado - realizado;
      var pctUsado = orcado ? (realizado / orcado * 100) : null;
      return {contaId: cid, orcado: orcado, realizado: realizado, diferenca: diferenca, pctUsado: pctUsado, tipo: contaTipo(cid)};
    }).sort(function(a,b){ return contaLabel(a.contaId).localeCompare(contaLabel(b.contaId)); });

    if(!linhas.length){
      html += '<div class="paper empty-state">Nenhum orçamento definido nem movimento em ' + orcamentoAnoSelecionado + ' ainda.</div>';
    } else {
      html += '<div class="paper table-wrap"><table><thead><tr><th>Conta</th><th>Orçado (ano)</th><th>Realizado</th><th>Diferença</th><th>% usado</th></tr></thead><tbody>';
      linhas.forEach(function(l){
        var estourou = l.tipo === 'custo' && l.orcado > 0 && l.realizado > l.orcado;
        html += '<tr>';
        html += '<td>' + escapeHtml(contaLabel(l.contaId)) + '</td>';
        html += '<td class="num">' + (l.orcado ? fmtBRL(l.orcado) : '—') + '</td>';
        html += '<td class="num">' + fmtBRL(l.realizado) + '</td>';
        html += '<td class="num ' + (l.diferenca >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(l.diferenca) + '</td>';
        html += '<td class="num">' + (l.pctUsado !== null ? '<span class="badge" style="background:' + (estourou ? '#A23E2E' : '#7FA36D') + '; color:#fff;">' + l.pctUsado.toFixed(0) + '%</span>' : '—') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '<div class="paper note-box">"Realizado" considera só lançamentos com status "Pago" e data dentro do ano selecionado. Para despesas (custo), passar de 100% significa que já foi gasto mais do que o orçado.</div>';
    el.innerHTML = html;
  }

  /* ---------------- Relatórios (DRE por Subgrupo/Conta) ---------------- */
  function relatoriosContaStats(contaId){
    var entries = state.financeiro.filter(function(f){ return f.contaId === contaId && (f.status || 'Pago') !== 'Pendente'; });
    var valor = 0, qtd = 0;
    entries.forEach(function(f){ valor += Number(f.valor||0); qtd += Number(f.quantidade||0); });
    return {valor:valor, qtd:qtd, entries:entries, precoMedio: qtd ? valor/qtd : 0};
  }
  function fmtPct(n){ return (Number(n)||0).toLocaleString('pt-BR', {maximumFractionDigits:2}) + '%'; }

  function renderRelatorios(){
    var el = document.getElementById('tab-relatorios');
    var totalReceitas = state.financeiro.filter(function(f){ return contaTipo(f.contaId) === 'receita' && (f.status||'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
    var totalCustos = state.financeiro.filter(function(f){ return contaTipo(f.contaId) === 'custo' && (f.status||'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);

    function renderSecao(tipoSecao, totalSecao, label){
      var subgrupos = state.subgruposFinanceiro.filter(function(s){ return s.tipo === tipoSecao; }).sort(function(a,b){ return (a.criadoEm||0)-(b.criadoEm||0); });
      var corTitulo = tipoSecao === 'receita' ? 'var(--growth-dark)' : 'var(--cost-dark)';
      var html = '<div class="paper" style="padding:16px 18px; margin-bottom:16px;">';
      html += '<div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px; margin-bottom:12px;">';
      html += '<div style="font-family:\'Zilla Slab\',serif; font-size:18px; font-weight:700; color:' + corTitulo + ';">' + label + '</div>';
      html += '<div style="display:flex; gap:18px; font-size:12.5px; color:var(--ink-soft);">';
      html += '<span>Total: <strong class="num" style="color:var(--ink);">' + fmtBRL(totalSecao) + '</strong></span>';
      html += '<span>% Custo: <strong class="num">' + (tipoSecao === 'receita' ? (totalCustos ? fmtPct(totalReceitas/totalCustos*100) : '0,00%') : '100,00%') + '</strong></span>';
      html += '<span>% Receita: <strong class="num">' + (tipoSecao === 'receita' ? '100,00%' : (totalReceitas ? fmtPct(totalCustos/totalReceitas*100) : '0,00%')) + '</strong></span>';
      html += '</div></div>';

      var corpo = '';
      subgrupos.forEach(function(sg){
        var contas = state.contasFinanceiro.filter(function(c){ return c.subgrupoId === sg.id; }).sort(function(a,b){ return (a.criadoEm||0)-(b.criadoEm||0); });
        var sgValor = 0, sgQtd = 0;
        var linhasContas = '';
        contas.forEach(function(c){
          var st = relatoriosContaStats(c.id);
          if(!st.entries.length) return;
          sgValor += st.valor; sgQtd += st.qtd;
          var percC = totalCustos ? st.valor/totalCustos*100 : 0;
          var percR = totalReceitas ? st.valor/totalReceitas*100 : 0;
          linhasContas += '<tr style="font-weight:600;">';
          linhasContas += '<td style="padding-left:24px;">' + escapeHtml(c.nome) + '</td>';
          linhasContas += '<td class="num">' + (st.qtd ? fmtNum(st.qtd) : '—') + '</td>';
          linhasContas += '<td class="num">' + (st.precoMedio ? fmtBRL(st.precoMedio) : '—') + '</td>';
          linhasContas += '<td class="num ' + (tipoSecao === 'custo' ? 'cost' : 'growth') + '">' + fmtBRL(st.valor) + '</td>';
          linhasContas += '<td class="num">' + fmtPct(percC) + '</td>';
          linhasContas += '<td class="num">' + fmtPct(percR) + '</td>';
          linhasContas += '</tr>';
          st.entries.slice().sort(function(a,b){ return (b.criadoEm||0)-(a.criadoEm||0); }).forEach(function(f){
            var docLabel = f.descricao || (f.parceiroId ? parceiroNome(f.parceiroId) : 'Lançamento');
            linhasContas += '<tr style="font-size:12px; color:var(--ink-soft);">';
            linhasContas += '<td style="padding-left:40px;">' + escapeHtml(docLabel) + (f.parceiroId ? ' — ' + escapeHtml(parceiroNome(f.parceiroId)) : '') + '</td>';
            linhasContas += '<td class="num">' + (f.quantidade ? fmtNum(f.quantidade) : '—') + '</td>';
            linhasContas += '<td class="num">—</td>';
            linhasContas += '<td class="num">' + fmtBRL(f.valor) + '</td>';
            linhasContas += '<td class="num">—</td><td class="num">—</td>';
            linhasContas += '</tr>';
          });
        });
        if(!linhasContas) return;
        var percSgC = totalCustos ? sgValor/totalCustos*100 : 0;
        var percSgR = totalReceitas ? sgValor/totalReceitas*100 : 0;
        corpo += '<tr style="font-weight:700; background:var(--paper-2);">';
        corpo += '<td>' + escapeHtml(sg.nome) + '</td>';
        corpo += '<td class="num">' + (sgQtd ? fmtNum(sgQtd) : '—') + '</td>';
        corpo += '<td class="num">—</td>';
        corpo += '<td class="num ' + (tipoSecao === 'custo' ? 'cost' : 'growth') + '">' + fmtBRL(sgValor) + '</td>';
        corpo += '<td class="num">' + fmtPct(percSgC) + '</td>';
        corpo += '<td class="num">' + fmtPct(percSgR) + '</td>';
        corpo += '</tr>';
        corpo += linhasContas;
      });

      if(!corpo){
        html += '<div class="empty-state">Nenhum lançamento "Pago" nesta seção ainda.</div>';
      } else {
        html += '<div class="table-wrap"><table><thead><tr><th>Subgrupo · Conta · Documento</th><th>Qtd.</th><th>Preço méd.</th><th>Valor</th><th>%custo</th><th>%receita</th></tr></thead><tbody>';
        html += corpo;
        html += '<tr style="font-weight:700; border-top:2px solid var(--paper-line);"><td>TOTAL</td><td></td><td></td>';
        html += '<td class="num">' + fmtBRL(totalSecao) + '</td>';
        html += '<td class="num">' + (totalCustos ? fmtPct(totalSecao/totalCustos*100) : '0,00%') + '</td>';
        html += '<td class="num">' + (totalReceitas ? fmtPct(totalSecao/totalReceitas*100) : '0,00%') + '</td></tr>';
        html += '</tbody></table></div>';
      }
      html += '</div>';
      return html;
    }

    var html = '<div class="stat-row">';
    html += statCard('Total de receitas', fmtBRL(totalReceitas), 'growth');
    html += statCard('Total de despesas', fmtBRL(totalCustos), 'cost');
    html += statCard('Resultado', fmtBRL(totalReceitas - totalCustos), (totalReceitas - totalCustos) >= 0 ? 'growth' : 'cost');
    html += '</div>';
    html += renderSecao('receita', totalReceitas, 'RECEITAS');
    html += renderSecao('custo', totalCustos, 'DESPESAS');
    html += '<div class="paper note-box">Este relatório considera apenas lançamentos do Financeiro marcados como "Pago" e vinculados a uma Conta (cadastrada pelo botão "+" no formulário de Lançamentos). Contas a Pagar/Receber ainda pendentes não entram aqui — acompanhe-as nas abas próprias.</div>';
    el.innerHTML = html;
  }

  /* ---------------- Indicadores (gráficos e exportação) ---------------- */
  function financeiroPorMes(){
    var map = {};
    state.financeiro.forEach(function(f){
      if(!f.data) return;
      var ym = f.data.slice(0,7);
      if(!map[ym]) map[ym] = {custo:0, receita:0};
      map[ym][f.tipo === 'custo' ? 'custo' : 'receita'] += Number(f.valor) || 0;
    });
    var months = Object.keys(map).sort();
    return {
      labels: months.map(monthLabel),
      custos: months.map(function(m){ return map[m].custo; }),
      receitas: months.map(function(m){ return map[m].receita; })
    };
  }
  function custosPorCategoria(){
    var map = {};
    state.financeiro.filter(function(f){ return f.tipo === 'custo'; }).forEach(function(f){
      map[f.categoria] = (map[f.categoria] || 0) + Number(f.valor || 0);
    });
    var labels = Object.keys(map);
    return {labels: labels, valores: labels.map(function(l){ return map[l]; })};
  }
  function resultadoPorTalhaoChart(){
    var labels = [], valores = [], cores = [];
    state.talhoes.forEach(function(t){
      var safraIdsDoTalhao = state.safras.filter(function(s){ return s.talhaoId === t.id; }).map(function(s){ return s.id; });
      var custos = custosTotaisPorTalhao(t.id);
      var receitas = receitasTotaisPorTalhao(t.id);
      var estoqueValor = estoqueValorPorSafraIds(safraIdsDoTalhao);
      var resultado = receitas + estoqueValor - custos;
      labels.push(t.nome); valores.push(Math.round(resultado * 100) / 100); cores.push(resultado >= 0 ? '#4F7942' : '#A23E2E');
    });
    return {labels: labels, valores: valores, cores: cores};
  }
  function saldoAcumuladoMensal(){
    var events = buildCashEvents();
    var buckets = {};
    events.forEach(function(e){
      var ym = e.date.slice(0,7);
      if(!buckets[ym]) buckets[ym] = 0;
      buckets[ym] += (e.tipo === 'entrada' ? e.valor : -e.valor);
    });
    var months = Object.keys(buckets).sort();
    var acumulado = 0, serie = [];
    months.forEach(function(m){ acumulado += buckets[m]; serie.push(Math.round(acumulado * 100) / 100); });
    return {labels: months.map(monthLabel), valores: serie};
  }

  function svgEscala(valores){
    var max = Math.max.apply(null, valores.concat([0]));
    var min = Math.min.apply(null, valores.concat([0]));
    if(max === min){ max = max + 1; min = min - 1; }
    return {max: max, min: min};
  }

  function svgBarChart(labels, datasets, opts){
    opts = opts || {};
    var horizontal = !!opts.horizontal;
    var w = 640, h = 260, padL = horizontal ? 110 : 46, padR = 16, padT = 16, padB = horizontal ? 16 : 36;
    var areaW = w - padL - padR, areaH = h - padT - padB;
    var todosValores = [];
    datasets.forEach(function(ds){ todosValores = todosValores.concat(ds.data); });
    var esc = svgEscala(todosValores);
    var faixa = esc.max - esc.min || 1;

    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%; height:100%; font-family:inherit;">';
    // linha zero / eixo
    var zeroPct = (0 - esc.min) / faixa;
    if(horizontal){
      var zeroX = padL + zeroPct * areaW;
      svg += '<line x1="' + zeroX + '" y1="' + padT + '" x2="' + zeroX + '" y2="' + (padT+areaH) + '" stroke="var(--paper-line)" stroke-width="1"></line>';
    } else {
      var zeroY = padT + areaH - zeroPct * areaH;

          svg += '<rect x="' + Math.min(x0,x1) + '" y="' + barY + '" width="' + Math.abs(x1-x0) + '" height="' + barH*0.82 + '" fill="' + cor + '" rx="2"></rect>';
        });
        svg += '<text x="' + (padL-8) + '" y="' + (padT + i*grupoH + grupoH/2 + 4) + '" text-anchor="end" font-size="11" fill="var(--ink-soft)">' + escapeHtml(lab.length > 16 ? lab.slice(0,15)+'…' : lab) + '</text>';
      });

      var grupoW = areaW / n;
      labels.forEach(function(lab, i){
        datasets.forEach(function(ds, di){
          var val = ds.data[i] || 0;
          var valPct = (val - esc.min) / faixa;
          var barX = padL + i*grupoW + grupoW*0.19 + di*barW;
          var y0 = padT + areaH - zeroPct*areaH, y1 = padT + areaH - valPct*areaH;
          svg += '<rect x="' + barX + '" y="' + Math.min(y0,y1) + '" width="' + barW*0.82 + '" height="' + Math.abs(y1-y0) + '" fill="' + ds.cor + '" rx="2"></rect>';
        });
        svg += '<text x="' + (padL + i*grupoW + grupoW/2) + '" y="' + (h-padB+16) + '" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">' + escapeHtml(lab) + '</text>';
      });
    }
    svg += '</svg>';

    var legenda = '';
    if(dsCount > 1 || datasets[0].label){

      });
      legenda += '</div>';
    }
    return svg + legenda;
  }

  function svgDoughnutChart(labels, valores, cores){
    var total = valores.reduce(function(s,v){ return s + v; }, 0);
    if(total <= 0) return '<div style="padding:10px; font-size:13px; color:var(--ink-soft);">Sem valores pra mostrar.</div>';
    var cx = 110, cy = 110, rOut = 90, rIn = 52;
    var anguloAtual = -90;
    var svg = '<svg viewBox="0 0 220 220" style="width:100%; height:100%; max-height:220px;">';
    labels.forEach(function(lab, i){
      var fatia = (valores[i] / total) * 360;
      var a0 = anguloAtual * Math.PI/180, a1 = (anguloAtual+fatia) * Math.PI/180;
      var x0o = cx + rOut*Math.cos(a0), y0o = cy + rOut*Math.sin(a0);
      var x1o = cx + rOut*Math.cos(a1), y1o = cy + rOut*Math.sin(a1);
      var x0i = cx + rIn*Math.cos(a1), y0i = cy + rIn*Math.sin(a1);
      var x1i = cx + rIn*Math.cos(a0), y1i = cy + rIn*Math.sin(a0);
      var largeArc = fatia > 180 ? 1 : 0;
      var d = 'M' + x0o + ',' + y0o + ' A' + rOut + ',' + rOut + ' 0 ' + largeArc + ' 1 ' + x1o + ',' + y1o + ' L' + x0i + ',' + y0i + ' A' + rIn + ',' + rIn + ' 0 ' + largeArc + ' 0 ' + x1i + ',' + y1i + ' Z';
      svg += '<path d="' + d + '" fill="' + cores[i] + '" stroke="var(--paper)" stroke-width="1.5"><title>' + escapeHtml(lab) + '</title></path>';
      anguloAtual += fatia;
    });
    svg += '</svg>';
    var legenda = '<div style="display:flex; flex-direction:column; gap:5px; margin-top:8px; font-size:11.5px; max-height:80px; overflow-y:auto;">';
    labels.forEach(function(lab, i){
      var pct = total ? (valores[i]/total*100) : 0;
      legenda += '<span style="display:flex; align-items:center; gap:6px;"><span style="width:9px; height:9px; border-radius:2px; background:' + cores[i] + '; display:inline-block; flex:none;"></span>' + escapeHtml(lab) + ' <span style="color:var(--ink-soft); margin-left:auto;">' + fmtNum(pct) + '%</span></span>';
    });
    legenda += '</div>';
    return '<div style="display:flex; flex-direction:column; align-items:center;">' + svg + legenda + '</div>';
  }

  function svgLineChart(labels, valores, cor){
    var w = 640, h = 260, padL = 56, padR = 16, padT = 16, padB = 30;
    var areaW = w - padL - padR, areaH = h - padT - padB;
    var esc = svgEscala(valores);
    var faixa = esc.max - esc.min || 1;
    var n = labels.length;
    var passo = n > 1 ? areaW / (n-1) : 0;
    var pontos = valores.map(function(v, i){
      var x = padL + i*passo;
      var y = padT + areaH - ((v - esc.min)/faixa) * areaH;
      return {x:x, y:y};
    });
    var zeroY = padT + areaH - ((0 - esc.min)/faixa) * areaH;

    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%; height:100%;">';
    svg += '<line x1="' + padL + '" y1="' + zeroY + '" x2="' + (padL+areaW) + '" y2="' + zeroY + '" stroke="var(--paper-line)" stroke-width="1"></line>';

    var linhaPath = 'M' + pontos.map(function(p){ return p.x + ',' + p.y; }).join(' L');
    var areaPath = linhaPath + ' L' + pontos[pontos.length-1].x + ',' + zeroY + ' L' + pontos[0].x + ',' + zeroY + ' Z';
    svg += '<path d="' + areaPath + '" fill="' + cor + '" fill-opacity="0.15" stroke="none"></path>';
    svg += '<path d="' + linhaPath + '" fill="none" stroke="' + cor + '" stroke-width="2.2"></path>';
    pontos.forEach(function(p){ svg += '<circle cx="' + p.x + '" cy="' + p.y + '" r="3" fill="' + cor + '"></circle>'; });

    var passoLabel = Math.ceil(n / 8);
    labels.forEach(function(lab, i){
      if(i % passoLabel !== 0 && i !== n-1) return;
      svg += '<text x="' + pontos[i].x + '" y="' + (h-padB+16) + '" text-anchor="middle" font-size="10" fill="var(--ink-soft)">' + escapeHtml(lab) + '</text>';
    });
    svg += '</svg>';
    return svg;
  }

  function addMesesISO(dataISO, meses){

  function parseNFeXML(xmlText){
    try{
      var parser = new DOMParser();
      var xml = parser.parseFromString(xmlText, 'text/xml');
      if(xml.getElementsByTagName('parsererror').length) return null;
      function tagText(parent, tag){ var els = parent.getElementsByTagName(tag); return els.length ? (els[0].textContent || '').trim() : ''; }
      var infNFe = xml.getElementsByTagName('infNFe')[0];
      if(!infNFe) return null;
      var ideEl = infNFe.getElementsByTagName('ide')[0];
      var emitEl = infNFe.getElementsByTagName('emit')[0];
      var numero = ideEl ? tagText(ideEl, 'nNF') : '';
      var dataEmissaoRaw = ideEl ? (tagText(ideEl, 'dhEmi') || tagText(ideEl, 'dEmi')) : '';
      var dataEmissao = dataEmissaoRaw ? dataEmissaoRaw.slice(0, 10) : '';
      var fornecedorNome = emitEl ? tagText(emitEl, 'xNome') : '';
      var chave = tagText(xml, 'chNFe');
      if(!chave){
        var idAttr = infNFe.getAttribute ? (infNFe.getAttribute('Id') || '') : '';
        chave = idAttr.replace(/^NFe/, '');
      }
      var dets = infNFe.getElementsByTagName('det');
      var itens = [];
      for(var i = 0; i < dets.length; i++){
        var prodEl = dets[i].getElementsByTagName('prod')[0];
        if(!prodEl) continue;
        var xProd = tagText(prodEl, 'xProd');
        if(!xProd) continue;
        itens.push({
          cProd: tagText(prodEl, 'cProd'), xProd: xProd, uCom: tagText(prodEl, 'uCom'), cfop: tagText(prodEl, 'CFOP'),
          qCom: parseFloat(tagText(prodEl, 'qCom')) || 0, vUnCom: parseFloat(tagText(prodEl, 'vUnCom')) || 0,
          vProd: parseFloat(tagText(prodEl, 'vProd')) || 0
        });
      }
      if(!itens.length) return null;
      var natureza = ideEl ? tagText(ideEl, 'natOp') : '';
      var duplicatas = [];
      var cobrEl = infNFe.getElementsByTagName('cobr')[0];
      if(cobrEl){
        var dupEls = cobrEl.getElementsByTagName('dup');
        for(var j = 0; j < dupEls.length; j++){
          var vDupTxt = tagText(dupEls[j], 'vDup');
          var dVencTxt = tagText(dupEls[j], 'dVenc');
          if(!vDupTxt || !dVencTxt) continue;
          duplicatas.push({numero: tagText(dupEls[j], 'nDup'), vencimento: dVencTxt, valor: parseFloat(vDupTxt) || 0});
        }
      }
      return {numero: numero, dataEmissao: dataEmissao, fornecedorNome: fornecedorNome, chave: chave, natureza: natureza, itens: itens, duplicatas: duplicatas};
    }catch(err){
      console.error('Erro ao ler XML da NF-e:', err);
      return null;
    }
  }

  function toISOImport(val){
    if(!val) return '';
    if(val instanceof Date){
      if(isNaN(val.getTime())) return '';
      var y = val.getFullYear(), m = String(val.getMonth()+1).padStart(2,'0'), d = String(val.getDate()).padStart(2,'0');
      return y + '-' + m + '-' + d;
    }
    var s = String(val).trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var m2 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m2) return m2[3] + '-' + m2[2].padStart(2,'0') + '-' + m2[1].padStart(2,'0');
    return '';
  }
  function parseValorImport(v){
    if(typeof v === 'number') return v;
    if(v == null) return 0;
    var s = String(v).trim().replace(/[^\d.,-]/g, '');
    if(s.indexOf(',') !== -1 && s.indexOf('.') !== -1){ s = s.replace(/\./g, '').replace(',', '.'); }
    else if(s.indexOf(',') !== -1){ s = s.replace(',', '.'); }
    return parseFloat(s) || 0;
  }
  function importarFinanceiroDeArquivo(){
    var contaSel = document.getElementById('f-import-conta');
    var statusSel = document.getElementById('f-import-status');
    var fileInput = document.getElementById('import-file-input');
    if(!contaSel || !statusSel || !fileInput) return;
    var contaId = contaSel.value;
    var statusPadrao = statusSel.value;
    var file = fileInput.files && fileInput.files[0];
    if(!file){ alert('Selecione um arquivo primeiro.'); return; }
    if(!contaId){ alert('Selecione uma conta para os lançamentos.'); return; }
    if(!window.XLSX){ alert('A biblioteca de leitura de planilhas ainda está carregando (ou não pôde ser carregada). Tente novamente em instantes.'); return; }

    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:'array', cellDates:true});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true});

        var novos = [];
        for(var i = 1; i < rows.length; i++){
          var r = rows[i];
          if(!r || r.length === 0) continue;
          var nome = r[0] != null ? String(r[0]).trim() : '';
          if(!nome || nome.toUpperCase() === 'TOTAL') continue;
          var dataEmissao = toISOImport(r[1]);
          var vencimento = toISOImport(r[2]);
          var doc = r[3] != null ? String(r[3]).trim() : '';
          var valor = parseValorImport(r[4]);
          if(!valor) continue;
          novos.push({
            id: uid(), contaId: contaId, tipo: contaTipo(contaId), categoria: contaNome(contaId),
            valor: valor, quantidade: 0, peso: 0, unidade: '',
            status: statusPadrao, data: statusPadrao === 'Pago' ? (dataEmissao || vencimento) : '', vencimento: vencimento,
            talhoesIds: [], talhaoId: '', parceiroId: '', membroId: '',
            descricao: nome + (doc ? ' - Doc ' + doc : ''), criadoEm: Date.now()
          });
        }

        if(!novos.length){ alert('Nenhuma linha válida encontrada no arquivo.'); return; }
        if(!window.confirm('Serão criados ' + novos.length + ' lançamentos, todos na conta "' + contaLabel(contaId) + '" com status "' + statusPadrao + '". Confirma a importação?')) return;

        novos.forEach(function(n){ state.financeiro.push(n); });
        saveKey('financeiro', state.financeiro);
        fileInput.value = '';
        renderAll();
        alert(novos.length + ' lançamentos importados com sucesso.');
      }catch(err){
        console.error('Erro ao importar arquivo:', err);
        alert('Não foi possível ler esse arquivo. Verifique se é um .xlsx ou .csv válido, com as colunas na ordem esperada.');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  /* ---------------- Form field helpers ---------------- */
  function field(type, name, label, required, placeholder, extra, currentValue){
    extra = extra || {};
    var attrs = '';
    Object.keys(extra).forEach(function(k){ attrs += ' ' + k + '="' + extra[k] + '"'; });
    return '<div class="field"><label for="f-' + name + '">' + label + '</label>' +
      '<input type="' + type + '" id="f-' + name + '" name="' + name + '"' +
      (required ? ' required' : '') +
      (placeholder ? ' placeholder="' + placeholder + '"' : '') +
      (currentValue !== undefined && currentValue !== null && currentValue !== '' ? ' value="' + escapeHtml(currentValue) + '"' : '') +
      attrs + '></div>';
  }
  function selectField(name, label, options, currentValue){
    var html = '<div class="field"><label for="f-' + name + '">' + label + '</label><select id="f-' + name + '" name="' + name + '">';
    options.forEach(function(o){
      var sel = (currentValue !== undefined && currentValue !== null && String(currentValue) === String(o.value)) ? ' selected' : '';
      html += '<option value="' + escapeHtml(o.value) + '"' + sel + '>' + escapeHtml(o.label) + '</option>';
    });
    html += '</select></div>';
    return html;
  }

  /* ---------------- Event delegation ---------------- */
  var NAV_COLLAPSE_KEY = 'fazenda-nav-collapsed';
  function getCollapsedGroups(){
    try{ var raw = window.localStorage.getItem(NAV_COLLAPSE_KEY); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
  }
  function saveCollapsedGroups(list){
    try{ window.localStorage.setItem(NAV_COLLAPSE_KEY, JSON.stringify(list)); }catch(e){}
  }
  function setGroupCollapsed(label, collapsed){
    label.classList.toggle('collapsed', collapsed);
    var el = label.nextElementSibling;
    while(el && !el.classList.contains('nav-group-label')){
      el.style.display = collapsed ? 'none' : '';
      el = el.nextElementSibling;
    }
  }
  function initNavGroups(){
    var collapsed = getCollapsedGroups();
    document.querySelectorAll('.nav-group-label').forEach(function(label){
      setGroupCollapsed(label, collapsed.indexOf(label.dataset.group) !== -1);
    });
  }
  function expandGroupFor(tab){
    var btn = document.querySelector('.nav-btn[data-tab="' + tab + '"]');
    if(!btn) return;
    var prev = btn.previousElementSibling;
    while(prev && !prev.classList.contains('nav-group-label')) prev = prev.previousElementSibling;
    if(prev && prev.classList.contains('collapsed')){
      setGroupCollapsed(prev, false);
      var collapsed = getCollapsedGroups().filter(function(g){ return g !== prev.dataset.group; });
      saveCollapsedGroups(collapsed);
    }
  }
  initNavGroups();

  document.getElementById('nav').addEventListener('click', function(e){
    var label = e.target.closest('.nav-group-label');
    if(label){
      var isCollapsed = !label.classList.contains('collapsed');
      setGroupCollapsed(label, isCollapsed);
      var collapsed = getCollapsedGroups().filter(function(g){ return g !== label.dataset.group; });
      if(isCollapsed) collapsed.push(label.dataset.group);
      saveCollapsedGroups(collapsed);
      return;
    }
    var btn = e.target.closest('.nav-btn');
    if(!btn) return;
    switchTab(btn.dataset.tab);
  });

  var ESTILO_SELECT_DESTINO = 'width:100%; padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;';
  function lerEstadoDestinoDoDom(cont){
    var form = cont.closest('form');
    var radio = form.querySelector('input[name="destino"]:checked');
    var selLav = form.querySelector('select[name="lavouraId"]');
    var selMet = form.querySelector('select[name="metodoRateio"]');
    var selSafraUnica = form.querySelector('select[name="destSafraId"]');
    var safras = [], talhoes = [];
    form.querySelectorAll('input[name="destSafraIds"]:checked').forEach(function(cb){ safras.push(cb.value); });
    form.querySelectorAll('input[name="destTalhaoIds"]:checked').forEach(function(cb){ talhoes.push(cb.value); });
    var maquinas = [];
    form.querySelectorAll('input[name="destMaquinaIds"]:checked').forEach(function(cb){ maquinas.push(cb.value); });
    return {
      maquinaIds: maquinas,
      destino: radio ? radio.value : '', lavouraId: selLav ? selLav.value : '', metodo: selMet ? selMet.value : 'area',
      safraIds: safras, safraUnica: selSafraUnica ? selSafraUnica.value : '', talhaoIds: talhoes,
      lavouraMudou: !!(selLav && cont.dataset.ultimaLavoura !== selLav.value)
    };

  function estadoDestinoDoRegistro(r){
    if(!r) return {destino:'', lavouraId:'', metodo:'area', safraIds:null, safraUnica:'', talhaoIds:[], maquinaIds:[]};
    var d = destinoEfetivo(r);
    var safraIdsR = d === 'lavoura' ? partesDoLancamento(r).map(function(pt){ return pt.safraId; }).filter(function(x){ return x; }) : [];
    var sf = safraIdsR.length ? state.safras.find(function(x){ return x.id === safraIdsR[0]; }) : null;
    return {
      destino: (d === 'lavoura' || d === 'talhao' || d === 'geral' || d === 'maquina') ? d : '',
      maquinaIds: r.maquinasIds || [],
      lavouraId: sf ? sf.lavouraId : '', metodo: r.metodoRateio || 'area', safraIds: safraIdsR.length ? safraIdsR : null, safraUnica: '',
      talhaoIds: talhoesDoLancamento(r)
    };
  }

  // Lê o destino do formulário e devolve as partes em que o valor vai ser dividido
  function lerDestinoDoForm(form, emEdicao){
    var radio = form.querySelector('input[name="destino"]:checked');
    if(!radio) return {erro: 'Escolha o destino do lançamento: Lavoura, Só talhão ou Geral da fazenda.'};
    var d = radio.value;
    if(d === 'geral') return {destino:'geral', partes:[]};
    if(d === 'maquina'){
      var ms = [];
      form.querySelectorAll('input[name="destMaquinaIds"]:checked').forEach(function(cb){ ms.push(cb.value); });
      if(!ms.length) return {erro: 'Marque pelo menos uma máquina ou equipamento.'};
      return {destino:'maquina', maquinas: ms, partes:[]};
    }
    if(d === 'talhao'){
      var ts = [];
      form.querySelectorAll('input[name="destTalhaoIds"]:checked').forEach(function(cb){ ts.push(cb.value); });
      if(!ts.length) return {erro: 'Marque pelo menos um talhão.'};
      return {destino:'talhao', talhoes: ts, partes:[]};
    }
    var selLav = form.querySelector('select[name="lavouraId"]');
    if(!selLav || !selLav.value) return {erro: 'Escolha a lavoura.'};
    var ids = [];
    form.querySelectorAll('input[name="destSafraIds"]:checked').forEach(function(cb){ ids.push(cb.value); });
    var sfs = state.safras.filter(function(x){ return ids.indexOf(x.id) !== -1; });
    if(!sfs.length) return {erro: 'Marque pelo menos um talhão da lavoura.'};
    var selMet = form.querySelector('select[name="metodoRateio"]');
    var metodo = selMet ? selMet.value : 'area';
    var pesos = sfs.map(function(x){ return metodo === 'igual' ? 1 : areaPlantadaSafra(x); });
    var soma = pesos.reduce(function(a,b){ return a+b; }, 0);
    if(soma <= 0){ pesos = sfs.map(function(){ return 1; }); soma = sfs.length; }
    return {destino:'lavoura', metodo: metodo, partes: sfs.map(function(x, i){ return {talhaoId: x.talhaoId, safraId: x.id, fracao: pesos[i] / soma}; })};
  }
  // Grava o destino num registro (lançamento ou conta a pagar) a partir do valor dele
  function aplicarDestino(reg, dest){
    reg.destino = dest.destino;
    delete reg.partes; delete reg.metodoRateio; delete reg.maquinasIds;
    if(dest.destino === 'maquina'){ reg.maquinasIds = dest.maquinas.slice(); reg.talhoesIds = []; reg.talhaoId = ''; reg.safraId = ''; return reg; }
    if(dest.destino === 'geral'){ reg.talhoesIds = []; reg.talhaoId = ''; reg.safraId = ''; return reg; }
    if(dest.destino === 'talhao'){ reg.talhoesIds = dest.talhoes.slice(); reg.talhaoId = dest.talhoes.length === 1 ? dest.talhoes[0] : ''; reg.safraId = ''; return reg; }
    var partes = dest.partes;
    reg.talhoesIds = partes.map(function(pt){ return pt.talhaoId; }).filter(function(v,i,a){ return v && a.indexOf(v) === i; });
    if(partes.length === 1){ reg.talhaoId = partes[0].talhaoId; reg.safraId = partes[0].safraId; return reg; }
    reg.talhaoId = ''; reg.safraId = '';
    var valores = dividirValor(Number(reg.valor) || 0, partes.map(function(pt){ return pt.fracao; }));
    reg.partes = partes.map(function(pt, i){ return {talhaoId: pt.talhaoId, safraId: pt.safraId || '', valor: valores[i]}; });
    if(dest.metodo) reg.metodoRateio = dest.metodo;
    return reg;
  }
  // Classificação em lote dos lançamentos antigos sem destino
  function classificarLancamentos(ids, destSel){
    var ok = 0, pulados = [];
    var lavId = destSel.indexOf('lav:') === 0 ? destSel.slice(4) : '';
    var sfsLav = lavId ? safrasDaLavoura(lavId) : [];
    ids.forEach(function(id){
      var idx = state.financeiro.findIndex(function(x){ return x.id === id; });
      if(idx === -1) return;
      var f = state.financeiro[idx];
      var desc = (f.descricao || contaNome(f.contaId) || 'lançamento') + ' (' + fmtBRL(f.valor) + ')';
      if(lancamentoEstaFechado(f)){ pulados.push(desc + ' — período fechado'); return; }
      var ts = talhoesDoLancamento(f);
      if(destSel === 'geral'){
        f.destino = 'geral'; f.talhoesIds = []; f.talhaoId = ''; f.safraId = ''; ok++; return;
      }
      if(destSel.indexOf('maq:') === 0){
        aplicarDestino(f, {destino:'maquina', maquinas:[destSel.slice(4)]}); ok++; return;
      }
      if(destSel === 'talhao'){
        if(!ts.length){ pulados.push(desc + ' — não tem talhão marcado'); return; }
        f.destino = 'talhao'; f.safraId = ''; ok++; return;
      }
      if(!lavId) return;
      var partes;
      if(!ts.length){
        var pesosL = sfsLav.map(areaPlantadaSafra), somaL = pesosL.reduce(function(a,b){ return a+b; }, 0);
        if(somaL <= 0){ pesosL = sfsLav.map(function(){ return 1; }); somaL = sfsLav.length; }
        partes = sfsLav.map(function(sf, i){ return {talhaoId: sf.talhaoId, safraId: sf.id, fracao: pesosL[i] / somaL}; });
      } else {
        // mantém a divisão que o lançamento já tinha (igual entre os talhões); talhões fora da lavoura ficam como "só talhão"
        partes = ts.map(function(tid){ var sf = sfsLav.find(function(x){ return x.talhaoId === tid; }); return {talhaoId: tid, safraId: sf ? sf.id : '', fracao: 1 / ts.length}; });
      }
      if(!partes.some(function(pt){ return pt.safraId; })){ pulados.push(desc + ' — o talhão ' + ts.map(talhaoNome).join(', ') + ' não faz parte dessa lavoura'); return; }
      aplicarDestino(f, {destino:'lavoura', metodo: ts.length ? 'igual' : 'area', partes: partes});
      ok++;
    });
    return {ok: ok, pulados: pulados};
  }
  // Divide um valor em partes que somam exatamente o total (a última parte leva a diferença de arredondamento)
  function dividirValor(total, fracoes){
    var acum = 0;
    return fracoes.map(function(fr, i){
      if(i === fracoes.length - 1) return Math.round((total - acum) * 100) / 100;
      var v = Math.round(total * fr * 100) / 100; acum += v; return v;
    });
  }


  function recalcularValorPorQuantidade(){
    var qtdEl = document.getElementById('f-quantidade');
    var valorUnitEl = document.getElementById('f-valorUnitario');
    var valorEl = document.getElementById('f-valor');
    if(!qtdEl || !valorUnitEl || !valorEl) return;
    var qtd = parseFloat(qtdEl.value) || 0;
    var valorUnit = parseFloat(valorUnitEl.value) || 0;
    if(qtd > 0 && valorUnit > 0){
      valorEl.value = (qtd * valorUnit).toFixed(2);
    }
  }

  function recalcularValorDiaria(){

  }

  /* ---------------- Ordenação por coluna em todas as tabelas ---------------- */
  // Clicar no cabeçalho ordena crescente/alfabética (▲); clicar de novo inverte (▼). A escolha fica guardada
  // e é reaplicada quando a tela é redesenhada. Tabelas genéricas já têm ordenação própria e ficam de fora.
  var ordenacoesTabelas = {};
  function valorOrdenacaoCelula(cell){
    if(!cell) return {vazio:true};
    var t = (cell.innerText || cell.textContent || '').split('\n')[0].trim();
    if(!t || t === '—' || t === '-' || t === '–') return {vazio:true};
    var d = t.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if(d) return {num: Number(d[3] + d[2] + d[1]), texto: t};
    // "− R$ 100" / "+ R$ 100" (sinal com espaço) só indicam custo/receita: ordena pelo valor. "-R$ 100" é negativo de verdade.
    var negativo = /^[−-](R\$|\d)/.test(t);
    var limpo = t.replace(/^[+−-]\s*/, '').replace(/R\$|\bha\b|%|\bsc\b|\s/g, '');
    if(/^-?\d{1,3}(\.\d{3})*(,\d+)?$/.test(limpo) || /^-?\d+(,\d+)?$/.test(limpo)){
      var n = Number(limpo.replace(/\./g, '').replace(',', '.'));
      if(!isNaN(n)) return {num: negativo ? -Math.abs(n) : n, texto: t};
    }
    return {texto: t};
  }
  function chaveTabelaOrdenacao(table){
    var tab = table.closest('[id^="tab-"]') || table.closest('[id]');
    var escopo = tab ? tab.id : 'doc';
    var todas = tab ? tab.querySelectorAll('table') : document.querySelectorAll('table');
    var idx = Array.prototype.indexOf.call(todas, table);
    var cab = Array.prototype.map.call(table.querySelectorAll('thead th'), function(th){ return (th.dataset.rotulo || th.textContent || '').trim(); }).join('|');
    return escopo + '#' + idx + '#' + cab;
  }
  function ordenarTabela(table, col, dir){
    var tbody = table.tBodies[0];
    if(!tbody) return;
    var linhas = Array.prototype.slice.call(tbody.rows);
    if(linhas.some(function(r){ return r.querySelector('td[colspan]'); })) return;
    var vals = linhas.map(function(r, i){ return {r: r, v: valorOrdenacaoCelula(r.cells[col]), i: i}; });
    var todosNumeros = vals.every(function(x){ return x.v.vazio || x.v.num !== undefined; });
    vals.sort(function(a, b){
      if(a.v.vazio && b.v.vazio) return a.i - b.i;
      if(a.v.vazio) return 1;
      if(b.v.vazio) return -1;
      var c = todosNumeros ? (a.v.num - b.v.num) : a.v.texto.localeCompare(b.v.texto, 'pt-BR', {numeric:true, sensitivity:'base'});
      if(c === 0) return a.i - b.i;
      return dir === 'desc' ? -c : c;
    });
    vals.forEach(function(x){ tbody.appendChild(x.r); });
    Array.prototype.forEach.call(table.querySelectorAll('thead th.th-ordenavel'), function(th){
      var seta = th.querySelector('.seta-ordem');
      if(seta) seta.textContent = (Number(th.dataset.col) === col) ? (dir === 'desc' ? ' ▼' : ' ▲') : '';
    });
  }
  function prepararTabelasOrdenaveis(){
    Array.prototype.forEach.call(document.querySelectorAll('table'), function(table){
      if(table.dataset.ordPreparada) return;
      table.dataset.ordPreparada = '1';
      if(table.querySelector('th[data-action="sort-generic-table"]') || table.classList.contains('sem-ordenacao')) return;
      var ths = table.querySelectorAll('thead tr:last-child th');
      if(!ths.length || !table.tBodies[0]) return;
      Array.prototype.forEach.call(ths, function(th, i){
        if(th.dataset.action || th.querySelector('input,select,button') || !th.textContent.trim() || th.colSpan > 1) return;
        th.dataset.rotulo = th.textContent.trim();
        th.dataset.col = i;
        th.classList.add('th-ordenavel');
        th.title = 'Clique para ordenar';
        var seta = document.createElement('span'); seta.className = 'seta-ordem'; th.appendChild(seta);
      });
      var salvo = ordenacoesTabelas[chaveTabelaOrdenacao(table)];
      if(salvo) ordenarTabela(table, salvo.col, salvo.dir);
    });
  }
  document.addEventListener('click', function(e){
    var th = e.target && e.target.closest ? e.target.closest('th.th-ordenavel') : null;
    if(!th) return;
    var table = th.closest('table');
    var chave = chaveTabelaOrdenacao(table);
    var col = Number(th.dataset.col);
    var atual = ordenacoesTabelas[chave];
    var dir = (atual && atual.col === col && atual.dir === 'asc') ? 'desc' : 'asc';
    ordenacoesTabelas[chave] = {col: col, dir: dir};
    ordenarTabela(table, col, dir);
  });
  var agendouPrepararTabelas = false;
  new MutationObserver(function(){
    if(agendouPrepararTabelas) return;
    agendouPrepararTabelas = true;
    setTimeout(function(){ agendouPrepararTabelas = false; prepararTabelasOrdenaveis(); }, 0);
  }).observe(document.body, {childList:true, subtree:true});

  window.addEventListener('afterprint', function(){
    document.body.classList.remove('imprimindo-calagem');
  });

  boot();
})();
</script>
