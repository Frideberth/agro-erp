<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raio-X do Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: ferramenta de trabalho em três abas (Raio-X / Simulador / Dados). Resumo no topo, detalhe abaixo. Paleta de folha de cafeeiro + cereja madura. */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --surface-2:#F7F8F4; --ink:#1C251F; --muted:#5B685F; --line:#D8DDD3;
  --accent:#7A2738; --accent-soft:#F3E3E6; --leaf:#2D5E46; --leaf-soft:#E2EDE6;
  --good:#2E7A4E; --warn:#A8670A; --bad:#BC3424;
  --seg1:#2D5E46; --seg2:#7FA48D; --seg3:#C9D6CC;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121713; --surface:#1A211C; --surface-2:#1F2721; --ink:#E6ECE7; --muted:#9AA79E; --line:#2D3830;
  --accent:#E58C9C; --accent-soft:#3A2228; --leaf:#7CC39C; --leaf-soft:#20352A;
  --good:#66C08A; --warn:#E5A83D; --bad:#F26D5B;
  --seg1:#5FA982; --seg2:#3F6D55; --seg3:#2B4537; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121713; --surface:#1A211C; --surface-2:#1F2721; --ink:#E6ECE7; --muted:#9AA79E; --line:#2D3830;
  --accent:#E58C9C; --accent-soft:#3A2228; --leaf:#7CC39C; --leaf-soft:#20352A;
  --good:#66C08A; --warn:#E5A83D; --bad:#F26D5B;
  --seg1:#5FA982; --seg2:#3F6D55; --seg3:#2B4537; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand .sub{color:var(--muted);max-width:60ch}
nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
nav.tabs button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--leaf);color:var(--bg)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-block:16px;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);font-size:.9rem}
.banner.mine{background:var(--leaf-soft)}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--leaf);color:var(--bg);border-color:var(--leaf)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent}

section.panel{display:flex;flex-direction:column;gap:22px;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g2w{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:900px){.g2w{grid-template-columns:1fr}}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

/* Veredito */
.verdict{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:820px){.verdict{grid-template-columns:1fr}}
.verdict .big{font-family:var(--f-display);font-size:clamp(1.35rem,2.6vw,1.85rem);font-weight:700;line-height:1.25;text-wrap:balance}
.verdict .big b{font-family:var(--f-mono);font-weight:600;font-size:.92em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-good{color:var(--good)} .s-warn{color:var(--warn)} .s-bad{color:var(--bad)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:.88rem;color:var(--muted)}
.facts span b{color:var(--ink);font-family:var(--f-mono);font-weight:600}

svg text{fill:var(--ink);font-family:var(--f-body)}
svg .lbl{fill:var(--muted);font-size:11px}
svg .val{font-family:var(--f-mono);font-size:11.5px}

.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-mono);font-size:1.3rem;font-weight:600}
.kpi .d{font-size:.8rem;color:var(--muted)}
.kpi .delta{font-family:var(--f-mono);font-size:.8rem;font-weight:600}

table.t{width:100%;border-collapse:collapse;font-size:.9rem}
.t th,.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.t th:first-child,.t td:first-child{text-align:left}
.t thead th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.t td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.t td:first-child{font-family:var(--f-body)}
.t tr.tot td{font-weight:700;border-bottom:2px solid var(--ink)}
.t tr.sub td{color:var(--muted)}
.scroll{overflow-x:auto;min-width:0}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--leaf);border-radius:6px}
.bar .n{font-family:var(--f-mono);font-size:.82rem;text-align:right;min-width:9ch}
.bar .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.alert .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:currentColor}
.alert h3{font-family:var(--f-body);font-size:.95rem}
.alert p{margin:2px 0 0;color:var(--muted);font-size:.88rem}

.heat td{text-align:center;padding:7px 6px;font-size:.82rem}
.heat th{text-align:center}
.heat td.base{outline:2px solid var(--ink);outline-offset:-2px;font-weight:700}

/* Simulador */
.simgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.simgrid{grid-template-columns:1fr}}
.slider{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-bottom:1px solid var(--line)}
.slider:last-child{border-bottom:0}
.slider .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.slider label{font-weight:600;font-size:.9rem}
.slider output{font-family:var(--f-mono);font-weight:600}
.slider input[type=range]{width:100%;accent-color:var(--leaf)}
.slider .hint{font-size:.78rem;color:var(--muted)}

/* Dados */
.dsec{display:flex;flex-direction:column;gap:12px}
.dsec > header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;color:var(--muted);font-weight:600}
input.in,select.in{font:inherit;font-size:.9rem;width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink)}
input.in.n{font-family:var(--f-mono);text-align:right}
table.ed{border-collapse:collapse;width:100%;font-size:.88rem}
.ed th{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px;white-space:nowrap}
.ed td{padding:3px 4px;vertical-align:middle}
.ed td.out{font-family:var(--f-mono);text-align:right;white-space:nowrap;padding-inline:8px;color:var(--leaf);font-weight:600}
.ed .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 6px;border-radius:6px}
.ed .x:hover{color:var(--bad)}
.method{font-size:.82rem;color:var(--muted);background:var(--surface-2);border-left:3px solid var(--seg2);padding:8px 12px;border-radius:0 6px 6px 0}
.method code{font-family:var(--f-mono);font-size:.8rem}
.subhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
textarea.io{width:100%;min-height:120px;font-family:var(--f-mono);font-size:.78rem;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .25s ease}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Custo de produção do café · método Painel SENAR</span>
      <h1>Raio-X do Café</h1>
      <span class="sub small" id="safraLabel"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-raiox" aria-selected="true" data-tab="raiox">Raio-X</button>
      <button role="tab" id="tab-sim" aria-selected="false" data-tab="sim">Simulador</button>
      <button role="tab" id="tab-dados" aria-selected="false" data-tab="dados">Dados da safra</button>
    </nav>
  </header>

  <div class="banner" id="banner"></div>

  <section class="panel" id="p-raiox"></section>
  <section class="panel" id="p-sim" hidden></section>
  <section class="panel" id="p-dados" hidden></section>
</div>

<script>
/* ================= DADOS DE EXEMPLO (FICTÍCIOS) ================= */
const EXEMPLO = {
  origem:'exemplo',
  geral:{ safra:'Safra exemplo', area:10.73, prod:49.7, mesesColheita:3 },
  tipos:[
    {tipo:'T6 · bebida dura', pct:30, preco:800},
    {tipo:'T7 · bebida dura', pct:50, preco:760},
    {tipo:'T8 · riado/rio', pct:10, preco:700},
    {tipo:'Escolha', pct:10, preco:500}
  ],
  pessoas:{ encargos:45.59, horasDia:8,
    fixos:[{funcao:'Funcionários registrados', n:2, salario:1350, fator:1, meses:9, diasMes:21, treino:0}],
    tratoristas:[{funcao:'Tratorista', n:3, salario:1350, fator:1, meses:12, diasMes:21, treino:0}]
  },
  mec:{ diesel:6.2, manutPct:3, consumo:0.12, filtrosPct:10,
    tratores:[{nome:'Trator 75 cv', valor:260000, cv:75, horasAno:195}] },
  insumos:[
    {grupo:'Corretivo', item:'Calcário calcítico', un:'t', aplic:0, qtd:1, preco:300},
    {grupo:'Fertilizante', item:'Sulfato de amônio', un:'t', aplic:2, qtd:0.5, preco:1700},
    {grupo:'Fertilizante', item:'Cama de frango', un:'t', aplic:1, qtd:7.22, preco:330},
    {grupo:'Fitossanitário', item:'Inseticida sistêmico', un:'kg', aplic:1, qtd:1, preco:450},
    {grupo:'Fitossanitário', item:'Fungicida foliar', un:'L', aplic:2, qtd:0.7, preco:220},
    {grupo:'Fitossanitário', item:'Herbicida A', un:'L', aplic:2, qtd:2, preco:40},
    {grupo:'Fitossanitário', item:'Herbicida B', un:'L', aplic:2, qtd:1, preco:40}
  ],
  opsCond:[
    {item:'Aplicação da cama de frango', tipo:'hd', aplic:3, qtd:5, maq:0},
    {item:'Aplicação da cama de frango', tipo:'hm', aplic:16, qtd:1, maq:0},
    {item:'Capina química', tipo:'hm', aplic:1, qtd:10, maq:0},
    {item:'Pulverizações', tipo:'hm', aplic:3, qtd:0.5, maq:0}
  ],
  opsColh:[
    {item:'Transporte e terreiro', tipo:'hd', aplic:1, qtd:3, maq:0},
    {item:'Transporte do café', tipo:'hm', aplic:1, qtd:3.6, maq:0}
  ],
  eventuais:[ {item:'Apanha (pago por medida)', un:'medida', qtd:2240, valor:20} ],
  itensColh:[
    {item:'Sacaria do café beneficiado', base:'saca', qtd:1, valor:5},
    {item:'Beneficiamento', base:'saca', qtd:1, valor:15},
    {item:'Frete de entrega', base:'saca', qtd:1, valor:4.5},
    {item:'Energia do secador (meses)', base:'fixo', qtd:3, valor:380},
    {item:'Lenha (m³)', base:'fixo', qtd:20, valor:140},
    {item:'Panos e peneiras', base:'ha', qtd:1, valor:60}
  ],
  gastos:[
    {item:'Análise de solo', total:50, pct:100},
    {item:'Energia elétrica', total:3600, pct:40},
    {item:'Tributos do utilitário', total:1500, pct:50},
    {item:'Combustível (utilitário)', total:3000, pct:50},
    {item:'Telefone e internet', total:2400, pct:20},
    {item:'ITR', total:33, pct:40},
    {item:'EPI', total:180, pct:100},
    {item:'Despesas bancárias', total:500, pct:100},
    {item:'Seguro agrícola', total:1000, pct:100},
    {item:'Projeto rural / assistência', total:1000, pct:100},
    {item:'Manutenção de benfeitorias', total:6742, pct:100},
    {item:'Manutenção de máquinas e implementos', total:5022, pct:100}
  ],
  juros:[ {linha:'Custeio (ex.: Pronaf)', part:0, taxa:0} ],
  terra:{ arrendHa:5068, terraNuaHa:125000, taxaCirc:6, taxaBens:6 },
  inventario:{ implValorHa:22000, implVida:20, implRes:0,
    bens:[
      {item:'Trator', valor:260000, vida:10, res:20, uso:100},
      {item:'Carreta 3 t', valor:25000, vida:15, res:5, uso:40},
      {item:'Roçadora', valor:20000, vida:12, res:5, uso:40},
      {item:'Pulverizador costal', valor:500, vida:8, res:5, uso:40},
      {item:'Derriçadora costal', valor:3200, vida:8, res:5, uso:100},
      {item:'Veículo utilitário', valor:80000, vida:10, res:30, uso:21},
      {item:'Motosserra', valor:2200, vida:8, res:5, uso:100},
      {item:'Ferramentas diversas', valor:3300, vida:8, res:0, uso:21},
      {item:'Kit herbicida', valor:7000, vida:8, res:5, uso:100},
      {item:'Atomizador', valor:38000, vida:15, res:5, uso:100},
      {item:'Esqueletadeira', valor:1310, vida:15, res:5, uso:100},
      {item:'Secador 5 m³', valor:80000, vida:15, res:5, uso:100}
    ]},
  prolabore:{ mensal:3000, pct:100 }
};

/* ================= ESTADO ================= */
const KEY='raiox-cafe-v1';
const clone=o=>JSON.parse(JSON.stringify(o));
let D;
try{ const s=localStorage.getItem(KEY); D = s? JSON.parse(s) : clone(EXEMPLO);}catch(e){ D=clone(EXEMPLO); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){} }

/* ================= CÁLCULO (método SENAR) ================= */
const n0=v=>{v=Number(v);return isFinite(v)?v:0};
const sum=(a,f)=>a.reduce((s,x)=>s+n0(f(x)),0);

function precoMedio(d){
  const tp=sum(d.tipos,t=>t.pct);
  return tp>0 ? sum(d.tipos,t=>t.pct*t.preco)/tp : 0;
}

function calc(d,o={}){
  const A=n0(d.geral.area);
  const prodBase=n0(d.geral.prod);
  const prod = o.prod!=null ? o.prod : prodBase;
  const P=A*prod;
  const preco = o.preco!=null ? o.preco : precoMedio(d);
  const mPes=1+(o.pessoas||0)/100, mIns=1+(o.insumos||0)/100, mMec=1+(o.mec||0)/100;
  const enc=n0(d.pessoas.encargos)/100, hDia=n0(d.pessoas.horasDia)||8;

  // Pessoas fixas: valor total = nº × salário × fator × (1+encargos) × meses + treinamento
  const rowCost=r=>n0(r.n)*n0(r.salario)*n0(r.fator)*(1+enc)*n0(r.meses)+n0(r.treino);
  const rowDays=r=>n0(r.n)*n0(r.diasMes)*n0(r.meses);
  const fixRows=d.pessoas.fixos.map(r=>({cost:rowCost(r),days:rowDays(r)}));
  const trRows=d.pessoas.tratoristas.map(r=>({cost:rowCost(r),days:rowDays(r)}));
  let fixCost=sum(fixRows,r=>r.cost), fixDays=sum(fixRows,r=>r.days), fixN=sum(d.pessoas.fixos,r=>r.n);
  let trCost=sum(trRows,r=>r.cost), trDays=sum(trRows,r=>r.days), trN=sum(d.pessoas.tratoristas,r=>r.n);
  if(o.nFix!=null && fixN>0){const s=o.nFix/fixN; fixCost*=s; fixDays*=s; fixN=o.nFix;}
  if(o.nTrat!=null && trN>0){const s=o.nTrat/trN; trCost*=s; trDays*=s; trN=o.nTrat;}
  fixCost*=mPes; trCost*=mPes;
  const custoDia = fixDays>0 ? fixCost/fixDays : 0;
  const custoHoraTrat = trDays>0 ? trCost/(trDays*hDia) : 0;

  // Hora-máquina: manutenção (valor × % ÷ horas/ano) + diesel (preço × cv × consumo) + filtros (% do diesel) + tratorista
  const diesel = o.diesel!=null ? o.diesel : n0(d.mec.diesel);
  const maq=d.mec.tratores.map(t=>{
    const manut = n0(t.horasAno)>0 ? n0(t.valor)*n0(d.mec.manutPct)/100/n0(t.horasAno) : 0;
    const die = diesel*n0(t.cv)*n0(d.mec.consumo);
    const fil = die*n0(d.mec.filtrosPct)/100;
    const maqParte=(manut+die+fil)*mMec;
    return {manut,die,fil,trat:custoHoraTrat,maqParte,hora:maqParte+custoHoraTrat};
  });
  const horaDe=i=> (maq[i]||maq[0]||{hora:custoHoraTrat,maqParte:0}).hora;
  const maqParteDe=i=> (maq[i]||maq[0]||{maqParte:0}).maqParte;

  // Operações: total/ha = nº aplicações × quantidade/ha/aplicação; R$/ha = total/ha × valor (homem-dia ou hora-máquina)
  let demDias=0, demHoras=0, mecTotal=0, pesOps=0;
  const opCalc=ops=>ops.map(op=>{
    const u=n0(op.aplic)*n0(op.qtd);
    let rha;
    if(op.tipo==='hm'){ rha=u*horaDe(op.maq); demHoras+=u*A; mecTotal+=u*A*maqParteDe(op.maq); pesOps+=0; }
    else { rha=u*custoDia; demDias+=u*A; pesOps+=u*A*custoDia; }
    return {u,rha,tot:rha*A};
  });
  const opsCond=opCalc(d.opsCond), opsColh=opCalc(d.opsColh);
  const tratAlocado = demHoras*custoHoraTrat;

  // Resíduo da mão de obra fixa (dias pagos não alocados em operações) vira "serviços gerais"
  const resDias=fixDays-demDias, resHoras=trDays*hDia-demHoras;
  const resFixCost=Math.max(0,resDias)*custoDia, resTrCost=Math.max(0,resHoras)*custoHoraTrat;
  const fColh=Math.min(1,n0(d.geral.mesesColheita)/12);

  // Insumos: R$/ha = nº aplicações × quantidade × valor unitário
  const ins=d.insumos.map(i=>{const rha=n0(i.aplic)*n0(i.qtd)*n0(i.preco)*mIns; return {rha,tot:rha*A};});
  const insTotal=sum(ins,i=>i.tot);
  const insGrupo={}; d.insumos.forEach((i,k)=>{insGrupo[i.grupo]=(insGrupo[i.grupo]||0)+ins[k].tot;});

  // Colheita: mão de obra eventual e itens gerais
  const escalaProd = prodBase>0 ? prod/prodBase : 1;
  const ev=d.eventuais.map(e=>({tot:n0(e.qtd)*n0(e.valor)*mPes*escalaProd}));
  const evTotal=sum(ev,e=>e.tot);
  const it=d.itensColh.map(x=>{const b=x.base==='ha'?A:x.base==='saca'?P:1; return {tot:n0(x.qtd)*n0(x.valor)*b};});
  const itTotal=sum(it,x=>x.tot);

  const condTotal=insTotal+sum(opsCond,x=>x.tot)+(resFixCost+resTrCost)*(1-fColh);
  const colhTotal=sum(opsColh,x=>x.tot)+(resFixCost+resTrCost)*fColh+evTotal+itTotal;

  // Gastos gerais: total × % de uso no café
  const gas=d.gastos.map(g=>({tot:n0(g.total)*n0(g.pct)/100}));
  const gasTotal=sum(gas,g=>g.tot);

  // Juros de custeio: parcela do COE financiada × taxa
  const coeSemJuros=condTotal+colhTotal+gasTotal;
  const partFin=Math.min(1,sum(d.juros,j=>j.part)/100);
  const jurosTotal=sum(d.juros,j=>coeSemJuros*n0(j.part)/100*n0(j.taxa)/100);
  const COE=coeSemJuros+jurosTotal;

  // Depreciação: (valor × (1 − residual)) ÷ vida útil × % de uso
  const inv=d.inventario;
  const implDep = n0(inv.implVida)>0 ? n0(inv.implValorHa)*(1-n0(inv.implRes)/100)/n0(inv.implVida)*A : 0;
  const bens=inv.bens.map(b=>({dep: n0(b.vida)>0 ? n0(b.valor)*n0(b.uso)/100*(1-n0(b.res)/100)/n0(b.vida) : 0}));
  const depTotal=implDep+sum(bens,b=>b.dep);
  const prolab=n0(d.prolabore.mensal)*12*n0(d.prolabore.pct)/100;
  const COT=COE+depTotal+prolab;

  // Custo total: remunerações (custo de oportunidade)
  const remCirc=(1-partFin)*COE/2*n0(d.terra.taxaCirc)/100;
  const remTerra=n0(d.terra.arrendHa)*A;
  const valorBens=sum(inv.bens,b=>n0(b.valor)*n0(b.uso)/100);
  const capBens=(n0(inv.implValorHa)*A+valorBens)/2;
  const remBens=capBens*n0(d.terra.taxaBens)/100;
  const CT=COT+remCirc+remTerra+remBens;

  const RB=P*preco, MB=RB-COE, ML=RB-COT, LU=RB-CT;
  const capCT=capBens+A*n0(d.terra.terraNuaHa), capST=capBens;
  const pesTotal=pesOps+resFixCost+resTrCost+tratAlocado+evTotal;
  const per=v=>({tot:v, ha:A>0?v/A:0, sc:P>0?v/P:0});

  return {
    A,prod,P,preco,RB,MB,ML,LU,
    COE:per(COE),COT:per(COT),CT:per(CT),
    cond:per(condTotal),colh:per(colhTotal),gas:per(gasTotal),juros:per(jurosTotal),
    dep:per(depTotal),prolab:per(prolab),remCirc:per(remCirc),remTerra:per(remTerra),remBens:per(remBens),
    nat:{pessoas:pesTotal, mecanizacao:mecTotal, insumos:insTotal, outros:itTotal+gasTotal+jurosTotal},
    insGrupo, custoDia, custoHoraTrat, maq, fixCost, trCost, fixDays, trDays, fixN, trN, hDia,
    demDias, demHoras, resDias, resHoras, resFixCost, resTrCost,
    rows:{fix:fixRows,tr:trRows,ins,opsCond,opsColh,ev,it,gas,bens,implDep},
    capCT, capST,
    lucratividade: RB>0?ML/RB*100:0,
    pnCOE: preco>0&&A>0?COE/A/preco:0, pnCOT: preco>0&&A>0?COT/A/preco:0, pnCT: preco>0&&A>0?CT/A/preco:0,
    bc: CT>0?RB/CT:0,
    remCapCT: capCT>0?ML/capCT*100:0, remCapST: capST>0?ML/capST*100:0,
    roe: capCT>0?LU/capCT*100:0, giro: capCT>0?RB/capCT*100:0,
    moSaca: P>0?pesTotal/P:0
  };
}

/* ================= FORMATAÇÃO ================= */
const nf=(v,dd=0)=>(isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:dd,maximumFractionDigits:dd});
const R=(v,dd=0)=>'R$ '+nf(v,dd);
const pct=(v,dd=1)=>nf(v,dd)+'%';
const sgn=(v,f)=>(v>0?'+':v<0?'−':'')+f(Math.abs(v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= RAIO-X ================= */
function statusPreco(c){
  if(c.preco>=c.CT.sc) return {cls:'s-good', txt:'Paga o custo total'};
  if(c.preco>=c.COT.sc) return {cls:'s-warn', txt:'Paga o operacional, não o total'};
  if(c.preco>=c.COE.sc) return {cls:'s-warn', txt:'Paga só o desembolso'};
  return {cls:'s-bad', txt:'Não paga nem o desembolso'};
}

function svgSaca(c, base){
  const W=640,H=base?150:118, x0=8, x1=W-8;
  const max=Math.max(c.CT.sc,c.preco,base?Math.max(base.CT.sc,base.preco):0)*1.08||1;
  const sx=v=>x0+(x1-x0)*v/max;
  const row=(cc,y,lab)=>{
    const a=sx(cc.COE.sc), b=sx(cc.COT.sc), e=sx(cc.CT.sc), p=sx(cc.preco);
    return `<text class="lbl" x="${x0}" y="${y-8}">${lab}</text>
    <rect x="${x0}" y="${y}" width="${Math.max(0,a-x0)}" height="22" rx="3" style="fill:var(--seg1)"/>
    <rect x="${a}" y="${y}" width="${Math.max(0,b-a)}" height="22" style="fill:var(--seg2)"/>
    <rect x="${b}" y="${y}" width="${Math.max(0,e-b)}" height="22" style="fill:var(--seg3)"/>
    <line x1="${p}" x2="${p}" y1="${y-4}" y2="${y+28}" style="stroke:var(--accent);stroke-width:2.5"/>
    <text class="val" x="${Math.min(p+5,x1-80)}" y="${y+40}" style="fill:var(--accent);font-weight:600">preço ${R(cc.preco)}</text>`;
  };
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Custo por saca comparado ao preço">`;
  if(base){ s+=row(base,24,'Base'); s+=row(c,96,'Cenário'); }
  else s+=row(c,24,'R$ por saca beneficiada');
  return s+`</svg>
  <div class="facts small">
    <span><svg width="10" height="10"><rect width="10" height="10" rx="2" style="fill:var(--seg1)"/></svg> COE (desembolso) <b>${R(c.COE.sc)}</b></span>
    <span><svg width="10" height="10"><rect width="10" height="10" rx="2" style="fill:var(--seg2)"/></svg> + depreciação e pró-labore = COT <b>${R(c.COT.sc)}</b></span>
    <span><svg width="10" height="10"><rect width="10" height="10" rx="2" style="fill:var(--seg3)"/></svg> + remunerações = CT <b>${R(c.CT.sc)}</b></span>
  </div>`;
}

function barsHtml(items,total){
  const max=Math.max(...items.map(i=>i[1]),1);
  return `<div class="bars">${items.map(([l,v])=>`<div class="bar"><span class="lab" title="${esc(l)}">${esc(l)}</span><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div><span class="n">${pct(total>0?v/total*100:0,0)}</span></div>`).join('')}</div>`;
}

function diagnostico(c,d){
  const out=[];
  const st=statusPreco(c);
  if(c.prod < c.pnCT) out.push(['s-bad','A produtividade está abaixo do ponto de nivelamento',`Para cobrir o custo total, com o preço médio de ${R(c.preco)}, seria preciso colher ${nf(c.pnCT,1)} sc/ha. A lavoura colheu ${nf(c.prod,1)} sc/ha.`]);
  else out.push(['s-good','A produtividade cobre o custo total',`O ponto de nivelamento é ${nf(c.pnCT,1)} sc/ha e a lavoura colheu ${nf(c.prod,1)} sc/ha: uma folga de ${nf(c.prod-c.pnCT,1)} sc/ha.`]);
  if(c.fixDays>0){
    const oc=c.demDias/c.fixDays*100;
    if(c.resDias<0) out.push(['s-warn','Faltam dias de mão de obra fixa',`As operações pedem ${nf(c.demDias)} homens-dia, mas a equipe fixa tem ${nf(c.fixDays)} dias no ano. A diferença precisa vir de diaristas, que não estão no custo.`]);
    else if(oc<60) out.push(['s-warn',`A equipe fixa está ${pct(oc,0)} ocupada nas operações do café`,`Sobram ${nf(c.resDias)} homens-dia pagos (${R(c.resFixCost)}) que entram como "serviços gerais". Vale conferir se esses dias rendem em outras atividades.`]);
  }
  if(c.trDays>0){
    const disp=c.trDays*c.hDia, oc=c.demHoras/disp*100;
    if(oc<50) out.push(['s-warn',`Os tratoristas estão ${pct(oc,0)} ocupados no café`,`São ${nf(disp)} horas pagas para ${nf(c.demHoras)} horas de máquina nas operações. As ${nf(c.resHoras)} horas restantes custam ${R(c.resTrCost)} na safra.`]);
  }
  const pesPct=c.COE.tot>0?c.nat.pessoas/c.COE.tot*100:0;
  if(pesPct>40) out.push(['s-warn',`Mão de obra é ${pct(pesPct,0)} do desembolso`,`São ${R(c.moSaca)} de pessoas por saca. É o primeiro lugar para procurar eficiência.`]);
  if(c.dep.tot===0) out.push(['s-warn','A depreciação está zerada','Sem inventário de máquinas e da implantação, o custo operacional total fica subestimado. Preencha a seção Inventário.']);
  const somaPct=sum(d.tipos,t=>t.pct);
  if(Math.abs(somaPct-100)>0.5) out.push(['s-warn','Os tipos de café não somam 100%',`A soma está em ${pct(somaPct,0)}. O preço médio é ponderado pelo que foi informado.`]);
  const lista=[...d.insumos.map((i,k)=>[i.item,c.rows.ins[k].tot]),...d.eventuais.map((e,k)=>[e.item,c.rows.ev[k].tot])].sort((a,b)=>b[1]-a[1]);
  if(lista[0]&&lista[0][1]>0) out.push(['s-good',`Maior item isolado: ${lista[0][0]}`,`${R(lista[0][1])} na safra, ${R(c.P>0?lista[0][1]/c.P:0,2)} por saca, ${pct(c.COE.tot>0?lista[0][1]/c.COE.tot*100:0,0)} do COE.`]);
  return out;
}

function heatmap(d){
  const steps=[-30,-20,-10,0,10,20,30];
  const base=calc(d);
  const vals=steps.map(sp=>steps.map(sq=>calc(d,{prod:base.prod*(1+sp/100),preco:base.preco*(1+sq/100)}).LU/(base.A||1)));
  const mx=Math.max(...vals.flat().map(Math.abs),1);
  let h=`<div class="scroll"><table class="t heat"><thead><tr><th>sc/ha \\ preço</th>${steps.map(s=>`<th>${s>0?'+':''}${s}%<br><span class="muted">${R(base.preco*(1+s/100))}</span></th>`).join('')}</tr></thead><tbody>`;
  steps.forEach((sp,i)=>{
    h+=`<tr><th style="text-align:left">${sp>0?'+':''}${sp}% <span class="muted">${nf(base.prod*(1+sp/100),1)}</span></th>`;
    steps.forEach((sq,j)=>{
      const v=vals[i][j], a=Math.round(Math.min(1,Math.abs(v)/mx)*55)+6;
      const col=v>=0?'var(--good)':'var(--bad)';
      h+=`<td class="${sp===0&&sq===0?'base':''}" style="background:color-mix(in srgb, ${col} ${a}%, transparent)">${sgn(v,x=>nf(x/1000,1))} mil</td>`;
    });
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

    ${heatmap(D)}
  </div>`;
}

/* ================= SIMULADOR ================= */
let SIM=null;
function simDefaults(){
  const b=calc(D);
  return {preco:Math.round(b.preco), prod:+b.prod.toFixed(1), pessoas:0, insumos:0, mec:0, diesel:+n0(D.mec.diesel).toFixed(2), nFix:b.fixN, nTrat:b.trN};
}
function renderSim(){
  if(!SIM) SIM=simDefaults();
  const b=calc(D), el=document.getElementById('p-sim');
  const sl=(id,lab,min,max,step,val,fmt,hint)=>`<div class="slider"><div class="row"><label for="s-${id}">${lab}</label><output id="o-${id}">${fmt(val)}</output></div><input type="range" id="s-${id}" data-k="${id}" min="${min}" max="${max}" step="${step}" value="${val}">${hint?`<span class="hint">${hint}</span>`:''}</div>`;
  const pM=Math.max(100,Math.round(b.preco*2.5)), qM=Math.max(10,Math.ceil(b.prod*2));
  el.innerHTML=`
  <div class="simgrid">
    <div class="card">
      <div class="subhead"><h2>E se…?</h2><button class="btn ghost" id="simReset">Voltar à safra</button></div>
      <p class="muted small" style="margin:4px 0 6px">Mexa nos controles. O resultado ao lado compara com a safra cadastrada.</p>
      ${sl('preco','Preço médio da saca',0,pM,5,SIM.preco,v=>R(v),`Na safra: ${R(b.preco)}`)}
      ${sl('prod','Produtividade',0,qM,0.5,SIM.prod,v=>nf(v,1)+' sc/ha',`Na safra: ${nf(b.prod,1)} sc/ha`)}
      ${sl('nFix','Pessoas fixas',0,Math.max(6,b.fixN+4),1,SIM.nFix,v=>nf(v)+' pessoas',`Na safra: ${nf(b.fixN)}`)}
      ${sl('nTrat','Tratoristas',0,Math.max(4,b.trN+3),1,SIM.nTrat,v=>nf(v)+' pessoas',`Na safra: ${nf(b.trN)}`)}
      ${sl('pessoas','Salários e diárias',-30,50,1,SIM.pessoas,v=>sgn(v,x=>x+'%'),'Reajuste sobre toda a mão de obra')}
      ${sl('insumos','Preço dos insumos',-40,60,1,SIM.insumos,v=>sgn(v,x=>x+'%'),'Adubos, corretivos e defensivos')}
      ${sl('diesel','Diesel',0,Math.max(12,Math.ceil(n0(D.mec.diesel)*2)),0.05,SIM.diesel,v=>R(v,2)+'/L',`Na safra: ${R(n0(D.mec.diesel),2)}/L`)}
      ${sl('mec','Manutenção e operação de máquinas',-30,60,1,SIM.mec,v=>sgn(v,x=>x+'%'),'Manutenção, diesel e filtros da hora-máquina')}
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0" id="simOut"></div>
  </div>`;
  el.querySelectorAll('input[type=range]').forEach(r=>r.addEventListener('input',()=>{
    SIM[r.dataset.k]=Number(r.value);
    updSimLabels(); updSim();
  }));
  document.getElementById('simReset').onclick=()=>{SIM=simDefaults(); renderSim();};
  updSimLabels(); updSim();
}
function updSimLabels(){
  const f={preco:v=>R(v),prod:v=>nf(v,1)+' sc/ha',nFix:v=>nf(v)+' pessoas',nTrat:v=>nf(v)+' pessoas',pessoas:v=>sgn(v,x=>x+'%'),insumos:v=>sgn(v,x=>x+'%'),diesel:v=>R(v,2)+'/L',mec:v=>sgn(v,x=>x+'%')};
  Object.keys(f).forEach(k=>{const o=document.getElementById('o-'+k); if(o) o.textContent=f[k](SIM[k]);});
}
function updSim(){
  const b=calc(D), c=calc(D,SIM), st=statusPreco(c);
  const k=(t,v,vb,fmt,good=1)=>{const dlt=v-vb, cls=Math.abs(dlt)<1e-9?'muted':((dlt>0)===(good>0)?'s-good':'s-bad');
    return `<div class="card kpi"><span class="eyebrow">${t}</span><span class="v">${fmt(v)}</span><span class="delta ${cls}">${Math.abs(dlt)<1e-9?'igual à safra':sgn(dlt,fmt)+' vs safra'}</span></div>`;};
  const precisa=c.pnCT;
  document.getElementById('simOut').innerHTML=`
    <div class="card"><div class="subhead"><h2>Resultado do cenário</h2><span class="pill ${st.cls}">${st.txt}</span></div>
      <p class="muted" style="margin:8px 0 6px">Neste cenário, para empatar no custo total seria preciso colher <b class="num" style="color:var(--ink)">${nf(precisa,1)} sc/ha</b>${c.preco>0?` ou vender a <b class="num" style="color:var(--ink)">${R(c.CT.sc)}</b> a saca`:''}.</p>
      ${svgSaca(c,b)}
    </div>
    <div class="grid g3">
      ${k('Lucro por hectare',c.LU/(c.A||1),b.LU/(b.A||1),v=>R(v))}
      ${k('Lucro na safra',c.LU,b.LU,v=>R(v))}
      ${k('Lucratividade',c.lucratividade,b.lucratividade,v=>pct(v))}
      ${k('Custo total por saca',c.CT.sc,b.CT.sc,v=>R(v,2),-1)}
      ${k('COE por saca',c.COE.sc,b.COE.sc,v=>R(v,2),-1)}
      ${k('Ponto de nivelamento (CT)',c.pnCT,b.pnCT,v=>nf(v,1)+' sc/ha',-1)}
    </div>
    <div class="card"><h3>Mão de obra no cenário</h3>
      <div class="scroll" style="margin-top:8px"><table class="t"><thead><tr><th></th><th>Disponível</th><th>Usado nas operações</th><th>Ocupação</th></tr></thead><tbody>
        <tr><td>Equipe fixa (homens-dia)</td><td>${nf(c.fixDays)}</td><td>${nf(c.demDias)}</td><td>${pct(c.fixDays>0?c.demDias/c.fixDays*100:0,0)}</td></tr>
        <tr><td>Tratoristas (horas)</td><td>${nf(c.trDays*c.hDia)}</td><td>${nf(c.demHoras)}</td><td>${pct(c.trDays>0?c.demHoras/(c.trDays*c.hDia)*100:0,0)}</td></tr>
      </tbody></table></div>
      <p class="muted small" style="margin:8px 0 0">Ocupação acima de 100% indica falta de gente: a operação teria que ser feita com diaristas.</p>
    </div>`;
}

/* ================= DADOS ================= */
const COLS={
  tipos:[{k:'tipo',l:'Tipo / bebida'},{k:'pct',l:'% da produção',n:1},{k:'preco',l:'R$ por saca',n:1}],
  fixos:[{k:'funcao',l:'Função'},{k:'n',l:'Nº',n:1},{k:'salario',l:'Salário R$',n:1},{k:'fator',l:'Nº salários',n:1},{k:'meses',l:'Meses',n:1},{k:'diasMes',l:'Dias/mês',n:1},{k:'treino',l:'Treinamento R$',n:1}],
  tratores:[{k:'nome',l:'Trator'},{k:'valor',l:'Valor novo R$',n:1},{k:'cv',l:'Potência cv',n:1},{k:'horasAno',l:'Horas/ano',n:1}],
  insumos:[{k:'grupo',l:'Grupo',opts:['Corretivo','Fertilizante','Fitossanitário','Irrigação','Outro']},{k:'item',l:'Produto'},{k:'un',l:'Un.'},{k:'aplic',l:'Nº aplic.',n:1},{k:'qtd',l:'Qtd/ha/aplic.',n:1},{k:'preco',l:'R$ unit.',n:1}],
  ops:[{k:'item',l:'Operação'},{k:'tipo',l:'Tipo',opts:[['hd','Homem-dia'],['hm','Hora-máquina']]},{k:'aplic',l:'Nº vezes',n:1},{k:'qtd',l:'Qtd/ha/vez',n:1},{k:'maq',l:'Trator',maq:1}],
  eventuais:[{k:'item',l:'Serviço'},{k:'un',l:'Unidade'},{k:'qtd',l:'Qtd na safra',n:1},{k:'valor',l:'R$ unit.',n:1}],
  itensColh:[{k:'item',l:'Item'},{k:'base',l:'Base',opts:[['ha','por hectare'],['saca','por saca'],['fixo','valor fixo']]},{k:'qtd',l:'Qtd',n:1},{k:'valor',l:'R$ unit.',n:1}],
  gastos:[{k:'item',l:'Gasto'},{k:'total',l:'R$ no ano',n:1},{k:'pct',l:'% no café',n:1}],
  juros:[{k:'linha',l:'Linha de crédito'},{k:'part',l:'% do COE financiado',n:1},{k:'taxa',l:'Juros % a.a.',n:1}],
  bens:[{k:'item',l:'Bem'},{k:'valor',l:'Valor novo R$',n:1},{k:'vida',l:'Vida útil (anos)',n:1},{k:'res',l:'Residual %',n:1},{k:'uso',l:'% uso no café',n:1}]
};
const BLANK={tipos:{tipo:'',pct:0,preco:0},fixos:{funcao:'',n:1,salario:0,fator:1,meses:12,diasMes:21,treino:0},tratores:{nome:'Trator',valor:0,cv:0,horasAno:0},insumos:{grupo:'Fertilizante',item:'',un:'',aplic:1,qtd:0,preco:0},ops:{item:'',tipo:'hd',aplic:1,qtd:0,maq:0},eventuais:{item:'',un:'',qtd:0,valor:0},itensColh:{item:'',base:'saca',qtd:1,valor:0},gastos:{item:'',total:0,pct:100},juros:{linha:'',part:0,taxa:0},bens:{item:'',valor:0,vida:10,res:5,uso:100}};

const getP=p=>p.split('.').reduce((o,k)=>o?.[k],D);
function setP(p,v){const ks=p.split('.'),last=ks.pop();const o=ks.reduce((o,k)=>o[k],D);o[last]=v;}
const showN=v=>(v===''||v==null)?'':String(v).replace('.',',');
function parseN(s){s=String(s).trim(); if(s==='')return 0; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=parseFloat(s); return isFinite(v)?v:0;}
const fid=p=>'f-'+p.replace(/\./g,'-');

function fld(p,l,n=1){const v=getP(p);return `<div class="field"><label for="${fid(p)}">${l}</label><input class="in ${n?'n':''}" id="${fid(p)}" data-p="${p}" ${n?'data-n="1" inputmode="decimal"':''} value="${esc(n?showN(v):v)}"></div>`;}
function edTable(path,colKey,outFn,outLabel){
  const rows=getP(path), cols=COLS[colKey];
  const maqOpts=D.mec.tratores.map((t,i)=>[i,t.nome||('Trator '+(i+1))]);
  return `<div class="scroll"><table class="ed"><thead><tr>${cols.map(c=>`<th>${c.l}</th>`).join('')}${outLabel?`<th style="text-align:right">${outLabel}</th>`:''}<th></th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr>${cols.map(c=>{const p=`${path}.${i}.${c.k}`;
    if(c.opts||c.maq){const opts=c.maq?maqOpts:c.opts.map(o=>Array.isArray(o)?o:[o,o]);
      return `<td><select class="in" id="${fid(p)}" data-p="${p}" ${c.maq?'data-n="1"':''} ${c.maq&&r.tipo!=='hm'?'disabled':''}>${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(r[c.k])===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select></td>`;}
    return `<td><input class="in ${c.n?'n':''}" id="${fid(p)}" data-p="${p}" ${c.n?'data-n="1" inputmode="decimal" size="7"':'size="18"'} value="${esc(c.n?showN(r[c.k]):r[c.k])}"></td>`;}).join('')}
    ${outLabel?`<td class="out" data-out="${path}.${i}"></td>`:''}<td><button class="x" title="Remover linha" data-del="${path}.${i}">×</button></td></tr>`).join('')}
  </tbody></table></div><div><button class="btn" data-add="${path}" data-blank="${colKey}">+ Adicionar linha</button></div>`;
}

function renderDados(){
  const el=document.getElementById('p-dados');
  el.innerHTML=`
  <div class="card dsec"><header><h2>Informações gerais</h2><span class="muted small">Painel · Informações Gerais</span></header>
    <div class="fields">
      <div class="field"><label for="${fid('geral.safra')}">Nome da safra</label><input class="in" id="${fid('geral.safra')}" data-p="geral.safra" value="${esc(D.geral.safra)}"></div>
      ${fld('geral.area','Área com lavoura (ha)')}${fld('geral.prod','Produtividade (sc beneficiadas/ha)')}${fld('geral.mesesColheita','Duração da colheita (meses)')}
    </div>
    <h3>Comercialização por tipo</h3>
    ${edTable('tipos','tipos')}
    <p class="method">Preço médio = <code>Σ (% × preço) ÷ Σ %</code> · Agora: <b class="mono" data-out="precoMedio"></b></p>
  </div>

  <div class="card dsec"><header><h2>Pessoas</h2><span class="muted small">Painel · Pessoas MOB</span></header>
    <div class="fields">${fld('pessoas.encargos','Encargos trabalhistas (%)')}${fld('pessoas.horasDia','Horas por dia')}</div>
    <h3>Pessoas fixas</h3>${edTable('pessoas.fixos','fixos',null,'Valor total')}
    <h3>Tratoristas</h3>${edTable('pessoas.tratoristas','fixos',null,'Valor total')}
    <p class="method">Valor total = <code>nº × salário × nº salários × (1 + encargos) × meses + treinamento</code>. Custo do homem-dia = valor total ÷ dias trabalhados. Os dias pagos que não forem usados nas operações entram como "serviços gerais", repartidos entre condução e colheita pelos meses de colheita. · Homem-dia: <b class="mono" data-out="custoDia"></b> · Hora do tratorista: <b class="mono" data-out="custoHoraTrat"></b></p>
  </div>

  <div class="card dsec"><header><h2>Mecanização</h2><span class="muted small">Painel · Custos de Mecanização</span></header>
    <div class="fields">${fld('mec.diesel','Diesel (R$/L)')}${fld('mec.manutPct','Manutenção (% do valor novo/ano)')}${fld('mec.consumo','Consumo (L por cv·hora)')}${fld('mec.filtrosPct','Filtros e lubrificantes (% do diesel)')}</div>
    ${edTable('mec.tratores','tratores',null,'R$/hora')}
    <p class="method">Hora-máquina = <code>valor × manutenção% ÷ horas/ano</code> + <code>diesel × cv × consumo</code> + <code>filtros% × diesel</code> + hora do tratorista.</p>
  </div>

  <div class="card dsec"><header><h2>Condução da lavoura</h2><span class="muted small">Painel · Atividades de Condução</span></header>
    <h3>Insumos</h3>${edTable('insumos','insumos',null,'R$/ha')}
    <h3>Operações</h3>${edTable('opsCond','ops',null,'R$/ha')}
    <p class="method">Insumo: <code>nº aplicações × quantidade/ha × valor unitário</code>. Operação: <code>nº vezes × quantidade/ha × (custo do homem-dia ou da hora-máquina)</code>.</p>
  </div>

  <div class="card dsec"><header><h2>Colheita e pós-colheita</h2><span class="muted small">Painel · Colheita e Pós</span></header>
    <h3>Operações com equipe fixa e máquinas</h3>${edTable('opsColh','ops',null,'R$/ha')}
    <h3>Mão de obra eventual</h3>${edTable('eventuais','eventuais',null,'R$ total')}
    <h3>Itens gerais</h3>${edTable('itensColh','itensColh',null,'R$ total')}
  </div>

  <div class="card dsec"><header><h2>Gastos gerais</h2><span class="muted small">Painel · Outros Gastos</span></header>
    ${edTable('gastos','gastos',null,'No café')}
    <p class="method">Valor no café = <code>total do ano × % de uso no café</code>.</p>
  </div>

  <div class="card dsec"><header><h2>Juros de custeio e uso da terra</h2><span class="muted small">Painel · Juros de Custeio / Uso da Terra</span></header>
    ${edTable('juros','juros')}
    <div class="fields">${fld('terra.arrendHa','Arrendamento da região (R$/ha/ano)')}${fld('terra.terraNuaHa','Valor da terra nua (R$/ha)')}${fld('terra.taxaCirc','Remuneração do capital circulante (% a.a.)')}${fld('terra.taxaBens','Remuneração dos bens de capital (% a.a.)')}</div>
    <p class="method">Juros = <code>COE × % financiado × taxa</code>. Capital circulante = <code>(parte do COE não financiada) ÷ 2 × taxa</code>. Terra = arrendamento × área. Bens de capital = <code>(implantação + bens) ÷ 2 × taxa</code>.</p>
  </div>

  <div class="card dsec"><header><h2>Inventário e depreciação</h2><span class="muted small">Painel · Inventário</span></header>
    <div class="fields">${fld('inventario.implValorHa','Implantação da lavoura (R$/ha)')}${fld('inventario.implVida','Vida útil da lavoura (anos)')}${fld('inventario.implRes','Residual da lavoura (%)')}</div>
    ${edTable('inventario.bens','bens',null,'Depreciação/ano')}
    <p class="method">Depreciação = <code>valor novo × % uso × (1 − residual) ÷ vida útil</code>. Implantação: <b class="mono" data-out="implDep"></b> por ano.</p>
  </div>

  <div class="card dsec"><header><h2>Pró-labore</h2><span class="muted small">Painel · Análise</span></header>
    <div class="fields">${fld('prolabore.mensal','Pró-labore mensal (R$)')}${fld('prolabore.pct','% dedicado ao café')}</div>
  </div>

  <div class="card dsec"><header><h2>Guardar e trazer dados</h2></header>
    <p class="muted small" style="margin:0">Os dados ficam salvos neste navegador. Para levar a outro computador, copie o texto abaixo e cole no outro lado.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="ioCopy">Copiar meus dados</button><button class="btn" id="ioLoad">Carregar o texto colado</button><span class="small muted" id="ioMsg"></span></div>
    <textarea class="io" id="ioText" placeholder="Cole aqui os dados copiados e clique em Carregar o texto colado"></textarea>
  </div>`;
  updOuts();
}

function updOuts(){
  const c=calc(D), set=(k,t)=>{const e=document.querySelector(`[data-out="${k}"]`); if(e) e.textContent=t;};
  set('precoMedio',R(precoMedio(D),2)); set('custoDia',R(c.custoDia,2)); set('custoHoraTrat',R(c.custoHoraTrat,2)); set('implDep',R(c.rows.implDep));
  c.rows.fix.forEach((r,i)=>set(`pessoas.fixos.${i}`,R(r.cost)));
  c.rows.tr.forEach((r,i)=>set(`pessoas.tratoristas.${i}`,R(r.cost)));
  c.maq.forEach((m,i)=>set(`mec.tratores.${i}`,R(m.hora,2)));
  c.rows.ins.forEach((r,i)=>set(`insumos.${i}`,R(r.rha,2)));
  c.rows.opsCond.forEach((r,i)=>set(`opsCond.${i}`,R(r.rha,2)));
  c.rows.opsColh.forEach((r,i)=>set(`opsColh.${i}`,R(r.rha,2)));
  c.rows.ev.forEach((r,i)=>set(`eventuais.${i}`,R(r.tot)));
  c.rows.it.forEach((r,i)=>set(`itensColh.${i}`,R(r.tot)));
  c.rows.gas.forEach((r,i)=>set(`gastos.${i}`,R(r.tot)));
  c.rows.bens.forEach((r,i)=>set(`inventario.bens.${i}`,R(r.dep)));
}

/* ================= EVENTOS ================= */
function touched(){ if(D.origem==='exemplo'){ D.origem='meus'; renderBanner(); } save(); SIM=null; }
const pd=document.getElementById('p-dados');
pd.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset.p) return;
  setP(t.dataset.p, t.dataset.n? parseN(t.value) : t.value);
  touched(); updOuts(); renderHeader();
});
pd.addEventListener('change',e=>{
  const t=e.target; if(t.tagName!=='SELECT'||!t.dataset.p) return;
  setP(t.dataset.p, t.dataset.n? Number(t.value) : t.value);
  touched(); if(t.dataset.p.endsWith('.tipo')||t.dataset.p.startsWith('mec.tratores')) renderDados(); else updOuts();
});
pd.addEventListener('focusout',e=>{ if(e.target.dataset?.p?.startsWith('mec.tratores')&&e.target.dataset.p.endsWith('nome')) renderDados(); });
pd.addEventListener('click',e=>{
  const a=e.target.closest('[data-add]'), x=e.target.closest('[data-del]');
  if(a){ getP(a.dataset.add).push(clone(BLANK[a.dataset.blank])); touched(); renderDados(); return; }
  if(x){ const ks=x.dataset.del.split('.'), i=+ks.pop(); getP(ks.join('.')).splice(i,1); touched(); renderDados(); return; }
  if(e.target.id==='ioCopy'){
    const txt=JSON.stringify(D), ta=document.getElementById('ioText'), msg=document.getElementById('ioMsg');
    ta.value=txt;
    (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>msg.textContent='Copiado.').catch(()=>{ta.select();msg.textContent='Texto selecionado: use Ctrl+C.';});
  }
  if(e.target.id==='ioLoad'){
    const msg=document.getElementById('ioMsg');
    try{ const o=JSON.parse(document.getElementById('ioText').value); if(!o.geral||!o.pessoas) throw 0; D=Object.assign(clone(EXEMPLO),o); D.origem='meus'; save(); SIM=null; renderAll(); document.getElementById('ioMsg').textContent='Dados carregados.'; }
    catch(err){ msg.textContent='O texto não parece ser uma cópia desta página. Copie de novo e cole inteiro.'; }
  }
});

function renderBanner(){
  const b=document.getElementById('banner');
  const ex=D.origem==='exemplo';
  b.className='banner'+(ex?'':' mine');
  b.innerHTML=`<span>${ex?'<b>Dados de exemplo, fictícios.</b> Servem só para mostrar o método. Troque pelos seus em <b>Dados da safra</b>.':'<b>Seus dados.</b> Ficam salvos neste navegador.'}</span>
  <span class="acts" id="bActs">${ex?`<button class="btn" data-b="blank">Começar em branco</button>`:`<button class="btn ghost" data-b="ex">Recarregar o exemplo</button>`}</span>`;
}
document.getElementById('banner').addEventListener('click',e=>{
  const k=e.target.dataset.b, acts=document.getElementById('bActs');
  if(k==='blank'||k==='ex'){
    acts.innerHTML=`<span class="confirm">${k==='ex'?'Isso apaga seus dados.':'Isso limpa todas as tabelas.'} Confirmar? <button class="btn danger" data-b="${k}-ok">Sim</button><button class="btn" data-b="cancel">Não</button></span>`;
  } else if(k==='cancel') renderBanner();
  else if(k==='ex-ok'){ D=clone(EXEMPLO); save(); SIM=null; renderAll(); }
  else if(k==='blank-ok'){
    D=clone(EXEMPLO); D.origem='meus';
    D.geral={safra:'Minha safra',area:0,prod:0,mesesColheita:3};
    ['tipos','insumos','opsCond','opsColh','eventuais','itensColh','gastos','juros'].forEach(k=>D[k]=[]);
    D.pessoas.fixos=[]; D.pessoas.tratoristas=[]; D.mec.tratores=[{nome:'Trator',valor:0,cv:0,horasAno:0}];
    D.inventario={implValorHa:0,implVida:20,implRes:0,bens:[]}; D.terra={arrendHa:0,terraNuaHa:0,taxaCirc:6,taxaBens:6}; D.prolabore={mensal:0,pct:100};
    save(); SIM=null; renderAll(); show('dados');
  }
});

function renderHeader(){ document.getElementById('safraLabel').textContent=`${D.geral.safra||'Safra'} · ${nf(n0(D.geral.area),2)} ha · ${nf(n0(D.geral.prod),1)} sc/ha`; }
let TAB='raiox';
function show(t){
  TAB=t;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  ['raiox','sim','dados'].forEach(k=>document.getElementById('p-'+k).hidden=k!==t);
  if(t==='raiox') renderRaioX(); if(t==='sim') renderSim(); if(t==='dados') renderDados();
  try{ history.replaceState(null,'','#'+t);}catch(e){}
}
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]'); if(b) show(b.dataset.tab);});
function renderAll(){ renderHeader(); renderBanner(); show(TAB); }
const h=(location.hash||'').slice(1); if(['raiox','sim','dados'].includes(h)) TAB=h;
renderAll();
</script>
