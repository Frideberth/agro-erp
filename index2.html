<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Fazenda — Caderno de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C2818;
    --panel:#223020;
    --panel-line:#33452D;
    --paper:#F1E9D2;
    --paper-2:#E8DCB9;
    --paper-line:#CBB98C;
    --ink:#2A2016;
    --ink-soft:#6B5D46;
    --accent:#C98A2B;
    --accent-dark:#9C6A1E;
    --growth:#4F7942;
    --growth-dark:#3B5B32;
    --cost:#A23E2E;
    --cost-dark:#7E2F22;
    --khaki:#8B8368;
    --radius:6px;
    --shadow: 0 2px 0 rgba(0,0,0,0.15), 0 8px 20px -12px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:linear-gradient(rgba(0,0,0,0.12) 1px, transparent 1px);
    background-size: 100% 3px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  #app{display:grid; grid-template-columns:232px 1fr; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--panel);
    border-right:1px solid var(--panel-line);
    padding:22px 16px;
    display:flex; flex-direction:column; gap:18px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 4px;}
  .brand-mark{
    width:34px; height:34px; border-radius:50%;
    background:var(--accent); color:var(--panel);
    display:flex; align-items:center; justify-content:center;
    font-family:'Zilla Slab', serif; font-weight:700; font-size:17px; flex:none;
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.25;}
  .brand-text strong{font-family:'Zilla Slab', serif; font-size:16px; color:var(--paper); letter-spacing:0.2px;}
  .brand-text span{font-size:11px; color:#9FAE93; text-transform:uppercase; letter-spacing:0.08em;}

  nav{display:flex; flex-direction:column; gap:2px;}
  .nav-group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;
    color:#9FAE93; font-weight:700; padding:14px 10px 6px;
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; user-select:none; border-radius:4px;
    transition:color .15s ease;
  }
  .nav-group-label:hover{color:var(--paper);}
  .nav-group-label::after{
    content:'▾'; font-size:9px; color:#7C8A70; transition:transform .15s ease;
  }
  .nav-group-label.collapsed::after{transform:rotate(-90deg);}
  .nav-btn{
    display:flex; align-items:center; gap:10px;
    background:transparent; border:1px solid transparent;
    color:#C7D0BC; text-align:left; padding:8px 12px 8px 16px;
    border-radius:var(--radius); font-size:13px; font-weight:500;
    transition:background .15s ease, color .15s ease;
  }
  .nav-btn:hover{background:rgba(255,255,255,0.05); color:var(--paper);}
  .nav-btn.active{background:var(--accent); color:#241704; font-weight:600;}
  .sidebar-footer{margin-top:auto; font-size:11px; color:#7C8A70; line-height:1.5; padding:0 4px;}

  /* ---------- Main ---------- */
  main{padding:28px 34px 60px; max-width:1180px;}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:8px;}
  .topbar h1{font-family:'Zilla Slab', serif; font-size:28px; color:var(--paper); margin:0; font-weight:600;}
  .topbar .subtitle{color:#8E9B82; font-size:13px; margin-top:2px;}
  #loading-indicator{color:#9FAE93; font-size:12.5px; font-style:italic; max-width:260px; text-align:right;}
  #loading-indicator.hidden{display:none;}
  .tab-content.hidden{display:none;}

  /* ---------- Cards / paper ---------- */
  .paper{background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:14px; margin-bottom:24px;}
  .stat-card{padding:16px 18px; min-width:0; overflow:hidden;}
  .stat-card .label{font-size:11px; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-soft); font-weight:600;}
  .stat-card .value{font-family:'JetBrains Mono', monospace; font-size:clamp(14px, 1.6vw, 22px); font-weight:600; margin-top:6px; color:var(--ink); overflow-wrap:break-word; white-space:normal; line-height:1.2;}
  .stat-card .value.growth{color:var(--growth-dark);}
  .stat-card .value.cost{color:var(--cost-dark);}

  .section-title{font-family:'Zilla Slab', serif; font-size:18px; font-weight:600; color:var(--paper); margin:26px 0 12px;}
  .section-title:first-child{margin-top:0;}

  .alert-box{padding:14px 18px; margin-bottom:8px;}
  .alert-box div{font-size:13.5px; margin-bottom:6px;}
  .alert-box div:last-child{margin-bottom:0;}

  .note-box{padding:12px 18px; margin-top:16px; font-size:12px; color:var(--ink-soft);}

  /* ---------- Plot map ---------- */
  .plot-map{display:flex; flex-wrap:wrap; gap:10px; padding:16px; background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .plot{
    position:relative; min-width:130px; flex:1 1 130px; max-width:220px; aspect-ratio:4/3;
    border-radius:4px; border:1px solid rgba(0,0,0,0.18); padding:10px;
    display:flex; flex-direction:column; justify-content:space-between; color:#1B1508;
    background-image: repeating-linear-gradient(100deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 2px, transparent 2px, transparent 9px);
    font-family:inherit; margin:0; text-align:left; cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .plot:hover, .plot:focus-visible{transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,0.25);}
  .plot .plot-cta{
    align-self:flex-end; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    opacity:0; transition:opacity .12s ease;
  }
  .plot:hover .plot-cta, .plot:focus-visible .plot-cta{opacity:0.85;}
  .plot.status-andamento{background-color:#DFA84E;}
  .plot.status-planejada{background-color:#C9C3A4;}
  .plot.status-colhida{background-color:#7FA36D;}
  .plot.status-none{background-color:#DCD2AE; opacity:.75;}
  .plot .plot-name{font-family:'Zilla Slab', serif; font-weight:600; font-size:14px;}
  .plot .plot-area{font-family:'JetBrains Mono', monospace; font-size:11px; opacity:.85;}
  .plot .plot-crop{font-size:12px; font-weight:600;}
  .plot .plot-status{align-self:flex-start; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; background:rgba(255,255,255,0.55); padding:2px 6px; border-radius:3px; font-weight:600;}

  /* ---------- Recent lists ---------- */
  .list-card{padding:6px 0;}
  .list-row{padding:8px 16px; border-bottom:1px solid var(--paper-2); font-size:13px; display:flex; justify-content:space-between; gap:8px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .flag-late{color:var(--cost-dark); font-weight:700; font-size:10.5px; text-transform:uppercase; margin-left:6px;}

  /* ---------- Property cards (nested talhões) ---------- */
  .property-card{padding:16px 18px; margin-bottom:14px;}
  .property-head{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;}
  .property-title{font-family:'Zilla Slab', serif; font-size:16px; font-weight:600;}
  .property-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .property-sublabel{margin-top:14px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700;}

  /* ---------- Forms ---------- */
  .form-card{padding:16px 18px; margin-bottom:20px;}
  .form-card h3{font-family:'Zilla Slab', serif; margin:0 0 12px; font-size:15px; color:var(--ink); border-bottom:1px dashed var(--paper-line); padding-bottom:8px;}
  form.entry-form{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; align-items:end;}
  .field{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .field label{font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;}
  .field input, .field select{padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; color:var(--ink); font-size:13px; width:100%; min-width:0; box-sizing:border-box;}
  .field input:focus, .field select:focus{border-color:var(--accent);}
  .btn{padding:9px 16px; border-radius:4px; border:none; font-size:13px; font-weight:600; background:var(--accent); color:#241704; transition:background .15s ease;}
  .btn:hover{background:var(--accent-dark); color:var(--paper);}
  .btn-del{background:transparent; border:1px solid var(--cost); color:var(--cost-dark); padding:4px 9px; font-size:11px; border-radius:4px; font-weight:600;}
  .btn-del:hover{background:var(--cost); color:#fff;}
  .btn-edit{background:transparent; border:1px solid var(--accent-dark); color:var(--accent-dark); padding:4px 9px; font-size:11px; border-radius:4px; font-weight:600; margin-right:6px;}
  .btn-edit:hover{background:var(--accent-dark); color:var(--paper);}
  .btn-cancel{background:transparent; border:1px solid var(--paper-line); color:var(--ink-soft); padding:9px 16px; font-size:13px; border-radius:4px; font-weight:600; margin-left:8px;}
  .btn-cancel:hover{background:var(--paper-2);}

  /* ---------- Tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); border-bottom:1px solid var(--paper-line); padding:8px 10px; font-weight:600;}
  tbody td{padding:9px 10px; border-bottom:1px solid var(--paper-2);}
  tbody tr:last-child td{border-bottom:none;}
  .num{font-family:'JetBrains Mono', monospace;}
  .num.growth{color:var(--growth-dark); font-weight:600;}
  .num.cost{color:var(--cost-dark); font-weight:600;}
  .badge{font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; padding:2px 7px; border-radius:3px; font-weight:700;}
  .badge.status-andamento{background:#DFA84E; color:#241704;}
  .badge.status-planejada{background:#C9C3A4; color:#241704;}
  .badge.status-colhida{background:#7FA36D; color:#0E1D0A;}
  .badge.tipo-custo{background:var(--cost); color:#fff;}
  .badge.tipo-receita{background:var(--growth); color:#fff;}

  .empty-state{padding:30px 20px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
  .table-wrap{overflow-x:auto;}

  @media (max-width: 820px){
    #app{grid-template-columns:1fr;}
    .sidebar{position:sticky; top:0; z-index:10; height:auto; flex-direction:row; align-items:center; padding:12px 14px; gap:14px; overflow-x:auto; overflow-y:visible;}
    .brand-text span{display:none;}
    nav{flex-direction:row;}
    .nav-group-label{display:none;}
    .nav-btn{display:flex !important;}
    .sidebar-footer{display:none;}
    main{padding:20px 16px 50px;}
  }

  .no-print{}

  .auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card{
    width:100%; max-width:380px; padding:30px 28px;
  }
  .auth-card h2{font-family:'Zilla Slab', serif; margin:0 0 4px; font-size:22px; color:var(--ink);}
  .auth-card p{font-size:13px; color:var(--ink-soft); margin:0 0 20px; line-height:1.5;}
  .auth-card .field{margin-bottom:14px;}
  .auth-card .btn{width:100%;}
  .auth-error{color:var(--cost-dark); font-size:12.5px; margin:-6px 0 14px; font-weight:600;}
  .auth-link{background:none; border:none; color:var(--ink-soft); font-size:12px; text-decoration:underline; cursor:pointer; margin-top:14px; padding:0;}
  .workspace-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border:1px solid var(--paper-line); border-radius:4px; margin-bottom:8px;
    background:#FBF7EC; cursor:pointer; font-size:14px; font-weight:600;
  }
  .workspace-item:hover{border-color:var(--accent);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,26,16,0.6); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{width:100%; max-width:360px; padding:22px;}
  .modal-cat-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:6px 0; border-bottom:1px solid var(--paper-2); font-size:13.5px;
  }
  .modal-cat-row:last-child{border-bottom:none;}
  .field-with-add{display:flex; align-items:flex-end; gap:6px; min-width:0;}
  .field-with-add .field{flex:1; min-width:0;}
  .btn-add-inline{
    background:var(--accent); color:#241704; border:none; border-radius:4px;
    width:34px; height:34px; font-size:18px; font-weight:700; line-height:1; cursor:pointer; flex:none;
  }
  .btn-add-inline:hover{background:var(--accent-dark); color:var(--paper);}

  @media print{
    .sidebar, #loading-indicator, .form-card, .btn-del, .no-print{display:none !important;}
    #app{display:block !important;}
    main{padding:0; max-width:100%;}
    body{background:#fff;}
    .paper{box-shadow:none; border:1px solid #ccc;}
  }
</style>
</head>
<body>
<div id="gate-screen" class="auth-screen" style="display:none;">
  <div class="auth-card paper"></div>
</div>
<div id="workspace-screen" class="auth-screen" style="display:none;">
  <div class="auth-card paper"></div>
</div>
<div id="cat-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Categorias de Produto</h3>
    <div id="cat-modal-list" style="margin-bottom:14px;"></div>
    <form id="form-cat-modal" style="display:flex; gap:8px;">
      <input type="text" id="cat-modal-input" name="nome" placeholder="Nova categoria" required style="flex:1; padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
      <button type="submit" class="btn">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-cat-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="parceiro-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Novo Parceiro</h3>
    <form id="form-parceiro-modal">
      <div class="field"><label>Nome</label><input type="text" id="parceiro-modal-nome" name="nome" placeholder="Nome do parceiro" required style="width:100%; padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;"></div>
      <div class="field"><label>Tipo</label>
        <select id="parceiro-modal-tipo" name="tipo" style="width:100%; padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
          <option value="Fornecedor">Fornecedor</option>
          <option value="Cliente">Cliente</option>
          <option value="Fornecedor e Cliente">Fornecedor e Cliente</option>
        </select>
      </div>
      <button type="submit" class="btn" style="width:100%; margin-top:6px;">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-parceiro-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="tipo-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Tipos de Atividade</h3>
    <div id="tipo-modal-list" style="margin-bottom:14px;"></div>
    <form id="form-tipo-modal" style="display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="tipo-modal-input" name="nome" placeholder="Nova atividade (ex: Irrigação)" required style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
      <select id="tipo-modal-cor" name="cor" style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;"></select>
      <button type="submit" class="btn">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-tipo-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="conta-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Contas Financeiras</h3>
    <div id="conta-modal-list" style="margin-bottom:14px; max-height:220px; overflow-y:auto;"></div>
    <form id="form-conta-modal" style="display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="conta-modal-input" name="nome" placeholder="Nome da conta (ex: Fertilizante)" required style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
      <div class="field-with-add">
        <select id="conta-modal-subgrupo" name="subgrupoId" style="flex:1; padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;"></select>
        <button type="button" class="btn-add-inline" data-action="open-subgrupo-modal" title="Novo subgrupo">+</button>
      </div>
      <button type="submit" class="btn">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-conta-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="subgrupo-modal-overlay" class="modal-overlay" style="display:none; z-index:110;">
  <div class="modal-box paper">
    <h3 style="margin:0 0 12px; font-family:'Zilla Slab',serif; font-size:16px; border-bottom:1px dashed var(--paper-line); padding-bottom:8px;">Subgrupos Financeiros</h3>
    <div id="subgrupo-modal-list" style="margin-bottom:14px; max-height:220px; overflow-y:auto;"></div>
    <form id="form-subgrupo-modal" style="display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="subgrupo-modal-input" name="nome" placeholder="Nome do subgrupo (ex: Custo Insumos Agrícolas)" required style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
      <select id="subgrupo-modal-tipo" name="tipo" style="padding:8px 9px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;">
        <option value="custo">Despesa</option>
        <option value="receita">Receita</option>
      </select>
      <button type="submit" class="btn">Adicionar</button>
    </form>
    <button type="button" class="btn-cancel" data-action="close-subgrupo-modal" style="margin-top:14px; width:100%;">Fechar</button>
  </div>
</div>
<div id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">⌂</div>
      <div class="brand-text"><strong>Minha Fazenda</strong><span>Caderno de gestão</span></div>
    </div>
    <nav id="nav">
      <button class="nav-btn active" data-tab="painel">Dashboard</button>
      <div class="nav-group-label" data-group="cadastros">Cadastros</div>
      <button class="nav-btn" data-tab="propriedades">Propriedades</button>
      <button class="nav-btn" data-tab="talhoes">Talhões</button>
      <button class="nav-btn" data-tab="safras">Safras</button>
      <button class="nav-btn" data-tab="culturas">Culturas</button>
      <button class="nav-btn" data-tab="produtos">Produtos</button>
      <button class="nav-btn" data-tab="parceiros">Parceiros</button>
      <button class="nav-btn" data-tab="equipe">Funcionários</button>
      <button class="nav-btn" data-tab="patrimonio">Patrimônio</button>
      <div class="nav-group-label" data-group="campo">Campo</div>
      <button class="nav-btn" data-tab="producao">Colheita</button>
      <button class="nav-btn" data-tab="vendasAntecipadas">Venda Antecipada</button>
      <button class="nav-btn" data-tab="operacoes">Diário de Campo</button>
      <div class="nav-group-label" data-group="financeiro">Financeiro</div>
      <button class="nav-btn" data-tab="financeiro">Lançamentos</button>
      <button class="nav-btn" data-tab="compras">NF-e</button>
      <button class="nav-btn" data-tab="contasPagar">Contas a Pagar</button>
      <button class="nav-btn" data-tab="contasReceber">Contas a Receber</button>
      <div class="nav-group-label" data-group="contratos">Contratos e Serviços</div>

  function nomePatrimonio(id){ var p = state.patrimonio.find(function(x){ return x.id === id; }); return p ? p.nome : '—'; }
  function horasUsoTotais(patrimonioId){
    return state.producao.filter(function(p){ return p.maquinaId === patrimonioId; }).reduce(function(s,p){ return s + (Number(p.horasUso)||0); }, 0);
  }

  function calcDepreciacao(item){
    var valor = Number(item.valor) || 0;
    var vidaUtil = Number(item.vidaUtilAnos) || 0;
    var percResidual = Number(item.percentualResidual) || 0;
    if(!item.dataAquisicao || !vidaUtil) return valor;
    var aquisicao = new Date(item.dataAquisicao);
    if(isNaN(aquisicao.getTime())) return valor;
    var hoje = new Date();
    var anos = (hoje - aquisicao) / (365.25 * 24 * 3600 * 1000);
    if(anos < 0) anos = 0;
    var fracao = Math.min(anos / vidaUtil, 1);
    var valorResidual = valor * (percResidual / 100);
    var depreciavel = valor - valorResidual;
    var atual = valor - (depreciavel * fracao);
    return Math.max(atual, valorResidual);
  }
  function calcValorFinanciamentoComJuros(item){
    var principal = Number(item.valorTotal) || 0;
    var taxa = Number(item.taxaJuros) || 0;
    if(!item.dataContratacao || !item.dataFinal || !taxa) return null;
    var inicio = new Date(item.dataContratacao);
    var fim = new Date(item.dataFinal);
    if(isNaN(inicio.getTime()) || isNaN(fim.getTime()) || fim <= inicio) return null;
    var anos = (fim - inicio) / (365.25 * 24 * 3600 * 1000);
    return principal * Math.pow(1 + (taxa / 100), anos);
  }
  function financiamentoValorBase(item){
    var comJuros = calcValorFinanciamentoComJuros(item);
    return comJuros !== null ? comJuros : (Number(item.valorTotal) || 0);
  }
  function financiamentoSaldoDevedor(item){
    var base = financiamentoValorBase(item);
    var pago = (Number(item.parcelasPagas) || 0) * (Number(item.valorParcela) || 0);
    return Math.max(base - pago, 0);
  }

    var qtd = Number(item.quantidade) || 1;
    return qtd * (Number(item.valor) || 0);
  }

        {name:'periodicidade', type:'select', label:'Periodicidade', options:[{value:'Anual', label:'Anual'}, {value:'Mensal', label:'Mensal'}, {value:'Por Safra', label:'Por Safra'}]},

        {name:'status', type:'select', label:'Status', options:[{value:'Ativo', label:'Ativo'}, {value:'Encerrado', label:'Encerrado'}]},
        {name:'observacao', type:'text', label:'Observação', placeholder:''}
      ],
      columns: [

      fields: [

        {name:'talhaoId', type:'select', label:'Talhão vinculado (opcional)', optionsFn: talhaoOptionsFn},
        {name:'contaId', type:'select', label:'Conta (para lançar as parcelas pagas)', optionsFn: function(){ return state.contasFinanceiro.map(function(c){ return {value:c.id, label: contaLabel(c.id)}; }); }},
        {name:'status', type:'select', label:'Status', options:[{value:'Ativo', label:'Ativo'}, {value:'Quitado', label:'Quitado'}]},
        {name:'observacao', type:'text', label:'Observação', placeholder:''}
      ],
      columns: [
        {key:'banco', label:'Banco'},
        {key:'tipo', label:'Tipo', format:'badge', colors:{'Custeio':'#C98A2B', 'Investimento':'#4F7942', 'Aquisição':'#A9B7C6', 'Outro':'#8B8368'}},

        {key:'valorTotal', label:'Valor financiado', format:'brl'},

  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }
  function fmtBRL(n){ return (Number(n) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
  function fmtHa(n){ return (Number(n) || 0).toLocaleString('pt-BR', {maximumFractionDigits:2}) + ' ha'; }
  function fmtNum(n){ return (Number(n) || 0).toLocaleString('pt-BR', {maximumFractionDigits:2}); }
  function fmtDate(d){
    if(!d) return '—';
    var parts = d.split('-');
    if(parts.length !== 3) return d;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }
  function monthLabel(ym){
    var parts = ym.split('-');
    var idx = parseInt(parts[1], 10) - 1;
    return (MESES[idx] || parts[1]) + '/' + parts[0];
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------------- Storage ---------------- */
  var hasCloudStorage = !!(window.storage && typeof window.storage.get === 'function');
  var hasLocalStorage = (function(){
    try{ var k='__fazenda_test__'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  })();
  var hasNetlifyBlobs = false;
  var NETLIFY_STORAGE_ENDPOINT = '/.netlify/functions/storage';
  var LS_PREFIX = 'fazenda:';
  var currentWorkspaceId = null;

  function blobsGet(storageKey){
    return fetch(NETLIFY_STORAGE_ENDPOINT + '?key=' + encodeURIComponent(storageKey))
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(v){ return (v === undefined) ? null : v; })
      .catch(function(err){ console.error('Erro ao ler (Netlify Blobs)', storageKey, err); return null; });
  }
  function blobsSet(storageKey, value){
    return fetch(NETLIFY_STORAGE_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key: storageKey, value: value})
    }).catch(function(err){ console.error('Erro ao salvar (Netlify Blobs)', storageKey, err); });
  }

  function rawGet(storageKey){
    if(hasNetlifyBlobs){ return blobsGet(storageKey); }
    if(hasCloudStorage){
      return Promise.resolve()
        .then(function(){ return window.storage.get(storageKey, true); })
        .then(function(res){ return res && res.value ? JSON.parse(res.value) : null; })
        .catch(function(){ return null; });
    }
    if(hasLocalStorage){
      try{
        var raw = window.localStorage.getItem(LS_PREFIX + storageKey);
        return Promise.resolve(raw ? JSON.parse(raw) : null);
      }catch(e){ return Promise.resolve(null); }
    }
    return Promise.resolve(null);
  }
  function rawSet(storageKey, value){
    if(hasNetlifyBlobs){ return blobsSet(storageKey, value); }
    if(hasCloudStorage){
      return Promise.resolve()
        .then(function(){ return window.storage.set(storageKey, JSON.stringify(value), true); })
        .catch(function(err){ console.error('Erro ao salvar', storageKey, err); });
    }
    if(hasLocalStorage){
      try{ window.localStorage.setItem(LS_PREFIX + storageKey, JSON.stringify(value)); }catch(e){ console.error('Erro ao salvar', storageKey, e); }
    }
    return Promise.resolve();
  }

  function migrateLocalStorageToBlobs(){
    if(!hasLocalStorage) return Promise.resolve();
    var chaves = [];
    try{
      for(var i = 0; i < window.localStorage.length; i++){
        var k = window.localStorage.key(i);
        if(k && k.indexOf(LS_PREFIX) === 0) chaves.push(k.slice(LS_PREFIX.length));
      }
    }catch(e){ return Promise.resolve(); }
    var tarefas = chaves.map(function(chave){
      var raw = null;
      try{ raw = window.localStorage.getItem(LS_PREFIX + chave); }catch(e){}
      if(!raw) return Promise.resolve();
      var valor;
      try{ valor = JSON.parse(raw); }catch(e){ return Promise.resolve(); }
      return blobsSet(chave, valor);
    });
    return Promise.all(tarefas);
  }

  function detectStorageBackend(){
    if(hasCloudStorage) return Promise.resolve();
    return fetch(NETLIFY_STORAGE_ENDPOINT + '?key=__ping__')
      .then(function(res){
        if(!res.ok){
          console.warn('Netlify Blobs: function respondeu com status ' + res.status + ' — usando localStorage como alternativa.');
          return;
        }
        hasNetlifyBlobs = true;
        console.info('Netlify Blobs: conectado com sucesso.');
        return blobsGet('global::workspaces').then(function(blobsWs){
          if(blobsWs && blobsWs.length) return;
          var lsWs = null;
          try{ var raw = window.localStorage.getItem(LS_PREFIX + 'global::workspaces'); lsWs = raw ? JSON.parse(raw) : null; }catch(e){}
          if(lsWs && lsWs.length){
            console.info('Netlify Blobs: migrando dados locais existentes...');
            return migrateLocalStorageToBlobs();
          }
        });
      })
      .catch(function(err){
        console.warn('Netlify Blobs: não foi possível conectar (' + err + ') — usando localStorage como alternativa.');
      });
  }

  // Chaves globais (não dependem de qual propriedade/cliente está selecionado)
  function loadGlobal(key){ return rawGet('global::' + key); }
  function saveGlobal(key, value){ return rawSet('global::' + key, value); }

  // Chaves de dados da propriedade/cliente atualmente selecionado
  function loadKey(key){
    return rawGet(currentWorkspaceId + '::' + key).then(function(v){ return v || []; });
  }
  function saveKey(key, arr){
    return rawSet(currentWorkspaceId + '::' + key, arr);
  }

  function loadWorkspaces(){ return loadGlobal('workspaces').then(function(v){ return Array.isArray(v) ? v : []; }); }
  function saveWorkspaces(list){ return saveGlobal('workspaces', list); }

  function migrateLegacyIfNeeded(){
    return rawGet('talhoes').then(function(legacyTalhoes){
      if(!legacyTalhoes || !legacyTalhoes.length){ return null; }
      var newId = 'ws-' + Date.now();
      return Promise.all(ALL_KEYS.map(function(k){
        return rawGet(k).then(function(val){
          if(val && val.length){ return rawSet(newId + '::' + k, val); }
        });
      })).then(function(){
        return loadWorkspaces().then(function(list){
          list.push({id:newId, nome:'Minha Fazenda', criadoEm:Date.now()});
          return saveWorkspaces(list).then(function(){ return newId; });
        });
      });
    });
  }

    document.getElementById('gate-screen').style.display = 'none';

  }

  function contasAVencer(dias){
    var hoje = new Date(); hoje.setHours(0,0,0,0);
    var limite = new Date(hoje.getTime() + dias * 24 * 3600 * 1000);
    var lista = [];
    state.financeiro.forEach(function(f){
      if(f.status === 'Pendente' && f.vencimento){
        var d = new Date(f.vencimento);
        if(d <= limite) lista.push({desc:(f.tipo==='custo'?'A pagar':'A receber') + ' · ' + (f.descricao || f.categoria), valor:Number(f.valor)||0, vencimento:f.vencimento, tipo: f.tipo==='receita'?'entrada':'saida', atrasado: d < hoje});
      }
    });
    state.contasPagar.forEach(function(c){
      if(c.status === 'Pendente' && c.vencimento){
        var d = new Date(c.vencimento);
        if(d <= limite) lista.push({desc:'A pagar · ' + c.descricao, valor:Number(c.valor)||0, vencimento:c.vencimento, tipo:'saida', atrasado: d < hoje});
      }
    });
    state.contasReceber.forEach(function(c){
      if(c.status === 'Pendente' && c.vencimento){
        var d = new Date(c.vencimento);
        if(d <= limite) lista.push({desc:'A receber · ' + c.descricao, valor:Number(c.valor)||0, vencimento:c.vencimento, tipo:'entrada', atrasado: d < hoje});
      }
    });
    lista.sort(function(a,b){ return new Date(a.vencimento) - new Date(b.vencimento); });
    return lista;
  }

  function buildCashEvents(){
    var events = [];
    state.financeiro.forEach(function(f){
      var st = f.status || 'Pago';
      if(st === 'Pendente'){ events.push({date: f.vencimento || f.data, valor: Number(f.valor)||0, tipo: f.tipo === 'receita' ? 'entrada' : 'saida', realizado:false}); }
      else { events.push({date: f.data, valor: Number(f.valor)||0, tipo: f.tipo === 'receita' ? 'entrada' : 'saida', realizado:true}); }
    });
    state.contasPagar.forEach(function(c){
      if(c.status === 'Pago'){ events.push({date: c.dataPagamento || c.vencimento, valor:Number(c.valor)||0, tipo:'saida', realizado:true}); }
      else { events.push({date: c.vencimento, valor:Number(c.valor)||0, tipo:'saida', realizado:false}); }
    });
    state.contasReceber.forEach(function(c){
      if(c.status === 'Recebido'){ events.push({date: c.dataRecebimento || c.vencimento, valor:Number(c.valor)||0, tipo:'entrada', realizado:true}); }
      else { events.push({date: c.vencimento, valor:Number(c.valor)||0, tipo:'entrada', realizado:false}); }
    });
    return events.filter(function(e){ return e.date; });
  }

  /* ---------------- Tab switching ---------------- */
  function switchTab(tab){
    document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === tab); });
    document.querySelectorAll('.tab-content').forEach(function(sec){ sec.classList.toggle('hidden', sec.id !== 'tab-' + tab); });
    document.getElementById('page-title').textContent = pageMeta[tab].title;
    document.getElementById('page-subtitle').textContent = pageMeta[tab].subtitle;

  function safeRender(nomeAba, fn){
    try{ fn(); }
    catch(err){
      console.error('Erro ao renderizar "' + nomeAba + '":', err);
      var el = document.getElementById('tab-' + nomeAba);
      if(el){
        el.innerHTML = '<div class="paper note-box">Não foi possível carregar esta aba (erro técnico: ' + escapeHtml(String(err && err.message || err)) + '). As demais abas continuam funcionando normalmente.</div>';

    }
  }

    var totalReceitas = state.financeiro.filter(function(f){ return f.tipo === 'receita' && (f.status||'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
    var saldo = totalReceitas - totalCustos;
    var estoque = estoqueResumo();

    var html = '';

    var hojeMs = Date.now();
    var colheitasProximas = state.safras.filter(function(s){
      if(s.status !== 'andamento' || !s.previsaoColheita) return false;
      var dias = Math.ceil((new Date(s.previsaoColheita + 'T00:00:00').getTime() - hojeMs) / 86400000);
      return dias <= 15;

    if(estoqueBaixo.length || manutencao.length || colheitasProximas.length){
      html += '<div class="paper alert-box">';
      if(estoqueBaixo.length){
        html += '<div><strong style="color:var(--cost-dark);">Estoque abaixo do mínimo:</strong> ' + estoqueBaixo.map(function(p){ return escapeHtml(p.nome); }).join(', ') + '</div>';

      if(manutencao.length){

    html += '<div><div class="section-title" style="margin-top:0;">Últimas atividades</div>';

        html += '<button type="button" class="btn-edit" data-action="salvar-cotacao" data-id="' + c.id + '">Salvar</button>';

        html += '</span></div>';
      });

    html += '</div>';

    var safrasAtivas = state.safras.filter(function(s){ return s.ativa !== false; });

    var recentFin = state.financeiro.slice().sort(function(a,b){ return (b.criadoEm||0)-(a.criadoEm||0); }).slice(0,5);
    html += '<div><div class="section-title" style="margin-top:0;">Últimos lançamentos</div>';
    if(!recentFin.length){
      html += '<div class="paper empty-state">Nenhum lançamento ainda.</div>';

      html += '<div class="paper list-card">';
      recentFin.forEach(function(f){
        html += '<div class="list-row"><span>' + escapeHtml(f.categoria) + '</span><span class="num ' + (f.tipo==='custo'?'cost':'growth') + '">' + (f.tipo==='custo'?'−':'+') + ' ' + fmtBRL(f.valor) + '</span></div>';
      });

    html += '</div>';

    html += '</div>';

    if(safrasAtivas.length){

      });

    }

    el.innerHTML = html;

  /* ---------------- Generic cadastro helpers ---------------- */
  function formatColumn(col, value){
    if(value === undefined || value === null || value === ''){ return '—'; }
    switch(col.format){
      case 'ha': return fmtHa(value);
      case 'brl': return fmtBRL(value);
      case 'num': return escapeHtml(value);
      case 'date': return fmtDate(value);
      case 'badge':
        var bg = (col.colors && col.colors[value]) ? col.colors[value] : '#C9C3A4';
        return '<span class="badge" style="background:' + bg + '; color:#1B1508">' + escapeHtml(value) + '</span>';
      default: return escapeHtml(value);
    }
  }

  function buildGenericFormHtml(entityKey){
    var cfg = ENTITY_CONFIGS[entityKey];
    var editingRecord = null;
    if(editState && editState.scope === 'generic' && editState.entityKey === entityKey){
      editingRecord = state[entityKey].find(function(x){ return x.id === editState.id; }) || null;
    }
    var html = '<div class="paper form-card"><h3>' + (editingRecord ? 'Editar ' + cfg.label.toLowerCase() : 'Novo(a) ' + cfg.label.toLowerCase()) + '</h3>';
    html += '<form class="entry-form" data-form="generic" data-entity="' + entityKey + '"' + (editingRecord ? ' data-editing-id="' + editingRecord.id + '"' : '') + '>';
    cfg.fields.forEach(function(f){
      var current = editingRecord ? editingRecord[f.name] : undefined;
      if(f.type === 'select'){
        var opts = typeof f.optionsFn === 'function' ? f.optionsFn(current) : f.options;
        if(f.addButton){
          html += '<div class="field-with-add">' + selectField(f.name, f.label, opts, current) + '<button type="button" class="btn-add-inline" data-action="' + f.addButton.action + '" title="' + f.addButton.title + '">+</button></div>';
        } else {
          html += selectField(f.name, f.label, opts, current);
        }
      } else {
        html += field(f.type, f.name, f.label, !!f.required, f.placeholder || '', f.extra || {}, current);
      }
    });
    html += '<button type="submit" class="btn">' + (editingRecord ? 'Salvar alterações' : 'Adicionar') + '</button>';
    if(editingRecord) html += '<button type="button" class="btn-cancel" data-action="cancel-edit">Cancelar</button>';
    html += '</form></div>';
    return html;
  }

  function buildGenericTableHtml(entityKey){
    var cfg = ENTITY_CONFIGS[entityKey];
    var list = state[entityKey];
    var html = '<div class="paper">';
    if(!list.length){
      html += '<div class="empty-state">Nenhum(a) ' + cfg.label.toLowerCase() + ' cadastrado(a) ainda.</div>';
    } else {
      if(list.length > 4){
        html += '<div style="padding:14px 18px 0;"><input type="text" id="search-' + entityKey + '" placeholder="Buscar..." style="width:100%; max-width:280px; padding:7px 10px; border:1px solid var(--paper-line); border-radius:4px; background:#FBF7EC; font-size:13px;"></div>';
      }
      html += '<div class="table-wrap"><table><thead><tr>';
      cfg.columns.forEach(function(c){ html += '<th>' + c.label + '</th>'; });
      html += '<th></th></tr></thead><tbody>';
      list.slice().sort(function(a,b){ return (b.criadoEm||0)-(a.criadoEm||0); }).forEach(function(item){
        html += '<tr>';
        cfg.columns.forEach(function(c){
          var val = c.compute ? c.compute(item) : item[c.key];
          var numClass = (c.format === 'ha' || c.format === 'brl' || c.format === 'num') ? ' class="num"' : '';
          html += '<td' + numClass + '>' + formatColumn(c, val) + '</td>';
        });
        html += '<td><button class="btn-edit" data-action="edit-generic" data-entity="' + entityKey + '" data-id="' + item.id + '">Editar</button>';
        html += '<button class="btn-del" data-action="del-generic" data-entity="' + entityKey + '" data-id="' + item.id + '">Remover</button>';
        if(cfg.extraRowAction) html += cfg.extraRowAction(item);
        html += '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
    return html;
  }

  function renderGenericTab(entityKey){
    document.getElementById('tab-' + entityKey).innerHTML = buildGenericFormHtml(entityKey) + buildGenericTableHtml(entityKey);

  function verificarStatusCertificado(){
    var elStatus = document.getElementById('certificado-status');
    var elForm = document.getElementById('certificado-form-area');
    if(!elStatus || !elForm) return;
    fetch('/.netlify/functions/certificado')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.configurado){
          elStatus.innerHTML = '✅ Certificado configurado: <strong>' + escapeHtml(data.nomeArquivo || 'certificado') + '</strong>' + (data.atualizadoEm ? ' (enviado em ' + fmtDate(data.atualizadoEm.slice(0,10)) + ')' : '');
          elForm.innerHTML = '<button type="button" class="btn-del" data-action="remover-certificado">Remover certificado</button>';
        } else {
          elStatus.innerHTML = data.erro ? ('⚠️ ' + escapeHtml(data.erro)) : 'Nenhum certificado configurado ainda.';
          elForm.innerHTML = '<div class="entry-form">'
            + '<div class="field"><label>Arquivo do certificado (.pfx ou .p12)</label><input type="file" id="cert-file-input" accept=".pfx,.p12"></div>'
            + '<div class="field"><label>Senha do certificado</label><input type="password" id="cert-senha-input" placeholder="Senha"></div>'
            + '<button type="button" class="btn" data-action="enviar-certificado" style="align-self:end;">Enviar com segurança</button>'
            + '</div>';
        }
      })
      .catch(function(){
        elStatus.textContent = 'Não foi possível verificar agora — normal se você ainda não publicou a function ou não configurou CERT_ENCRYPTION_KEY no Netlify.';
        elForm.innerHTML = '';
      });
  }

  function enviarCertificado(){
    var fileInput = document.getElementById('cert-file-input');
    var senhaInput = document.getElementById('cert-senha-input');
    var file = fileInput && fileInput.files && fileInput.files[0];
    var senha = senhaInput ? senhaInput.value : '';
    if(!file){ alert('Selecione o arquivo do certificado (.pfx ou .p12).'); return; }
    if(!senha){ alert('Digite a senha do certificado.'); return; }
    if(!window.confirm('Confirma o envio? O certificado é guardado de forma criptografada — a senha não fica visível pra ninguém depois de enviada.')) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var base64 = String(e.target.result).split(',')[1] || '';
      fetch('/.netlify/functions/certificado', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({certBase64: base64, senha: senha, nomeArquivo: file.name})
      })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(data.ok){
            alert('Certificado enviado e guardado com segurança.');
            if(senhaInput) senhaInput.value = '';
            verificarStatusCertificado();
          } else {
            alert('Não foi possível enviar: ' + (data.error || 'erro desconhecido. Confira se a variável CERT_ENCRYPTION_KEY está configurada no Netlify.'));
          }
        })
        .catch(function(){ alert('Não foi possível enviar o certificado. Confira sua conexão e tente de novo.'); });
    };
    reader.readAsDataURL(file);
  }

  var sefazProximoTesteLiberadoEm = 0;

  function testarConsultaSefaz(){
    var agora = Date.now();
    if(agora < sefazProximoTesteLiberadoEm){
      var minutosFaltando = Math.ceil((sefazProximoTesteLiberadoEm - agora) / 60000);
      alert('A SEFAZ pediu pra esperar antes de consultar de novo. Faltam aproximadamente ' + minutosFaltando + ' minuto(s).');
      return;
    }
    var ambienteInput = document.getElementById('f-sefaz-ambiente');
    var ufInput = document.getElementById('f-sefaz-uf');
    var docInput = document.getElementById('f-sefaz-documento');
    var nsuInput = document.getElementById('f-sefaz-ultnsu');
    var resultadoEl = document.getElementById('sefaz-resultado');
    var ambiente = ambienteInput ? ambienteInput.value : 'homologacao';
    var uf = ufInput ? ufInput.value : '';
    var documento = docInput ? docInput.value.replace(/\D/g, '') : '';
    var ultNSU = nsuInput ? nsuInput.value.replace(/\D/g, '') : '0';
    if(!documento){ alert('Digite o CPF ou CNPJ (só números).'); return; }
    var avisoAmbiente = ambiente === 'producao' ? 'PRODUÇÃO (dados reais)' : 'HOMOLOGAÇÃO (testes)';
    if(!window.confirm('Isso vai consultar a SEFAZ em ambiente de ' + avisoAmbiente + ' usando o certificado guardado. Confirma?')) return;
    if(resultadoEl){ resultadoEl.style.display = 'block'; resultadoEl.textContent = 'Consultando a SEFAZ, aguarde…'; }
    fetch('/.netlify/functions/sefaz-consulta', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ambiente: ambiente, uf: uf, documento: documento, ultNSU: ultNSU})
    })
      .then(function(r){ return r.json(); })
      .then(function(data){
        sefazUltimaResposta = data;
        sefazIgnoradasNaUltimaConsulta = 0;
        if(data.documentos && data.documentos.length){
          var nsusJaTemos = sefazDocumentosAcumulados.map(function(d){ return d.nsu; });
          var chavesJaImportadas = state.notasFiscaisImportadas.map(function(n){ return n.chave; });
          data.documentos.forEach(function(doc){
            if(!doc.schema || doc.schema.indexOf('procNFe') === -1) return;
            if(nsusJaTemos.indexOf(doc.nsu) !== -1) return;
            var parsedRapido = parseNFeXML(doc.xml);
            if(parsedRapido && parsedRapido.chave && chavesJaImportadas.indexOf(parsedRapido.chave) !== -1){
              sefazIgnoradasNaUltimaConsulta++;
              return;
            }
            sefazDocumentosAcumulados.push(doc);
          });
        }
        if(data.cStat === '656'){
          sefazProximoTesteLiberadoEm = Date.now() + 60 * 60 * 1000;
        } else {
          sefazProximoTesteLiberadoEm = Date.now() + 2 * 60 * 1000;
        }
        state.sefazNotasPendentes = sefazDocumentosAcumulados;
        saveKey('sefazNotasPendentes', state.sefazNotasPendentes);
        if(data.ultNSU){
          state.sefazProgresso = [{ultNSU: data.ultNSU, maxNSU: data.maxNSU || '', atualizadoEm: new Date().toISOString()}];
          saveKey('sefazProgresso', state.sefazProgresso);
        }
        renderCompras();
      })
      .catch(function(err){
        sefazUltimaResposta = { erro: String(err) };
        renderCompras();
      });
  }

  function trazerNotasSefaz(){
    if(!sefazDocumentosAcumulados.length){ alert('Nenhuma nota completa acumulada ainda.'); return; }

    var qtdInput = document.getElementById('sefaz-qtd-notas');
    var qtdDesejada = qtdInput ? parseInt(qtdInput.value, 10) : NaN;
    var docsParaProcessar, docsRestantes;
    if(qtdDesejada && qtdDesejada > 0 && qtdDesejada < sefazDocumentosAcumulados.length){
      docsParaProcessar = sefazDocumentosAcumulados.slice(-qtdDesejada); // pega as últimas (mais recentes)
      docsRestantes = sefazDocumentosAcumulados.slice(0, sefazDocumentosAcumulados.length - qtdDesejada);
    } else {
      docsParaProcessar = sefazDocumentosAcumulados;
      docsRestantes = [];
    }

    var novosItens = [];
    var falhas = 0;
    docsParaProcessar.forEach(function(doc){
      var parsed = parseNFeXML(doc.xml);
      if(!parsed){ falhas++; return; }
      var jaImportada = parsed.chave && state.notasFiscaisImportadas.some(function(n){ return n.chave === parsed.chave; });
      parsed.itens.forEach(function(item){
        var match = state.produtos.find(function(p){ return p.nome.trim().toLowerCase() === item.xProd.trim().toLowerCase(); });
        item.incluir = !jaImportada;
        item.produtoId = match ? match.id : '';
        item.destino = 'compra';
        item.safraId = '';
        item.numeroNota = parsed.numero;
        item.dataEmissaoNota = parsed.dataEmissao;
        item.fornecedorNomeNota = parsed.fornecedorNome;
        item.chaveNota = parsed.chave;
        item.naturezaNota = parsed.natureza;
        novosItens.push(item);
      });
    });

    if(!novosItens.length){ alert('Não consegui extrair itens dessas notas.' + (falhas ? ' (' + falhas + ' com erro de leitura)' : '')); return; }

    if(!nfeImportada) nfeImportada = { itens: [] };
    nfeImportada.itens = nfeImportada.itens.concat(novosItens);
    sefazDocumentosAcumulados = docsRestantes;
    state.sefazItensRevisao = nfeImportada.itens;
    state.sefazNotasPendentes = sefazDocumentosAcumulados;
    saveKey('sefazItensRevisao', state.sefazItensRevisao);
    saveKey('sefazNotasPendentes', state.sefazNotasPendentes);
    renderCompras();
    var formCardEl = document.querySelector('#tab-compras .paper.form-card');
    if(formCardEl) formCardEl.scrollIntoView({behavior: 'smooth', block: 'start'});
  }

        html += '</tr>';

        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }
    el.innerHTML = html;

  /* ---------------- AGRO5.0 — espaço para novos indicadores/tecnologias ---------------- */
  function gerarMapaAnualChuvaHtml(registros, ano, tituloPropriedade){
    var matriz = {};
    registros.forEach(function(r){
      if(!r.data) return;
      var partes = r.data.split('-');
      var anoReg = parseInt(partes[0], 10);
      if(anoReg !== ano) return;
      var mes = parseInt(partes[1], 10);
      var dia = parseInt(partes[2], 10);
      if(!matriz[dia]) matriz[dia] = {};
      matriz[dia][mes] = (matriz[dia][mes] || 0) + (Number(r.mm) || 0);
    });

    var totalPorMes = {};
    for(var m = 1; m <= 12; m++) totalPorMes[m] = 0;
    for(var d = 1; d <= 31; d++){
      for(var mm = 1; mm <= 12; mm++){
        if(matriz[d] && matriz[d][mm]) totalPorMes[mm] += matriz[d][mm];
      }
    }
    function diasNoMes(mesNum){ return new Date(ano, mesNum, 0).getDate(); }

    var html = '<div class="paper table-wrap" style="overflow-x:auto;"><p style="font-size:12.5px; font-weight:600; padding:12px 12px 0;">' + escapeHtml(tituloPropriedade) + ' — ' + ano + '</p>';
    html += '<table style="min-width:820px;"><thead><tr><th>Dia</th>';
    for(var mh = 1; mh <= 12; mh++) html += '<th>' + MESES[mh-1] + '</th>';
    html += '</tr></thead><tbody>';
    for(var dia = 1; dia <= 31; dia++){
      html += '<tr><td>' + String(dia).padStart(2,'0') + '</td>';
      for(var mes = 1; mes <= 12; mes++){
        var valorCel = (matriz[dia] && matriz[dia][mes]) ? matriz[dia][mes] : null;
        html += '<td class="num">' + (valorCel !== null ? valorCel.toLocaleString('pt-BR', {maximumFractionDigits:1}) : '') + '</td>';
      }
      html += '</tr>';
    }
    html += '<tr style="font-weight:700; background:var(--paper-2);"><td>TOTAL</td>';
    for(var mt = 1; mt <= 12; mt++){
      html += '<td class="num">' + (totalPorMes[mt] ? totalPorMes[mt].toLocaleString('pt-BR', {maximumFractionDigits:1}) : '') + '</td>';
    }
    html += '</tr>';
    html += '<tr style="font-weight:700;"><td>MÉDIA</td>';
    for(var md = 1; md <= 12; md++){
      var media = totalPorMes[md] ? (totalPorMes[md] / diasNoMes(md)) : null;
      html += '<td class="num">' + (media !== null ? media.toLocaleString('pt-BR', {maximumFractionDigits:1}) : '') + '</td>';
    }
    html += '</tr>';
    html += '</tbody></table></div>';
    return html;
  }

    html += '<div class="paper note-box">Registre a leitura do pluviômetro sempre que chover — o total do mês e do ano são calculados automaticamente. "Dias desde a última chuva" ajuda a identificar períodos de estiagem. "Média" no mapa anual é o total do mês dividido pelos dias daquele mês.</div>';

    html += '<div class="section-title">Alertas Inteligentes</div>';
    var alertasInteligentes = [];

      if(s.status !== 'andamento' && s.status !== 'colhida') return;

    state.producao.filter(function(p){ return p.tipo === 'saida' && Number(p.precoUnitario) > 0; }).forEach(function(p){

        });

    if(typeof CLIMATOLOGIA_INMET_ABATIA !== 'undefined'){

            });

              texto: 'Chuva de ' + MESES[mesAtualClima-1] + ' em <strong>' + escapeHtml(propClimatologia.nome) + '</strong> está ' + Math.round(pctClima - 100) + '% acima da média histórica oficial (INMET) pra esse mês (' + fmtNum(chuvaMesAtualClima) + 'mm vs ' + fmtNum(mediaClimatologica) + 'mm esperados).'
            });

    if(!alertasInteligentes.length){

      html += '</div>';

      if(safraRastreio){

        html += '<p style="font-size:12.5px; font-weight:600; margin:14px 0 6px;">Insumos aplicados (' + insumosRastreio.length + ')</p>';
        if(!insumosRastreio.length){

            html += '<tr><td>' + fmtDate(o.data) + '</td><td>' + escapeHtml(o.tipo) + '</td><td>' + escapeHtml(produtoNome(o.produtoId)) + '</td><td class="num">' + (o.quantidade||0) + (o.unidade ? ' ' + escapeHtml(o.unidade) : '') + '</td></tr>';

        html += '<p style="font-size:12.5px; font-weight:600; margin:14px 0 6px;">Colheita (' + entradasRastreio.length + ' registro(s))</p>';
        if(!entradasRastreio.length){

        } else {
          html += '<div class="table-wrap"><table><thead><tr><th>Data</th><th>Quantidade</th><th>Umidade</th><th>Local</th></tr></thead><tbody>';
          entradasRastreio.slice().sort(function(a,b){ return (a.data||'').localeCompare(b.data||''); }).forEach(function(p){
            html += '<tr><td>' + fmtDate(p.data) + '</td><td class="num">' + fmtNum(p.quantidade) + (p.unidade ? ' ' + escapeHtml(p.unidade) : '') + '</td><td class="num">' + (p.umidade ? fmtNum(p.umidade) + '%' : '—') + '</td><td>' + (p.localArmazenagem ? escapeHtml(p.localArmazenagem) : '—') + '</td></tr>';
          });
          html += '</tbody></table></div>';

        var saidasRastreio = state.producao.filter(function(p){ return p.safraId === safraRastreio.id && p.tipo === 'saida'; });
        html += '<p style="font-size:12.5px; font-weight:600; margin:14px 0 6px;">Vendas (' + saidasRastreio.length + ' registro(s))</p>';
        if(!saidasRastreio.length){

            html += '<tr><td>' + fmtDate(p.data) + '</td><td>' + (p.parceiroId ? escapeHtml(parceiroNome(p.parceiroId)) : '—') + '</td><td class="num">' + fmtNum(p.quantidade) + (p.unidade ? ' ' + escapeHtml(p.unidade) : '') + '</td><td class="num">' + fmtBRL(p.precoUnitario) + '</td><td class="num growth">' + fmtBRL((Number(p.quantidade)||0) * (Number(p.precoUnitario)||0)) + '</td></tr>';
          });

        var custoTalhaoRastreio = custosTotaisPorTalhao(safraRastreio.talhaoId);
