  /* ---------------- Funcionários (equipe) ---------------- */

  /* ---------------- Rentabilidade ---------------- */
  function talhoesDoLancamento(f){
    if(f.talhoesIds && f.talhoesIds.length) return f.talhoesIds;
    if(f.talhaoId) return [f.talhaoId];
    return [];
  }
  function custosFinanceiroPorTalhao(talhaoId){
    return state.financeiro.filter(function(f){ return f.tipo === 'custo' && (f.status || 'Pago') !== 'Pendente'; }).reduce(function(s,f){
      var talhoes = talhoesDoLancamento(f);
      if(talhoes.indexOf(talhaoId) === -1) return s;
      return s + (Number(f.valor||0) / talhoes.length);
    }, 0);
  }
  function receitasFinanceiroPorTalhao(talhaoId){
    return state.financeiro.filter(function(f){ return f.tipo === 'receita' && (f.status || 'Pago') !== 'Pendente'; }).reduce(function(s,f){
      var talhoes = talhoesDoLancamento(f);
      if(talhoes.indexOf(talhaoId) === -1) return s;
      return s + (Number(f.valor||0) / talhoes.length);
    }, 0);
  }
  function contasPagarPagasPorTalhao(talhaoId){
    return state.contasPagar.filter(function(c){ return c.status === 'Pago' && c.talhaoId === talhaoId; }).reduce(function(s,c){ return s + Number(c.valor||0); }, 0);
  }
  function contasReceberRecebidasPorTalhao(talhaoId){
    return state.contasReceber.filter(function(c){ return c.status === 'Recebido' && c.talhaoId === talhaoId; }).reduce(function(s,c){ return s + Number(c.valor||0); }, 0);
  }
  function custosTotaisPorTalhao(talhaoId){ return custosFinanceiroPorTalhao(talhaoId) + contasPagarPagasPorTalhao(talhaoId); }
  function receitasTotaisPorTalhao(talhaoId){ return receitasFinanceiroPorTalhao(talhaoId) + contasReceberRecebidasPorTalhao(talhaoId); }
  function producaoTotalEmSacas(safraIds){
    var totalSc = 0;
    state.producao.forEach(function(p){
      if(p.tipo !== 'entrada' || safraIds.indexOf(p.safraId) === -1) return;
      var conv = converterKgSc(Number(p.quantidade) || 0, p.unidade);
      totalSc += (conv.sc !== null) ? conv.sc : (Number(p.quantidade) || 0);
    });
    return totalSc;
  }

  function produtividadeRealSafra(safraId){
    var safra = state.safras.find(function(s){ return s.id === safraId; });
    if(!safra) return null;
    var talhao = state.talhoes.find(function(t){ return t.id === safra.talhaoId; });
    var area = talhao ? Number(talhao.area) || 0 : 0;
    if(area <= 0) return null;
    var totalSc = producaoTotalEmSacas([safraId]);
    return totalSc > 0 ? totalSc / area : null;
  }

  function historicoTalhao(talhaoId, safraIdExcluir){
    var safrasDoTalhao = state.safras.filter(function(s){ return s.talhaoId === talhaoId && s.id !== safraIdExcluir; });
    var produtividades = [];
    var custosHa = [];
    safrasDoTalhao.forEach(function(s){
      var prod = produtividadeRealSafra(s.id);
      if(prod !== null) produtividades.push(prod);
      var talhao = state.talhoes.find(function(t){ return t.id === s.talhaoId; });
      var area = talhao ? Number(talhao.area) || 0 : 0;
      if(area > 0){
        var custo = custosTotaisPorTalhao(s.talhaoId);
        custosHa.push(custo / area);
      }
    });
    var mediaProdutividade = produtividades.length ? produtividades.reduce(function(a,b){ return a+b; },0) / produtividades.length : null;
    var mediaCustoHa = custosHa.length ? custosHa.reduce(function(a,b){ return a+b; },0) / custosHa.length : null;
    return {mediaProdutividade: mediaProdutividade, mediaCustoHa: mediaCustoHa, qtdSafras: safrasDoTalhao.length};
  }

  function renderRentabilidade(){
    var el = document.getElementById('tab-rentabilidade');
    var html = '';

    html += '<div class="section-title" style="margin-top:0;">Por talhão</div>';
    if(!state.talhoes.length){
      html += '<div class="paper empty-state">Cadastre talhões para ver a rentabilidade.</div>';
    } else {
      html += '<div class="paper table-wrap"><table><thead><tr><th>Talhão</th><th>Cultura atual</th><th>Custos</th><th>Custo/ha</th><th>Custo/saca</th><th>Receitas</th><th>Estoque projetado</th><th>Resultado</th><th>Retorno s/ custo</th></tr></thead><tbody>';
      state.talhoes.forEach(function(t){
        var safraIdsDoTalhao = state.safras.filter(function(s){ return s.talhaoId === t.id; }).map(function(s){ return s.id; });
        var custos = custosTotaisPorTalhao(t.id);
        var receitas = receitasTotaisPorTalhao(t.id);
        var estoqueValor = estoqueValorPorSafraIds(safraIdsDoTalhao);
        var resultado = receitas + estoqueValor - custos;
        var retorno = custos > 0 ? (resultado / custos * 100) : null;
        var safra = safraAtualDoTalhao(t.id);
        var area = Number(t.area) || 0;
        var custoPorHa = area > 0 ? (custos / area) : null;
        var totalSacas = producaoTotalEmSacas(safraIdsDoTalhao);
        var custoPorSaca = totalSacas > 0 ? (custos / totalSacas) : null;
        html += '<tr>';
        html += '<td>' + escapeHtml(t.nome) + '</td>';
        html += '<td>' + (safra ? escapeHtml(culturaNome(safra.culturaId)) : '—') + '</td>';
        html += '<td class="num cost">' + fmtBRL(custos) + '</td>';
        html += '<td class="num">' + (custoPorHa === null ? '—' : fmtBRL(custoPorHa)) + '</td>';
        html += '<td class="num">' + (custoPorSaca === null ? '—' : fmtBRL(custoPorSaca)) + '</td>';
        html += '<td class="num growth">' + fmtBRL(receitas) + '</td>';
        html += '<td class="num growth">' + fmtBRL(estoqueValor) + '</td>';
        html += '<td class="num ' + (resultado >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(resultado) + '</td>';
        html += '<td class="num">' + (retorno === null ? '—' : retorno.toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '<div class="section-title">Por cultura</div>';
    if(!state.culturas.length){
      html += '<div class="paper empty-state">Cadastre culturas para ver a rentabilidade agrupada.</div>';
    } else {
      html += '<div class="paper table-wrap"><table><thead><tr><th>Cultura</th><th>Custos</th><th>Custo/ha</th><th>Custo/saca</th><th>Receitas</th><th>Estoque projetado</th><th>Resultado</th><th>Retorno s/ custo</th></tr></thead><tbody>';
      state.culturas.forEach(function(c){
        var safrasDaCultura = state.safras.filter(function(s){ return s.culturaId === c.id; });
        var talhaoIds = safrasDaCultura.map(function(s){ return s.talhaoId; }).filter(function(v,i,a){ return a.indexOf(v)===i; });
        var safraIds = safrasDaCultura.map(function(s){ return s.id; });
        var custos = talhaoIds.reduce(function(sum,tid){ return sum + custosTotaisPorTalhao(tid); }, 0);
        var receitas = talhaoIds.reduce(function(sum,tid){ return sum + receitasTotaisPorTalhao(tid); }, 0);
        var estoqueValor = estoqueValorPorSafraIds(safraIds);
        var resultado = receitas + estoqueValor - custos;
        var retorno = custos > 0 ? (resultado / custos * 100) : null;
        var areaTotal = talhaoIds.reduce(function(sum,tid){ var t = state.talhoes.find(function(x){ return x.id === tid; }); return sum + (t ? Number(t.area)||0 : 0); }, 0);
        var custoPorHa = areaTotal > 0 ? (custos / areaTotal) : null;
        var totalSacas = producaoTotalEmSacas(safraIds);
        var custoPorSaca = totalSacas > 0 ? (custos / totalSacas) : null;
        html += '<tr>';
        html += '<td>' + escapeHtml(c.nome) + '</td>';
        html += '<td class="num cost">' + fmtBRL(custos) + '</td>';
        html += '<td class="num">' + (custoPorHa === null ? '—' : fmtBRL(custoPorHa)) + '</td>';
        html += '<td class="num">' + (custoPorSaca === null ? '—' : fmtBRL(custoPorSaca)) + '</td>';
        html += '<td class="num growth">' + fmtBRL(receitas) + '</td>';
        html += '<td class="num growth">' + fmtBRL(estoqueValor) + '</td>';
        html += '<td class="num ' + (resultado >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(resultado) + '</td>';
        html += '<td class="num">' + (retorno === null ? '—' : retorno.toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '<div class="paper note-box">Custos somam os lançamentos "Pago" do Financeiro e as Contas a Pagar "Pago", ambos vinculados ao talhão. Receitas somam o Financeiro "Pago" e as Contas a Receber "Recebido". "Custo/ha" divide o custo total pela área do talhão (ou soma das áreas, na visão por cultura). "Custo/saca" divide o custo total pela quantidade total colhida (aba Colheita), convertendo kg para sacas (60kg = 1sc) quando aplicável. Como um talhão pode ter mais de uma cultura ao longo do tempo, o agrupamento por cultura soma os talhões onde ela já foi ou está sendo cultivada — evite lançar o mesmo valor em mais de um lugar para não contar em duplicidade.</div>';

    el.innerHTML = html;
  }

  /* ---------------- Fluxo de Caixa ---------------- */
  function renderFluxoCaixa(){
    var el = document.getElementById('tab-fluxoCaixa');
    var events = buildCashEvents();
    var buckets = {};
    events.forEach(function(e){
      var ym = e.date.slice(0,7);
      if(!buckets[ym]) buckets[ym] = {entradaReal:0, saidaReal:0, entradaPrev:0, saidaPrev:0};
      if(e.tipo === 'entrada'){
        if(e.realizado) buckets[ym].entradaReal += e.valor; else buckets[ym].entradaPrev += e.valor;
      } else {
        if(e.realizado) buckets[ym].saidaReal += e.valor; else buckets[ym].saidaPrev += e.valor;
      }
    });
    var months = Object.keys(buckets).sort();

    var saldoRealizado = events.filter(function(e){ return e.realizado; }).reduce(function(s,e){ return s + (e.tipo==='entrada' ? e.valor : -e.valor); }, 0);
    var totalPendenteReceber = state.contasReceber.filter(function(c){ return c.status === 'Pendente'; }).reduce(function(s,c){ return s + Number(c.valor||0); }, 0)
      + state.financeiro.filter(function(f){ return f.status === 'Pendente' && f.tipo === 'receita'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
    var totalPendentePagar = state.contasPagar.filter(function(c){ return c.status === 'Pendente'; }).reduce(function(s,c){ return s + Number(c.valor||0); }, 0)
      + state.financeiro.filter(function(f){ return f.status === 'Pendente' && f.tipo === 'custo'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
    var saldoProjetadoFinal = saldoRealizado + totalPendenteReceber - totalPendentePagar;
    var estoque = estoqueResumo();

    var html = '<div class="stat-row">';
    html += statCard('Saldo realizado', fmtBRL(saldoRealizado), saldoRealizado >= 0 ? 'growth' : 'cost');
    html += statCard('A receber (pendente)', fmtBRL(totalPendenteReceber), 'growth');
    html += statCard('A pagar (pendente)', fmtBRL(totalPendentePagar), 'cost');
    html += statCard('Saldo projetado', fmtBRL(saldoProjetadoFinal), saldoProjetadoFinal >= 0 ? 'growth' : 'cost');
    html += '</div>';

    html += '<div class="paper note-box" style="margin-top:-8px; margin-bottom:16px;">Esta projeção não inclui o valor da produção em estoque (' + fmtBRL(estoque.total) + '), que ainda não tem data prevista de venda — acompanhe em Estoque de Colheita, ou lance a venda em Contas a Receber quando houver data.</div>';

    if(!months.length){
      html += '<div class="paper empty-state">Nenhum lançamento com data para projetar o fluxo de caixa ainda.</div>';
    } else {
      html += '<div class="paper table-wrap"><table><thead><tr><th>Mês</th><th>Entradas realizadas</th><th>Saídas realizadas</th><th>Entradas previstas</th><th>Saídas previstas</th><th>Saldo do mês</th><th>Saldo acumulado</th></tr></thead><tbody>';
      var acumulado = 0;
      months.forEach(function(ym){
        var b = buckets[ym];
        var saldoMes = (b.entradaReal + b.entradaPrev) - (b.saidaReal + b.saidaPrev);
        acumulado += saldoMes;
        html += '<tr>';
        html += '<td>' + monthLabel(ym) + '</td>';
        html += '<td class="num growth">' + fmtBRL(b.entradaReal) + '</td>';
        html += '<td class="num cost">' + fmtBRL(b.saidaReal) + '</td>';
        html += '<td class="num growth">' + fmtBRL(b.entradaPrev) + '</td>';
        html += '<td class="num cost">' + fmtBRL(b.saidaPrev) + '</td>';
        html += '<td class="num ' + (saldoMes >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(saldoMes) + '</td>';
        html += '<td class="num ' + (acumulado >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(acumulado) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }
    el.innerHTML = html;
  }

  /* ---------------- Conta-Corrente por Parceiro ---------------- */
  var contaCorrenteParceiroId = '';

  function renderContaCorrente(){
    var el = document.getElementById('tab-contaCorrente');
    var html = '';

    html += '<div class="paper form-card"><h3>Selecionar parceiro</h3>';
    html += '<div class="entry-form">';
    html += selectField('cc-parceiro', 'Parceiro', [{value:'', label:'Todos os parceiros (resumo)'}].concat(state.parceiros.map(function(p){ return {value:p.id, label:p.nome}; })), contaCorrenteParceiroId);
    html += '</div></div>';

    if(!state.parceiros.length){
      html += '<div class="paper empty-state">Nenhum parceiro cadastrado ainda.</div>';
      el.innerHTML = html;
      return;
    }

    if(!contaCorrenteParceiroId){
      var resumo = {};
      state.financeiro.forEach(function(f){
        if(!f.parceiroId) return;
        if(!resumo[f.parceiroId]) resumo[f.parceiroId] = {pago:0, recebido:0, pendenteAPagar:0, pendenteAReceber:0};
        var st = f.status || 'Pago';
        var valor = Number(f.valor) || 0;
        if(f.tipo === 'custo'){
          if(st === 'Pago') resumo[f.parceiroId].pago += valor; else resumo[f.parceiroId].pendenteAPagar += valor;
        } else {
          if(st === 'Pago') resumo[f.parceiroId].recebido += valor; else resumo[f.parceiroId].pendenteAReceber += valor;
        }
      });
      var idsComMovimento = Object.keys(resumo);
      if(!idsComMovimento.length){
        html += '<div class="paper empty-state">Nenhum lançamento vinculado a um parceiro ainda. Vincule parceiros nos Lançamentos para ver o extrato aqui.</div>';
      } else {
        html += '<div class="paper table-wrap"><table><thead><tr><th>Parceiro</th><th>Total pago</th><th>Total recebido</th><th>Saldo</th><th>A pagar (pendente)</th><th>A receber (pendente)</th></tr></thead><tbody>';
        idsComMovimento
          .sort(function(a,b){ return parceiroNome(a).localeCompare(parceiroNome(b)); })
          .forEach(function(pid){
            var r = resumo[pid];
            var saldo = r.recebido - r.pago;
            html += '<tr>';
            html += '<td>' + escapeHtml(parceiroNome(pid)) + '</td>';
            html += '<td class="num cost">' + fmtBRL(r.pago) + '</td>';
            html += '<td class="num growth">' + fmtBRL(r.recebido) + '</td>';
            html += '<td class="num ' + (saldo >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(saldo) + '</td>';
            html += '<td class="num">' + fmtBRL(r.pendenteAPagar) + '</td>';
            html += '<td class="num">' + fmtBRL(r.pendenteAReceber) + '</td>';
            html += '</tr>';
          });
        html += '</tbody></table></div>';
      }
    } else {
      var lancamentos = state.financeiro.filter(function(f){ return f.parceiroId === contaCorrenteParceiroId; });
      var totalPago = lancamentos.filter(function(f){ return f.tipo === 'custo' && (f.status||'Pago') === 'Pago'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
      var totalRecebido = lancamentos.filter(function(f){ return f.tipo === 'receita' && (f.status||'Pago') === 'Pago'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
      var pendAPagar = lancamentos.filter(function(f){ return f.tipo === 'custo' && f.status === 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
      var pendAReceber = lancamentos.filter(function(f){ return f.tipo === 'receita' && f.status === 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
      var saldoParc = totalRecebido - totalPago;

      html += '<div class="stat-row">';
      html += statCard('Total pago a este parceiro', fmtBRL(totalPago), 'cost');
      html += statCard('Total recebido dele', fmtBRL(totalRecebido), 'growth');
      html += statCard('Saldo', fmtBRL(saldoParc), saldoParc >= 0 ? 'growth' : 'cost');
      html += statCard('Pendente a pagar', fmtBRL(pendAPagar));
      html += statCard('Pendente a receber', fmtBRL(pendAReceber));
      html += '</div>';

      if(!lancamentos.length){
        html += '<div class="paper empty-state">Nenhum lançamento vinculado a este parceiro ainda.</div>';
      } else {
        html += '<div class="paper table-wrap"><table><thead><tr><th>Data/Venc.</th><th>Tipo</th><th>Conta</th><th>Descrição</th><th>Status</th><th>Valor</th></tr></thead><tbody>';
        lancamentos.slice().sort(function(a,b){ return (b.criadoEm||0)-(a.criadoEm||0); }).forEach(function(f){
          var st = f.status || 'Pago';
          html += '<tr>';
          html += '<td>' + fmtDate(st === 'Pendente' ? f.vencimento : f.data) + '</td>';
          html += '<td><span class="badge tipo-' + f.tipo + '">' + (f.tipo === 'custo' ? 'Custo' : 'Receita') + '</span></td>';
          html += '<td>' + (f.contaId ? escapeHtml(contaLabel(f.contaId)) : escapeHtml(f.categoria || '—')) + '</td>';
          html += '<td>' + escapeHtml(f.descricao || '—') + '</td>';
          html += '<td><span class="badge" style="background:' + (st === 'Pendente' ? '#DFA84E' : '#7FA36D') + '; color:#1B1508">' + st + '</span></td>';
          html += '<td class="num ' + (f.tipo === 'custo' ? 'cost' : 'growth') + '">' + (f.tipo === 'custo' ? '−' : '+') + ' ' + fmtBRL(f.valor) + '</td>';
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      }
    }

    html += '<div class="paper note-box">Este extrato considera os lançamentos da aba Financeiro vinculados a um Parceiro. Contas a Pagar/Receber, Arrendamentos, Financiamentos e Serviços Prestados têm seus próprios controles e ainda não entram nesta soma.</div>';
    el.innerHTML = html;
  }

  /* ---------------- Orçado x Realizado ---------------- */
  var orcamentoAnoSelecionado = new Date().getFullYear();

  function renderOrcamento(){
    var el = document.getElementById('tab-orcamento');
    var html = '';

    var anosDisponiveis = [];
    for(var ay = new Date().getFullYear() - 2; ay <= new Date().getFullYear() + 2; ay++) anosDisponiveis.push(ay);

    html += '<div class="paper form-card"><h3>Definir orçamento</h3>';
    html += '<div class="entry-form">';
    html += selectField('orc-ano-view', 'Ano em análise', anosDisponiveis.map(function(a){ return {value:String(a), label:String(a)}; }), String(orcamentoAnoSelecionado));
    if(state.contasFinanceiro.length){
      html += selectField('orc-conta', 'Conta', state.contasFinanceiro.map(function(c){ return {value:c.id, label: contaLabel(c.id)}; }));
      html += field('number', 'orc-valor', 'Valor orçado para o ano (R$)', false, '0,00', {step:'0.01', min:'0'});
      html += '<button type="button" class="btn" data-action="salvar-orcamento" style="align-self:end;">Salvar orçamento</button>';
    }
    html += '</div></div>';

    if(!state.contasFinanceiro.length){
      html += '<div class="paper empty-state">Cadastre contas financeiras (aba Lançamentos → botão "+" ao lado de Conta) antes de definir orçamentos.</div>';
      el.innerHTML = html;
      return;
    }

    var orcamentosDoAno = state.orcamentos.filter(function(o){ return o.ano === orcamentoAnoSelecionado; });
    var contasComMovimento = {};
    state.financeiro.forEach(function(f){
      if((f.status || 'Pago') !== 'Pago') return;
      var ano = parseInt((f.data || '').slice(0, 4), 10);
      if(ano !== orcamentoAnoSelecionado) return;
      if(!contasComMovimento[f.contaId]) contasComMovimento[f.contaId] = 0;
      contasComMovimento[f.contaId] += Number(f.valor) || 0;
    });

    var idsRelevantes = {};
    orcamentosDoAno.forEach(function(o){ idsRelevantes[o.contaId] = true; });
    Object.keys(contasComMovimento).forEach(function(cid){ idsRelevantes[cid] = true; });

    var linhas = Object.keys(idsRelevantes).map(function(cid){
      var orc = orcamentosDoAno.find(function(o){ return o.contaId === cid; });
      var orcado = orc ? orc.valorOrcado : 0;
      var realizado = contasComMovimento[cid] || 0;
      var diferenca = orcado - realizado;
      var pctUsado = orcado ? (realizado / orcado * 100) : null;
      return {contaId: cid, orcado: orcado, realizado: realizado, diferenca: diferenca, pctUsado: pctUsado, tipo: contaTipo(cid)};
    }).sort(function(a,b){ return contaLabel(a.contaId).localeCompare(contaLabel(b.contaId)); });

    if(!linhas.length){
      html += '<div class="paper empty-state">Nenhum orçamento definido nem movimento em ' + orcamentoAnoSelecionado + ' ainda.</div>';
    } else {
      html += '<div class="paper table-wrap"><table><thead><tr><th>Conta</th><th>Orçado (ano)</th><th>Realizado</th><th>Diferença</th><th>% usado</th></tr></thead><tbody>';
      linhas.forEach(function(l){
        var estourou = l.tipo === 'custo' && l.orcado > 0 && l.realizado > l.orcado;
        html += '<tr>';
        html += '<td>' + escapeHtml(contaLabel(l.contaId)) + '</td>';
        html += '<td class="num">' + (l.orcado ? fmtBRL(l.orcado) : '—') + '</td>';
        html += '<td class="num">' + fmtBRL(l.realizado) + '</td>';
        html += '<td class="num ' + (l.diferenca >= 0 ? 'growth' : 'cost') + '">' + fmtBRL(l.diferenca) + '</td>';
        html += '<td class="num">' + (l.pctUsado !== null ? '<span class="badge" style="background:' + (estourou ? '#A23E2E' : '#7FA36D') + '; color:#fff;">' + l.pctUsado.toFixed(0) + '%</span>' : '—') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '<div class="paper note-box">"Realizado" considera só lançamentos com status "Pago" e data dentro do ano selecionado. Para despesas (custo), passar de 100% significa que já foi gasto mais do que o orçado.</div>';
    el.innerHTML = html;
  }

  /* ---------------- Relatórios (DRE por Subgrupo/Conta) ---------------- */
  function relatoriosContaStats(contaId){
    var entries = state.financeiro.filter(function(f){ return f.contaId === contaId && (f.status || 'Pago') !== 'Pendente'; });
    var valor = 0, qtd = 0, peso = 0;
    entries.forEach(function(f){ valor += Number(f.valor||0); qtd += Number(f.quantidade||0); peso += Number(f.peso||0); });
    return {valor:valor, qtd:qtd, peso:peso, entries:entries, precoMedio: qtd ? valor/qtd : 0, pesoMedio: qtd ? peso/qtd : 0};
  }
  function fmtPct(n){ return (Number(n)||0).toLocaleString('pt-BR', {maximumFractionDigits:2}) + '%'; }

  function renderRelatorios(){
    var el = document.getElementById('tab-relatorios');
    var totalReceitas = state.financeiro.filter(function(f){ return contaTipo(f.contaId) === 'receita' && (f.status||'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);
    var totalCustos = state.financeiro.filter(function(f){ return contaTipo(f.contaId) === 'custo' && (f.status||'Pago') !== 'Pendente'; }).reduce(function(s,f){ return s + Number(f.valor||0); }, 0);

    function renderSecao(tipoSecao, totalSecao, label){
      var subgrupos = state.subgruposFinanceiro.filter(function(s){ return s.tipo === tipoSecao; }).sort(function(a,b){ return (a.criadoEm||0)-(b.criadoEm||0); });
      var corTitulo = tipoSecao === 'receita' ? 'var(--growth-dark)' : 'var(--cost-dark)';
      var html = '<div class="paper" style="padding:16px 18px; margin-bottom:16px;">';
      html += '<div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px; margin-bottom:12px;">';
      html += '<div style="font-family:\'Zilla Slab\',serif; font-size:18px; font-weight:700; color:' + corTitulo + ';">' + label + '</div>';
      html += '<div style="display:flex; gap:18px; font-size:12.5px; color:var(--ink-soft);">';
      html += '<span>Total: <strong class="num" style="color:var(--ink);">' + fmtBRL(totalSecao) + '</strong></span>';
      html += '<span>% Custo: <strong class="num">' + (tipoSecao === 'receita' ? (totalCustos ? fmtPct(totalReceitas/totalCustos*100) : '0,00%') : '100,00%') + '</strong></span>';
      html += '<span>% Receita: <strong class="num">' + (tipoSecao === 'receita' ? '100,00%' : (totalReceitas ? fmtPct(totalCustos/totalReceitas*100) : '0,00%')) + '</strong></span>';
      html += '</div></div>';

      var corpo = '';
      subgrupos.forEach(function(sg){
        var contas = state.contasFinanceiro.filter(function(c){ return c.subgrupoId === sg.id; }).sort(function(a,b){ return (a.criadoEm||0)-(b.criadoEm||0); });
        var sgValor = 0, sgQtd = 0;
        var linhasContas = '';
        contas.forEach(function(c){
          var st = relatoriosContaStats(c.id);
          if(!st.entries.length) return;
          sgValor += st.valor; sgQtd += st.qtd;
          var percC = totalCustos ? st.valor/totalCustos*100 : 0;
          var percR = totalReceitas ? st.valor/totalReceitas*100 : 0;
          linhasContas += '<tr style="font-weight:600;">';
          linhasContas += '<td style="padding-left:24px;">' + escapeHtml(c.nome) + '</td>';
          linhasContas += '<td class="num">' + (st.qtd ? fmtNum(st.qtd) : '—') + '</td>';
          linhasContas += '<td class="num">' + (st.pesoMedio ? fmtNum(st.pesoMedio) : '—') + '</td>';
          linhasContas += '<td class="num">' + (st.precoMedio ? fmtBRL(st.precoMedio) : '—') + '</td>';
          linhasContas += '<td class="num ' + (tipoSecao === 'custo' ? 'cost' : 'growth') + '">' + fmtBRL(st.valor) + '</td>';
          linhasContas += '<td class="num">' + fmtPct(percC) + '</td>';
          linhasContas += '<td class="num">' + fmtPct(percR) + '</td>';
          linhasContas += '</tr>';
          st.entries.slice().sort(function(a,b){ return (b.criadoEm||0)-(a.criadoEm||0); }).forEach(function(f){
            var docLabel = f.descricao || (f.parceiroId ? parceiroNome(f.parceiroId) : 'Lançamento');
            linhasContas += '<tr style="font-size:12px; color:var(--ink-soft);">';
            linhasContas += '<td style="padding-left:40px;">' + escapeHtml(docLabel) + (f.parceiroId ? ' — ' + escapeHtml(parceiroNome(f.parceiroId)) : '') + '</td>';
            linhasContas += '<td class="num">' + (f.quantidade ? fmtNum(f.quantidade) : '—') + '</td>';
            linhasContas += '<td class="num">—</td><td class="num">—</td>';
            linhasContas += '<td class="num">' + fmtBRL(f.valor) + '</td>';
            linhasContas += '<td class="num">—</td><td class="num">—</td>';
            linhasContas += '</tr>';
          });
        });
        if(!linhasContas) return;
        var percSgC = totalCustos ? sgValor/totalCustos*100 : 0;
        var percSgR = totalReceitas ? sgValor/totalReceitas*100 : 0;
        corpo += '<tr style="font-weight:700; background:var(--paper-2);">';
        corpo += '<td>' + escapeHtml(sg.nome) + '</td>';
        corpo += '<td class="num">' + (sgQtd ? fmtNum(sgQtd) : '—') + '</td>';
        corpo += '<td class="num">—</td><td class="num">—</td>';
        corpo += '<td class="num ' + (tipoSecao === 'custo' ? 'cost' : 'growth') + '">' + fmtBRL(sgValor) + '</td>';
        corpo += '<td class="num">' + fmtPct(percSgC) + '</td>';
        corpo += '<td class="num">' + fmtPct(percSgR) + '</td>';
        corpo += '</tr>';
        corpo += linhasContas;
      });

      if(!corpo){
        html += '<div class="empty-state">Nenhum lançamento "Pago" nesta seção ainda.</div>';
      } else {
        html += '<div class="table-wrap"><table><thead><tr><th>Subgrupo · Conta · Documento</th><th>Qtd.</th><th>Peso méd.</th><th>Preço méd.</th><th>Valor</th><th>%custo</th><th>%receita</th></tr></thead><tbody>';
        html += corpo;
        html += '<tr style="font-weight:700; border-top:2px solid var(--paper-line);"><td>TOTAL</td><td></td><td></td><td></td>';
        html += '<td class="num">' + fmtBRL(totalSecao) + '</td>';
        html += '<td class="num">' + (totalCustos ? fmtPct(totalSecao/totalCustos*100) : '0,00%') + '</td>';
        html += '<td class="num">' + (totalReceitas ? fmtPct(totalSecao/totalReceitas*100) : '0,00%') + '</td></tr>';
        html += '</tbody></table></div>';
      }
      html += '</div>';
      return html;
    }

    var html = '<div class="stat-row">';
    html += statCard('Total de receitas', fmtBRL(totalReceitas), 'growth');
    html += statCard('Total de despesas', fmtBRL(totalCustos), 'cost');
    html += statCard('Resultado', fmtBRL(totalReceitas - totalCustos), (totalReceitas - totalCustos) >= 0 ? 'growth' : 'cost');
    html += '</div>';
    html += renderSecao('receita', totalReceitas, 'RECEITAS');
    html += renderSecao('custo', totalCustos, 'DESPESAS');
    html += '<div class="paper note-box">Este relatório considera apenas lançamentos do Financeiro marcados como "Pago" e vinculados a uma Conta (cadastrada pelo botão "+" no formulário de Lançamentos). Contas a Pagar/Receber ainda pendentes não entram aqui — acompanhe-as nas abas próprias.</div>';
    el.innerHTML = html;
  }

  /* ---------------- Indicadores (gráficos e exportação) ---------------- */
  function financeiroPorMes(){
    var map = {};
    state.financeiro.forEach(function(f){
      if(!f.data) return;
      var ym = f.data.slice(0,7);
      if(!map[ym]) map[ym] = {custo:0, receita:0};
      map[ym][f.tipo === 'custo' ? 'custo' : 'receita'] += Number(f.valor) || 0;
    });
    var months = Object.keys(map).sort();
    return {
      labels: months.map(monthLabel),
      custos: months.map(function(m){ return map[m].custo; }),
      receitas: months.map(function(m){ return map[m].receita; })
    };
  }
  function custosPorCategoria(){
    var map = {};
    state.financeiro.filter(function(f){ return f.tipo === 'custo'; }).forEach(function(f){
      map[f.categoria] = (map[f.categoria] || 0) + Number(f.valor || 0);
    });

  function saldoAcumuladoMensal(){
    var events = buildCashEvents();
    var buckets = {};
    events.forEach(function(e){
      var ym = e.date.slice(0,7);
      if(!buckets[ym]) buckets[ym] = 0;
      buckets[ym] += (e.tipo === 'entrada' ? e.valor : -e.valor);
    });
    var months = Object.keys(buckets).sort();
    var acumulado = 0, serie = [];
    months.forEach(function(m){ acumulado += buckets[m]; serie.push(Math.round(acumulado * 100) / 100); });
    return {labels: months.map(monthLabel), valores: serie};
  }

  function parseNFeXML(xmlText){
    try{
      var parser = new DOMParser();
      var xml = parser.parseFromString(xmlText, 'text/xml');
      if(xml.getElementsByTagName('parsererror').length) return null;
      function tagText(parent, tag){ var els = parent.getElementsByTagName(tag); return els.length ? (els[0].textContent || '').trim() : ''; }
      var infNFe = xml.getElementsByTagName('infNFe')[0];
      if(!infNFe) return null;
      var ideEl = infNFe.getElementsByTagName('ide')[0];
      var emitEl = infNFe.getElementsByTagName('emit')[0];
      var numero = ideEl ? tagText(ideEl, 'nNF') : '';
      var dataEmissaoRaw = ideEl ? (tagText(ideEl, 'dhEmi') || tagText(ideEl, 'dEmi')) : '';
      var dataEmissao = dataEmissaoRaw ? dataEmissaoRaw.slice(0, 10) : '';
      var fornecedorNome = emitEl ? tagText(emitEl, 'xNome') : '';
      var chave = tagText(xml, 'chNFe');
      if(!chave){
        var idAttr = infNFe.getAttribute ? (infNFe.getAttribute('Id') || '') : '';
        chave = idAttr.replace(/^NFe/, '');
      }
      var dets = infNFe.getElementsByTagName('det');
      var itens = [];
      for(var i = 0; i < dets.length; i++){
        var prodEl = dets[i].getElementsByTagName('prod')[0];
        if(!prodEl) continue;
        var xProd = tagText(prodEl, 'xProd');
        if(!xProd) continue;
        itens.push({
          cProd: tagText(prodEl, 'cProd'), xProd: xProd, uCom: tagText(prodEl, 'uCom'), cfop: tagText(prodEl, 'CFOP'),
          qCom: parseFloat(tagText(prodEl, 'qCom')) || 0, vUnCom: parseFloat(tagText(prodEl, 'vUnCom')) || 0,
          vProd: parseFloat(tagText(prodEl, 'vProd')) || 0
        });
      }
      if(!itens.length) return null;
      var natureza = ideEl ? tagText(ideEl, 'natOp') : '';
      return {numero: numero, dataEmissao: dataEmissao, fornecedorNome: fornecedorNome, chave: chave, natureza: natureza, itens: itens};
    }catch(err){
      console.error('Erro ao ler XML da NF-e:', err);
      return null;
    }
  }

  function toISOImport(val){
    if(!val) return '';
    if(val instanceof Date){
      if(isNaN(val.getTime())) return '';
      var y = val.getFullYear(), m = String(val.getMonth()+1).padStart(2,'0'), d = String(val.getDate()).padStart(2,'0');
      return y + '-' + m + '-' + d;
    }
    var s = String(val).trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var m2 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m2) return m2[3] + '-' + m2[2].padStart(2,'0') + '-' + m2[1].padStart(2,'0');
    return '';
  }
  function parseValorImport(v){
    if(typeof v === 'number') return v;
    if(v == null) return 0;
    var s = String(v).trim().replace(/[^\d.,-]/g, '');
    if(s.indexOf(',') !== -1 && s.indexOf('.') !== -1){ s = s.replace(/\./g, '').replace(',', '.'); }
    else if(s.indexOf(',') !== -1){ s = s.replace(',', '.'); }
    return parseFloat(s) || 0;
  }
  function importarFinanceiroDeArquivo(){
    var contaSel = document.getElementById('f-import-conta');
    var statusSel = document.getElementById('f-import-status');
    var fileInput = document.getElementById('import-file-input');
    if(!contaSel || !statusSel || !fileInput) return;
    var contaId = contaSel.value;
    var statusPadrao = statusSel.value;
    var file = fileInput.files && fileInput.files[0];
    if(!file){ alert('Selecione um arquivo primeiro.'); return; }
    if(!contaId){ alert('Selecione uma conta para os lançamentos.'); return; }
    if(!window.XLSX){ alert('A biblioteca de leitura de planilhas ainda está carregando (ou não pôde ser carregada). Tente novamente em instantes.'); return; }

    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:'array', cellDates:true});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true});

        var novos = [];
        for(var i = 1; i < rows.length; i++){
          var r = rows[i];
          if(!r || r.length === 0) continue;
          var nome = r[0] != null ? String(r[0]).trim() : '';
          if(!nome || nome.toUpperCase() === 'TOTAL') continue;
          var dataEmissao = toISOImport(r[1]);
          var vencimento = toISOImport(r[2]);
          var doc = r[3] != null ? String(r[3]).trim() : '';
          var valor = parseValorImport(r[4]);
          if(!valor) continue;
          novos.push({
            id: uid(), contaId: contaId, tipo: contaTipo(contaId), categoria: contaNome(contaId),
            valor: valor, quantidade: 0, peso: 0, unidade: '',
            status: statusPadrao, data: statusPadrao === 'Pago' ? (dataEmissao || vencimento) : '', vencimento: vencimento,
            talhoesIds: [], talhaoId: '', parceiroId: '', membroId: '',
            descricao: nome + (doc ? ' - Doc ' + doc : ''), criadoEm: Date.now()
          });
        }

        if(!novos.length){ alert('Nenhuma linha válida encontrada no arquivo.'); return; }
        if(!window.confirm('Serão criados ' + novos.length + ' lançamentos, todos na conta "' + contaLabel(contaId) + '" com status "' + statusPadrao + '". Confirma a importação?')) return;

        novos.forEach(function(n){ state.financeiro.push(n); });
        saveKey('financeiro', state.financeiro);
        fileInput.value = '';
        renderAll();
        alert(novos.length + ' lançamentos importados com sucesso.');
      }catch(err){
        console.error('Erro ao importar arquivo:', err);
        alert('Não foi possível ler esse arquivo. Verifique se é um .xlsx ou .csv válido, com as colunas na ordem esperada.');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function field(type, name, label, required, placeholder, extra, currentValue){

      (required ? ' required' : '') +
      (placeholder ? ' placeholder="' + placeholder + '"' : '') +
      (currentValue !== undefined && currentValue !== null && currentValue !== '' ? ' value="' + escapeHtml(currentValue) + '"' : '') +
      attrs + '></div>';

  function selectField(name, label, options, currentValue){
    var html = '<div class="field"><label for="f-' + name + '">' + label + '</label><select id="f-' + name + '" name="' + name + '">';
    options.forEach(function(o){
      var sel = (currentValue !== undefined && currentValue !== null && String(currentValue) === String(o.value)) ? ' selected' : '';
      html += '<option value="' + escapeHtml(o.value) + '"' + sel + '>' + escapeHtml(o.label) + '</option>';

  function recalcularValorDiaria(){
    var qtdEl = document.getElementById('f-qtdDiarias');
    var valorDEl = document.getElementById('f-valorDiaria');
    var valorInDiaria = document.getElementById('f-valor');
    var hintD = document.getElementById('diaria-hint');
    if(!qtdEl || !valorDEl) return;
    var qtd = parseFloat(qtdEl.value) || 0;
    var valorD = parseFloat(valorDEl.value) || 0;
    var totalDiaria = qtd * valorD;
    if(valorInDiaria) valorInDiaria.value = totalDiaria.toFixed(2);
    if(hintD){
      hintD.textContent = 'O "Valor (R$)" acima é calculado automaticamente (Nº de diárias × Valor por diária)' + (totalDiaria > 0 ? ' = ' + fmtBRL(totalDiaria) + '.' : '.');
    }
  }

        var valorH = parseFloat(document.getElementById('f-valorHoraExtra').value) || 0;

          : 'Some este valor ao "Valor (R$)" acima, se quiser incluir a hora extra no total pago.';
      }

        state.notasFiscaisImportadas.push({
          chave: item.chaveNota, numero: item.numeroNota, fornecedorNome: item.fornecedorNomeNota,
          dataEmissao: item.dataEmissaoNota, dataImportacao: new Date().toISOString()
        });
        chavesJaRegistradas.push(item.chaveNota);
      });
      saveKey('notasFiscaisImportadas', state.notasFiscaisImportadas);

      saveKey('produtos', state.produtos);
      saveKey('compras', state.compras);
      saveKey('parceiros', state.parceiros);
      saveKey('producao', state.producao);
      if(mudouFinanceiro) saveKey('financeiro', state.financeiro);
      nfeImportada = null;
      notaEmDetalheChave = null;
      state.sefazItensRevisao = [];
      saveKey('sefazItensRevisao', state.sefazItensRevisao);
      renderAll();
      return;
    }
    if(action === 'switch-workspace'){
      currentWorkspaceId = null;
      document.getElementById('app').style.display = 'none';
      loadWorkspaces().then(function(list){ showWorkspaceScreen(list); });
      return;
    }
    if(action === 'lock-app'){
      currentWorkspaceId = null;
      try{ window.sessionStorage.removeItem(UNLOCK_FLAG); }catch(e){}
      document.getElementById('app').style.display = 'none';
      showGateScreen();
      return;
    }

    if(action.indexOf('del-') === 0){
      if(!window.confirm('Tem certeza que deseja remover este item? Essa ação não pode ser desfeita.')) return;
    }

    if(action === 'export-excel'){ exportarExcel(); return; }
    if(action === 'export-pdf'){ window.print(); return; }
    if(action === 'export-backup'){ exportarBackupJSON(); return; }
    if(action === 'import-financeiro'){ importarFinanceiroDeArquivo(); return; }
    if(action === 'import-backup'){ var fileInput = document.getElementById('backup-file-input'); if(fileInput) fileInput.click(); return; }
    if(action === 'cancel-edit'){ editState = null; renderAll(); return; }
    if(action === 'edit-generic'){
      editState = {scope:'generic', entityKey: btn.dataset.entity, id: id};
      renderAll();
      var formCard = document.querySelector('#tab-' + btn.dataset.entity + ' .form-card');
      if(formCard) formCard.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    if(action === 'pagar-parcela-financiamento'){
      var fin = state.financiamentos.find(function(f){ return f.id === id; });
      if(!fin) return;
      if(!fin.contaId){ alert('Antes de pagar uma parcela por aqui, edite este financiamento e escolha uma "Conta" — é nela que a despesa vai ser lançada.'); return; }
      var pagasAtual = Number(fin.parcelasPagas) || 0;
      var novaPagas = pagasAtual + 1;
      var valorParcelaFin = Number(fin.valorParcela) || 0;
      if(!window.confirm('Confirma o pagamento da parcela ' + novaPagas + '/' + (fin.numeroParcelas || '?') + ', no valor de ' + fmtBRL(valorParcelaFin) + '? Isso cria uma despesa "Pago" no Financeiro.')) return;
      fin.parcelasPagas = novaPagas;
      if(fin.numeroParcelas && novaPagas >= Number(fin.numeroParcelas)) fin.status = 'Quitado';
      saveKey('financiamentos', state.financiamentos);
      var contaFin = state.contasFinanceiro.find(function(c){ return c.id === fin.contaId; });
      state.financeiro.push({
        id: uid(), contaId: fin.contaId, tipo: contaTipo(fin.contaId), categoria: contaFin ? contaFin.nome : '',
        valor: valorParcelaFin, quantidade: 0, peso: 0, unidade: '', status: 'Pago',
        data: new Date().toISOString().slice(0,10), vencimento: '',
        talhoesIds: fin.talhaoId ? [fin.talhaoId] : [], talhaoId: fin.talhaoId || '', parceiroId: '', membroId: '',
        descricao: 'Parcela ' + novaPagas + '/' + (fin.numeroParcelas || '?') + ' - ' + fin.banco + (fin.numeroContrato ? ' - Contrato ' + fin.numeroContrato : ''),
        criadoEm: Date.now()
      });
      saveKey('financeiro', state.financeiro);
      renderAll();
      return;
    }
    if(action === 'del-generic'){
      var entityKey = btn.dataset.entity;
      if(entityKey === 'servicosPrestados'){
        var registroAExcluir = state.servicosPrestados.find(function(x){ return x.id === id; });
        if(registroAExcluir && registroAExcluir.financeiroId){
          state.financeiro = state.financeiro.filter(function(f){ return f.id !== registroAExcluir.financeiroId; });
          saveKey('financeiro', state.financeiro);
        }
      }
      state[entityKey] = state[entityKey].filter(function(x){ return x.id !== id; });
      saveKey(entityKey, state[entityKey]);
      renderAll(); return;
    }
    if(action === 'del-talhao'){ state.talhoes = state.talhoes.filter(function(t){ return t.id !== id; }); saveKey('talhoes', state.talhoes); renderAll(); return; }
    if(action === 'edit-talhao'){ editState = {scope:'talhoes', id: id}; renderAll(); var f2 = document.getElementById('form-talhao'); if(f2) f2.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    if(action === 'del-safra'){ state.safras = state.safras.filter(function(s){ return s.id !== id; }); saveKey('safras', state.safras); renderAll(); return; }
    if(action === 'edit-safra'){ editState = {scope:'safras', id: id}; renderAll(); var f3 = document.getElementById('form-safra'); if(f3) f3.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    if(action === 'toggle-ativa-safra'){
      var safraToggle = state.safras.find(function(s){ return s.id === id; });
      if(!safraToggle) return;
      safraToggle.ativa = safraToggle.ativa === false ? true : false;
      saveKey('safras', state.safras);
      renderAll();
      return;
    }
    if(action === 'del-producao'){ state.producao = state.producao.filter(function(p){ return p.id !== id; }); saveKey('producao', state.producao); renderAll(); return; }
    if(action === 'edit-producao'){
      editState = {scope: btn.dataset.tipo === 'entrada' ? 'producao-entrada' : 'producao-saida', id: id};
      renderAll();
      var f4 = document.getElementById(btn.dataset.tipo === 'entrada' ? 'form-colheita-entrada' : 'form-colheita-venda');
      if(f4) f4.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    if(action === 'del-operacao'){ state.operacoes = state.operacoes.filter(function(o){ return o.id !== id; }); saveKey('operacoes', state.operacoes); renderAll(); return; }
    if(action === 'edit-operacao'){ editState = {scope:'operacoes', id: id}; renderAll(); var f1 = document.getElementById('form-operacao'); if(f1) f1.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    if(action === 'del-financeiro'){
      var finParaExcluir = state.financeiro.find(function(f){ return f.id === id; });
      if(finParaExcluir && lancamentoEstaFechado(finParaExcluir)){ alert('Este lançamento está num período fechado. Reabra o período antes de excluir.'); return; }
      state.financeiro = state.financeiro.filter(function(f){ return f.id !== id; }); saveKey('financeiro', state.financeiro); renderAll(); return;
    }
    if(action === 'edit-financeiro'){
      var finParaEditar = state.financeiro.find(function(f){ return f.id === id; });
      if(finParaEditar && lancamentoEstaFechado(finParaEditar)){ alert('Este lançamento está num período fechado. Reabra o período antes de editar.'); return; }
      editState = {scope:'financeiro', id: id}; renderAll(); var f5 = document.getElementById('form-financeiro'); if(f5) f5.scrollIntoView({behavior:'smooth', block:'start'}); return;
    }
    if(action === 'ver-anexo'){
      rawGet('anexo::' + id).then(function(anexo){
        if(!anexo || !anexo.dados){ alert('Nenhum comprovante encontrado.'); return; }
        var w = window.open();
        if(w && w.document){
          w.document.write('<title>' + escapeHtml(anexo.nome || 'Comprovante') + '</title>' + (anexo.tipo && anexo.tipo.indexOf('image') === 0 ? '<img src="' + anexo.dados + '" style="max-width:100%;">' : '<embed src="' + anexo.dados + '" style="width:100%; height:100vh;">'));
        }
      });
      return;
    }
    if(action === 'fechar-periodo'){
      var mesInput = document.getElementById('fechamento-mes-input');
      var ym = mesInput ? mesInput.value : '';
      if(!ym){ alert('Escolha um mês antes de fechar.'); return; }
      if(!state.periodosFechados) state.periodosFechados = [];
      if(state.periodosFechados.indexOf(ym) !== -1){ alert('Esse período já está fechado.'); return; }
      if(!window.confirm('Fechar ' + ym + '? Nenhum lançamento com data ou vencimento nesse mês poderá ser criado, editado ou excluído até você reabrir.')) return;
      state.periodosFechados.push(ym);
      saveKey('periodosFechados', state.periodosFechados);
      renderAll();
      return;
    }
    if(action === 'reabrir-periodo'){
      if(!window.confirm('Reabrir ' + id + '? Os lançamentos desse mês voltam a poder ser editados/excluídos.')) return;
      state.periodosFechados = state.periodosFechados.filter(function(p){ return p !== id; });
      saveKey('periodosFechados', state.periodosFechados);
      renderAll();
      return;
    }
    if(action === 'salvar-orcamento'){
      var orcContaSel = document.getElementById('f-orc-conta');
      var orcValorInput = document.getElementById('f-orc-valor');
      var orcContaId = orcContaSel ? orcContaSel.value : '';
      var orcValor = orcValorInput ? (parseFloat(orcValorInput.value) || 0) : 0;
      if(!orcContaId || orcValor <= 0){ alert('Escolha uma conta e digite um valor maior que zero.'); return; }
      var idxOrc = state.orcamentos.findIndex(function(o){ return o.contaId === orcContaId && o.ano === orcamentoAnoSelecionado; });
      if(idxOrc !== -1){
        state.orcamentos[idxOrc].valorOrcado = orcValor;
      } else {
        state.orcamentos.push({id: uid(), contaId: orcContaId, ano: orcamentoAnoSelecionado, valorOrcado: orcValor, criadoEm: Date.now()});
      }
      saveKey('orcamentos', state.orcamentos);
      renderOrcamento();
      return;
    }
  });

  boot();
})();
</script>
</body>
</html>
